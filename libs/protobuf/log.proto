syntax = "proto3";

package PB.Log;

//option optimize_for = CODE_SIZE;
option optimize_for = LITE_RUNTIME;
//
// LogEntry is used to log status information.
//
message LogEntry {
	message Entry {
		enum Level {
			DUMMY		= 0;
			LOG_TRACE	= 1000;
			LOG_DEBUG	= 500;
			LOG_INFO 	= 150;
			LOG_WARNING	=  50;
			LOG_ERROR	=  10;
			LOG_CRITICAL	=   1;
		};
		Level	level	= 1;
		string	sender	= 2;
		string	file	= 3;
		int32	line	= 4;
		string	message = 5;
		int32	date	= 6;
	};

	repeated Entry entry = 1;
	// Set by the core on a line a log-handler module wrote from inside its
	// handler: the handlers the line came through, which it is not handed to
	// again (one that logged per line it received would otherwise feed itself
	// forever). Internal to the core, and written ahead of `entry` on the wire
	// so the core can spot it from the first byte (nsclient_logger).
	repeated uint64 handled_by = 2;
}

