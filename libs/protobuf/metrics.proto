syntax = "proto3";

package PB.Metrics;

//option optimize_for = CODE_SIZE;
option optimize_for = LITE_RUNTIME;
import "common.proto";

//
// Common utility types (re-used in various messages below)
//
message Quantile {
	double quantile = 1;
	double value    = 2;
}

message Summary {
  uint64   sample_count = 1;
  double   sample_sum   = 2;
  repeated Quantile quantile     = 3;
}

message Histogram {
  uint64 sample_count = 1;
  double sample_sum   = 2;
  repeated Bucket bucket       = 3;
}

message Bucket {
  uint64 cumulative_count = 1;
  double upper_bound = 2;
}


message Metric {
	// The name of this metric within its bundle. Joined with the bundle path by
	// a "." it is the key of the flat JSON view (/api/v2/metrics), the Graphite
	// path and the collectd identifier, so it is the one field no consumer may
	// see move: producers keep composing it exactly as before, and the metadata
	// below is what the OpenMetrics exposition reads instead.
	string key = 1;
	// Labels for the OpenMetrics exposition. Only the OpenMetrics renderer reads
	// them; every flat consumer keeps reading `key`, so a metric whose key still
	// embeds its instance ("core 0.idle") can carry core="0" here without
	// renaming anything.
	repeated PB.Common.KeyValue dims = 11;
	// Which member is set is the metric's OpenMetrics type: gauge, counter
	// (rendered with the `_total` suffix the spec requires), unknown, summary,
	// histogram - or, for a string, a label of the bundle's `_info` family.
	oneof value {
		PB.Common.OptionalFloat gauge_value = 5;
		PB.Common.OptionalString string_value = 6;
		PB.Common.OptionalFloat counter_value = 7;
		PB.Common.OptionalFloat untyped_value = 8;
		Summary summary_value = 9;
		Histogram histogram_value = 10;
	}

	// The OpenMetrics family name relative to the bundle, when it differs from
	// `key` - which it does exactly when the key embeds an instance that `dims`
	// carries as a label ("core 0.idle" -> alias "idle", dims core="0"). Empty
	// means the key is the name.
	string alias = 3;
	// One line of help text, emitted as `# HELP`. A metric without one falls
	// back to its bundle's `desc`.
	string desc = 4;
	// The unit of the value ("bytes", "seconds", "percent", ...), emitted as
	// `# UNIT` and appended to the family name, which OpenMetrics requires a
	// unit-carrying family to end with. Empty for a unitless count.
	string unit = 12;
}

message MetricsBundle {
	string key = 1;
	repeated Metric value = 2;
	repeated MetricsBundle children = 6;

	string alias = 3;
	// Help text for every metric of this bundle that declares none of its own.
	string desc = 4;
}

//
// Metrics message
// Used for fetching and sending metrics.
//
message MetricsQueryMessage {
	message Request {
		int64 id = 1;
		string type = 2;
	};

	PB.Common.Header header = 1;
	repeated Request payload = 2;
}

//
// Metrics message
// Used for fetching and sending metrics.
//
message MetricsMessage {
	message Response {
		int64 id = 1;
		PB.Common.Result result = 2;

		repeated MetricsBundle bundles = 3;
	};

	PB.Common.Header header = 1;
	repeated Response payload = 2;
}
