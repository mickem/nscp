syntax = "proto3";

package PB.Failures;

option optimize_for = LITE_RUNTIME;
import "common.proto";
import "plugin.proto";
import "metrics.proto";

//
// Failed checks: the last N non-OK check results the core dispatched.
//
// Every check - whatever transport asked for it - passes through one point in
// the core on its way back, and that point keeps a bounded, in-memory log of
// the ones that did not come back OK (see service/failed_check_store.hpp).
// Consumers (the REST API, the web UI, `nscp test`, a module) read it through
// NSAPIFailuresQuery with the request/response pair below.
//

//
// What the system looked like when a check failed: the core's latest metrics
// snapshot at that instant (the one `/api/v2/metrics` was serving), when
// [/settings/core/failed checks] `capture metrics` is on.
//
// Snapshots are shared: every failure recorded within one metrics interval
// refers to the same one (the same `snapshot_id`), and the store holds at most
// `metrics context budget` bytes of distinct snapshots, releasing the oldest
// first. An entry whose snapshot was released keeps its place in the log and
// says so with EVICTED.
//
message MetricsContext {
	enum State {
		// No snapshot was available: capture is on but the core had not
		// collected one yet (the first metrics interval after a start).
		NONE = 0;
		// `metrics` (or, in a list, `snapshot_id`) refers to the snapshot.
		CAPTURED = 1;
		// The snapshot was released to stay within the budget, or capture was
		// turned off after the entry was recorded.
		EVICTED = 2;
		// The snapshot was larger than `max context size` and was not kept.
		TOO_LARGE = 3;
		// `capture metrics` was off when the entry was recorded.
		DISABLED = 4;
	};
	State state = 1;
	// The snapshot's id: two entries with the same id saw the same snapshot.
	uint64 snapshot_id = 2;
	// When the core collected the snapshot, seconds since the unix epoch. At or
	// before the failure's own timestamp, by at most one metrics interval.
	int64 captured_at = 3;
	// The serialised size of the snapshot, which is what the budget counts.
	uint64 size = 4;
	// The snapshot itself. Only filled when the request asked for it
	// (`include_context`): a listing carries the state and the id only, so it
	// does not grow by a snapshot per entry.
	PB.Metrics.MetricsMessage metrics = 5;

	// What `prune metrics` and `prune pattern` took out of the snapshot before
	// it was kept. Unset when neither was set.
	message Pruned {
		// The rules in force, as `prune metrics` spells them (empty when only
		// `prune pattern` is set).
		string rules = 1;
		// Metrics dropped for being 0, an empty string, or part of a duplicate
		// instance.
		uint64 zeros = 2;
		uint64 empty = 3;
		uint64 duplicates = 4;
		// Each collapsed instance (key: its flat-key prefix) and the instance
		// it was identical to (value).
		repeated PB.Common.KeyValue collapsed = 5;
		// The `prune pattern` entries in force (lower-cased), and how many
		// metrics they excluded.
		repeated string patterns = 6;
		uint64 excluded = 7;
	}
	Pruned pruned = 6;
}

//
// One failed check, as the core saw it leave execute_query.
//
message FailedCheck {
	// Monotonic and 1-based for the lifetime of the process; a cleared store
	// does not restart it. A poller asks for `since = <the last index it saw>`
	// and gets only what it has not seen.
	uint64 index = 1;
	// When the check finished, seconds since the unix epoch.
	int64 timestamp = 2;
	// Who asked: the caller subject resolved from the request header, in the
	// `module[:principal]` form the permission layer uses ("NRPEServer",
	// "WEBServer:admin", "Scheduler"); "*" when the caller is unknown.
	string subject = 3;
	// How deeply nested the check was: 0 for one a transport asked for
	// directly, 1 for one a check_multi or check_and_forward ran on its
	// behalf, and so on. Both ends of such a pair are recorded.
	int32 depth = 4;
	// The payload as it was returned, after the core's caps: the lines are
	// truncated, the perf list is capped and `data` is cleared. `arguments`
	// is filled from the request - with credential-looking values redacted -
	// only when [/settings/core/failed checks] `record arguments` is on, and
	// cleared otherwise.
	PB.Commands.QueryResponseMessage.Response response = 5;
	// The metrics snapshot the failure was recorded with; see MetricsContext.
	MetricsContext context = 6;
}

//
// Failures request message.
// Consumer (REST, the `nscp test` console, a module) -> core.
//
message FailuresRequestMessage {
	message Request {
		enum Command {
			GET = 0;
			// Drop every stored entry, then answer as GET does (with an empty
			// list and `removed` set).
			CLEAR = 1;
		};

		int64 id = 1;
		Command command = 2;
		// Only entries whose index is greater than this. 0 is everything.
		uint64 since = 3;
		// At most this many entries, the newest ones. 0 is no limit beyond
		// what the store holds.
		uint32 limit = 4;
		// Fill each entry's `context.metrics` with its snapshot. Meant for
		// one entry (`index`); a listing leaves it off.
		bool include_context = 5;
		// Only the entry with this index (0 for no such restriction). The
		// response then holds that entry or, once the cap has evicted it,
		// nothing.
		uint64 index = 6;
	};

	PB.Common.Header header = 1;
	repeated Request payload = 2;
}

//
// Failures response message.
// The entries asked for, newest first, plus what a consumer needs to say how
// the store is configured and whether it has missed anything.
//
message FailuresResponseMessage {
	message Response {
		int64 id = 1;
		PB.Common.Result result = 2;

		// Newest first.
		repeated FailedCheck entries = 3;

		// The store's configuration, so a UI can say "recording is off" or
		// "arguments are not recorded" instead of showing an empty column.
		bool enabled = 4;
		uint64 max_entries = 5;
		bool arguments_recorded = 6;
		// The statuses that are recorded, as configured
		// ("warning,critical,unknown").
		string statuses = 7;

		// The highest index handed out so far; 0 before the first failure. A
		// poller that sees it move past its own `since` plus the entries it got
		// knows the cap evicted something in between.
		uint64 last_index = 8;
		// Entries the cap has evicted since the process started.
		uint64 dropped = 9;
		// For CLEAR: how many entries were removed.
		uint64 removed = 10;

		// Whether failures are recorded with a metrics snapshot, and the
		// budget for the distinct snapshots held (bytes) and how much of it is
		// in use.
		bool capture_metrics = 11;
		uint64 context_budget = 12;
		uint64 context_bytes_used = 13;
		// The largest single snapshot that is kept (bytes).
		uint64 max_context_size = 14;
	};

	PB.Common.Header header = 1;
	repeated Response payload = 2;
}
