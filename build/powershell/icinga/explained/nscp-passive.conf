// The passive services of the "explained Icinga alerts" tutorial (Step 4).
// setup-icinga-explained-alerts.ps1 fills in the __PLACEHOLDERS__, appends
// one Host per estate machine and installs the result as
// /etc/icinga2/conf.d/nscp-passive.conf.
//
// Where this differs from the tutorial, and why:
//
//   * check_freshness / freshness_threshold are Nagios and Icinga 1 attributes.
//     Icinga 2 refuses them ("Attribute 'check_freshness' does not exist").
//     Freshness the Icinga 2 way: a passive result pushes the next check out
//     by check_interval, and when nothing arrives in that time Icinga runs the
//     check command itself - "dummy", which then says "No data received". So
//     active checks stay enabled; switching them off switches freshness off.
//   * max_check_attempts is set here. "generic-service" brings 5, and passive
//     results count as attempts: the notification would wait for the fifth
//     failed result in a row.
//   * The ApiUser is not called "nscp": the turn-key passive flow of
//     setup-icinga-machine.ps1 already has a user of that name on this VM,
//     with the wider rights `ensure objects` needs.

object ApiUser "__API_USER__" {
  password = "__API_PASSWORD__"
  permissions = [ "actions/process-check-result" ]
}

template Service "nscp-passive" {
  import "generic-service"
  check_command         = "dummy"
  max_check_attempts    = __ATTEMPTS__
  check_interval        = __FRESHNESS__s      /* 2 x the agent's interval */
  retry_interval        = __FRESHNESS__s
  enable_passive_checks = true
  vars.dummy_state      = 3
  vars.dummy_text       = "No data received"
}

apply Service for (name in [ __SERVICES__ ]) {
  import "nscp-passive"
  assign where host.vars.nscp_passive == true
}

// The tutorial takes the hosts as given ("set vars.nscp_passive = true on each
// host"). Here they are the estate's machines; the agent's host_check schedule
// is their host check.
template Host "nscp-passive-host" {
  check_command         = "dummy"
  max_check_attempts    = 1
  check_interval        = __FRESHNESS__s
  retry_interval        = __FRESHNESS__s
  enable_passive_checks = true
  vars.dummy_state      = 2
  vars.dummy_text       = "No data received"
  vars.nscp_passive     = true
  vars.explain_settle   = __SETTLE__
}

// The stock users.conf is moved out of the way by setup-icinga-machine.ps1,
// so the "icingaadmin" the tutorial notifies is defined here.
object User "icingaadmin" {
  display_name = "Icinga 2 Admin"
  email = "__MAIL_TO__"
  enable_notifications = true
  states = [ OK, Warning, Critical, Unknown ]
  types = [ Problem, Recovery ]
}

