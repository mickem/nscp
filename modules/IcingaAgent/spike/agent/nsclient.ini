; NSClient++ side of the IcingaAgent spike. The parent host and the ticket
; are passed with --define by agent/entrypoint.sh.
[/modules]
IcingaAgent = enabled
CheckSystem = enabled
CheckHelpers = enabled
CheckDisk = enabled
; `nscp test` needs it for its console
CommandClient = enabled

[/settings/Icinga/agent]
parent endpoint = icinga-master
endpoint name = nscp-agent
certificate directory = /var/lib/nscp-agent/certs

; Which checks the master may run is the core permission policy's job. The
; agent runs every check as the verified parent: IcingaAgent:<parent endpoint>.
[/settings/permissions]
enabled = true

[/settings/permissions/policies]
IcingaAgent:icinga-master = CheckSystem.*, CheckDisk.*

[/settings/log]
level = debug
