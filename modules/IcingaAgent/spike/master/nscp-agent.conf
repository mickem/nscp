// Icinga 2 master side of the NSClient++ IcingaAgent spike.
//
// The agent connects to us (no `host` on the Endpoint), exactly like an
// Icinga for Windows node that only has outbound connectivity.

object Endpoint "nscp-agent" { }

object Zone "nscp-agent" {
  endpoints = [ "nscp-agent" ]
  parent = "master"
}

object ApiUser "spike" {
  password = "spike"
  permissions = [ "*" ]
}

// --- Check commands -------------------------------------------------------
//
// The ifw-api convention (Icinga 2.14+, used by Icinga for Windows): the
// master sends the command name in ifw_api_command (defaults to the
// CheckCommand's own name) and the `ifw_api_arguments` dictionary, plus the
// resolved value of every macro the arguments reference. The agent builds
// the command line itself.

object CheckCommand "check_cpu" {
  import "ifw-api"
  vars.ifw_api_arguments = {
    "warning"  = { value = "$nscp_cpu_warning$" }
    "critical" = { value = "$nscp_cpu_critical$" }
    "time"     = { value = "$nscp_cpu_time$" }
  }
}

object CheckCommand "check_memory" {
  import "ifw-api"
  vars.ifw_api_arguments = {
    "warning"  = { value = "$nscp_mem_warning$" }
    "critical" = { value = "$nscp_mem_critical$" }
    "type"     = { value = "$nscp_mem_type$" }
  }
}

// A CheckCommand whose Icinga name differs from the NSClient++ query.
object CheckCommand "nscp-disk" {
  import "ifw-api"
  vars.ifw_api_command = "check_drivesize"
  vars.ifw_api_arguments = {
    "drive"    = { value = "$nscp_disk_drive$" }
    "warning"  = { value = "$nscp_disk_warning$" }
    "critical" = { value = "$nscp_disk_critical$" }
    "show-all" = { set_if = "$nscp_disk_show_all$" }
  }
}

// Not ifw-api: a plain plugin command. The agent gets only the name.
object CheckCommand "check_uptime" {
  import "plugin-check-command"
  command = [ "/bin/false" ]  // never run on the master
}

// Something the agent is not allowed to run (see allowed commands).
object CheckCommand "check_always_ok" {
  import "ifw-api"
}

// --- Objects --------------------------------------------------------------

object Host "nscp-agent" {
  zone = "master"
  check_command = "cluster-zone"   // UP while the agent is connected
  vars.cluster_zone = name
  check_interval = 10s
  retry_interval = 10s
}

template Service "nscp-agent-service" {
  host_name = "nscp-agent"
  zone = "master"           // conf.d is not in a zone; command_endpoint needs one
  command_endpoint = "nscp-agent"
  check_interval = 15s
  retry_interval = 15s
}

object Service "cpu" {
  import "nscp-agent-service"
  check_command = "check_cpu"
  vars.nscp_cpu_warning = "load > 80"
  vars.nscp_cpu_critical = "load > 95"
  vars.nscp_cpu_time = [ "5s", "1m" ]
}

object Service "memory" {
  import "nscp-agent-service"
  check_command = "check_memory"
  vars.nscp_mem_warning = "used > 90%"
  vars.nscp_mem_critical = "used > 98%"
  vars.nscp_mem_type = "physical"
}

object Service "disk root" {
  import "nscp-agent-service"
  check_command = "nscp-disk"
  vars.nscp_disk_drive = "/"
  vars.nscp_disk_warning = "used > 95%"
  vars.nscp_disk_critical = "used > 99%"
  vars.nscp_disk_show_all = true
}

object Service "uptime" {
  import "nscp-agent-service"
  check_command = "check_uptime"
}

object Service "not allowed" {
  import "nscp-agent-service"
  check_command = "check_always_ok"
}

// --- Generic pass-through -------------------------------------------------
//
// One CheckCommand for every NSClient++ query, in NSClient++'s own syntax:
// the arguments are handed over verbatim as `key=value` tokens, exactly as
// check_nrpe -a or the REST API would pass them. Icinga reads `$` as a
// macro, so NSClient++'s `${keyword}` is written `$${keyword}`.
object CheckCommand "nscp-query" {
  import "ifw-api"
  vars.ifw_api_command = "$nscp_query$"
  vars.ifw_api_arguments = {
    "(arguments)" = { value = "$nscp_arguments$", skip_key = true }
  }
}

object Service "process (generic)" {
  import "nscp-agent-service"
  check_command = "nscp-query"
  vars.nscp_query = "check_process"
  vars.nscp_arguments = [ "process=nscp", "warning=count < 1", "critical=count < 1", "top-syntax=%(status): $${list}" ]
}
