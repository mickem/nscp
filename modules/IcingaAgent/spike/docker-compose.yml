# IcingaAgent spike: an Icinga 2 master and NSClient++ as a native agent.
# Use ./run.sh, which also issues the ticket.
services:
  icinga-master:
    image: ${ICINGA_IMAGE:-icinga/icinga2:2.16.6}
    hostname: icinga-master
    environment:
      ICINGA_MASTER: "1"
      ICINGA_CN: icinga-master
    volumes:
      - master-data:/data
      - ./master/nscp-agent.conf:/etc/icinga2/conf.d/nscp-agent.conf:ro
    ports:
      - "5665:5665"

  nscp-agent:
    build:
      context: ./agent
      args:
        BASE: ${UBUNTU_IMAGE:-ubuntu:24.04}
    hostname: nscp-agent
    environment:
      ICINGA_PARENT_HOST: icinga-master
      ICINGA_TICKET: ${ICINGA_TICKET:-}
      NSCP_BUILD_DIR: ${NSCP_BUILD_DIR}
    volumes:
      # Same path inside as outside: a build tree finds its libraries by an
      # absolute RPATH.
      - ${NSCP_BUILD_DIR:?set NSCP_BUILD_DIR to an NSClient++ build tree}:${NSCP_BUILD_DIR}:ro
      - agent-certs:/var/lib/nscp-agent
    depends_on:
      - icinga-master

volumes:
  master-data:
  agent-certs:
