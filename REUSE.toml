# REUSE configuration (https://reuse.software) — REUSE spec 3.x
#
# Most C/C++ sources carry an inline SPDX header (see tools/license_headers.py).
# This file supplies license/copyright info for the remaining tracked files that
# cannot (or do not) carry an inline header — docs, data, images, build files,
# manifests, scripts, etc. — and records the licenses of bundled third-party
# files that carry a non-SPDX header REUSE cannot parse.
#
# Validate with: reuse lint
version = 1

SPDX-PackageName = "NSClient++"
SPDX-PackageSupplier = "Michael Medin <michael@medin.name>"
SPDX-PackageDownloadLocation = "https://github.com/mickem/nscp"

# --- Project default -----------------------------------------------------------
# Everything is NSClient++'s own, dual-licensed. precedence = "closest" means a
# file's own inline SPDX header (when present) wins over this fallback, so the
# per-file headers and the third-party overrides below are respected.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2004-2026 Michael Medin"
SPDX-License-Identifier = "Apache-2.0 OR GPL-2.0-only"

# --- Bundled third-party (see THIRD-PARTY-NOTICES.md) ---------------------------
# These carry upstream headers that predate SPDX tags, so annotate explicitly.
[[annotations]]
path = ["include/net/icmp_header.hpp", "include/net/ipv4_header.hpp"]
precedence = "override"
SPDX-FileCopyrightText = "2003-2008 Christopher M. Kohlhoff"
SPDX-License-Identifier = "BSL-1.0"

[[annotations]]
path = "include/simpleini/simpleini.h"
precedence = "override"
SPDX-FileCopyrightText = "2006-2008 Brodie Thiesfield"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["installers/ui/WixUI_MondoNSCP.wxs", "installers/installer-NSCP/WixUI_en-us.wxl"]
precedence = "override"
SPDX-FileCopyrightText = "Microsoft Corporation"
SPDX-License-Identifier = "CPL-1.0"

# CMake modules for C#/.NET/Mono, based on the GDCM project's (BSD-3-Clause).
# override: the attribution line is wrapped mid-sentence, which the reuse
# parser would otherwise pick up as an empty copyright holder.
[[annotations]]
path = [
    "build/cmake/FindCSharp.cmake",
    "build/cmake/FindDotNetFrameworkSdk.cmake",
    "build/cmake/FindMono.cmake",
    "build/cmake/UseCSharp.cmake",
    "build/cmake/UseDotNetFrameworkSdk.cmake",
    "build/cmake/UseMono.cmake",
]
precedence = "override"
SPDX-FileCopyrightText = "2006-2010 Mathieu Malaterre <mathieu.malaterre@gmail.com>"
SPDX-License-Identifier = "BSD-3-Clause"

# Protobuf CMake modules; their header points at a COPYING-CMAKE-SCRIPTS file
# (the stock BSD-3-Clause of KDE's cmake modules) that was never imported —
# LICENSES/BSD-3-Clause.txt now provides the text.
[[annotations]]
path = ["build/cmake/FindProtoBuf.cmake", "build/cmake/GoogleProtoBuf.cmake"]
precedence = "override"
SPDX-FileCopyrightText = "2008 Ange Optimization ApS"
SPDX-License-Identifier = "BSD-3-Clause"

# Prebuilt third-party binaries checked into the tree (no readable inline
# info, so without these the project-default annotation would claim them).
[[annotations]]
path = "installers/installer-NSCP/wixca.dll"
precedence = "override"
SPDX-FileCopyrightText = "Microsoft Corporation"
SPDX-License-Identifier = "CPL-1.0"

[[annotations]]
path = "libs/protobuf_net/Google.Protobuf.dll"
precedence = "override"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "BSD-3-Clause"

# Vendored replxx (libs/replxx/README.nscp.md records the upstream revision).
# The copy is byte-identical to upstream, which is the point: it can be diffed
# against the upstream tarball to prove provenance. That also means we do not
# add SPDX headers to the sources - most of them carry no notice at all - so
# the licensing lives here instead. libs/replxx/CMakeLists.txt and
# README.nscp.md are ours and stay under the project default.
#
# replxx is BSD-3-Clause, but it embeds two files under other terms; upstream
# documents all three in libs/replxx/LICENSE.md. The three blocks below must
# stay in this order: a later annotation wins over an earlier one, so the
# per-file entries override the directory-wide one.
[[annotations]]
path = ["libs/replxx/include/**", "libs/replxx/src/**", "libs/replxx/LICENSE.md"]
precedence = "override"
SPDX-FileCopyrightText = [
    "2017-2018 Marcin Konarski <amok@codestation.org>",
    "2010 Salvatore Sanfilippo <antirez@gmail.com>",
    "2010 Pieter Noordhuis <pcnoordhuis@gmail.com>",
]
SPDX-License-Identifier = "BSD-3-Clause"

# Markus Kuhn's reference wcwidth()/wcswidth() implementation, carried inside
# replxx. Its notice is the short permission-and-disclaimer form SPDX registers
# as HPND-Markus-Kuhn.
[[annotations]]
path = "libs/replxx/src/wcwidth.cpp"
precedence = "override"
SPDX-FileCopyrightText = "2007 Markus Kuhn"
SPDX-License-Identifier = "HPND-Markus-Kuhn"

# Unicode, Inc.'s UTF conversion routines, carried inside replxx. The notice in
# these files is the short "Limitations on Rights to Redistribute This Code"
# form shipped with ConvertUTF.c - not the Unicode Terms of Use, and not the
# Unicode DFS licence, so no registered SPDX identifier matches it and the text
# is carried verbatim in LICENSES/ under a LicenseRef.
[[annotations]]
path = ["libs/replxx/src/ConvertUTF.cpp", "libs/replxx/src/ConvertUTF.h"]
precedence = "override"
SPDX-FileCopyrightText = "2001-2004 Unicode, Inc."
SPDX-License-Identifier = "LicenseRef-Unicode-ConvertUTF"
