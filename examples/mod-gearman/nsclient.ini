; ---------------------------------------------------------------------------
; The agent side of the Mod-Gearman lab.
;
; Point an NSClient++ at this file and it connects out to the lab's gearmand,
; registers on the queue the core routes, and answers the checks in
; conf/objects.cfg. Nothing listens on this machine.
;
;   nscp test --settings ini://C:\src\nscp\examples\mod-gearman\nsclient.ini
;
; To use it as the real agent's configuration instead, copy the [/modules]
; lines and the [/settings/gearman/...] sections (and the schedule at the
; bottom, if you want the passive half) into
; C:\Program Files\NSClient++\nsclient.ini and restart the service.
; ---------------------------------------------------------------------------

[/settings/default]
; The lab's checks are answered by the modules below and nothing else has to
; be reachable, so no password and no listener are configured here.
allowed hosts = 127.0.0.1

[/modules]
; The module under test. (Note that a `;` comment has to be on a line of its
; own here: everything after the `=` is the value, comment and all.)
GearmanClient = enabled
; check_cpu, check_memory, check_uptime, check_service
CheckSystem   = enabled
; check_drivesize
CheckDisk     = enabled
; check_ok - the host check
CheckHelpers  = enabled
; Only for the passive half at the bottom of this file.
Scheduler     = enabled

; ---------------------------------------------------------------------------
; The worker: check jobs in, results out, over one outbound connection.
; ---------------------------------------------------------------------------
[/settings/gearman/worker]
; The lab's gearmand, published on the loopback address by docker compose.
server      = 127.0.0.1:4730

; The same secret as key= in conf/module.conf. Nothing negotiates this: with
; the wrong key the jobs are queued, cannot be decoded here, and the checks
; sit in the core until they are declared orphaned.
key         = nscp-lab-secret

; One queue per hostgroup, the same names as hostgroups= in conf/module.conf.
; The queue this registers on is hostgroup_windows-lab.
hostgroups  = windows-lab

; In agent mode (the default) a job is refused unless it names a host this
; agent answers for, which is its own computer name plus whatever is listed
; here. The lab's host object is called nscp-lab, so say so - or rename the
; host in conf/objects.cfg to this machine's name and drop this line.
host names  = nscp-lab

; Two threads, two connections. Plenty for one host's own checks.
workers     = 2

; ---------------------------------------------------------------------------
; The passive half: results this agent files by itself, into the same result
; queue the worker submits to. This is the part that replaces NSCA.
;
; Everything below is optional - delete it and the worker above still works.
; ---------------------------------------------------------------------------
[/settings/gearman/client]
channel  = GEARMAN
; The name the core files the results under. It has to be the core's
; host_name, which in conf/objects.cfg is nscp-lab; `auto` would use this
; machine's own name.
hostname = nscp-lab

[/settings/gearman/client/targets/default]
address  = 127.0.0.1:4730
key      = nscp-lab-secret
; The queue the core's result thread reads. A result on any other queue is
; discarded by gearmand without a word.
queue    = check_results

; The service description on the core is the name of the schedule, so this
; one lands on nscp-lab / "Passive result" - the service conf/objects.cfg
; defines with active checks turned off.
[/settings/scheduler/schedules/Passive result]
channel  = GEARMAN
interval = 30s
command  = check_ok "message=filed by the agent, nobody asked"

[/settings/scheduler/schedules/Passive result2]
channel  = GEARMAN
interval = 30s
command  = check_ok "message=filed by the agent, nobody asked"
