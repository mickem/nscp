# ---------------------------------------------------------------------------
# The lab's hosts and services.
#
#   nscp-lab     the machine running NSClient++. It is in the hostgroup
#                conf/module.conf routes, so every check below leaves the
#                core over gearmand and is answered by the agent.
#   gearman-lab  this container. Not in that hostgroup, so its one check
#                runs here - it is how the queue itself is watched.
#
# The check_command is always `nscp`, defined at the bottom as nothing but
# $ARG1$: what the agent receives is a native NSClient++ query, not a plugin
# path. Write the query exactly as you would type it after `nscp client
# --query`, with two exceptions that bite every Nagios operator once:
#
#   * `host=$HOSTADDRESS$`, not `-H $HOSTADDRESS$`. A two-character first
#     token puts the agent's parser into key=value mode and the value goes
#     missing; the check answers with a help screen.
#   * `warning=load gt 80`, not `warning=load>80`. `>` is a metacharacter
#     and the agent refuses it unless `allow nasty characters` is on.
#
# Edit, then: docker compose restart
# ---------------------------------------------------------------------------

define hostgroup {
  hostgroup_name  windows-lab
  alias           Checked through gearmand by an NSClient++ agent
}

# Templates for the lab. Half a minute between checks is impatient for a
# real installation and about right for a lab; interval_length is 60, so
# these are minutes.
define host {
  name                   lab-host
  use                    generic-host
  register               0
  check_period           24x7
  check_interval         0.5
  retry_interval         0.5
  max_check_attempts     2
  contact_groups         admins
  notifications_enabled  0
  notification_period    24x7
  notification_interval  0
}

define service {
  name                   lab-service
  use                    generic-service
  register               0
  check_period           24x7
  check_interval         0.5
  retry_interval         0.5
  max_check_attempts     2
  contact_groups         admins
  notifications_enabled  0
  notification_period    24x7
  notification_interval  0
}

# ---------------------------------------------------------------------------
# The agent. Everything here is answered by NSClient++ over gearmand.
#
# `host_name` is also the name the agent checks a job against: in agent mode
# it refuses a job for a host it is not. Either name this host after your
# Windows machine, or leave it as nscp-lab and keep
# `host names = nscp-lab` in the agent's worker section.
# ---------------------------------------------------------------------------
define host {
  use            lab-host
  host_name      nscp-lab
  alias          The machine running NSClient++
  address        127.0.0.1
  hostgroups     windows-lab
  # A host check is a check like any other. check_ok always answers OK, so
  # this one says exactly one thing: the agent is connected and answering.
  check_command  nscp!check_ok message=agent-is-alive
}

define service {
  use                  lab-service
  host_name            nscp-lab
  service_description  CPU
  check_command        nscp!check_cpu "warning=load gt 80" "critical=load gt 90"
}

define service {
  use                  lab-service
  host_name            nscp-lab
  service_description  Memory
  check_command        nscp!check_memory "warning=used gt 80%" "critical=used gt 90%"
}

define service {
  use                  lab-service
  host_name            nscp-lab
  service_description  Disk C
  check_command        nscp!check_drivesize drive=C: "warning=free lt 20%" "critical=free lt 10%"
}

define service {
  use                  lab-service
  host_name            nscp-lab
  service_description  Uptime
  check_command        nscp!check_uptime "warning=uptime lt 2h" "critical=uptime lt 15m"
}

define service {
  use                  lab-service
  host_name            nscp-lab
  service_description  DHCP client service
  check_command        nscp!check_service service=Dhcp
}

# Passive only: the core never schedules this one, so nothing the worker
# does can move it. What lands here arrived on the `check_results` queue,
# which is the channel `nscp gearman ... --command "Passive result"` and the
# Scheduler write into. Until something does, it sits PENDING.
define service {
  use                     lab-service
  host_name               nscp-lab
  service_description     Passive result
  check_command           nscp!check_ok message=never-run
  active_checks_enabled   0
  passive_checks_enabled  1
}

# A check the agent is asked for and does not have. It answers UNKNOWN with
# "Unknown command(s): check_no_such_thing", which is worth seeing once: it
# is what a check whose module is not enabled looks like from the core.
define service {
  use                  lab-service
  host_name            nscp-lab
  service_description  Missing command
  check_command        nscp!check_no_such_thing
}

# ---------------------------------------------------------------------------
# The container itself. Not in windows-lab, so this check is run here, by
# the core, the ordinary way - which is how you see whether an agent is on
# the queue at all without leaving the web UI.
# ---------------------------------------------------------------------------
define host {
  use            lab-host
  host_name      gearman-lab
  alias          This container (Naemon, gearmand, Thruk)
  address        127.0.0.1
  check_command  check-lab-alive
}

define service {
  use                  lab-service
  host_name            gearman-lab
  service_description  Gearman queue
  # -x is the interesting flag: CRITICAL when nothing is registered on the
  # queue, which is what "the agent is not connected" looks like from here.
  # The thresholds are the number of jobs waiting in the queue - they pile
  # up when the agent is gone and drain when it comes back.
  check_command        check_gearman_queue!5!20
}

define command {
  command_name  check-lab-alive
  command_line  /bin/echo "the lab itself, checked the ordinary way"
}

define command {
  command_name  check_gearman_queue
  command_line  /usr/lib/nagios/plugins/check_gearman -H localhost:4730 -q hostgroup_windows-lab -x -t 20 -w $ARG1$ -c $ARG2$
}

# The one command definition every check above goes through: the agent gets
# the expanded $ARG1$ and runs it as a query.
define command {
  command_name  nscp
  command_line  $ARG1$
}

