# ---------------------------------------------------------------------------
# Mod-Gearman NEB module - the core side of the lab.
#
# This file decides which checks leave the core at all. Everything in the
# hostgroup named below is put on the gearmand queue `hostgroup_<name>`
# instead of being run here; the NSClient++ agent that registers on that
# queue answers it.
#
# Edit, then: docker compose restart
# ---------------------------------------------------------------------------

# gearmand runs in this same container. Spelled 127.0.0.1 rather than
# localhost: gearmand listens on IPv4 only here, and the NEB module would
# resolve localhost to ::1 first and time out.
server=127.0.0.1:4730

# The shared secret. It must be byte-for-byte the same as `key` in the
# agent's [/settings/gearman/worker] section - nothing negotiates it, and a
# mismatch is silent on this side: the jobs are queued, the agent cannot
# decode them, and the checks just sit there.
#
# CHANGE IT if this lab ever leaves your own machine. Anyone who has it can
# queue checks for the agent to run.
encryption=yes
key=nscp-lab-secret

# Route this hostgroup through gearmand, and nothing else. `hosts` and
# `services` would route every check the core has, including the ones the
# lab runs locally.
hostgroups=windows-lab
do_hostchecks=yes
hosts=no
services=no

# Not part of this lab: event handlers and notifications stay in the core.
eventhandler=no
notifications=no

# One thread reading `check_results` back. The queue is the same one the
# agent's submit_gearman / Scheduler channel writes into, which is what lets
# a Mod-Gearman installation drop NSCA.
result_workers=1
accept_clear_results=no

# Say something when a check comes back for a host nobody is answering for,
# rather than leaving it in its last state forever.
orphan_host_checks=yes
orphan_service_checks=yes

use_uniq_jobs=on
debug=0
logfile=/var/log/naemon/mod_gearman_neb.log
