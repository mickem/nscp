# Thruk, pointed at the lab's Naemon through its livestatus socket.
#
# There is no authentication here: default_user_name logs every visitor in as
# an omnipotent user, because a playground that asks for a password is a
# playground nobody opens. Do not expose port 8080 anywhere but your own
# machine.
default_user_name = thrukadmin
cookie_auth_disable = 1

<Component Thruk::Backend>
  <peer>
    name    = Gearman lab
    type    = livestatus
    <options>
      peer  = /var/cache/naemon/live
    </options>
  </peer>
</Component>
