---
name: Download Mongoose
description: Download Mongoose
inputs:
  version:
    description: The Mongoose version to download
    required: true
outputs:
  path:
    description: The path to the folder (windows \ format)
    value:  ${{ steps.path.outputs.path }}
  path_unix:
    description: The path to the folder (unix / format)
    value:  ${{ steps.path.outputs.path_unix }}
runs:
  using: composite
  steps:
    # Cloned at the tag rather than downloaded as a generated tag archive: see
    # the tinyxml2 action for why the commit is the thing worth pinning.
    - name: Clone
      run: |
        git clone --quiet --depth 1 --branch "${{ inputs.version }}" https://github.com/cesanta/mongoose.git "mongoose-${{ inputs.version }}"
      working-directory: tmp
      shell: bash

    - name: Verify commit
      run: |
        "$GITHUB_WORKSPACE/.github/scripts/verify-commit.sh" mongoose "${{ inputs.version }}" "mongoose-${{ inputs.version }}"
      working-directory: tmp
      shell: bash

    - id: path
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          path=$(pwd -W)
          path_unix=$(pwd -W | sed 's/\\/\//g')
        else
          path=$(pwd)
          path_unix=$path
        fi
        echo "path=$path" >> $GITHUB_OUTPUT
        echo "path_unix=$path_unix" >> $GITHUB_OUTPUT
      shell: bash
      working-directory: tmp/mongoose-${{ inputs.version }}
