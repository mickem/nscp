---
name: Build cryptopp
description: Build and cache cryptopp libraries
inputs:
  version:
    description: The cryptopp version to build
    required: true
  architecture:
    description: The architecture to build
    required: true
  runtime:
    description: If we should use dynamic or static runtime
    default: dynamic
  toolset:
    description: The toolset to use for building
    required: true
outputs:
  path:
    description: The path to the cryptopp folder
    value:  ${{ steps.path.outputs.path }}
  path_unix:
    description: The path to the cryptopp folder
    value:  ${{ steps.path.outputs.path_unix }}
runs:
  using: composite
  steps:

    - id: cache
      uses: actions/cache@v3
      with:
        key: ${{ runner.os }}-cryptopp-${{ inputs.version }}-${{ inputs.architecture }}-${{ inputs.runtime }}-${{ inputs.toolset }}
        path: |
          tmp/cryptopp

    - id: versions
      run: |
        $tag_version="${{ inputs.version }}".replace('.','_')
        $file_version="${{ inputs.version }}".replace('.','')
        echo "tag_version=$tag_version" >> $env:GITHUB_OUTPUT
        echo "file_version=$file_version" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Download
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
            curl -fL --retry 8 --retry-delay 15 --retry-max-time 300 https://github.com/weidai11/cryptopp/releases/download/CRYPTOPP_${{ steps.versions.outputs.tag_version }}/cryptopp${{ steps.versions.outputs.file_version }}.zip --output cryptopp.zip
      working-directory: tmp
      shell: cmd

    - name: Verify checksum
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        "$GITHUB_WORKSPACE/.github/scripts/verify-checksum.sh" cryptopp "${{ inputs.version }}" cryptopp.zip
      working-directory: tmp
      shell: bash

    - name: Unpack
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
            mkdir cryptopp
            cd cryptopp
            7z x ..\cryptopp.zip
      working-directory: tmp
      shell: cmd

    - id: setup
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        switch ("${{ inputs.architecture }}") {
          "x86"   { echo "platform=win32" >> $env:GITHUB_OUTPUT }
          "arm64" { echo "platform=ARM64" >> $env:GITHUB_OUTPUT }
          default { echo "platform=x64"   >> $env:GITHUB_OUTPUT }
        }
      shell: pwsh
      working-directory: tmp/cryptopp

    # Crypto++ ships Win32/x64 project configurations only, so msbuild rejects
    # /p:Platform=ARM64 outright. The sources build fine on ARM64 - see the
    # script for why this is boilerplate rather than a port.
    - name: Add ARM64 project configurations
      if: inputs.architecture == 'arm64' && steps.cache.outputs.cache-hit != 'true'
      run: |
        python ../../build/python/msdev-add-arm64.py cryptlib.vcxproj
      shell: cmd
      working-directory: tmp/cryptopp

    - name: Convert to dynamic runtime
      if: inputs.runtime == 'dynamic' && steps.cache.outputs.cache-hit != 'true'
      run: |
        python ../../build/python/msdev-to-dynamic.py cryptlib.vcxproj
      shell: cmd
      working-directory: tmp/cryptopp

    - name: Build
      if: inputs.architecture != 'arm64' && steps.cache.outputs.cache-hit != 'true'
      run: |
        msbuild cryptlib.vcxproj /p:Configuration=Release /p:Platform=${{ steps.setup.outputs.platform }} /p:PlatformToolset=${{ inputs.toolset }}
        msbuild cryptdll.vcxproj /p:Configuration=Release /p:Platform=${{ steps.setup.outputs.platform }} /p:PlatformToolset=${{ inputs.toolset }}
        msbuild cryptlib.vcxproj /p:Configuration=Debug /p:Platform=${{ steps.setup.outputs.platform }} /p:PlatformToolset=${{ inputs.toolset }}
        msbuild cryptdll.vcxproj /p:Configuration=Debug /p:Platform=${{ steps.setup.outputs.platform }} /p:PlatformToolset=${{ inputs.toolset }}
      working-directory: tmp/cryptopp
      shell: cmd

    # cryptdll is left out on ARM64: NSClient++ links the static cryptlib (see
    # FindCryptoPP.cmake) and cryptdll's MAC post-build step shells out to a
    # Win32 cryptest.exe, which has nothing to say about an ARM64 DLL nobody
    # ships.
    - name: Build (ARM64)
      if: inputs.architecture == 'arm64' && steps.cache.outputs.cache-hit != 'true'
      run: |
        msbuild cryptlib.vcxproj /p:Configuration=Release /p:Platform=${{ steps.setup.outputs.platform }} /p:PlatformToolset=${{ inputs.toolset }}
        msbuild cryptlib.vcxproj /p:Configuration=Debug /p:Platform=${{ steps.setup.outputs.platform }} /p:PlatformToolset=${{ inputs.toolset }}
      working-directory: tmp/cryptopp
      shell: cmd

    - id: path
      run: |
        $path=$pwd.path
        $path_unix=$pwd.path.replace('\','/')
        echo "path=$path" >> $env:GITHUB_OUTPUT
        echo "path_unix=$path_unix" >> $env:GITHUB_OUTPUT
      shell: pwsh
      working-directory: tmp/cryptopp
