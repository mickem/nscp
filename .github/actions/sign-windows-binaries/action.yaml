---
name: Sign windows binaries
description: Sign the binaries the installer ships, before the installer is built
inputs:
  files:
    description: >-
      Newline-separated absolute paths of the files to sign, normally the
      output of build/python/signing_list.py. An explicit list rather than a
      folder: the build tree also holds the unit-test executables, and every
      signature is billed.
    required: true
  azure-tenant-id:
    description: The Azure Active Directory tenant (directory) ID.
    required: true
  azure-client-id:
    description: The client (application) ID of an App Registration in the tenant.
    required: true
  azure-client-secret:
    description: A client secret that was generated for the App Registration.
    required: true
runs:
  using: composite
  steps:
    - name: Sign binaries
      uses: azure/trusted-signing-action@0d74250c661747df006298d0fb49944c10f16e03 # v0.5.1
      with:
        azure-tenant-id: ${{ inputs.azure-tenant-id }}
        azure-client-id: ${{ inputs.azure-client-id }}
        azure-client-secret: ${{ inputs.azure-client-secret }}
        endpoint: https://neu.codesigning.azure.net
        trusted-signing-account-name: nsclient
        certificate-profile-name: nsclient
        files: ${{ inputs.files }}
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256
