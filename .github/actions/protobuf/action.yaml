---
name: Build protobuf
description: Build and cache protobuf libraries
inputs:
  version:
    description: The protobuf version to build
    required: true
  architecture:
    description: The openssl architecture to build
    required: true
  runtime:
    description: The openssl architecture to build
    default: dynamic
  toolset:
    description: The toolset to use for building
    required: true
  support_xp:
    description: If we should support Windows XP
    default: 'false'
outputs:
  path:
    description: The path to the protobuf folder
    value:  ${{ steps.path.outputs.path }}
  path_unix:
    description: The path to the protobuf folder
    value:  ${{ steps.path.outputs.path_unix }}
  protoc_unix:
    description: >-
      The protoc that runs on the *host*: the same one as in the target tree for
      a native build, a separate x64 build when cross-compiling.
    value:  ${{ steps.path.outputs.protoc_unix }}
runs:
  using: composite
  steps:

    - name: Download protobuf
      run: |
            curl -fL --retry 8 --retry-delay 15 --retry-max-time 300 https://github.com/protocolbuffers/protobuf/releases/download/v${{ inputs.version }}/protobuf-all-${{ inputs.version }}.zip --output protobuf.zip
      working-directory: tmp
      shell: cmd

    - name: Verify checksum
      run: |
        "$GITHUB_WORKSPACE/.github/scripts/verify-checksum.sh" protobuf "${{ inputs.version }}" protobuf.zip
      working-directory: tmp
      shell: bash

    - name: Unpack protobuf
      run: |
            7z x protobuf.zip
      working-directory: tmp
      shell: cmd

    # The value recorded for this version in .github/dependency-checksums.txt
    # is part of the cache key, so a build is only ever restored for exactly
    # the input it was made from. Re-recording the digest (or recording one
    # where it used to read `unrecorded`) starts a fresh build instead of
    # reusing one made from bytes that were never checked against it.
    - id: digest
      shell: bash
      run: |
        value="$("$GITHUB_WORKSPACE/.github/scripts/dependency-digest.sh" protobuf "${{ inputs.version }}")"
        echo "value=${value}" >> "$GITHUB_OUTPUT"

    - id: cache
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
      with:
        key: ${{ runner.os }}-protobuf-${{ inputs.version }}-${{ inputs.architecture }}-${{ inputs.runtime }}-${{ inputs.toolset }}-${{ steps.digest.outputs.value }}
        path: |
          tmp/protobuf-${{ inputs.version }}/build/Release
          tmp/protobuf-${{ inputs.version }}/build_host/Release

    - id: setup
      run: |
        switch ("${{ inputs.architecture }}") {
          "x86"   { echo "platform=Win32" >> $env:GITHUB_OUTPUT }
          "arm64" { echo "platform=ARM64" >> $env:GITHUB_OUTPUT }
          default { echo "platform=x64"   >> $env:GITHUB_OUTPUT }
        }
        # protoc is a *build* tool: the NSCP build runs it to generate the
        # .pb.cc sources. Cross-compiling for ARM64 produces a protoc.exe the
        # x64 runner cannot execute, so a second, host-native one is built
        # alongside it and handed to CMake.
        if ("${{ inputs.architecture }}" -eq "arm64") {
          echo "cross=true" >> $env:GITHUB_OUTPUT
        } else {
          echo "cross=false" >> $env:GITHUB_OUTPUT
        }
        # The runner reports itself as Windows 6.2 and has the Windows 8.1 SDK
        # installed for the legacy XP build, so CMake picks 8.1 - "Selecting
        # Windows SDK version 8.1 to target Windows 6.2.9200" - and 8.1 has no
        # ARM64 toolchain at all, which surfaces as "No CMAKE_C_COMPILER could
        # be found". Only the SDK is pinned; the toolset stays as asked.
        if ("${{ inputs.architecture }}" -eq "arm64") {
          echo "sdk=-DCMAKE_SYSTEM_VERSION=10.0" >> $env:GITHUB_OUTPUT
        } else {
          echo "sdk=" >> $env:GITHUB_OUTPUT
        }
        if ("${{ inputs.runtime }}" -eq "dynamic") {
          echo "shared_libs=TRUE" >> $env:GITHUB_OUTPUT
        } else {
          echo "shared_libs=FALSE" >> $env:GITHUB_OUTPUT
        }
        if ("${{ inputs.support_xp }}" -eq "true") {
          echo 'additional_options=/p:AdditionalOptions="/DGOOGLE_PROTOBUF_SUPPORT_WINDOWS_XP %(AdditionalOptions)"' >> $env:GITHUB_OUTPUT
          echo "cmake_toolset=${{ inputs.toolset }},version=14.16" >> $env:GITHUB_OUTPUT
          echo "vctools_version=/p:VCToolsVersion=14.16.27023" >> $env:GITHUB_OUTPUT
        } else {
          echo "additional_options=" >> $env:GITHUB_OUTPUT
          echo "cmake_toolset=${{ inputs.toolset }}" >> $env:GITHUB_OUTPUT
          echo "vctools_version=" >> $env:GITHUB_OUTPUT
        }
        

      shell: pwsh

    - name: Prepare
      run: |
        mkdir build
      working-directory: tmp/protobuf-${{ inputs.version }}
      shell: cmd
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}

    - name: Prepare (host protoc)
      run: |
        mkdir build_host
      working-directory: tmp/protobuf-${{ inputs.version }}
      shell: cmd
      if: ${{ steps.cache.outputs.cache-hit != 'true' && steps.setup.outputs.cross == 'true' }}

    - name: CMake
      run: |
        cmake -DBUILD_SHARED_LIBS=${{ steps.setup.outputs.shared_libs }} -Dprotobuf_WITH_ZLIB=OFF -G "Visual Studio 17" -T ${{ steps.setup.outputs.cmake_toolset }} -A ${{ steps.setup.outputs.platform }} ${{ steps.setup.outputs.sdk }} ..
      working-directory: tmp/protobuf-${{ inputs.version }}/build
      shell: cmd

    - name: Build
      run: |
        echo msbuild libprotobuf.vcxproj /p:Configuration=Release /p:Platform=${{ steps.setup.outputs.platform }} /p:PlatformToolset=${{ inputs.toolset }} ${{ steps.setup.outputs.vctools_version }} ${{ steps.setup.outputs.additional_options }}
        msbuild libprotobuf.vcxproj /p:Configuration=Release /p:Platform=${{ steps.setup.outputs.platform }} /p:PlatformToolset=${{ inputs.toolset }} ${{ steps.setup.outputs.vctools_version }} ${{ steps.setup.outputs.additional_options }}
        msbuild libprotoc.vcxproj /p:Configuration=Release /p:Platform=${{ steps.setup.outputs.platform }} /p:PlatformToolset=${{ inputs.toolset }} ${{ steps.setup.outputs.vctools_version }}
        msbuild protoc.vcxproj /p:Configuration=Release /p:Platform=${{ steps.setup.outputs.platform }} /p:PlatformToolset=${{ inputs.toolset }} ${{ steps.setup.outputs.vctools_version }}
      working-directory: tmp/protobuf-${{ inputs.version }}/build
      shell: cmd
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}

    # Only protoc itself, and only for the host architecture: the libraries the
    # daemon links against still come from the target build above.
    - name: Build host protoc
      run: |
        cmake -Dprotobuf_WITH_ZLIB=OFF -Dprotobuf_BUILD_TESTS=OFF -G "Visual Studio 17" -T ${{ inputs.toolset }} -A x64 ..
        msbuild protoc.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=${{ inputs.toolset }}
      working-directory: tmp/protobuf-${{ inputs.version }}/build_host
      shell: cmd
      if: ${{ steps.cache.outputs.cache-hit != 'true' && steps.setup.outputs.cross == 'true' }}

    - id: path
      run: |
        $path=$pwd.path
        $path_unix=$pwd.path.replace('\','/')
        echo "path=$path" >> $env:GITHUB_OUTPUT
        echo "path_unix=$path_unix" >> $env:GITHUB_OUTPUT
        if ("${{ steps.setup.outputs.cross }}" -eq "true") {
          $protoc = "$path_unix/build_host/Release/protoc.exe"
        } else {
          $protoc = "$path_unix/build/Release/protoc.exe"
        }
        if (-not (Test-Path $protoc)) {
          Write-Error "protoc was not built: $protoc does not exist"
          exit 1
        }
        echo "protoc_unix=$protoc" >> $env:GITHUB_OUTPUT
      shell: pwsh
      working-directory: tmp/protobuf-${{ inputs.version }}
