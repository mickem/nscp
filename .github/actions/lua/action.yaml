---
name: Download lua
description: Download and cache lua
inputs:
  version:
    description: The Lua version to cache
    required: true
outputs:
  path:
    description: The path to the folder (windows \ format)
    value:  ${{ steps.path.outputs.path }}
  path_unix:
    description: The path to the folder (unix / format)
    value:  ${{ steps.path.outputs.path_unix }}
runs:
  using: composite
  steps:
    # The value recorded for this version in .github/dependency-checksums.txt
    # is part of the cache key, so a build is only ever restored for exactly
    # the input it was made from. Re-recording the digest (or recording one
    # where it used to read `unrecorded`) starts a fresh build instead of
    # reusing one made from bytes that were never checked against it.
    - id: digest
      shell: bash
      run: |
        value="$("$GITHUB_WORKSPACE/.github/scripts/dependency-digest.sh" lua "${{ inputs.version }}")"
        echo "value=${value}" >> "$GITHUB_OUTPUT"

    - id: cache
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
      with:
        key: ${{ runner.os }}-lua-${{ inputs.version }}-${{ steps.digest.outputs.value }}
        path: |
          tmp/lua-${{ inputs.version }}

    - name: Download
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        curl -fL --retry 8 --retry-delay 15 --retry-max-time 300 https://www.lua.org/ftp/lua-${{ inputs.version }}.tar.gz --output lua.tar.gz
      working-directory: tmp
      shell: cmd

    - name: Verify checksum
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        "$GITHUB_WORKSPACE/.github/scripts/verify-checksum.sh" lua "${{ inputs.version }}" lua.tar.gz
      working-directory: tmp
      shell: bash

    - name: Unpack
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        7z x lua.tar.gz
        7z x lua.tar
        del lua.tar
        del lua.tar.gz
      working-directory: tmp
      shell: cmd


    - id: path
      run: |
        $path=$pwd.path
        $path_unix=$pwd.path.replace('\','/')
        echo "path=$path" >> $env:GITHUB_OUTPUT
        echo "path_unix=$path_unix" >> $env:GITHUB_OUTPUT
      shell: pwsh
      working-directory: tmp/lua-${{ inputs.version }}
