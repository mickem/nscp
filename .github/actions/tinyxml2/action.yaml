---
name: Download TinyXml2
description: Download and cache TinyXml2
inputs:
  version:
    description: The TinyXml2 version to cache
    required: true
outputs:
  path:
    description: The path to the folder (windows \ format)
    value:  ${{ steps.path.outputs.path }}
  path_unix:
    description: The path to the folder (unix / format)
    value:  ${{ steps.path.outputs.path_unix }}
runs:
  using: composite
  steps:
    # Cloned at the tag rather than downloaded as a generated tag archive, so
    # what the build compiles can be pinned to an immutable commit. A tag is a
    # movable pointer and the zip GitHub generates for it is not a release
    # artifact anyone signs; the commit is the thing that cannot change under
    # us. Same treatment as googletest.
    - name: Clone
      run: |
        git clone --quiet --depth 1 --branch "${{ inputs.version }}" https://github.com/leethomason/tinyxml2.git "tinyxml2-${{ inputs.version }}"
      working-directory: tmp
      shell: bash

    - name: Verify commit
      run: |
        "$GITHUB_WORKSPACE/.github/scripts/verify-commit.sh" tinyxml2 "${{ inputs.version }}" "tinyxml2-${{ inputs.version }}"
      working-directory: tmp
      shell: bash

    - id: path
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          path=$(pwd -W)
          path_unix=$(pwd -W | sed 's/\\/\//g')
        else
          path=$(pwd)
          path_unix=$path
        fi
        echo "path=$path" >> $GITHUB_OUTPUT
        echo "path_unix=$path_unix" >> $GITHUB_OUTPUT
      shell: bash
      working-directory: tmp/tinyxml2-${{ inputs.version }}
