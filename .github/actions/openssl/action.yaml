---
name: Build openssl
description: Build and cache openssl libraries
inputs:
  version:
    description: The openssl version to build
    required: true
  architecture:
    description: The openssl architecture to build
    required: true
  runtime:
    description: The C runtime to link against, dynamic (/MD) or static (/MT)
    default: dynamic
  linkage:
    description: >-
      How OpenSSL itself is built: `static` produces libcrypto.lib and
      libssl.lib as static libraries, `shared` produces libcrypto-3-x64.dll
      and libssl-3-x64.dll (libcrypto-3.dll / libssl-3.dll on x86) with
      import libraries of the same names. A shared build also leaves
      libcrypto_static.lib / libssl_static.lib behind, but those are compiled
      against the DLL C runtime whatever `runtime` says, so a static-runtime
      consumer (installer_lib) cannot link them; it needs a `static` build of
      its own, see `suffix`.
    default: static
  suffix:
    description: >-
      Appended to the build folder (tmp/openssl-<version><suffix>) and to the
      cache key, so that one job can hold two builds of the same version, say
      a shared one for the product and a static one for installer_lib.
    default: ''
outputs:
  path:
    description: The path to the openssl folder
    value:  ${{ steps.path.outputs.path }}
  path_unix:
    description: The path to the openssl folder
    value:  ${{ steps.path.outputs.path_unix }}
runs:
  using: composite
  steps:

    - id: setup
      run: |
        # The target triplet has to be named explicitly: Configure otherwise
        # guesses from the host, and a cross build for ARM64 would silently
        # produce x86 libraries that fail to link into the ARM64 daemon.
        switch ("${{ inputs.architecture }}") {
          "x64"   { echo "cmd=VC-WIN64A" >> $env:GITHUB_OUTPUT }
          "arm64" { echo "cmd=VC-WIN64-ARM" >> $env:GITHUB_OUTPUT }
          default { echo "cmd=VC-WIN32" >> $env:GITHUB_OUTPUT }
        }
        if ("${{ inputs.runtime }}" -eq "dynamic") {
          echo "runtime_flags=" >> $env:GITHUB_OUTPUT
        } else {
          echo "runtime_flags=-MT" >> $env:GITHUB_OUTPUT
        }
        if ("${{ inputs.linkage }}" -eq "shared") {
          echo "linkage_flags=shared" >> $env:GITHUB_OUTPUT
        } else {
          echo "linkage_flags=no-shared" >> $env:GITHUB_OUTPUT
        }
        echo "dir=openssl-${{ inputs.version }}${{ inputs.suffix }}" >> $env:GITHUB_OUTPUT
      shell: pwsh

    # A second run of this action in the same job (another suffix) finds the
    # tarball from the first one and skips the download.
    - name: Download openssl
      run: |
            if not exist openssl-${{ inputs.version }}.tar.gz curl -fL --retry 8 --retry-delay 15 --retry-max-time 300 https://github.com/openssl/openssl/releases/download/openssl-${{ inputs.version }}/openssl-${{ inputs.version }}.tar.gz --output openssl-${{ inputs.version }}.tar.gz
      working-directory: tmp
      shell: cmd

    - name: Verify checksum
      run: |
        "$GITHUB_WORKSPACE/.github/scripts/verify-checksum.sh" openssl "${{ inputs.version }}" openssl-${{ inputs.version }}.tar.gz
      working-directory: tmp
      shell: bash

    # The tarball unpacks to openssl-<version>. A suffixed build is unpacked
    # through a scratch folder and moved into place, so it never touches the
    # unsuffixed tree an earlier run of this action may have built already.
    - name: Unpack openssl
      run: |
            7z x -y openssl-${{ inputs.version }}.tar.gz
            if "${{ inputs.suffix }}"=="" (
              7z x -y openssl-${{ inputs.version }}.tar
            ) else (
              7z x -y openssl-${{ inputs.version }}.tar -o${{ steps.setup.outputs.dir }}.unpack
              move ${{ steps.setup.outputs.dir }}.unpack\openssl-${{ inputs.version }} ${{ steps.setup.outputs.dir }}
              rmdir ${{ steps.setup.outputs.dir }}.unpack
            )
      working-directory: tmp
      shell: cmd

    - id: cache
      uses: actions/cache@v3
      with:
        # The linkage flag and the suffix are part of the key, so a static
        # and a shared build of the same version never share a cache entry
        # (with no suffix the static key spells "no-shared", as it always
        # did, so the legacy build keeps its cache).
        key: ${{ runner.os }}-openssl-${{ inputs.version }}${{ inputs.suffix }}-${{ steps.setup.outputs.linkage_flags }}-${{ inputs.architecture }}-${{ inputs.runtime }}
        # The two globs cover every linkage: the static libraries, and for a
        # shared build the import libraries, the versioned DLLs and their
        # _static twins.
        path: |
          tmp/${{ steps.setup.outputs.dir }}/libcrypto*.*
          tmp/${{ steps.setup.outputs.dir }}/libssl*.*
          tmp/${{ steps.setup.outputs.dir }}/include/crypto/dso_conf.h
          tmp/${{ steps.setup.outputs.dir }}/include/crypto/bn_conf.h
          tmp/${{ steps.setup.outputs.dir }}/include/internal/param_names.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/asn1.h          
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/asn1t.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/bio.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/cmp.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/cms.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/comp.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/conf.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/configuration.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/core_names.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/crmf.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/crypto.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/ct.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/err.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/ess.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/fipskey.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/lhash.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/ocsp.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/opensslv.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/pkcs12.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/pkcs7.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/safestack.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/srp.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/ssl.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/ui.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/x509.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/x509v3.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/x509_acert.h
          tmp/${{ steps.setup.outputs.dir }}/include/openssl/x509_vfy.h


    - name: Build openssl
      run: |
          perl Configure ${{ steps.setup.outputs.cmd }} no-asm ${{ steps.setup.outputs.linkage_flags }} ${{ steps.setup.outputs.runtime_flags }}
          nmake
      working-directory: tmp/${{ steps.setup.outputs.dir }}
      shell: cmd
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}

    - id: path
      run: |
        $path=$pwd.path
        $path_unix=$pwd.path.replace('\','/')
        echo "path=$path" >> $env:GITHUB_OUTPUT
        echo "path_unix=$path_unix" >> $env:GITHUB_OUTPUT
      shell: pwsh
      working-directory: tmp/${{ steps.setup.outputs.dir }}
