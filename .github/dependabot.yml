---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      frontend:
        patterns:
          - "*"
    ignore:
      # typescript-eslint 8 peers on typescript <6.1.0, so a grouped update that
      # carries TypeScript 7 fails `npm ci` and takes every other bump in the
      # group down with it. Drop this once typescript-eslint supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/tests"
    schedule:
      interval: "weekly"
    groups:
      testing:
        patterns:
          - "*"
    ignore:
      # ts-jest 29 peers on typescript <7; one unresolvable bump fails `npm
      # install` for the whole group.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # These majors need Node 22. The regular suites still run on the
      # distro's Node 18 and the stress harness on Node 20 (see
      # integration-tests-linux.yml), and execa 6+ is ESM-only while the
      # harness is CommonJS. Lift together with the Node version.
      - dependency-name: "execa"
        update-types: ["version-update:semver-major"]
      - dependency-name: "undici"
        update-types: ["version-update:semver-major"]
      - dependency-name: "testcontainers"
        update-types: ["version-update:semver-major"]
      # Types follow the Node the suites run on, not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: "/build/python"
    schedule:
      interval: "weekly"
    groups:
      build:
        patterns:
          - "*"
    ignore:
      # mk_pyzip.py packs this runtime into the Python zip the agent ships, so
      # a protobuf major changes the API users' scripts see (7 removes
      # FieldDescriptor.label and the float_format options). Take it as a
      # change of its own, with an upgrade note, not inside a grouped bump.
      - dependency-name: "protobuf"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: "tests/msi"
    schedule:
      interval: "weekly"
    groups:
      testing:
        patterns:
          - "*"
