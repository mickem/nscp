---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      frontend:
        patterns:
          - "*"
    ignore:
      # typescript-eslint 8 peers on typescript <6.1.0, so a grouped update that
      # carries TypeScript 7 fails `npm ci` and takes every other bump in the
      # group down with it. Drop this once typescript-eslint supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/tests"
    schedule:
      interval: "weekly"
    groups:
      testing:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: "/build/python"
    schedule:
      interval: "weekly"
    groups:
      build:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: "tests/msi"
    schedule:
      interval: "weekly"
    groups:
      testing:
        patterns:
          - "*"
