name: Create release

permissions:
  contents: write
  actions: read
  # For the attestations below: an OIDC token to obtain the Sigstore signing
  # certificate, and the attestations API to store the result.
  id-token: write
  attestations: write

on:
  workflow_call:
    inputs:
      version:
        type: string
        description: 'Version to build'
        required: true

env:
  PYTHON_VERSION: 3.11

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - id: python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ ENV.PYTHON_VERSION }}

    # Windows artifacts
    - uses: actions/download-artifact@v7
      with:
        name: NSCP-${{ inputs.version }}-x64
    - uses: actions/download-artifact@v7
      with:
        name: NSCP-${{ inputs.version }}-Win32
    - uses: actions/download-artifact@v7
      with:
        name: NSCP-${{ inputs.version }}-Win32-legacy-xp
    - uses: actions/download-artifact@v7
      with:
        name: NSCP-${{ inputs.version }}-ARM64

    # Ubuntu artifacts
    - uses: actions/download-artifact@v7
      with:
        name: NSCP-${{ inputs.version }}-ubuntu-24.04-x64
    - uses: actions/download-artifact@v7
      with:
        name: NSCP-${{ inputs.version }}-ubuntu-24.04-arm64

    # Raspberry Pi OS 64-bit (and Debian 13 arm64, which it is built from)
    - uses: actions/download-artifact@v7
      with:
        name: NSCP-${{ inputs.version }}-debian-trixie-arm64

    # RedHat (rocky) artifacts
    - uses: actions/download-artifact@v7
      with:
        name: NSCP-${{ inputs.version }}-rocky-9-x64
    - uses: actions/download-artifact@v7
      with:
        name: NSCP-${{ inputs.version }}-rocky-9-arm64
    - uses: actions/download-artifact@v7
      with:
        name: NSCP-${{ inputs.version }}-rocky-10-x64
    - uses: actions/download-artifact@v7
      with:
        name: NSCP-${{ inputs.version }}-rocky-10-arm64

    # macOS arm64. The artifact is a directory (the .pkg plus the relocatable
    # tarball), so it is unpacked into one and the paths below name both files.
    - uses: actions/download-artifact@v7
      with:
        name: NSCP-${{ inputs.version }}-macos-arm64
        path: macos

    - uses: actions/download-artifact@v7
      with:
        name: NSCP-${{ inputs.version }}-web

    - name: Rename docs
      run: |
        mv NSCP-${{ inputs.version }}-x64-docs.zip NSCP-${{ inputs.version }}-docs.zip
        rm NSCP-${{ inputs.version }}-Win32-docs.zip
        rm NSCP-${{ inputs.version }}-Win32-legacy-xp-docs.zip
        rm NSCP-${{ inputs.version }}-ARM64-docs.zip
      shell: pwsh

    # Signed statements about what is published, verifiable by anyone with
    #   gh attestation verify <file> --repo mickem/nscp
    # A SLSA build provenance attestation over every release asset ties each
    # file to this workflow run and the commit it built. An SBOM attestation
    # per Windows platform binds that platform's SBOM to its zip and MSI, so
    # the SBOM cannot be swapped for another one after the fact. Both are
    # Sigstore-signed with this workflow's identity; nothing here needs a key.
    - name: Attest build provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: |
          NSCP-${{ inputs.version }}*.zip
          NSCP-${{ inputs.version }}-*.cdx.json
          NSCP-${{ inputs.version }}-*.deb
          NSCP-${{ inputs.version }}-*.rpm
          installers/installer-NSCP/NSCP-${{ inputs.version }}-*.msi
          NSCP-Web-${{ inputs.version }}.zip
          macos/NSCP-${{ inputs.version }}-macos-arm64.pkg
          macos/NSCP-${{ inputs.version }}-macos-arm64.tar.gz

    - name: Attest SBOM (x64)
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: |
          NSCP-${{ inputs.version }}-x64.zip
          installers/installer-NSCP/NSCP-${{ inputs.version }}-x64.msi
        sbom-path: NSCP-${{ inputs.version }}-x64.cdx.json

    - name: Attest SBOM (Win32)
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: |
          NSCP-${{ inputs.version }}-Win32.zip
          installers/installer-NSCP/NSCP-${{ inputs.version }}-Win32.msi
        sbom-path: NSCP-${{ inputs.version }}-Win32.cdx.json

    - name: Attest SBOM (Win32-legacy-xp)
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: |
          NSCP-${{ inputs.version }}-Win32-legacy-xp.zip
          installers/installer-NSCP/NSCP-${{ inputs.version }}-Win32-legacy-xp.msi
        sbom-path: NSCP-${{ inputs.version }}-Win32-legacy-xp.cdx.json

    - name: Attest SBOM (ARM64)
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: |
          NSCP-${{ inputs.version }}-ARM64.zip
          installers/installer-NSCP/NSCP-${{ inputs.version }}-ARM64.msi
        sbom-path: NSCP-${{ inputs.version }}-ARM64.cdx.json

    - name: Create Release
      id: create_release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
      with:
        tag: ${{ inputs.version }}
        name: ${{ inputs.version }}
        draft: true
        prerelease: false
        generateReleaseNotes: true
        # The standalone check_nsclient binary now lives in its own repo
        # at https://github.com/mickem/check_nsclient/releases — it is
        # bundled inside the NSCP installers built above but no longer
        # re-attached to this release.
        artifacts: |
          NSCP-${{ inputs.version }}-docs.zip
          NSCP-${{ inputs.version }}-x64.zip
          NSCP-${{ inputs.version }}-Win32.zip
          NSCP-${{ inputs.version }}-Win32-legacy-xp.zip
          NSCP-${{ inputs.version }}-ARM64.zip
          installers/installer-NSCP/NSCP-${{ inputs.version }}-x64.msi
          installers/installer-NSCP/NSCP-${{ inputs.version }}-Win32.msi
          installers/installer-NSCP/NSCP-${{ inputs.version }}-Win32-legacy-xp.msi
          installers/installer-NSCP/NSCP-${{ inputs.version }}-ARM64.msi
          NSCP-${{ inputs.version }}-x64-symbols.zip
          NSCP-${{ inputs.version }}-Win32-symbols.zip
          NSCP-${{ inputs.version }}-Win32-legacy-xp-symbols.zip
          NSCP-${{ inputs.version }}-ARM64-symbols.zip
          NSCP-${{ inputs.version }}-x64.cdx.json
          NSCP-${{ inputs.version }}-Win32.cdx.json
          NSCP-${{ inputs.version }}-Win32-legacy-xp.cdx.json
          NSCP-${{ inputs.version }}-ARM64.cdx.json
          NSCP-${{ inputs.version }}-ubuntu-24.04-amd64.deb
          NSCP-${{ inputs.version }}-ubuntu-24.04-arm64.deb
          NSCP-${{ inputs.version }}-debian-trixie-arm64.deb
          NSCP-${{ inputs.version }}-rocky-9-x86_64.rpm
          NSCP-${{ inputs.version }}-rocky-9-aarch64.rpm
          NSCP-${{ inputs.version }}-rocky-10-x86_64.rpm
          NSCP-${{ inputs.version }}-rocky-10-aarch64.rpm
          macos/NSCP-${{ inputs.version }}-macos-arm64.pkg
          macos/NSCP-${{ inputs.version }}-macos-arm64.tar.gz
          NSCP-Web-${{ inputs.version }}.zip
          NSCP-Web-${{ inputs.version }}.sha256
