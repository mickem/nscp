name: Test packaging scripts

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'files/nsclient.service.in'
      - '.github/workflows/test-packaging.yml'
  pull_request:
    paths:
      - 'packaging/**'
      - 'files/nsclient.service.in'
      - '.github/workflows/test-packaging.yml'

# A new push supersedes this run; do not let it finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-render-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run packaging-script unit tests
        working-directory: packaging/scripts
        run: |
          python -m unittest test_render_templates test_verify_manifest_hashes -v

  test-service-unit:
    # A hosted runner rather than a container: this starts a real unit, so it
    # needs systemd as PID 1. The Debian and RedHat build jobs run in a
    # container and drive `nscp test` directly, so nothing else in CI has ever
    # loaded the shipped unit, let alone started it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Start the service unit's sandbox and check what it allows
        run: sudo ./packaging/scripts/test_service_unit.sh files/nsclient.service.in
