name: Integration Tests (Windows)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      architecture:
        type: string
        description: 'Architecture to test'
        required: true
        default: 'x64'
      version:
        type: string
        description: 'Version to test'
        required: true
      artifact-name:
        type: string
        description: 'Name of the artifact to download'
        required: true
      platform:
        type: string
        description: 'Platform identifier (e.g., x64, Win32, ubuntu-x64)'
        required: true

env:
  PYTHON_VERSION: 3.11

jobs:
  integration-tests:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - id: python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ inputs.architecture }}
          cache-dependency-path: 'build/python/requirements.txt'
          cache: 'pip'

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: .

      # The runner image ships x64 .NET SDKs only. The DotnetPlugins scenario
      # needs a runtime matching the agent's architecture (a 32-bit nscp cannot
      # load the x64 hostfxr.dll), so install the 8.0 runtime for the tested
      # architecture into the default per-architecture location the module
      # searches (%ProgramFiles(x86)%\dotnet for x86).
      - name: Install the .NET runtime (${{ inputs.architecture }})
        shell: pwsh
        run: |
          $arch = '${{ inputs.architecture }}'
          $dir = if ($arch -eq 'x86') { "${env:ProgramFiles(x86)}\dotnet" } else { "${env:ProgramFiles}\dotnet" }
          Invoke-WebRequest -UseBasicParsing https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
          ./dotnet-install.ps1 -Channel 8.0 -Runtime dotnet -Architecture $arch -InstallDir $dir
          Get-ChildItem "$dir\host\fxr"

      - name: Create folders (Windows)
        shell: bash
        run: |
          mkdir -p tmp/nscp
          cd tmp/nscp
          7z x ../../NSCP-${{ inputs.version }}-${{ inputs.platform }}.zip

      - name: Copy test scripts
        working-directory: tmp/nscp
        shell: bash
        run: |
          cp -r ../../scripts/* scripts
          find scripts

      - name: Acceptance tests (Windows)
        working-directory: tmp/nscp
        run: |
          ..\..\tests\acceptance-tests.bat --ci

      # Replaces the old ./.github/actions/rest-test composite action. The
      # rest scenarios now live as top-level rest-*.test.ts files under the
      # main integration harness; NSCP_SKIP_DOCKER=1 makes every docker-
      # dependent scenario skip itself so this stage runs without docker on
      # the Windows runner (where docker support has been flaky historically
      # — see the disabled NRPE block below). Each rest-* test spins its own
      # nscp.exe via NscpInstance, so no manual start/kill/log-tail step is
      # needed here.
      - name: Install integration harness deps
        working-directory: tests
        shell: bash
        run: npm install

      # Provision the real IIS role so the CheckWindowsApps IIS checks run
      # against live WAS/W3SVC counters instead of their role-not-installed
      # fallback (NSCP_EXPECT_IIS=1 below turns that fallback into a test
      # failure). Web-Scripting-Tools brings the root\WebAdministration WMI
      # provider the app-pool check uses for auto_start enrichment, and the
      # priming request starts DefaultAppPool so its counter instances exist
      # before the suite queries them.
      - name: Enable IIS (live target for CheckWindowsApps)
        shell: powershell
        run: |
          Install-WindowsFeature -Name Web-Server, Web-Scripting-Tools | Out-Null
          Start-Service W3SVC
          Invoke-WebRequest -UseBasicParsing http://localhost/ | Out-Null

      - name: Run REST scenarios (no-docker)
        working-directory: tests
        shell: bash
        env:
          NSCP_BIN: ${{ github.workspace }}/tmp/nscp/nscp.exe
          NSCP_SKIP_DOCKER: "1"
          NSCP_EXPECT_IIS: "1"
        run: npm test

      # TODO: Disabled for now due to issues with docker on windows runners
      #- name: Run NRPE tests
      #  working-directory: tmp/nscp
      #  run: |
      #    ..\..\tests\nrpe\run-test.bat

      - name: Run installer tests
        if: inputs.architecture == 'x64'
        uses: ./.github/actions/installer-test

