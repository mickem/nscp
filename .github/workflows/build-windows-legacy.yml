name: Build Legacy Windows version (xp)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      architecture:
        type: string
        description: 'Architecture to build'
        required: true
        default: 'x64'
      version:
        type: string
        description: 'Version to build'
        required: true
      sign:
        type: boolean
        description: >-
          Authenticode-sign the shipped binaries and the MSI. Only the release
          build (build-release.yml) sets it, and only it passes the secrets
          below: a pull request or a merge to main never sees them.
        required: false
        default: false
    secrets:
      AZURE_TENANT_ID:
        description: 'Azure tenant ID (signing only)'
        required: false
      AZURE_CLIENT_ID:
        description: 'Azure client ID (signing only)'
        required: false
      AZURE_CLIENT_SECRET:
        description: 'Azure client secret (signing only)'
        required: false

env:
  PYTHON_VERSION: 3.11
  OPENSSL_VERSION: 3.5.8
  PROTOBUF_VERSION: 21.12
  BOOST_VERSION: 1.86.0
  CRYPTOPP_VERSION: 8.9.0
  LUA_VERSION: 5.4.8
  TINY_XML_2_VERSION: 10.1.0
  GOOGLE_TEST_VERSION: 1.12.1
  MONGOOSE_VERSION: "7.23"
  MINIZ_VERSION: "3.1.1"

jobs:
  build:
    # Pinned to windows-2022 (not windows-latest): the legacy XP build needs
    # the v141_xp toolset, the Windows 8.1 SDK, the "Visual Studio 17"
    # (VS 2022) cmake generator, and ./.github/actions/update-msvc installs
    # components into ...\Microsoft Visual Studio\2022\Enterprise. The
    # windows-latest image has moved to Visual Studio 18, which ships none of
    # those, so ilammy/msvc-dev-cmd fails with "Toolset directory for version
    # '14.1' was not found".
    runs-on: windows-2022
    outputs:
      platform: ${{ steps.setup.outputs.platform }}

    steps:
    - uses: actions/checkout@v6

    - id: setup
      run: |
        if ("${{ inputs.architecture }}" -eq "x64") {
          echo "msvc_arch=x64" >> $env:GITHUB_OUTPUT
          echo "platform=x64" >> $env:GITHUB_OUTPUT
        } else {
          echo "msvc_arch=amd64_x86" >> $env:GITHUB_OUTPUT
          echo "platform=Win32" >> $env:GITHUB_OUTPUT
        }
      shell: pwsh

    - id: python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ ENV.PYTHON_VERSION }}
        architecture: ${{ inputs.architecture }}
        cache-dependency-path: 'build/python/requirements.txt'
        cache: 'pip'

    - uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    - id: build-web
      working-directory: web
      run: |
        # npm ci, not npm install: install tolerates a lockfile that has drifted
        # from package.json and rewrites it, so the bytes shipped in the web zip
        # and in the MSI's bundled web/dist would not be the ones
        # package-lock.json names. ci fails instead, and the .sha256 manifest the
        # installer verifies then attests a dependency tree someone reviewed.
        npm ci
        npm run build

    - name: Install components
      uses: ./.github/actions/update-msvc

    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      name: Setup msvc environment
      with:
        toolset: "14.1"
        arch: ${{ steps.setup.outputs.msvc_arch }}

    - name: make dirs
      run: |
        mkdir tmp
        mkdir tmp\nscp
        mkdir tmp\installer_lib
      shell: cmd

    - uses: shogo82148/actions-setup-perl@ac3202722f5744e62a8fa3af3e1aaaebb08861f3 # v1
      with:
        perl-version: '5.40'
        distribution: strawberry

    - name: setup python dependencies
      run: |
        & "$env:Python_ROOT_DIR\Scripts\pip" install -r build/python/requirements.txt

    - id: google-test
      uses: ./.github/actions/google-test
      with:
        version: ${{ env.GOOGLE_TEST_VERSION }}
        architecture: ${{ inputs.architecture }}
        runtime: 'static'
        toolset: v141_xp
        target_folder: './tmp/nscp'

    - id: openssl
      uses: ./.github/actions/openssl
      with:
        version: ${{ ENV.OPENSSL_VERSION }}
        architecture: ${{ inputs.architecture }}
        runtime: 'static'

    - id: protobuf
      uses: ./.github/actions/protobuf
      with:
        version: ${{ ENV.PROTOBUF_VERSION }}
        architecture: ${{ inputs.architecture }}
        runtime: static
        toolset: v141_xp
        support_xp: 'true'

    - id: cryptopp
      uses: ./.github/actions/cryptopp
      with:
        version: ${{ ENV.CRYPTOPP_VERSION }}
        architecture: ${{ inputs.architecture }}
        toolset: v141_xp
        runtime: 'static'

    - id: lua
      uses: ./.github/actions/lua
      with:
        version: ${{ ENV.LUA_VERSION }}

    - id: tinyxml2
      uses: ./.github/actions/tinyxml2
      with:
        version: ${{ ENV.TINY_XML_2_VERSION }}

    - id: mongoose
      uses: ./.github/actions/mongoose
      with:
        version: ${{ ENV.MONGOOSE_VERSION }}

    - id: miniz
      uses: ./.github/actions/miniz
      with:
        version: ${{ ENV.MINIZ_VERSION }}

    # The XP build links Boost statically with the static runtime, built by
    # the v141 toolset against the XP-compatible Windows API level. The
    # action downloads the archive, verifies it against
    # .github/dependency-checksums.txt, and caches the result keyed on that
    # digest.
    - name: Build Boost (static)
      id: static_boost
      uses: ./.github/actions/boost
      with:
        version: ${{ ENV.BOOST_VERSION }}
        libraries: system filesystem thread regex date_time program_options python chrono json
        platform: ${{ inputs.architecture }}
        configuration: Release
        static: '1'
        static-runtime: '1'
        directory: ${{ runner.workspace }}/static_boost
        toolset: '14.1'
        defines: _USING_V110_SDK71_ BOOST_USE_WINAPI_VERSION=0x501 BOOST_NO_CXX17_HDR_SHARED_MUTEX

    - id: paths
      run: |
        $path_unix="${{ steps.static_boost.outputs.root }}".replace('\','/')
        echo "static_boost_root=$path_unix" >> $env:GITHUB_OUTPUT
        $path_unix="${{ steps.static_boost.outputs.librarydir }}".replace('\','/')
        echo "static_boost_librarydir=$path_unix" >> $env:GITHUB_OUTPUT
        $path_unix="${{ env.Python_ROOT_DIR }}".replace('\','/')
        echo "python_path=$path_unix" >> $env:GITHUB_OUTPUT
      shell: pwsh

    # Written with a plain heredoc rather than a third-party file-writing
    # action: this job later receives the code-signing credentials, so every
    # action that runs in it is part of the trust boundary around them.
    # The heredoc delimiter is quoted, so ${PROTOBUF_ROOT} stays literal for
    # cmake; the ${{ }} expressions are substituted by Actions before the
    # shell ever sees the script.
    - name: Write NSClient++ cmake config
      shell: bash
      run: |
        mkdir -p tmp/nscp
        cat > tmp/nscp/build.cmake <<'BUILD_CMAKE'
            set(Boost_USE_STATIC_RUNTIME ON)
            set(Boost_USE_STATIC_LIBS ON)
            SET(USE_STATIC_RUNTIME TRUE)
            SET(NSCP_BOOST_PYTHON_VERSION "python311")

            SET(LIBRARY_ROOT_FOLDER	"${{ env.GITHUB_WORKSPACE }}")
            SET(BOOST_ROOT "${{ steps.paths.outputs.static_boost_root }}")
            SET(BOOST_LIBRARYDIR "${{ steps.paths.outputs.static_boost_librarydir }}")
            SET(PROTOBUF_ROOT "${{ steps.protobuf.outputs.path_unix }}")
            SET(PROTOBUF_LIBRARYDIR "${PROTOBUF_ROOT}/build/Release")
            SET(OPENSSL_ROOT_DIR "${{ steps.openssl.outputs.path_unix }}")
            SET(OPENSSL_USE_STATIC_LIBS TRUE)
            SET(LUA_SOURCE_ROOT "${{ steps.lua.outputs.path_unix }}")
            SET(Python3_ROOT_DIR "${{ steps.paths.outputs.python_path }}")
            SET(Python3_FIND_STRATEGY LOCATION)
            SET(CRYPTOPP_ROOT "${{ steps.cryptopp.outputs.path_unix }}")
            SET(TINY_XML2_SOURCE_DIR "${{ steps.tinyxml2.outputs.path_unix }}")
            set(GTEST_ROOT "${{ steps.google-test.outputs.path_unix }}")
            set(MONGOOSE_SOURCE_DIR "${{ steps.mongoose.outputs.path_unix }}")
            set(MINIZ_INCLUDE_DIR "${{ steps.miniz.outputs.path_unix }}")
            set(CHECK_NSCLIENT_MISSING TRUE)
        BUILD_CMAKE

    - name: Make python dist
      working-directory: tmp/nscp
      run: |
        # --version must match the NSCP_BOOST_PYTHON_VERSION cmake variable
        # written above; the MSI bundles python<version>.zip and expects
        # this filename to exist. Bump them together when changing Python.
        & "$env:Python_ROOT_DIR\python" ..\..\build\python\mk_pyzip.py --source ${{ env.Python_ROOT_DIR }} --version python311
      shell: pwsh

    - name: CMake (installer_lib)
      working-directory: tmp/installer_lib
      run: |

        cmake ../../installer_lib -T v141_xp -G "Visual Studio 17" -A ${{ steps.setup.outputs.platform }} -DBOOST_ROOT=${{ steps.paths.outputs.static_boost_root }} -DBOOST_LIBRARYDIR=${{ steps.paths.outputs.static_boost_librarydir }} -DOPENSSL_ROOT_DIR=${{ steps.openssl.outputs.path_unix }} -DBUILD_VERSION=${{ inputs.version }}
    - name: Build installer_lib
      working-directory: tmp/installer_lib
      run: |
        msbuild installer_lib.sln /p:Configuration=Release /p:Platform=${{ steps.setup.outputs.platform }}
  
    - name: CMake (NSCP)
      working-directory: tmp/nscp
      run: |
         cmake ../.. -T v141_xp  -G "Visual Studio 17" -A ${{ steps.setup.outputs.platform }} -D BUILD_VERSION=${{ inputs.version }} -D CRT_MERGE_MODULE_NAME=Microsoft_VC143_CRT

    - name: Build nsclient
      working-directory: tmp/nscp
      run: |
        msbuild NSCP.sln /p:Configuration=RelWithDebInfo /p:Platform=${{ steps.setup.outputs.platform }}

    - name: Run tests
      working-directory: tmp/nscp
      run: |
        ctest --output-on-failure -C Release

    # Every executable and library the MSI installs, taken from the installer's
    # own .wxs files, and nothing else: the unit tests build into the same
    # folder as nscp.exe. Runs on every build, signed or not, so a pull request
    # that breaks the list fails here rather than in the release build. A file
    # that already carries a valid signature (the Python runtime, the bundled
    # check_nsclient.exe) keeps its publisher's.
    - name: List binaries to sign
      id: signing_list
      shell: pwsh
      run: |
        python build/python/test_signing_list.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $files = python build/python/signing_list.py --wix-dir installers/installer-NSCP --defines tmp/nscp/installers/installer-NSCP/wix-defines.txt
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $unsigned = @()
        foreach ($f in $files) {
          $sig = Get-AuthenticodeSignature -LiteralPath $f
          if ($sig.Status -eq 'Valid') {
            Write-Host "keeps its signature ($($sig.SignerCertificate.Subject)): $f"
          } else {
            $unsigned += $f
          }
        }
        Write-Host "$($unsigned.Count) of $($files.Count) shipped binaries to sign"
        $delimiter = "EOF_$([guid]::NewGuid().ToString('N'))"
        "files<<$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        $unsigned | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        $delimiter | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Sign binaries
      if: inputs.sign && steps.signing_list.outputs.files != ''
      uses: ./.github/actions/sign-windows-binaries
      with:
        files: ${{ steps.signing_list.outputs.files }}
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

    - name: Build installer
      working-directory: tmp/nscp
      run: |
        msbuild installers\installer-NSCP\installer_NSCP.vcxproj /p:Configuration=RelWithDebInfo /p:Platform=${{ steps.setup.outputs.platform }} /p:BuildProjectReferences=false

    - name: Post process files
      uses: ./.github/actions/post-process-windows-binaries
      with:
        version: ${{ inputs.version }}
        platform: ${{ steps.setup.outputs.platform }}
        suffix: '-legacy-xp'
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        signing-enabled: ${{ inputs.sign }}

    # The SBOM records, for every dependency this build compiled or bundled,
    # the version, the upstream URL and the SHA-256 or git commit it was
    # verified against in .github/dependency-checksums.txt. It goes into the
    # zip as sbom.cdx.json (with SHA256SUMS over the zip's files) and next to
    # the zip and the MSI as a release asset. The values come from the
    # manifest, never from the downloads, so it only claims what the build
    # checked.
    # The legacy build links neither MariaDB Connector/C nor check_nsclient.
    - name: Write the SBOM
      shell: bash
      run: |
        set -euo pipefail
        python build/python/test_sbom.py
        python build/python/sbom.py --check
        name="NSCP-${{ inputs.version }}-${{ steps.setup.outputs.platform }}-legacy-xp"
        protobuf_net=$(sed -n 's:.*<GoogleProtobufVersion[^>]*>\([^<]*\)</GoogleProtobufVersion>.*:\1:p' libs/dotnet-plugin-api/NSCP.Core.csproj)
        args=(
          --version "${{ inputs.version }}"
          --platform "${{ steps.setup.outputs.platform }}-legacy-xp"
          --commit "${GITHUB_SHA}"
          --component "openssl=${{ env.OPENSSL_VERSION }}"
          --component "protobuf=${{ env.PROTOBUF_VERSION }}"
          --component "cryptopp=${{ env.CRYPTOPP_VERSION }}"
          --component "boost=${{ env.BOOST_VERSION }}"
          --component "lua=${{ env.LUA_VERSION }}"
          --component "tinyxml2=${{ env.TINY_XML_2_VERSION }}"
          --component "mongoose=${{ env.MONGOOSE_VERSION }}"
          --component "miniz=${{ env.MINIZ_VERSION }}"
          --component "googletest=${{ env.GOOGLE_TEST_VERSION }}"
          --python-runtime "${{ steps.python.outputs.python-version }}"
          --nuget "Google.Protobuf=${protobuf_net}"
          --npm-lock web/package-lock.json
          --zip "tmp/nscp/${name}.zip"
          --output "tmp/nscp/${name}.cdx.json"
        )
        python build/python/sbom.py "${args[@]}"

    # The C# sample plugin is built for the tests but deliberately not part of
    # the zip or the MSI, so it travels next to them in the artifact (staged
    # under tmp/nscp to keep the artifact's root where it is) and the
    # integration job copies it into the extracted modules/dotnet folder.
    - name: Stage the C# sample plugin for the integration tests
      shell: bash
      run: |
        mkdir -p tmp/nscp/dotnet-sample
        cp tmp/nscp/modules/dotnet/NSCP.Plugin.CSharpSample.dll tmp/nscp/modules/dotnet/NSCP.Plugin.CSharpSample.deps.json tmp/nscp/dotnet-sample/

    - uses: actions/upload-artifact@v6
      with:
        name: NSCP-${{ inputs.version }}-${{ steps.setup.outputs.platform }}-legacy-xp
        path: |
          tmp/nscp/NSCP-${{ inputs.version }}-${{ steps.setup.outputs.platform }}-legacy-xp-docs.zip
          tmp/nscp/NSCP-${{ inputs.version }}-${{ steps.setup.outputs.platform }}-legacy-xp.zip
          tmp/nscp/installers/installer-NSCP/NSCP-${{ inputs.version }}-${{ steps.setup.outputs.platform }}-legacy-xp.msi
          tmp/nscp/NSCP-${{ inputs.version }}-${{ inputs.platform }}-legacy-xp-symbols.zip
          tmp/nscp/NSCP-${{ inputs.version }}-${{ steps.setup.outputs.platform }}-legacy-xp.cdx.json
          tmp/nscp/dotnet-sample/
        if-no-files-found: error

    - name: Add versions
      shell: bash
      run: |
        echo "| Library | Version |" >> $GITHUB_STEP_SUMMARY
        echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
        echo "| Boost | ${{ env.BOOST_VERSION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Cryptopp | ${{ env.CRYPTOPP_VERSION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Lua | ${{ env.LUA_VERSION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| OpenSSL | ${{ env.OPENSSL_VERSION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Protobuf | ${{ env.PROTOBUF_VERSION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| TinyXml2 | ${{ env.TINY_XML_2_VERSION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Mongoose | ${{ env.MONGOOSE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Miniz | ${{ env.MINIZ_VERSION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Python | ${{ env.PYTHON_VERSION }} |" >> $GITHUB_STEP_SUMMARY

  integration-tests:
    needs: build
    uses: ./.github/workflows/integration-tests-windows.yml
    with:
      architecture: ${{ inputs.architecture }}
      version: ${{ inputs.version }}
      artifact-name: NSCP-${{ inputs.version }}-${{ needs.build.outputs.platform }}-legacy-xp
      platform: ${{ needs.build.outputs.platform }}-legacy-xp
