name: Build Windows Server

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      architecture:
        type: string
        description: 'Architecture to build'
        required: true
        default: 'x64'
      version:
        type: string
        description: 'Version to build'
        required: true
    secrets:
      AZURE_TENANT_ID:
        description: 'Azure tenant ID'
        required: true
      AZURE_CLIENT_ID:
        description: 'Azure client ID'
        required: true
      AZURE_CLIENT_SECRET:
        description: 'Azure client secret'
        required: true

env:
  PYTHON_VERSION: 3.11
  OPENSSL_VERSION: 3.5.8
  PROTOBUF_VERSION: 21.12
  BOOST_VERSION: 1.86.0
  CRYPTOPP_VERSION: 8.9.0
  LUA_VERSION: 5.4.8
  TINY_XML_2_VERSION: 10.1.0
  GOOGLE_TEST_VERSION: 1.12.1
  MONGOOSE_VERSION: "7.23"
  MINIZ_VERSION: "3.1.1"
  MARIADB_CONNECTOR_VERSION: 3.4.9

jobs:
  build:
    # Pinned to windows-2022 (not windows-latest): this build targets the
    # v141 toolset via vcvars 14.1, builds with the "Visual Studio 17"
    # (VS 2022) cmake generator, and ./.github/actions/update-msvc installs
    # components into ...\Microsoft Visual Studio\2022\Enterprise. The
    # windows-latest image has moved to Visual Studio 18, which ships none of
    # those, so ilammy/msvc-dev-cmd fails with "Toolset directory for version
    # '14.1' was not found".
    runs-on: windows-2022
    outputs:
      platform: ${{ steps.setup.outputs.platform }}

    steps:
    - uses: actions/checkout@v6

    - id: setup
      run: |
        switch ("${{ inputs.architecture }}") {
          "x64" {
            echo "msvc_arch=x64" >> $env:GITHUB_OUTPUT
            echo "platform=x64" >> $env:GITHUB_OUTPUT
            echo "toolset=v141" >> $env:GITHUB_OUTPUT
            echo "vs_toolset=14.1" >> $env:GITHUB_OUTPUT
            echo "boost_toolset=14.1" >> $env:GITHUB_OUTPUT
            echo "python_arch=x64" >> $env:GITHUB_OUTPUT
          }
          "x86" {
            echo "msvc_arch=amd64_x86" >> $env:GITHUB_OUTPUT
            echo "platform=Win32" >> $env:GITHUB_OUTPUT
            echo "toolset=v141" >> $env:GITHUB_OUTPUT
            echo "vs_toolset=14.1" >> $env:GITHUB_OUTPUT
            echo "boost_toolset=14.1" >> $env:GITHUB_OUTPUT
            echo "python_arch=x86" >> $env:GITHUB_OUTPUT
          }
          "arm64" {
            # Cross-compile ARM64 from the x64 host runner. v141 does not
            # support ARM64, so use the default v143 toolset.
            echo "msvc_arch=amd64_arm64" >> $env:GITHUB_OUTPUT
            echo "platform=ARM64" >> $env:GITHUB_OUTPUT
            echo "toolset=v143" >> $env:GITHUB_OUTPUT
            echo "vs_toolset=14.4" >> $env:GITHUB_OUTPUT
            # Empty: Boost is built with the newest toolset, which is what
            # the v143 build links it into. b2 knows that toolset as
            # msvc-14.3, not 14.4, so vs_toolset cannot simply be reused.
            echo "boost_toolset=" >> $env:GITHUB_OUTPUT
            # setup-python doesn't ship an arm64 Python on x64 hosts; use
            # the host x64 interpreter for build-time scripts.
            echo "python_arch=x64" >> $env:GITHUB_OUTPUT
          }
          default {
            Write-Error "Unsupported architecture '${{ inputs.architecture }}'"
            exit 1
          }
        }
        # Everything that follows from "the host cannot run what we are
        # building", collected in one place:
        #
        #  - Boost.Python needs an ARM64 libpython, and there is none to build
        #    against, so the component is dropped from the Boost build and the
        #    daemon is configured without embedded Python. PythonScript and the
        #    bundled runtime fall out of the MSI with it.
        #  - protoc is a build tool, so CMake is handed the host-native one the
        #    protobuf action builds alongside the ARM64 libraries.
        if ("${{ inputs.architecture }}" -eq "arm64") {
          echo "boost_libraries=system filesystem thread regex date_time program_options chrono json" >> $env:GITHUB_OUTPUT
          echo "with_python=false" >> $env:GITHUB_OUTPUT
        } else {
          echo "boost_libraries=system filesystem thread regex date_time program_options python chrono json" >> $env:GITHUB_OUTPUT
          echo "with_python=true" >> $env:GITHUB_OUTPUT
        }
      shell: pwsh

    - id: python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ ENV.PYTHON_VERSION }}
        architecture: ${{ steps.setup.outputs.python_arch }}
        cache-dependency-path: 'build/python/requirements.txt'
        cache: 'pip'

    - uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    - id: build-web
      working-directory: web
      run: |
        # npm ci, not npm install: install tolerates a lockfile that has drifted
        # from package.json and rewrites it, so the bytes shipped in the web zip
        # and in the MSI's bundled web/dist would not be the ones
        # package-lock.json names. ci fails instead, and the .sha256 manifest the
        # installer verifies then attests a dependency tree someone reviewed.
        npm ci
        npm run build

    - name: Install components
      uses: ./.github/actions/update-msvc

    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      name: Setup msvc environment
      with:
        toolset: ${{ steps.setup.outputs.vs_toolset }}
        arch: ${{ steps.setup.outputs.msvc_arch }}

    - name: make dirs
      run: |
        mkdir tmp
        mkdir tmp\nscp
        mkdir tmp\installer_lib
      shell: cmd

    - uses: shogo82148/actions-setup-perl@ac3202722f5744e62a8fa3af3e1aaaebb08861f3 # v1
      with:
        perl-version: '5.40'
        distribution: strawberry

    - name: setup python dependencies
      run: |
        & "$env:Python_ROOT_DIR\Scripts\pip" install -r build/python/requirements.txt

    - id: google-test
      uses: ./.github/actions/google-test
      with:
        version: ${{ env.GOOGLE_TEST_VERSION }}
        architecture: ${{ inputs.architecture }}
        runtime: 'dynamic'
        toolset: ${{ steps.setup.outputs.toolset }}
        target_folder: './tmp/nscp'

    # OpenSSL is built as DLLs and shipped next to nscp.exe (like nscp_net.dll
    # and the other shared libraries) rather than linked into every module.
    - id: openssl
      uses: ./.github/actions/openssl
      with:
        version: ${{ ENV.OPENSSL_VERSION }}
        architecture: ${{ inputs.architecture }}
        runtime: 'dynamic'
        linkage: 'shared'

    # installer_lib is the custom action DLL msiexec extracts on its own and
    # loads before anything is installed, so it links OpenSSL statically and
    # against the static C runtime. The _static.lib pair a shared build leaves
    # behind is compiled against the DLL runtime and does not link into it
    # (unresolved __imp_ CRT symbols), hence a second, no-shared -MT build in
    # a folder of its own.
    - id: openssl-static
      uses: ./.github/actions/openssl
      with:
        version: ${{ ENV.OPENSSL_VERSION }}
        architecture: ${{ inputs.architecture }}
        runtime: 'static'
        linkage: 'static'
        suffix: '-static'

    - id: protobuf
      uses: ./.github/actions/protobuf
      with:
        version: ${{ ENV.PROTOBUF_VERSION }}
        architecture: ${{ inputs.architecture }}
        runtime: 'dynamic'
        toolset: ${{ steps.setup.outputs.toolset }}

    - id: cryptopp
      uses: ./.github/actions/cryptopp
      with:
        version: ${{ ENV.CRYPTOPP_VERSION }}
        architecture: ${{ inputs.architecture }}
        toolset: ${{ steps.setup.outputs.toolset }}
        runtime: 'dynamic'

    - id: lua
      uses: ./.github/actions/lua
      with:
        version: ${{ ENV.LUA_VERSION }}

    - id: tinyxml2
      uses: ./.github/actions/tinyxml2
      with:
        version: ${{ ENV.TINY_XML_2_VERSION }}

    - id: mongoose
      uses: ./.github/actions/mongoose
      with:
        version: ${{ ENV.MONGOOSE_VERSION }}

    - id: miniz
      uses: ./.github/actions/miniz
      with:
        version: ${{ ENV.MINIZ_VERSION }}

    - id: mariadb
      uses: ./.github/actions/mariadb
      with:
        version: ${{ ENV.MARIADB_CONNECTOR_VERSION }}
        architecture: ${{ inputs.architecture }}
        toolset: ${{ steps.setup.outputs.toolset }}

    # Boost is built with the same MSVC toolset as the code that links it:
    # v141 on x86 and x64 (static libraries built with a newer toolset than
    # the one linking them are not supported), the newest on ARM64. The
    # action downloads the archive, verifies it against
    # .github/dependency-checksums.txt, and caches the result keyed on that
    # digest.
    - name: Build Boost (static)
      id: static_boost
      uses: ./.github/actions/boost
      with:
        version: ${{ ENV.BOOST_VERSION }}
        libraries: system filesystem
        platform: ${{ inputs.architecture }}
        configuration: Release
        static: '1'
        static-runtime: '1'
        toolset: ${{ steps.setup.outputs.boost_toolset }}
        directory: ${{ runner.workspace }}/static_boost

    - name: Build Boost (regular)
      id: boost
      uses: ./.github/actions/boost
      with:
        version: ${{ ENV.BOOST_VERSION }}
        libraries: ${{ steps.setup.outputs.boost_libraries }}
        platform: ${{ inputs.architecture }}
        configuration: Release
        toolset: ${{ steps.setup.outputs.boost_toolset }}

    - id: paths
      run: |
        echo "boost_root=$('${{ steps.boost.outputs.root }}'.replace('\','/'))" >> $env:GITHUB_OUTPUT
        echo "boost_librarydir=$('${{ steps.boost.outputs.librarydir }}'.replace('\','/'))" >> $env:GITHUB_OUTPUT
        echo "static_boost_root=$('${{ steps.static_boost.outputs.root }}'.replace('\','/'))" >> $env:GITHUB_OUTPUT
        echo "static_boost_librarydir=$('${{ steps.static_boost.outputs.librarydir }}'.replace('\','/'))" >> $env:GITHUB_OUTPUT
        $path_unix="${{ env.Python_ROOT_DIR }}".replace('\','/')
        echo "python_path=$path_unix" >> $env:GITHUB_OUTPUT
      shell: pwsh

    # Written with a plain heredoc rather than a third-party file-writing
    # action: this job later receives the code-signing credentials, so every
    # action that runs in it is part of the trust boundary around them.
    # The heredoc delimiter is quoted, so ${CMAKE_CURRENT_SOURCE_DIR} and
    # friends stay literal for cmake; the ${{ }} expressions are substituted
    # by Actions before the shell ever sees the script.
    - name: Write NSClient++ cmake config
      shell: bash
      run: |
        mkdir -p tmp/nscp
        cat > tmp/nscp/build.cmake <<'BUILD_CMAKE'
            SET(USE_STATIC_RUNTIME FALSE)
            SET(LIBRARY_ROOT_FOLDER	"${{ env.GITHUB_WORKSPACE }}")
            SET(BOOST_ROOT "${{ steps.paths.outputs.boost_root }}")
            SET(BOOST_LIBRARYDIR "${{ steps.paths.outputs.boost_librarydir }}")
            SET(NSCP_BOOST_PYTHON_VERSION "python311")
            SET(PROTOBUF_ROOT "${{ steps.protobuf.outputs.path_unix }}")
            SET(PROTOBUF_LIBRARYDIR "${PROTOBUF_ROOT}/build/Release")
            SET(OPENSSL_ROOT_DIR "${{ steps.openssl.outputs.path_unix }}")
            # Link the import libraries and ship libcrypto-3-*.dll / libssl-3-*.dll
            # (CMakeLists.txt copies them into the build tree and the MSI and zip
            # pick them up from there). installer_lib is configured separately
            # below, against the static OpenSSL build.
            SET(OPENSSL_USE_STATIC_LIBS FALSE)
            SET(LUA_SOURCE_ROOT "${{ steps.lua.outputs.path_unix }}")
            SET(Python3_ROOT_DIR "${{ steps.paths.outputs.python_path }}")
            SET(Python3_FIND_STRATEGY LOCATION)
            SET(CRYPTOPP_ROOT "${{ steps.cryptopp.outputs.path_unix }}")
            SET(TINY_XML2_SOURCE_DIR "${{ steps.tinyxml2.outputs.path_unix }}")
            set(GTEST_ROOT "${{ steps.google-test.outputs.path_unix }}")
            set(MONGOOSE_SOURCE_DIR "${{ steps.mongoose.outputs.path_unix }}")
            set(MINIZ_INCLUDE_DIR "${{ steps.miniz.outputs.path_unix }}")
            set(MARIADB_ROOT_DIR "${{ steps.mariadb.outputs.path_unix }}")
            set(CHECK_NSCLIENT_LOCATION "${CMAKE_CURRENT_SOURCE_DIR}/tmp")
        BUILD_CMAKE

    - name: Make python dist
      if: steps.setup.outputs.with_python == 'true'
      working-directory: tmp/nscp
      run: |
        # --version must match the NSCP_BOOST_PYTHON_VERSION cmake variable
        # written above; the MSI bundles python<version>.zip and expects
        # this filename to exist. Bump them together when changing Python.
        & "$env:Python_ROOT_DIR\python" ..\..\build\python\mk_pyzip.py --source ${{ env.Python_ROOT_DIR }} --version python311
      shell: pwsh

    # This binary is not built here - it is fetched and then shipped inside the
    # signed MSI, so its digest has to be pinned in the repository like every
    # other dependency. See .github/dependency-checksums.txt.
    - name: Download check_nsclient from mickem/check_nsclient
      shell: bash
      run: |
        ver=$(cat .check_nsclient_version | tr -d '[:space:]')
        url="https://github.com/mickem/check_nsclient/releases/download/${ver}/check_nsclient-${ver}-windows-${{ inputs.architecture }}.exe"
        echo "Fetching $url"
        curl -sSfL --retry 8 --retry-delay 15 --retry-max-time 300 -o tmp/check_nsclient.exe "$url"
        .github/scripts/verify-checksum.sh "check_nsclient-${{ inputs.architecture }}" "${ver}" tmp/check_nsclient.exe

    # Everything that only differs on ARM64, in one place.
    #
    # The SDK has to be pinned: the runner reports itself as Windows 6.2 and
    # carries the Windows 8.1 SDK for the legacy XP build, so CMake selects 8.1
    # - "Selecting Windows SDK version 8.1 to target Windows 6.2.9200" - and
    # 8.1 has no ARM64 toolchain, which surfaces as "No CMAKE_C_COMPILER could
    # be found". The quotes are load-bearing under pwsh: unquoted, the argument
    # is split into -DCMAKE_SYSTEM_VERSION=10 plus a stray ".0", CMake shrugs
    # and falls straight back to 8.1.
    - id: cmake_options
      run: |
        $extra = @()
        if ("${{ inputs.architecture }}" -eq "arm64") {
          echo 'sdk="-DCMAKE_SYSTEM_VERSION=10.0"' >> $env:GITHUB_OUTPUT
          $extra += '-D NSCP_WITH_PYTHON=OFF'
          # Microsoft ships no ARM64 CRT merge module for this toolset, so the
          # ARM64 MSI is knowingly built without the Visual C++ runtime. The
          # upgrade note and the README tell operators to install the ARM64
          # redistributable. Every other architecture still fails hard.
          $extra += '-D NSCP_ALLOW_MISSING_CRT_MERGE_MODULE=ON'
          $extra += '-D PROTOBUF_PROTOC_EXECUTABLE=${{ steps.protobuf.outputs.protoc_unix }}'
        } else {
          echo "sdk=" >> $env:GITHUB_OUTPUT
        }
        echo "extra=$($extra -join ' ')" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: CMake (installer_lib)
      working-directory: tmp/installer_lib
      run: |

        cmake ../../installer_lib -T ${{ steps.setup.outputs.toolset }} -G "Visual Studio 17" -A ${{ steps.setup.outputs.platform }} -DBOOST_ROOT=${{ steps.paths.outputs.static_boost_root }} -DBOOST_LIBRARYDIR=${{ steps.paths.outputs.static_boost_librarydir }} -DOPENSSL_ROOT_DIR=${{ steps.openssl-static.outputs.path_unix }} -DBUILD_VERSION=${{ inputs.version }} ${{ steps.cmake_options.outputs.sdk }}
    - name: Build installer_lib
      working-directory: tmp/installer_lib
      run: |
        msbuild installer_lib.sln /p:Configuration=Release /p:Platform=${{ steps.setup.outputs.platform }}
  
    - name: CMake (NSCP)
      working-directory: tmp/nscp
      run: |
        cmake ../.. -T ${{ steps.setup.outputs.toolset }} -G "Visual Studio 17" -A ${{ steps.setup.outputs.platform }} -D BUILD_VERSION=${{ inputs.version }} -D CRT_MERGE_MODULE_NAME=Microsoft_VC143_CRT ${{ steps.cmake_options.outputs.sdk }} ${{ steps.cmake_options.outputs.extra }}

    - name: Build nsclient
      working-directory: tmp/nscp
      run: |
        msbuild NSCP.sln /p:Configuration=RelWithDebInfo /p:Platform=${{ steps.setup.outputs.platform }}

    - name: Run tests
      if: inputs.architecture != 'arm64'
      working-directory: tmp/nscp
      run: |
        ctest --output-on-failure -C Release

    - name: Sign binaries
      # Only sign on main; PRs lack the signing secrets and don't need signed builds.
      if: github.ref == 'refs/heads/main'
      uses: ./.github/actions/sign-windows-binaries
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

    - name: Build installer
      working-directory: tmp/nscp
      run: |
        msbuild installers\installer-NSCP\installer_NSCP.vcxproj /p:Configuration=RelWithDebInfo /p:Platform=${{ steps.setup.outputs.platform }} /p:BuildProjectReferences=false

    - name: Post process files
      uses: ./.github/actions/post-process-windows-binaries
      with:
        version: ${{ inputs.version }}
        platform: ${{ steps.setup.outputs.platform }}
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        signing-enabled: ${{ github.ref == 'refs/heads/main' }}

    # The SBOM records, for every dependency this build compiled or bundled,
    # the version, the upstream URL and the SHA-256 or git commit it was
    # verified against in .github/dependency-checksums.txt. It goes into the
    # zip as sbom.cdx.json (with SHA256SUMS over the zip's files) and next to
    # the zip and the MSI as a release asset. The values come from the
    # manifest, never from the downloads, so it only claims what the build
    # checked.
    - name: Write the SBOM
      shell: bash
      run: |
        set -euo pipefail
        python build/python/test_sbom.py
        python build/python/sbom.py --check
        name="NSCP-${{ inputs.version }}-${{ steps.setup.outputs.platform }}"
        protobuf_net=$(sed -n 's:.*<GoogleProtobufVersion[^>]*>\([^<]*\)</GoogleProtobufVersion>.*:\1:p' libs/dotnet-plugin-api/NSCP.Core.csproj)
        args=(
          --version "${{ inputs.version }}"
          --platform "${{ steps.setup.outputs.platform }}"
          --commit "${GITHUB_SHA}"
          --component "openssl=${{ env.OPENSSL_VERSION }}"
          --component "protobuf=${{ env.PROTOBUF_VERSION }}"
          --component "cryptopp=${{ env.CRYPTOPP_VERSION }}"
          --component "boost=${{ env.BOOST_VERSION }}"
          --component "lua=${{ env.LUA_VERSION }}"
          --component "tinyxml2=${{ env.TINY_XML_2_VERSION }}"
          --component "mongoose=${{ env.MONGOOSE_VERSION }}"
          --component "miniz=${{ env.MINIZ_VERSION }}"
          --component "googletest=${{ env.GOOGLE_TEST_VERSION }}"
          --component "mariadb=${{ env.MARIADB_CONNECTOR_VERSION }}"
          --component "check_nsclient-${{ inputs.architecture }}=$(tr -d '[:space:]' < .check_nsclient_version)"
          --nuget "Google.Protobuf=${protobuf_net}"
          --npm-lock web/package-lock.json
          --zip "tmp/nscp/${name}.zip"
          --output "tmp/nscp/${name}.cdx.json"
        )
        # ARM64 ships no embedded Python (see the setup step).
        if [ "${{ steps.setup.outputs.with_python }}" = "true" ]; then
          args+=(--python-runtime "${{ steps.python.outputs.python-version }}")
        fi
        python build/python/sbom.py "${args[@]}"

    # The C# sample plugin is built for the tests but deliberately not part of
    # the zip or the MSI, so it travels next to them in the artifact (staged
    # under tmp/nscp to keep the artifact's root where it is) and the
    # integration job copies it into the extracted modules/dotnet folder.
    - name: Stage the C# sample plugin for the integration tests
      if: inputs.architecture != 'arm64'
      shell: bash
      run: |
        mkdir -p tmp/nscp/dotnet-sample
        cp tmp/nscp/modules/dotnet/NSCP.Plugin.CSharpSample.dll tmp/nscp/modules/dotnet/NSCP.Plugin.CSharpSample.deps.json tmp/nscp/dotnet-sample/

    - uses: actions/upload-artifact@v6
      with:
        name: NSCP-${{ inputs.version }}-${{ steps.setup.outputs.platform }}
        path: |
          tmp/nscp/NSCP-${{ inputs.version }}-${{ steps.setup.outputs.platform }}-docs.zip
          tmp/nscp/NSCP-${{ inputs.version }}-${{ steps.setup.outputs.platform }}.zip
          tmp/nscp/installers/installer-NSCP/NSCP-${{ inputs.version }}-${{ steps.setup.outputs.platform }}.msi
          tmp/nscp/NSCP-${{ inputs.version }}-${{ steps.setup.outputs.platform }}-symbols.zip
          tmp/nscp/NSCP-${{ inputs.version }}-${{ steps.setup.outputs.platform }}.cdx.json
          tmp/nscp/dotnet-sample/
        if-no-files-found: error

    - name: Add versions
      shell: bash
      run: |
        echo "| Library | Version |" >> $GITHUB_STEP_SUMMARY
        echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
        echo "| Boost | ${{ env.BOOST_VERSION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Cryptopp | ${{ env.CRYPTOPP_VERSION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Lua | ${{ env.LUA_VERSION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| OpenSSL | ${{ env.OPENSSL_VERSION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Protobuf | ${{ env.PROTOBUF_VERSION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| TinyXml2 | ${{ env.TINY_XML_2_VERSION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Mongoose | ${{ env.MONGOOSE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Miniz | ${{ env.MINIZ_VERSION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Python | ${{ env.PYTHON_VERSION }} |" >> $GITHUB_STEP_SUMMARY

  integration-tests:
    needs: build
    # Cross-compiled ARM64 binaries cannot be executed on the x64 host.
    if: inputs.architecture != 'arm64'
    uses: ./.github/workflows/integration-tests-windows.yml
    with:
      architecture: ${{ inputs.architecture }}
      version: ${{ inputs.version }}
      artifact-name: NSCP-${{ inputs.version }}-${{ needs.build.outputs.platform }}
      platform: ${{ needs.build.outputs.platform }}
