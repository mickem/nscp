name: Build main

# Validates every merge to main: the full platform matrix, unsigned, plus the
# sanitizer and coverage runs a pull request skips. It publishes nothing. The
# signed build and the draft release come from build-release.yml, and only for
# the release pull request, so code signing is billed per release rather than
# per merge.

permissions:
  contents: read

on:
  push:
    branches: [main]

# Merging three PRs in a row would start three full builds when only the
# newest state of main matters. Cancel the older ones. Nothing is lost: this
# workflow publishes nothing, and a release is built by build-release.yml,
# whose runs are never cancelled by a later merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-version:
    uses: ./.github/workflows/get-version.yml
  create-test-bundle:
    uses: ./.github/workflows/create-test-bundle.yml
  # Sanitizers (and coverage) run on main only, not per PR: together they are
  # close to half of a PR run's machine time and they almost never fail on a
  # single change. A regression is caught on the merge instead, and a branch
  # that needs them checked first can run tests-sanitizers.yml on demand from
  # the Actions tab ("Run workflow" -> pick the branch).
  sanitizer-tests:
    needs: get-version
    uses: ./.github/workflows/tests-sanitizers.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
  coverage:
    needs: get-version
    uses: ./.github/workflows/tests-coverage.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
  build-server-x64:
    needs: [get-version, create-test-bundle]
    uses: ./.github/workflows/build-windows.yml
    with:
      architecture: x64
      version: ${{ needs.get-version.outputs.version }}
  build-server-x86:
    needs: [get-version, create-test-bundle]
    uses: ./.github/workflows/build-windows.yml
    with:
      architecture: x86
      version: ${{ needs.get-version.outputs.version }}
  # Cross-compiled on the x64 runner: the unit tests and the Windows
  # integration suite are skipped inside build-windows.yml because the host
  # cannot execute ARM64 binaries. Main and release builds only - a PR does
  # not need a fourth Windows build to tell it whether the change compiles,
  # but a release should never be the first time ARM64 is built.
  build-server-arm64:
    needs: [get-version, create-test-bundle]
    uses: ./.github/workflows/build-windows.yml
    with:
      architecture: arm64
      version: ${{ needs.get-version.outputs.version }}
  build-x86-static:
    needs: get-version
    uses: ./.github/workflows/build-windows-legacy.yml
    with:
      architecture: x86
      version: ${{ needs.get-version.outputs.version }}
  build-debian:
    needs: [get-version, create-test-bundle]
    uses: ./.github/workflows/build-debian.yml
    with:
      architecture: x64
      version: ${{ needs.get-version.outputs.version }}
      # Adds the Raspberry Pi OS / Debian package; the feature build stays on
      # the Ubuntu pair.
      targets: all
  build-redhat:
    needs: [get-version, create-test-bundle]
    uses: ./.github/workflows/build-redhat.yml
    with:
      architecture: x64
      version: ${{ needs.get-version.outputs.version }}
      # Every supported RedHat release; the feature build takes the newest only.
      targets: all
  # macOS arm64. Not in branch protection yet: the port is new, the runner is
  # billed at 10x on private repos (free here, this repository is public), and a
  # build nobody has watched for a few weeks has no business blocking a merge.
  # It still runs on every pull request, because the alternative is finding out
  # on the merge commit.
  build-macos:
    needs: get-version
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
  build-web:
    needs: get-version
    uses: ./.github/workflows/build-web.yml
    with:
      version: ${{ needs.get-version.outputs.version }}

