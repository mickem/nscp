name: Upgrade and security notes

# The Upgrading and Security notices pages are assembled from one file per
# note under docs/upgrades/ and docs/security/ (docs/hooks/notes.py). The HTML site is only built on Windows in CI, so
# validate the notes here on every change: a typo in a module tag or a missing
# front matter would otherwise only fail the docs build much later.
on:
  push:
    branches: [main]
    paths:
      - 'docs/upgrades/**'
      - 'docs/security/**'
      - 'docs/hooks/**'
      - 'docs/docs/setup/upgrading.md'
      - 'docs/docs/security/notices.md'
      - '.github/workflows/docs-upgrade-notes.yml'
  pull_request:
    paths:
      - 'docs/upgrades/**'
      - 'docs/security/**'
      - 'docs/hooks/**'
      - 'docs/docs/setup/upgrading.md'
      - 'docs/docs/security/notices.md'
      - '.github/workflows/docs-upgrade-notes.yml'

permissions:
  contents: read

jobs:
  check:
    name: Validate and assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Validate the notes
        run: |
          pip install pyyaml
          python3 docs/hooks/notes.py --check
      - name: Assemble the pages
        run: python3 docs/hooks/notes.py --render "$RUNNER_TEMP/notes"
