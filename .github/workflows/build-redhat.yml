name: Build Linux

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      architecture:
        type: string
        description: 'Architecture to build'
        required: true
        default: 'x64'
      version:
        type: string
        description: 'Version to build'
        required: true
      targets:
        type: string
        description: >-
          Which targets to build: "all" for every supported release, or
          "default" for the newest one only. Release builds want all of them;
          a pull request gets the newest, where a change that breaks the RPM
          build breaks it too. Spelled the same way, with the same two values,
          as build-debian.yml, so a value meant for one cannot be silently
          ignored by the other.
        required: false
        default: all

jobs:
  # The matrix has to be computed rather than written out: `include:` entries
  # cannot carry an `if:`, and a skipped matrix job is still a queued runner.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.pick.outputs.build }}
      test: ${{ steps.pick.outputs.test }}
    steps:
    - id: pick
      shell: bash
      run: |
        set -euo pipefail
        # `integration_tests` says whether the integration suite runs against
        # this entry; it is dropped before the build matrix sees it, so it
        # does not show up in job names. Rocky 9 is false because its Python
        # 3.9 does not accept the type annotations the test code uses - the
        # package is still built and shipped.
        all='[
          {"distro":"rocky","distro_version":"9", "python_version":"python39", "arch":"x64",  "rpm_arch":"x86_64", "cpack_arch":"amd64","runner":"ubuntu-latest",   "integration_tests":false},
          {"distro":"rocky","distro_version":"9", "python_version":"python39", "arch":"arm64","rpm_arch":"aarch64","cpack_arch":"arm64","runner":"ubuntu-24.04-arm","integration_tests":false},
          {"distro":"rocky","distro_version":"10","python_version":"python312","arch":"x64",  "rpm_arch":"x86_64", "cpack_arch":"amd64","runner":"ubuntu-latest",   "integration_tests":true},
          {"distro":"rocky","distro_version":"10","python_version":"python312","arch":"arm64","rpm_arch":"aarch64","cpack_arch":"arm64","runner":"ubuntu-24.04-arm","integration_tests":true}
        ]'
        case "${{ inputs.targets }}" in
          all)
            selected=$(jq -c . <<< "$all")
            ;;
          default)
            # "Newest" is read off the list rather than named, so adding
            # Rocky 11 above is the only edit needed.
            selected=$(jq -c \
              '(map(.distro_version | tonumber) | max | tostring) as $v
               | map(select(.distro_version == $v))' <<< "$all")
            ;;
          *)
            echo "::error::Unknown targets value '${{ inputs.targets }}' (expected 'default' or 'all')"
            exit 1
            ;;
        esac
        # Only the fields the integration workflow consumes: the extra build
        # fields would otherwise land in the job name, and the check names are
        # what branch protection matches on.
        tested=$(jq -c '
          map(select(.integration_tests))
          | map({distro, distro_version, arch, rpm_arch, runner})' <<< "$selected")
        selected=$(jq -c 'map(del(.integration_tests))' <<< "$selected")
        echo "Building: $(jq -r 'map("\(.distro) \(.distro_version) \(.arch)") | join(", ")' <<< "$selected")"
        echo "Testing:  $(jq -r 'if length == 0 then "(none)" else map("\(.distro) \(.distro_version) \(.arch)") | join(", ") end' <<< "$tested")"
        echo "build=$selected" >> "$GITHUB_OUTPUT"
        echo "test=$tested" >> "$GITHUB_OUTPUT"

  build-rpm:
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.build) }}
    container:
      image: rockylinux/rockylinux:${{ matrix.distro_version }}
      options: --user root

    steps:
    - name: Install dependencies
      shell: sh
      run: |
        # Inline retry helper: Rocky/EPEL mirrors and the NodeSource setup script
        # are the most common sources of CI flakes for this job. 3 attempts, 5s/10s backoff.
        retry() {
          n=0
          until "$@"; do
            n=$((n+1))
            if [ $n -ge 3 ]; then echo "::error::Failed after $n attempts: $*" >&2; return 1; fi
            echo "::warning::Attempt $n failed; retrying in $((n*5))s..." >&2
            sleep $((n*5))
          done
        }
        retry dnf install -y epel-release
        retry dnf install -y dnf-plugins-core
        if [ "${{ matrix.distro_version }}" = "8" ]; then
          dnf config-manager --set-enabled powertools
        else
          dnf config-manager --set-enabled crb
        fi
        retry dnf update -y
        # Node.js / npm are no longer needed here: the web bundle ships
        # separately and is installed at runtime via `nscp web install-ui`.
        # ccache comes from EPEL, which is already enabled above. zstd lets
        # actions/cache compress with zstd instead of falling back to gzip.
        # --nobest: appstream and baseos do not always publish a package set
        # in lockstep. On 2026-09-15 appstream carried openssl-devel 3.5.8
        # while no enabled repo had the openssl-libs 3.5.8 it requires, so the
        # install failed outright ("nothing provides openssl-libs(x86-64) =
        # 1:3.5.8") on rocky 9 x86_64 while the same package list resolved on
        # aarch64. Without --nobest dnf refuses the whole transaction rather
        # than taking the older build that matches the installed runtime. It
        # can only widen what resolves - if no installable candidate exists the
        # install still fails loudly, exactly as it does now.
        retry dnf install -y --allowerasing --nobest coreutils bash file findutils gawk git boost-devel gtest-devel protobuf-compiler protobuf-devel openssl openssl-devel gmock-devel cryptopp-devel lua-devel cmake gcc-c++ python3-pip rpm-build python3-devel dbus-devel bash libzip-devel tinyxml2-devel mariadb-connector-c-devel pkgconf-pkg-config ccache zstd dotnet-sdk-8.0
    - uses: actions/checkout@v7

    - name: Configure ccache
      shell: bash
      run: |
        # See build-debian.yml for the rationale and for why the cache lives
        # inside the workspace. ccache is an EPEL package here, so the guard
        # below is what keeps the build working if it ever goes missing.
        if command -v ccache > /dev/null; then
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          echo "CCACHE_LAUNCHER=ccache" >> "$GITHUB_ENV"
        else
          echo "::warning::ccache not available - building without a compiler cache"
        fi

    - name: Restore ccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .ccache
        key: ccache-rpm-${{ matrix.distro }}-${{ matrix.distro_version }}-${{ matrix.arch }}-${{ github.sha }}
        restore-keys: |
          ccache-rpm-${{ matrix.distro }}-${{ matrix.distro_version }}-${{ matrix.arch }}-

    - name: make dirs
      run: |
        mkdir -p tmp/nscp
      shell: /usr/bin/bash {0}
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    - name: setup python dependencies
      shell: /usr/bin/bash {0}
      run: |
        retry() {
          local n=0
          until "$@"; do
            n=$((n+1))
            if [ $n -ge 3 ]; then echo "::error::Failed after $n attempts: $*" >&2; return 1; fi
            echo "::warning::Attempt $n failed; retrying in $((n*5))s..." >&2
            sleep $((n*5))
          done
        }
        retry bash -c 'pip3 install --break-system-packages -r build/python/requirements.txt 2>/dev/null || pip3 install -r build/python/requirements.txt'
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    - name: Download check_nsclient from mickem/check_nsclient
      shell: bash
      run: |
        ver=$(cat .check_nsclient_version | tr -d '[:space:]')
        url="https://github.com/mickem/check_nsclient/releases/download/${ver}/check_nsclient-${ver}-linux-${{ matrix.arch }}"
        echo "Fetching $url"
        curl -sSfL --retry 8 --retry-delay 15 --retry-max-time 300 -o check_nsclient "$url"
        # Shipped inside the package, so pinned like every other dependency.
        # See .github/dependency-checksums.txt.
        .github/scripts/verify-checksum.sh "check_nsclient-linux-${{ matrix.arch }}" "${ver}" check_nsclient
        chmod +x check_nsclient

    - name: CMake (NSCP)
      working-directory: tmp/nscp
      run: |
        # Shell env var (not the GHA template expression) so paths
        # resolve to the container-mounted workspace, not the runner
        # host's view. See build-debian.yml for the full rationale.
        cmake ../.. \
          ${CCACHE_LAUNCHER:+-DCMAKE_C_COMPILER_LAUNCHER=$CCACHE_LAUNCHER -DCMAKE_CXX_COMPILER_LAUNCHER=$CCACHE_LAUNCHER} \
          -DBUILD_VERSION=${{ inputs.version }} \
          -DCPACK_GENERATOR=RPM \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DNSCP_WEB_BACKEND=beast \
          -DNSCP_BOOST_PYTHON_VERSION=${{ matrix.python_version }} \
          -DLIBRARY_ROOT_FOLDER="$GITHUB_WORKSPACE" \
          -DCHECK_NSCLIENT_LOCATION="$GITHUB_WORKSPACE" \
          -DUSE_STATIC_RUNTIME=OFF

    - name: Build nsclient
      working-directory: tmp/nscp
      run: |
        # See build-debian.yml: this step is ~97% of the job and the module
        # graph is wide, so a serial `make` wasted three of the four cores.
        if [ -n "${CCACHE_LAUNCHER:-}" ]; then ccache --zero-stats; fi
        make -j"$(nproc)"

    - name: ccache statistics
      if: always()
      shell: bash
      run: |
        if [ -n "${CCACHE_LAUNCHER:-}" ]; then ccache --show-stats; fi

    - name: CPack
      working-directory: tmp/nscp
      run: |
        cpack -G RPM

    - name: rename dist files
      run: |
        mv tmp/nscp/NSCP-${{ inputs.version }}-${{ matrix.cpack_arch }}.rpm NSCP-${{ inputs.version }}-${{ matrix.distro }}-${{ matrix.distro_version }}-${{ matrix.rpm_arch }}.rpm
      shell: /usr/bin/bash {0}
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    - name: Test RPM package installation
      run: |
        dnf install -y ./NSCP-${{ inputs.version }}-${{ matrix.distro }}-${{ matrix.distro_version }}-${{ matrix.rpm_arch }}.rpm
        nscp settings --load-all --list --add-defaults

    # The C# sample plugin is built for the tests but deliberately not part of
    # the package, so it travels next to the package in the artifact and the
    # integration job copies it into the installed modules/dotnet folder.
    - name: Stage the C# sample plugin for the integration tests
      shell: /usr/bin/bash {0}
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      run: |
        set -e
        mkdir -p dotnet-sample
        cp tmp/nscp/modules/dotnet/NSCP.Plugin.CSharpSample.dll tmp/nscp/modules/dotnet/NSCP.Plugin.CSharpSample.deps.json dotnet-sample/

    - uses: actions/upload-artifact@v7
      with:
        name: NSCP-${{ inputs.version }}-${{ matrix.distro }}-${{ matrix.distro_version }}-${{ matrix.arch }}
        path: |
          NSCP-${{ inputs.version }}-${{ matrix.distro }}-${{ matrix.distro_version }}-${{ matrix.rpm_arch }}.rpm
          dotnet-sample/
        if-no-files-found: error

    - name: Run tests
      working-directory: tmp/nscp
      run: |
        ctest --output-on-failure -C Release

  # Derived from the same list the packages are built from, so a new release
  # added above is built and tested by that one edit instead of drifting until
  # the artifact download fails.
  integration-tests:
    needs: [matrix, build-rpm]
    if: needs.matrix.outputs.test != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.test) }}
    uses: ./.github/workflows/integration-tests-linux.yml
    with:
      architecture: ${{ matrix.arch }}
      version: ${{ inputs.version }}
      artifact-name: NSCP-${{ inputs.version }}-${{ matrix.distro }}-${{ matrix.distro_version }}-${{ matrix.arch }}
      package-type: rpm
      package-arch: ${{ matrix.rpm_arch }}
      container: 'rockylinux/rockylinux:${{ matrix.distro_version }}'
      distro: ${{ matrix.distro }}
      distro_version: ${{ matrix.distro_version }}
      runner: ${{ matrix.runner }}
