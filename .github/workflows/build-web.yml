name: Build web bundle

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      version:
        type: string
        description: 'Version to build'
        required: true

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        # react-router 8 and vite 8 need node >= 22
        node-version: 22
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Build web frontend
      working-directory: web
      run: |
        # npm ci, not npm install: install tolerates a lockfile that has drifted
        # from package.json and rewrites it, so the bytes shipped in the web zip
        # and in the MSI's bundled web/dist would not be the ones
        # package-lock.json names. ci fails instead, and the .sha256 manifest the
        # installer verifies then attests a dependency tree someone reviewed.
        npm ci
        npm run build

    # Gate on known-vulnerable runtime dependencies. Runtime only: a dev-only
    # advisory does not reach anyone running the agent, and failing the release
    # build on one would mean the web bundle cannot ship until an unrelated
    # build tool is patched. `high` and above is the bar, so the build fails on
    # something worth stopping for rather than on every low-severity notice.
    - name: Audit web dependencies
      working-directory: web
      run: npm audit --omit=dev --audit-level=high

    - name: Unit tests
      working-directory: web
      run: npm test

    - name: Install Playwright Chromium
      working-directory: web
      run: npx playwright install --with-deps chromium

    - name: Integration tests (rendered UI, Playwright)
      working-directory: web
      run: npm run test:e2e

    - name: Package bundle
      run: |
        set -euo pipefail
        zipname="NSCP-Web-${{ inputs.version }}.zip"
        shaname="NSCP-Web-${{ inputs.version }}.sha256"
        # Archive entries are rooted at the zip root (index.html, assets/, …),
        # not nested under dist/, so `unzip` extracts straight into ${web-path}.
        (cd web/dist && zip -r "${GITHUB_WORKSPACE}/${zipname}" .)
        # sha256sum-compatible single-line manifest, verifiable with
        # `sha256sum -c NSCP-Web-<version>.sha256`.
        sha256sum "${zipname}" > "${shaname}"

    - uses: actions/upload-artifact@v6
      with:
        name: NSCP-${{ inputs.version }}-web
        path: |
          NSCP-Web-${{ inputs.version }}.zip
          NSCP-Web-${{ inputs.version }}.sha256
        if-no-files-found: error
