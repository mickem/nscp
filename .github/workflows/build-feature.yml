name: Build feature

permissions:
  contents: read

on:
  pull_request:
    # Run CI for PRs into main, and into long-lived feature/* branches so
    # contributors can stack fix commits onto an in-progress feature branch.
    # Signing still only happens on push to main (see build-windows.yml).
    branches:
      - "main"
      - "feature/**"

# A PR head that gets a new push makes the run already in flight pointless:
# it is testing a commit nobody will merge. Cancel it and start over on the
# new head instead of paying for both. The group is per-PR (github.ref is
# refs/pull/<n>/merge here), so PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-version:
    uses: ./.github/workflows/get-version.yml
  create-test-bundle:
    uses: ./.github/workflows/create-test-bundle.yml
  build-server-x64:
    needs: [get-version, create-test-bundle]
    uses: ./.github/workflows/build-windows.yml
    with:
      architecture: x64
      version: ${{ needs.get-version.outputs.version }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  build-server-x86:
    needs: [get-version, create-test-bundle]
    uses: ./.github/workflows/build-windows.yml
    with:
      architecture: x86
      version: ${{ needs.get-version.outputs.version }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  build-x86-static:
    needs: get-version
    uses: ./.github/workflows/build-windows-legacy.yml
    with:
      architecture: x86
      version: ${{ needs.get-version.outputs.version }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  build-debian:
    needs: [get-version, create-test-bundle]
    uses: ./.github/workflows/build-debian.yml
    with:
      architecture: x64
      version: ${{ needs.get-version.outputs.version }}
  build-redhat:
    needs: [get-version, create-test-bundle]
    uses: ./.github/workflows/build-redhat.yml
    with:
      architecture: x64
      version: ${{ needs.get-version.outputs.version }}
  build-web:
    needs: get-version
    uses: ./.github/workflows/build-web.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
