name: Build feature

permissions:
  contents: read

on:
  pull_request:
    # Run CI for PRs into main, and into long-lived feature/* branches so
    # contributors can stack fix commits onto an in-progress feature branch.
    # Nothing is signed here, and the signing secrets are not passed: only
    # build-release.yml signs.
    branches:
      - "main"
      - "feature/**"

# A PR head that gets a new push makes the run already in flight pointless:
# it is testing a commit nobody will merge. Cancel it and start over on the
# new head instead of paying for both. The group is per-PR (github.ref is
# refs/pull/<n>/merge here), so PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-version:
    uses: ./.github/workflows/get-version.yml
  create-test-bundle:
    uses: ./.github/workflows/create-test-bundle.yml
  build-server-x64:
    needs: [get-version, create-test-bundle]
    uses: ./.github/workflows/build-windows.yml
    with:
      architecture: x64
      version: ${{ needs.get-version.outputs.version }}
  build-server-x86:
    needs: [get-version, create-test-bundle]
    uses: ./.github/workflows/build-windows.yml
    with:
      architecture: x86
      version: ${{ needs.get-version.outputs.version }}
  build-x86-static:
    needs: get-version
    uses: ./.github/workflows/build-windows-legacy.yml
    with:
      architecture: x86
      version: ${{ needs.get-version.outputs.version }}
  build-debian:
    needs: [get-version, create-test-bundle]
    uses: ./.github/workflows/build-debian.yml
    with:
      architecture: x64
      version: ${{ needs.get-version.outputs.version }}
  # Only the newest RedHat release on a pull request: the older ones differ in
  # packaged library versions and the python the tests run under, not in
  # anything a change to NSClient++ is likely to break on its own. The release
  # build still produces all of them.
  build-redhat:
    needs: [get-version, create-test-bundle]
    uses: ./.github/workflows/build-redhat.yml
    with:
      architecture: x64
      version: ${{ needs.get-version.outputs.version }}
      targets: default
  # macOS arm64. Not in branch protection yet: the port is new, the runner is
  # billed at 10x on private repos (free here, this repository is public), and a
  # build nobody has watched for a few weeks has no business blocking a merge.
  # It still runs on every pull request, because the alternative is finding out
  # on the merge commit.
  build-macos:
    needs: get-version
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
  build-web:
    needs: get-version
    uses: ./.github/workflows/build-web.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
