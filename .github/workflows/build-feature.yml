name: Build feature

permissions:
  contents: read

on:
  pull_request:
    # Run CI for PRs into main, and into long-lived feature/* branches so
    # contributors can stack fix commits onto an in-progress feature branch.
    # Signing still only happens on push to main (see build-windows.yml).
    branches:
      - "main"
      - "feature/**"

# A PR head that gets a new push makes the run already in flight pointless:
# it is testing a commit nobody will merge. Cancel it and start over on the
# new head instead of paying for both. The group is per-PR (github.ref is
# refs/pull/<n>/merge here), so PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-version:
    uses: ./.github/workflows/get-version.yml
  create-test-bundle:
    uses: ./.github/workflows/create-test-bundle.yml
  build-server-x64:
    needs: [get-version, create-test-bundle]
    uses: ./.github/workflows/build-windows.yml
    with:
      architecture: x64
      version: ${{ needs.get-version.outputs.version }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  build-server-x86:
    needs: [get-version, create-test-bundle]
    uses: ./.github/workflows/build-windows.yml
    with:
      architecture: x86
      version: ${{ needs.get-version.outputs.version }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  # TEMPORARY (reverted before merge, see below): ARM64 belongs on release
  # builds only, but it has never actually run past "Build Boost", so this
  # branch needs one real run to prove the rest of the path.
  #
  # Removing this means `git revert e36c6492`, not dropping the tip commit -
  # it is several commits down, and a squash merge would carry it in. The
  # branch guard is the backstop for exactly that: if this does reach main,
  # the job is skipped on every other pull request instead of quietly adding
  # a fourth Windows build to all of them.
  build-server-arm64:
    if: github.head_ref == 'claude/busy-maxwell-9lpc4a'
    needs: [get-version, create-test-bundle]
    uses: ./.github/workflows/build-windows.yml
    with:
      architecture: arm64
      version: ${{ needs.get-version.outputs.version }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  build-x86-static:
    needs: get-version
    uses: ./.github/workflows/build-windows-legacy.yml
    with:
      architecture: x86
      version: ${{ needs.get-version.outputs.version }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  build-debian:
    needs: [get-version, create-test-bundle]
    uses: ./.github/workflows/build-debian.yml
    with:
      architecture: x64
      version: ${{ needs.get-version.outputs.version }}
      # TEMPORARY (reverted before merge, with the ARM64 job above): proves
      # the new Raspberry Pi OS entry builds. Release builds keep "all";
      # pull requests get "default". Guarded on the branch for the same
      # reason as the job above - on main this reads "default" again.
      targets: ${{ github.head_ref == 'claude/busy-maxwell-9lpc4a' && 'all' || 'default' }}
  # Only the newest RedHat release on a pull request: the older ones differ in
  # packaged library versions and the python the tests run under, not in
  # anything a change to NSClient++ is likely to break on its own. The release
  # build still produces all of them.
  build-redhat:
    needs: [get-version, create-test-bundle]
    uses: ./.github/workflows/build-redhat.yml
    with:
      architecture: x64
      version: ${{ needs.get-version.outputs.version }}
      targets: default
  build-web:
    needs: get-version
    uses: ./.github/workflows/build-web.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
