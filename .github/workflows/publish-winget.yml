name: Publish to WinGet

# Submits a manifest update to microsoft/winget-pkgs whenever a non-draft,
# non-prerelease release is published. Can also be invoked manually for a
# given version (workflow_dispatch) or as a reusable workflow.

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (must already exist as a GitHub release).'
        required: true
        type: string
      dry_run:
        description: 'Render and validate manifests but do not submit.'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        description: 'Release version to publish.'
        required: true
        type: string
      dry_run:
        description: 'Render and validate manifests but do not submit.'
        required: false
        type: boolean
        default: false
    secrets:
      WINGET_PR_TOKEN:
        description: 'PAT used by wingetcreate to open the PR against microsoft/winget-pkgs.'
        required: false

env:
  PACKAGE_IDENTIFIER: Mickem.NSClient

jobs:
  publish:
    # Skip drafts and prereleases when triggered by the release event.
    if: ${{ github.event_name != 'release' || (github.event.release.draft == false && github.event.release.prerelease == false) }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Resolve release tag and version
        id: ctx
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'release') {
              $tag     = '${{ github.event.release.tag_name }}'
              $version = $tag
              $dryRun  = 'false'
              # published_at is ISO-8601 like 2026-05-15T14:30:00Z;
              # the manifest field wants YYYY-MM-DD.
              $publishedAt = '${{ github.event.release.published_at }}'
              $releaseDate = if ($publishedAt) { $publishedAt.Substring(0, 10) } else { '' }
          } else {
              $tag     = '${{ inputs.version }}'
              $version = '${{ inputs.version }}'
              $dryRun  = '${{ inputs.dry_run }}'
              $releaseDate = ''
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
              Write-Error 'No release tag/version available.'
              exit 1
          }
          "tag=$tag"                 | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "dry_run=$dryRun"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_date=$releaseDate" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Render WinGet manifests
        shell: pwsh
        run: |
          $renderArgs = @(
              '--version',      '${{ steps.ctx.outputs.version }}',
              '--release-tag',  '${{ steps.ctx.outputs.tag }}',
              '--templates',    'packaging/winget',
              '--output',       'dist/winget',
              '--download-dir', 'dist/_assets',
              '--asset',        'MSI_X64=NSCP-${{ steps.ctx.outputs.version }}-x64.msi',
              '--asset',        'MSI_X86=NSCP-${{ steps.ctx.outputs.version }}-Win32.msi'
          )
          if ('${{ steps.ctx.outputs.release_date }}') {
              $renderArgs += '--release-date'
              $renderArgs += '${{ steps.ctx.outputs.release_date }}'
          }
          python packaging/scripts/render_templates.py @renderArgs

      - name: Validate manifests with winget
        shell: pwsh
        run: |
          # winget is preinstalled on windows-latest runners.
          winget validate --manifest dist/winget

      - name: Verify rendered hashes round-trip from URL
        shell: pwsh
        run: |
          python packaging/scripts/verify_manifest_hashes.py winget dist/winget

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v6
        with:
          name: winget-manifests-${{ steps.ctx.outputs.version }}
          path: dist/winget
          if-no-files-found: error

      - name: Sync the bot's winget-pkgs fork with upstream
        if: ${{ steps.ctx.outputs.dry_run != 'true' }}
        shell: pwsh
        env:
          WINGET_PR_TOKEN: ${{ secrets.WINGET_PR_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINGET_PR_TOKEN)) {
              Write-Warning 'WINGET_PR_TOKEN secret is not configured. Skipping fork sync.'
              exit 0
          }

          # wingetcreate pushes its branch to a fork of microsoft/winget-pkgs
          # owned by the token's account, and fast-forwards that fork first.
          # winget-pkgs takes hundreds of commits a day, so a fork left alone
          # between releases drifts by tens of thousands of commits and the
          # fast-forward inside wingetcreate gives up with nothing but "The
          # forked repository could not be synced with the upstream commits."
          # Sync it here instead: every release keeps the fork current, and a
          # sync that genuinely cannot happen says so with the repo name.
          $headers = @{
              Authorization          = "Bearer $env:WINGET_PR_TOKEN"
              Accept                 = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
          }

          # Invoke-RestMethod turns any non-2xx into a terminating error, so
          # wrap it to get the status back and decide per call.
          function Invoke-GitHubApi {
              param([string]$Method, [string]$Uri, [string]$Body)
              try {
                  $params = @{ Method = $Method; Uri = $Uri; Headers = $headers }
                  if ($Body) {
                      $params.Body        = $Body
                      $params.ContentType = 'application/json'
                  }
                  return @{ status = 200; body = Invoke-RestMethod @params }
              } catch {
                  $status = 0
                  if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
                  $detail = $_.ErrorDetails.Message
                  if (-not $detail) { $detail = $_.Exception.Message }
                  return @{ status = $status; body = $detail }
              }
          }

          # The fork belongs to whichever account minted WINGET_PR_TOKEN, so
          # ask the token rather than hard-coding the bot name.
          $me = Invoke-GitHubApi GET 'https://api.github.com/user'
          if ($me.status -ne 200) {
              Write-Error "Could not identify the WINGET_PR_TOKEN account (HTTP $($me.status)): $($me.body)"
              exit 1
          }
          $owner = $me.body.login
          $fork  = "$owner/winget-pkgs"
          Write-Host "WINGET_PR_TOKEN account: $owner"

          $repo = Invoke-GitHubApi GET "https://api.github.com/repos/$fork"
          if ($repo.status -eq 404) {
              Write-Host "$fork does not exist yet; wingetcreate will create the fork."
              exit 0
          }
          if ($repo.status -ne 200) {
              Write-Error "Could not read $fork (HTTP $($repo.status)): $($repo.body)"
              exit 1
          }

          $branch = $repo.body.default_branch
          $sync = Invoke-GitHubApi POST "https://api.github.com/repos/$fork/merge-upstream" `
              (@{ branch = $branch } | ConvertTo-Json)
          if ($sync.status -eq 200) {
              Write-Host "${fork}:${branch} is in sync with microsoft/winget-pkgs - $($sync.body.message)"
              exit 0
          }

          Write-Host "Sign in as $owner and press 'Sync fork' on https://github.com/$fork."
          Write-Host "If the fork has diverged, or is too far behind for GitHub to fast-forward, delete it instead:"
          Write-Host "wingetcreate re-forks on the next run. Check for open PRs from the fork before deleting it."
          Write-Error "Could not fast-forward ${fork}:${branch} from microsoft/winget-pkgs (HTTP $($sync.status)): $($sync.body)"
          exit 1

      - name: Submit manifest to microsoft/winget-pkgs
        if: ${{ steps.ctx.outputs.dry_run != 'true' }}
        shell: pwsh
        env:
          WINGET_PR_TOKEN: ${{ secrets.WINGET_PR_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINGET_PR_TOKEN)) {
              Write-Warning 'WINGET_PR_TOKEN secret is not configured. Skipping submission.'
              exit 0
          }

          # Install wingetcreate.
          $wc = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile $wc

          # Verify the Authenticode signature before executing — this runs
          # with WINGET_PR_TOKEN in scope, so a compromised aka.ms redirect
          # would otherwise hand the PAT to an attacker.
          $sig = Get-AuthenticodeSignature $wc
          if ($sig.Status -ne 'Valid') {
              Write-Error "wingetcreate.exe Authenticode status is $($sig.Status), expected Valid."
              exit 1
          }
          if ($sig.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
              Write-Error "wingetcreate.exe is not signed by Microsoft Corporation: $($sig.SignerCertificate.Subject)"
              exit 1
          }

          & $wc submit `
            --token $env:WINGET_PR_TOKEN `
            dist/winget
