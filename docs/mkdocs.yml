      - Legacy API: api/rest/legacy.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - codehilite
  - smarty
  - sane_lists
  - toc:
      permalink: true
  # Content tabs used by the reference docs to show differing Windows vs Linux
  # behaviour side-by-side (generated by scripts/python/docs_generate.py).
  - pymdownx.superfences
  # <div markdown="1"> wrappers around the assembled upgrade and security
  # notes (hooks/notes.py), which the page filter hides and shows.
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  # OS logos (:fontawesome-brands-windows: / :fontawesome-brands-linux:) in the
  # reference index's OS column (generated by scripts/python/docs_generate.py).
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  