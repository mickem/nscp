site_name: NSClient++
site_url: https://nsclient.org
repo_url: https://github.com/mickem/nscp
repo_name: GitHub
edit_uri: blob/master/docs/docs
theme: 
  name: 'material'
  custom_dir: 'custom_theme'
copyright: "NSClient++ is dual-licensed under Apache-2.0 OR GPL-2.0-only"
extra_css: 
  - pygments.css
  - custom.css
extra_javascript:
  # Module/version filter on setup/upgrading.md and security/notices.md.
  - js/notes.js
# Build-time assembly of setup/upgrading.md and security/notices.md from one
# file per note (docs/upgrades, docs/security) so branches never conflict.
hooks:
  - hooks/notes.py
extra:
  #disqus: 'your-disqus-shortname'
  palette:
    primary: 'indigo'
    accent: 'green'
  logo: images/FAVICON.PNG
  root_menu:
    title: 0.5.2
    link: version.md
    page: History
nav:
  - Home: index.md
  - Quick Start: quick-start.md
  - Concepts:
      - How NSClient++ Works: concepts/index.md
      - Checks In Depth: concepts/checks.md
      - Settings: concepts/settings.md
      - File Layout: concepts/file-layout.md
      - Permissions: concepts/permissions.md
  - Setup:
