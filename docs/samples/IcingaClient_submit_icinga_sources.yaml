all:
- source: Icinga 2 REST API `POST /v1/actions/process-check-result` over HTTPS (default port 5665)
  provides: passive host/service check results
  privilege: none
  note: With `ensure_objects`, the host and service are first looked up with `GET /v1/objects/hosts/...` / `services/...` and created with `PUT` when missing. Where the target carries configured credentials, the request may not change its address, proxy or transport security unless the target sets `allow host override = true`.
  requires:
  - OpenSSL (the module is not built without it)
  - An Icinga 2 API endpoint reachable from the agent
  - An Icinga 2 `ApiUser` (`username`/`password`, sent as HTTP Basic auth) permitted `actions/process-check-result`, plus object query/create permissions when `ensure_objects` is on
