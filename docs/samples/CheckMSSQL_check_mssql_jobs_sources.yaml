windows:
  - source: SQL Server Agent tables `msdb.dbo.sysjobs`, `sysjobhistory` and `sysjobactivity` over ODBC/TDS
    provides: job name, enabled, last run status and age, running state
    without: "A permission failure on msdb is UNKNOWN `Query failed: ...`; with no enabled jobs the result is OK `No enabled SQL Agent jobs found`"
    requires:
      - SQL Server ODBC driver (auto-detected, newest first - ODBC Driver 18/17/13/11, Native Client 11.0, then the legacy `SQL Server` driver shipped with Windows; override with `driver`)
      - Network reachability of the instance named by `server` (default `localhost`)
      - "Credentials: a SQL login (`user`/`password`), or - with both empty - Windows integrated authentication as the agent service account, which then needs a login on the instance"
      - Membership in the msdb role `SQLAgentReaderRole` (or `sysadmin`)
      - SQL Server Agent for any jobs to exist
