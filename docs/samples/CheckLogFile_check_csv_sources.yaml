windows:
- source: '`CreateFileW` + `ReadFile` on a local or UNC path'
  provides: rows and cells
  privilege: conditional
  note: The agent's account must be able to read the file (for a UNC path, the share). Paths are also held against `file access` in `[/settings/logfile]`.
  without: '"Failed to open <path>: <error>"'
linux:
- source: '`open` + `read` on a local path'
  provides: rows and cells
  privilege: conditional
  note: The agent's account must be able to read the file. Paths are also held against `file access` in `[/settings/logfile]`.
  without: '"Failed to open <path>: <error>"'
