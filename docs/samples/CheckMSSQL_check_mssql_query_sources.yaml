windows:
  - source: User-supplied T-SQL (`query`) executed over ODBC/TDS
    provides: one row per result row, every column as a keyword
    note: Runs in the login's default database unless `database` is set; bounded by `query-timeout` (default 30s).
    without: "A statement that returns no columns is UNKNOWN `Query returned no result set ...`; a SQL error is UNKNOWN `Query failed: ...`"
    requires:
      - SQL Server ODBC driver (auto-detected, newest first - ODBC Driver 18/17/13/11, Native Client 11.0, then the legacy `SQL Server` driver shipped with Windows; override with `driver`)
      - Network reachability of the instance named by `server` (default `localhost`)
      - "Credentials: a SQL login (`user`/`password`), or - with both empty - Windows integrated authentication as the agent service account, which then needs a login on the instance"
      - Whatever database permissions the query itself needs
