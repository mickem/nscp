all:
- source: Remote NSClient++ REST API `GET /api/v2/queries/{command}/commands/execute` over HTTPS
  provides: the remote check's status (from the HTTP status code), message and performance data
  privilege: none
  note: Same request as `check_remote_nscp`. Where the target carries configured credentials, the request may not change its address, proxy or transport security unless the target sets `allow host override = true`.
  without: 'A connection error is UNKNOWN `Socket error: ...`; an HTTP status other than 200/202/500 (401, 403, 404, 503) is UNKNOWN.'
  requires:
  - A remote NSClient++ with its web server reachable on `host`/`port` (default 8443, TLS with `verify mode = peer`)
  - A remote credential (`password`, sent in the `password` header) whose role grants executing queries
