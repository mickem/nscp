all:
- source: Remote SMTP submission server, ESMTP over TCP (default port 587) with STARTTLS, or implicit TLS with `security = tls`
  provides: check results delivered as e-mail to the configured recipient
  privilege: none
  note: When `username` is set it authenticates with AUTH PLAIN or AUTH LOGIN. Where the target carries configured credentials, the request may not change its address, proxy or transport security unless the target sets `allow host override = true`. Recipient and sender likewise cannot be changed by the request unless `allow recipient override = true`.
  requires:
  - OpenSSL (the module is not built without it)
  - An SMTP relay or submission server reachable on `host`/`port`
  - A mailbox `username`/`password` when the server requires authentication
  - A CA that verifies the server certificate (unless `insecure-skip-verify`)
