windows:
  - source: Catalog views `sys.availability_groups`, `sys.availability_replicas` and DMVs `sys.dm_hadr_availability_replica_states`, `sys.dm_hadr_database_replica_states` over ODBC/TDS
    provides: replica role, connected state, health, sync state, redo and log-send queues
    without: An instance with no availability groups returns OK `No availability groups found`.
    requires:
      - SQL Server ODBC driver (auto-detected, newest first - ODBC Driver 18/17/13/11, Native Client 11.0, then the legacy `SQL Server` driver shipped with Windows; override with `driver`)
      - Network reachability of the instance named by `server` (default `localhost`)
      - "Credentials: a SQL login (`user`/`password`), or - with both empty - Windows integrated authentication as the agent service account, which then needs a login on the instance"
      - "`VIEW SERVER STATE`"
      - Always On availability groups configured on the instance
