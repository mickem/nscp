windows:
  - source: '`dhcpsapi.dll` loaded by absolute System32 path (`GetSystemDirectoryW` + `LoadLibraryW`) before the first DHCP call'
    provides: the DHCP Server Management API the scope read below uses
    privilege: none
    note: 'The DLL is delay-loaded by CheckWindowsApps, so the module''s other commands never map it. It ships with Windows whether or not the DHCP Server role is installed.'
    without: 'UNKNOWN "The DHCP Server Management API (dhcpsapi.dll) is not available on this host: ..."'
  - source: 'DHCP Server Management API against the local server: `DhcpEnumSubnets`, `DhcpGetMibInfo` (`SCOPE_MIB_INFO`), `DhcpGetSubnetInfo` per scope'
    provides: 'one row per IPv4 scope: scope, subnet, mask, prefix, name, comment, state, enabled, in_use, free, pending_offers, addresses, used_pct, free_pct, stats_known'
    note: 'Local RPC to the DHCP Server service; the server only answers read requests from members of DHCP Users, DHCP Administrators or Administrators (LocalSystem qualifies). The calls take no timeout. IPv6 scopes are not read.'
    requires:
      - DHCP Server role, with the DHCP Server service running on this host
    without: 'UNKNOWN "DHCP Server service is not running or not installed on this host: ..." when there is no RPC endpoint to bind to; UNKNOWN "<step>: access denied - the service account must be a member of DHCP Users or DHCP Administrators" when the account may not read the server. A scope deleted between the list and its info read is skipped; one created between the list and the statistics read reports stats_known = 0.'
