all:
- source: The wrapped command's result, submitted on `channel=` (default NSCA)
  privilege: none
  note: The wrapped command runs with the caller's grants; its own data sources and privileges apply.
  without: '"Failed to submit to: <channel>" when no module handles the channel.'
  requires:
  - A loaded client module for the channel (NSCA, NRDP, Graphite, ...)
