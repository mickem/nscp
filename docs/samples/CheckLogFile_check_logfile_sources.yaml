windows:
- source: The named text file(s), read with `std::ifstream`
  provides: lines and their split columns
  privilege: conditional
  note: The agent's account must be able to read each file. Paths are also held against `file access` in `[/settings/logfile]`.
  without: '"Failed to open file: <path>"'
- source: Agent storage (`logfile.bookmarks` context)
  provides: the resume position for `bookmark=`
  privilege: none
