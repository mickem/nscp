common:
  info:
    description: 'CheckSecurity checks host security posture: certificate expiry and (on Windows) the
      firewall profile state.'
    title: CheckSecurity
  queries:
    check_activation:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: licensed = 0
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${name}: ${activation_status} (${genuine_state}, grace ${grace_days}d)'
        empty-state: unknown
        empty-syntax: '%(status): No licensing information found (Software Licensing service unavailable?)'
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): ${list}'
        perf-config: ''
        perf-syntax: license
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: grace_days > 0 and grace_days < 30
      fields:
      - generic: false
        long_description: 'Licensing status as a word: licensed, unlicensed, initial_grace, additional_grace,
          non_genuine_grace, notification, extended_grace'
        name: activation_status
        short_description: ''
      - generic: false
        long_description: 'Product key channel: Retail, Volume:MAK, Volume:GVLK, OEM, ...'
        name: channel
        short_description: ''
      - generic: false
        long_description: Product description including the licensing channel
        name: description
        short_description: ''
      - generic: false
        long_description: True when Windows reports itself as genuine (false also when it could not be
          determined)
        name: genuine
        short_description: ''
      - generic: false
        long_description: 'Genuine status as a word: genuine, invalid_license, tampered, offline, unknown'
        name: genuine_state
        short_description: ''
      - generic: false
        long_description: Remaining grace/renewal period in whole days (0 when no grace period applies)
        name: grace_days
        short_description: ''
      - generic: false
        long_description: Remaining grace/renewal period in minutes, as Windows reports it (0 when no
          grace period applies)
        name: grace_minutes
        short_description: ''
      - generic: false
        long_description: Product SKU id (GUID)
        name: id
        short_description: ''
      - generic: false
        long_description: True when the product is Windows itself (as opposed to another licensed product)
        name: is_windows
        short_description: ''
      - generic: false
        long_description: Partial product key (the last five characters of the installed key)
        name: key
        short_description: ''
      - generic: false
        long_description: 'Raw LicenseStatus: 0 unlicensed, 1 licensed, 2 initial grace, 3 additional
          grace, 4 non-genuine grace, 5 notification, 6 extended grace'
        name: license_status
        short_description: ''
      - generic: false
        long_description: Raw LicenseStatusReason code explaining the status
        name: license_status_reason
        short_description: ''
      - generic: false
        long_description: True when the product is fully licensed (activated)
        name: licensed
        short_description: ''
      - generic: false
        long_description: Product name, e.g. 'Windows(R), Professional edition'
        name: name
        short_description: ''
      info:
        description: 'Check the Windows activation/licensing state: license status, remaining grace or
          KMS renewal period and genuineness. Windows only.'
      params:
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: Report every licensed product with an installed key (Office, ...) instead of
          only Windows itself.
        name: all-products
        repeatable: false
        required: false
        short_description: Report every licensed product with an installed key (Office, ...) instead of
          only Windows itself.
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: Do not evaluate the genuine state (skips the SLIsGenuineLocal call); genuine_state
          then reads 'unknown'.
        name: skip-genuine
        repeatable: false
        required: false
        short_description: Do not evaluate the genuine state (skips the SLIsGenuineLocal call); genuine_state
          then reads 'unknown'.
    check_antivirus:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: enabled = 0 or up_to_date = 0
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: ${name} (enabled=${enabled} up_to_date=${up_to_date})
        empty-state: unknown
        empty-syntax: No antivirus product registered
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '${status}: ${count} antivirus product(s) healthy'
        perf-config: ''
        perf-syntax: ${name}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: True if real-time protection is enabled
        name: enabled
        short_description: ''
      - generic: false
        long_description: Antivirus product display name
        name: name
        short_description: ''
      - generic: false
        long_description: Raw Security Center productState bitfield
        name: product_state
        short_description: ''
      - generic: false
        long_description: True if virus definitions are current
        name: up_to_date
        short_description: ''
      info:
        description: Check registered antivirus products' enabled/up-to-date state (Windows Security Center).
          Windows only.
    check_bitlocker:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: protected = 0
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: ${drive} protected=${protected}
        empty-state: unknown
        empty-syntax: No encryptable volumes found
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '${status}: all ${count} volume(s) protected'
        perf-config: ''
        perf-syntax: ${drive}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: Raw conversion status (0 decrypted, 1 encrypted, ...)
        name: conversion_status
        short_description: ''
      - generic: false
        long_description: Drive letter of the volume (may be empty for non-lettered volumes)
        name: drive
        short_description: ''
      - generic: false
        long_description: True if BitLocker protection is on (protection_status is 1)
        name: protected
        short_description: ''
      - generic: false
        long_description: Raw protection status (0 off, 1 on, 2 unknown)
        name: protection_status
        short_description: ''
      info:
        description: Check BitLocker drive-encryption protection status per volume. Windows only.
    check_certificate:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: expires_in < 10
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: ${subject} expires in ${expires_in}d (${valid_to})
        empty-state: unknown
        empty-syntax: No certificates found
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): all %(count) certificate(s) are ok'
        perf-config: ''
        perf-syntax: ${subject}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${problem_list}'
        warn: ''
        warning: expires_in < 30
      fields:
      - generic: false
        long_description: True if the certificate has already expired
        name: expired
        short_description: ''
      - generic: false
        long_description: Whole days until the certificate expires (negative if already expired)
        name: expires_in
        short_description: ''
      - generic: false
        long_description: Alias for expires_in
        name: expires_in_days
        short_description: ''
      - generic: false
        long_description: Seconds until the certificate expires (negative if already expired)
        name: expires_in_sec
        short_description: ''
      - generic: false
        long_description: Certificate issuer distinguished name
        name: issuer
        short_description: ''
      - generic: false
        long_description: Public key size in bits
        name: key_size
        short_description: ''
      - generic: false
        long_description: Public key type (RSA, EC, DSA, ...)
        name: key_type
        short_description: ''
      - generic: false
        long_description: The not-after / expiry date
        name: not_after
        short_description: ''
      - generic: false
        long_description: The not-before date
        name: not_before
        short_description: ''
      - generic: false
        long_description: True if the certificate is not yet valid (not-before is in the future)
        name: not_yet_valid
        short_description: ''
      - generic: false
        long_description: True if the certificate is self-signed
        name: self_signed
        short_description: ''
      - generic: false
        long_description: Certificate serial number (hex)
        name: serial
        short_description: ''
      - generic: false
        long_description: Signature algorithm (e.g. sha256WithRSAEncryption)
        name: signature_algorithm
        short_description: ''
      - generic: false
        long_description: Where the certificate was read from (file path or store)
        name: source
        short_description: ''
      - generic: false
        long_description: The store/source type (file or a Windows store name)
        name: store
        short_description: ''
      - generic: false
        long_description: Certificate subject (e.g. /CN=host.example.com)
        name: subject
        short_description: ''
      - generic: false
        long_description: SHA-1 fingerprint (lower-case hex)
        name: thumbprint
        short_description: ''
      - generic: false
        long_description: True if the certificate chains to a trusted CA (system store or ca=; time validity
          is ignored — use expired/not_yet_valid for that)
        name: trusted
        short_description: ''
      - generic: false
        long_description: Not-before date (UTC)
        name: valid_from
        short_description: ''
      - generic: false
        long_description: Not-after / expiry date (UTC)
        name: valid_to
        short_description: ''
      - generic: false
        long_description: True if the key is weak (RSA/DSA < 2048 bits, or EC < 256 bits)
        name: weak_key
        short_description: ''
      - generic: false
        long_description: True if signed with a weak algorithm (MD5 or SHA-1)
        name: weak_signature
        short_description: ''
      info:
        description: Check X.509 certificate expiry/validity/hygiene from files (all platforms) or the
          Windows certificate store.
      params:
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: A certificate file (PEM or DER) or a directory of them. Can be given multiple
          times.
        name: file
        repeatable: false
        required: false
        short_description: A certificate file (PEM or DER) or a directory of them. Can be given multiple
          times.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Alias for file.
        name: path
        repeatable: false
        required: false
        short_description: Alias for file.
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: Recurse into directories given via file=/path=.
        name: recursive
        repeatable: false
        required: false
        short_description: Recurse into directories given via file=/path=.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Password for PKCS#12 (.pfx/.p12) files.
        name: password
        repeatable: false
        required: false
        short_description: Password for PKCS#12 (.pfx/.p12) files.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: CA bundle to evaluate the 'trusted' keyword against (defaults to the system
          trust store).
        name: ca
        repeatable: false
        required: false
        short_description: CA bundle to evaluate the 'trusted' keyword against (defaults to the system
          trust store).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Windows certificate store to enumerate (e.g. My, Root, CA). Windows only.
        name: store
        repeatable: false
        required: false
        short_description: Windows certificate store to enumerate (e.g. My, Root, CA). Windows only.
      - content_type: 2
        default_value: LocalMachine
        is_simple: false
        long_description: 'Windows store location: LocalMachine or CurrentUser. Windows only.'
        name: location
        repeatable: false
        required: false
        short_description: 'Windows store location: LocalMachine or CurrentUser. Windows only.'
    check_defender:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: enabled = 0 or realtime_enabled = 0 or signature_age > 7
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: Defender enabled=${enabled} realtime=${realtime_enabled} tamper=${tamper_protection}
          sig_age=${signature_age}d sig=${signature_version} engine=${engine_version}
        empty-state: unknown
        empty-syntax: '%(status): Microsoft Defender status unavailable (not installed or another antivirus
          is active)'
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): Microsoft Defender healthy (signature age ${signature_age}d)'
        perf-config: ''
        perf-syntax: defender
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: signature_age > 3
      fields:
      - generic: false
        long_description: True if Defender antivirus/service is enabled
        name: enabled
        short_description: ''
      - generic: false
        long_description: Defender anti-malware engine version
        name: engine_version
        short_description: ''
      - generic: false
        long_description: Days since the last full scan (-1 if never/unknown)
        name: full_scan_age
        short_description: ''
      - generic: false
        long_description: Defender platform/product version
        name: product_version
        short_description: ''
      - generic: false
        long_description: Days since the last quick scan (-1 if never/unknown)
        name: quick_scan_age
        short_description: ''
      - generic: false
        long_description: True if real-time protection is on
        name: realtime_enabled
        short_description: ''
      - generic: false
        long_description: Antivirus signature age in days (-1 if unknown)
        name: signature_age
        short_description: ''
      - generic: false
        long_description: Antivirus signature (definition) version
        name: signature_version
        short_description: ''
      - generic: false
        long_description: True if tamper protection is on
        name: tamper_protection
        short_description: ''
      info:
        description: 'Check Microsoft Defender status: signature/scan age, real-time and tamper protection,
          engine/signature versions. Windows only.'
    check_file_security:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: exists = 0 or readable = 0 or owner_expected = 0 or world_writable = 1
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${path}: ${state}'
        empty-state: unknown
        empty-syntax: '%(status): No paths checked'
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): all %(count) path(s) have the expected owner and no unexpected write access'
        perf-config: ''
        perf-syntax: ${path}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: unexpected_write = 1
      fields:
      - generic: false
        long_description: Number of explicit entries in the DACL
        name: ace_count
        short_description: ''
      - generic: false
        long_description: The DACL rendered as 'trustee(rights)'; deny entries are prefixed with '!' and
          inherited ones with '~'; rights are F (full) or a subset of R (read), W (write), X (execute),
          D (delete), P (permissions)
        name: dacl
        short_description: ''
      - generic: false
        long_description: Why the security descriptor could not be read (empty when it could)
        name: error
        short_description: ''
      - generic: false
        long_description: True when the path exists
        name: exists
        short_description: ''
      - generic: false
        long_description: True when the path is a directory
        name: is_dir
        short_description: ''
      - generic: false
        long_description: Owner as 'DOMAIN\name' (the SID when it cannot be resolved)
        name: owner
        short_description: ''
      - generic: false
        long_description: True when the owner is on the expected-owner list (or no list was given)
        name: owner_expected
        short_description: ''
      - generic: false
        long_description: Owner SID
        name: owner_sid
        short_description: ''
      - generic: false
        long_description: The inspected file or directory
        name: path
        short_description: ''
      - generic: false
        long_description: True when the security descriptor could be read
        name: readable
        short_description: ''
      - generic: false
        long_description: Service the path was resolved from (empty for a path= entry)
        name: service
        short_description: ''
      - generic: false
        long_description: 'One-line verdict: missing, unreadable, unexpected owner, world writable or
          ok'
        name: state
        short_description: ''
      - generic: false
        long_description: The trustees with write access that are not allow-listed
        name: unexpected
        short_description: ''
      - generic: false
        long_description: True when a trustee outside the allow-list holds write access
        name: unexpected_write
        short_description: ''
      - generic: false
        long_description: True when Everyone, Users, Authenticated Users, Guests, Power Users or Anonymous
          Logon holds write access
        name: world_writable
        short_description: ''
      - generic: false
        long_description: Comma separated trustees holding write access
        name: writable
        short_description: ''
      info:
        description: Check the owner and DACL of files, folders or service binaries; alerts on world-writable
          paths and unexpected owners. Windows only.
      params:
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: File or directory to inspect (repeatable).
        name: path
        repeatable: false
        required: false
        short_description: File or directory to inspect (repeatable).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Alias for path (repeatable).
        name: file
        repeatable: false
        required: false
        short_description: Alias for path (repeatable).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Windows service whose binary is inspected (repeatable); the image path is read
          from the service configuration.
        name: service
        repeatable: false
        required: false
        short_description: Windows service whose binary is inspected (repeatable); the image path is read
          from the service configuration.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: An acceptable owner (repeatable), matched against the SID, 'DOMAIN\name' or
          the bare name. Any other owner is CRITICAL. When omitted the owner is only reported.
        name: expected-owner
        repeatable: false
        required: false
        short_description: An acceptable owner (repeatable), matched against the SID, 'DOMAIN\name' or
          the bare name. Any other owner is CRITICAL. When omitted the owner is only reported.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: A trustee allowed to hold write access (repeatable), in addition to SYSTEM,
          Administrators, TrustedInstaller and CREATOR OWNER.
        name: allow-write
        repeatable: false
        required: false
        short_description: A trustee allowed to hold write access (repeatable), in addition to SYSTEM,
          Administrators, TrustedInstaller and CREATOR OWNER.
    check_firewall:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: enabled = 0
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: ${profile}=${enabled}
        empty-state: unknown
        empty-syntax: No firewall profiles found
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): all %(count) firewall profile(s) enabled'
        perf-config: ''
        perf-syntax: ${profile}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${problem_list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: True if the profile is currently applied to a connected network (e.g. NLA re-categorising
          a network to public makes the Public profile active)
        name: active
        short_description: ''
      - generic: false
        long_description: True if the profile's firewall is enabled
        name: enabled
        short_description: ''
      - generic: false
        long_description: Default inbound action (allow/block)
        name: inbound
        short_description: ''
      - generic: false
        long_description: Default outbound action (allow/block)
        name: outbound
        short_description: ''
      - generic: false
        long_description: Where the profile's settings come from; 'group policy' if any of the reported
          settings is enforced through group policy, otherwise 'local'
        name: policy
        short_description: ''
      - generic: false
        long_description: Firewall profile name (Domain, Private or Public)
        name: profile
        short_description: ''
      info:
        description: Check the Windows firewall profile (Domain/Private/Public) enabled state. Windows
          only.
    check_firewall_rules:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: present = 0
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${name}: ${state}'
        empty-state: ok
        empty-syntax: '%(status): No firewall rules matched'
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): %(count) rule(s) checked, all as expected'
        perf-config: ''
        perf-syntax: ${name}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${problem_list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: 'What the rule does with matching traffic: allow or block'
        name: action
        short_description: ''
      - generic: false
        long_description: True for an enabled inbound allow rule that restricts neither the remote address
          nor the local port
        name: any_any
        short_description: ''
      - generic: false
        long_description: True when the rule covers any local port
        name: any_port
        short_description: ''
      - generic: false
        long_description: True when the rule accepts traffic from any remote address
        name: any_remote
        short_description: ''
      - generic: false
        long_description: Program the rule is bound to (empty when it is not program specific)
        name: application
        short_description: ''
      - generic: false
        long_description: Rule description
        name: description
        short_description: ''
      - generic: false
        long_description: 'Direction the rule applies to: in or out'
        name: direction
        short_description: ''
      - generic: false
        long_description: True when the rule accepts traffic that has traversed a NAT device
        name: edge_traversal
        short_description: ''
