        required: false
        short_description: Maximum depth to recurse
      - content_type: 2
        default_value: filter
        is_simple: false
        long_description: Include the total of either (filter) all files matching the filter or (all)
          all files regardless of the filter
        name: total
        repeatable: false
        required: false
