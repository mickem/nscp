common:
  info:
    description: CheckDisk can check various file and disk related things.
    title: CheckDisk
  paths:
    /settings/disk:
      info:
        advanced: false
        description: ''
        subkey: false
        title: ''
      keys:
        collection interval:
          advanced: true
          default_value: 10s
          description: How often disk I/O and disk free data is sampled. All rates (IOPS, bytes/sec) and
            latencies reported by check_disk_io and check_disk_health are averages over one such interval,
            so lowering it makes them react faster and follow short spikes more closely, at the cost of
            more frequent sampling. Duration, e.g. 10s.
          sample: false
          title: Collection interval
        disable:
          advanced: true
          default_value: ''
          description: 'A comma separated list of checks to disable in the collector: disk_io, disk_free,
            trend. Please note disabling these will mean part of NSClient++ will no longer function as
            expected.'
          sample: false
          title: Disable automatic checks
        max collection errors:
          advanced: true
          default_value: '10'
          description: How many consecutive failed fetches disable a collection (disk I/O or disk free)
            for the rest of the process lifetime. A single failure is not treated as the source being
            unavailable, since the collector retries on the next interval and any success resets the count.
            Set to 0 to retry forever.
          sample: false
          title: Maximum consecutive collection errors
        trend interval:
          advanced: true
          default_value: 5m
          description: How often a used-space sample is kept per drive for the check_drivesize trend keywords
            (full_in/rate). Duration, e.g. 5m.
          sample: false
          title: Trend sampling interval
        trend retention:
          advanced: true
          default_value: 7d
          description: How much used-space history is kept per drive; bounds the largest useful trend-window.
            Duration, e.g. 7d.
          sample: false
          title: Trend history retention
  queries:
    check_disk_write:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: has_issues = 1
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '%(path): %(message)'
        empty-state: unknown
        empty-syntax: No write test performed
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): %(list)'
        perf-config: ''
        perf-syntax: '%(path)'
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: 1 when the write test failed, else 0
        name: has_issues
        short_description: ''
      - generic: false
        long_description: Human-readable description of any problems found (empty when the write test
          succeeded)
        name: issues
        short_description: ''
      - generic: false
        long_description: Human readable outcome of the write test
        name: message
        short_description: ''
      - generic: false
        long_description: Path of the test file
        name: path
        short_description: ''
      - generic: false
        long_description: Time spent reading back and verifying the file (ms)
        name: read_time
        short_description: ''
      - generic: false
        long_description: Number of bytes written to (and read back from) the test file
        name: size
        short_description: ''
      - generic: false
        long_description: Total time for the create/write/read/delete cycle (ms)
        name: total_time
        short_description: ''
      - generic: false
        long_description: Time spent creating, writing and flushing the file to disk (ms)
        name: write_time
        short_description: ''
      info:
        description: Verify that a disk is writable by creating a test file, writing to it, reading it
          back and deleting it.
      params:
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The test file to create (must not already exist; it is deleted after the test).
        name: file
        repeatable: false
        required: false
        short_description: The test file to create (must not already exist; it is deleted after the test).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Alias for file.
        name: path
        repeatable: false
        required: false
        short_description: Alias for file.
      - content_type: 2
        default_value: 1k
        is_simple: false
        long_description: The amount of data to write, in bytes or with a byte unit (e.g. 512, 4k, 1M).
          Maximum is 1M.
        name: size
        repeatable: false
        required: false
        short_description: The amount of data to write, in bytes or with a byte unit (e.g. 512, 4k, 1M).
          Maximum is 1M.
