module: CheckDisk
namespace: check
platforms:
- unix
- windows
unix:
  queries:
    check_disk_health:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: (has_space = 1 and free_pct < 10) or percent_disk_time > 95 or (has_device = 1 and (health_status
          = 'Unhealthy' or is_offline = 1))
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${name}: ${free_pct} free, ${percent_disk_time}% busy, q=${queue_length} iops=${iops}'
        empty-state: critical
        empty-syntax: ''
        escape-html: 'false'
        filter: name != '_Total'
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): All disks are healthy.'
        perf-config: ''
        perf-syntax: ${name}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: (has_space = 1 and free_pct < 20) or percent_disk_time > 80 or (has_device = 1 and health_status
          = 'Warning')
      fields:
      - generic: false
        long_description: 'Convert a byte count to a specific unit and return the numeric value (1024-based).
          Useful in thresholds.

          Syntax: convert_bytes(value, unit) where unit is "B", "K"/"KB", "M"/"MB", "G"/"GB", "T"/"TB".'
        name: convert_bytes()
        short_description: ''
      - generic: false
        long_description: Physical disk number/index (device rows)
        name: disk_number
        short_description: ''
      - generic: false
        long_description: "Format a number as a human-readable byte string.\nSyntax: format_bytes(value)\
          \ auto-scales to B/KB/MB/GB/... (1024-based).\n        format_bytes(value, unit) formats to\
          \ a fixed unit (\"B\", \"K\"/\"KB\", \"M\"/\"MB\", \"G\"/\"GB\", \"T\"/\"TB\")."
        name: format_bytes()
        short_description: ''
      - generic: false
        long_description: Free disk space in bytes (I/O-only rows have none)
        name: free
        short_description: ''
      - generic: false
        long_description: Percentage of free disk space (I/O-only rows have none)
        name: free_pct
        short_description: ''
      - generic: false
        long_description: Physical disk friendly name (device rows)
        name: friendly_name
        short_description: ''
      - generic: false
        long_description: 1 if the row carries physical-disk device state (a per-disk row), 0 otherwise
          (guard; no perfdata)
        name: has_device
        short_description: ''
      - generic: false
        long_description: 1 if the row has filesystem space data, 0 for I/O-only rows (e.g. _Total or
          a disk with no mounted filesystem)
        name: has_space
        short_description: ''
      - generic: false
        long_description: 'Physical disk health: Healthy, Warning, Unhealthy or Unknown (device rows)'
        name: health_status
        short_description: ''
      - generic: false
        long_description: Total IOPS (reads + writes)
        name: iops
        short_description: ''
      - generic: false
        long_description: 1 if the physical disk is offline (device rows)
        name: is_offline
        short_description: ''
      - generic: false
        long_description: 1 if the physical disk is read-only (device rows)
        name: is_readonly
        short_description: ''
      - generic: false
        long_description: 'Physical disk media type: HDD, SSD, SCM or Unspecified (device rows)'
        name: media_type
        short_description: ''
      - generic: false
        long_description: Drive name (e.g. C:, D:, _Total)
        name: name
        short_description: ''
      - generic: false
        long_description: 'Physical disk operational status, synthesised single value: Offline, OK, or
          the health string (device rows)'
        name: operational_status
        short_description: ''
      - generic: false
        long_description: Percent of time the disk is busy
        name: percent_disk_time
        short_description: ''
      - generic: false
        long_description: Percent of time the disk is idle
        name: percent_idle_time
        short_description: ''
      - generic: false
        long_description: Current disk queue length
        name: queue_length
        short_description: ''
      - generic: false
        long_description: Bytes read per second
        name: read_bytes_per_sec
        short_description: ''
      - generic: false
        long_description: Average read latency in milliseconds (over the collection interval)
        name: read_latency
        short_description: ''
      - generic: false
        long_description: Read IOPS
        name: reads_per_sec
        short_description: ''
      - generic: false
        long_description: 'Divide a value by a divisor. Useful for arbitrary unit conversions (e.g. decimal
          Mbps with scale(value, 1000000)).

          Syntax: scale(value, divisor).'
        name: scale()
        short_description: ''
      - generic: false
        long_description: Physical disk serial number (device rows)
        name: serial
        short_description: ''
      - generic: false
        long_description: Total disk size in bytes (I/O-only rows have none)
        name: size
        short_description: ''
      - generic: false
        long_description: Split I/O operations per second
        name: split_io_per_sec
        short_description: ''
      - generic: false
        long_description: Total bytes per second (read + write)
        name: total_bytes_per_sec
        short_description: ''
      - generic: false
