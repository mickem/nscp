        name: written_u
        short_description: ''
      info:
        description: Check various aspects of a file and/or folder.
      params:
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'The path to search for files under.

          Notice that specifying multiple path will create an aggregate set you will not check each path
          individually.In other words if one path contains an error the entire check will result in error.'
        name: path
        repeatable: false
        required: false
        short_description: The path to search for files under.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Alias for path.
        name: file
        repeatable: false
        required: false
        short_description: Alias for path.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: A comma separated list of paths to scan
        name: paths
        repeatable: false
        required: false
        short_description: A comma separated list of paths to scan
      - content_type: 2
        default_value: '*.*'
        is_simple: false
        long_description: The pattern of files to search for (works like a filter but is faster and can
          be combined with a filter).
        name: pattern
        repeatable: false
        required: false
