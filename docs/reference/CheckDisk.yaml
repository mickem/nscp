          all files regardless of the filter
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: Silently skip top-level paths that do not exist, instead of failing the whole
          check. Intended for directories that are legitimately absent some of the time. Implies empty-state=ok,
          so a scan whose paths are all missing reports OK rather than UNKNOWN (pass empty-state= to choose
          a different one).
        name: ignore-missing
        repeatable: false
        required: false
        short_description: Silently skip top-level paths that do not exist, instead of failing the whole
          check. Intended for directories that are legitimately absent some of the time. Implies empty-state=ok,
          so a scan whose paths are all missing reports OK rather than UNKNOWN (pass empty-state= to choose
          a different one).
