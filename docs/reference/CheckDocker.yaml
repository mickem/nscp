        name: detail_list
        short_description: ''
      - generic: false
        long_description: Number of images
        name: images
        short_description: ''
      - generic: false
        long_description: Disk freed by pruning unused images (bytes)
        name: images_reclaimable
        short_description: ''
      - generic: false
        long_description: Disk used by images (bytes; supports units, e.g. images_size > 10G)
