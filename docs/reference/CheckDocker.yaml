common:
  info:
    description: Check docker containers (state, health) and the docker daemon itself.
    title: CheckDocker
module: CheckDocker
namespace: check
platforms:
- unix
- windows
unix:
  paths:
    /settings/docker:
      info:
        advanced: false
        description: ''
        subkey: false
        title: ''
      keys:
        endpoint:
          advanced: false
          default_value: /var/run/docker.sock
          description: 'The local docker daemon socket: a named pipe (\\.\pipe\docker_engine) on Windows,
            a unix socket (/var/run/docker.sock) elsewhere.'
          sample: false
          title: DOCKER ENDPOINT
        timeout:
          advanced: true
          default_value: '10'
          description: Timeout for talking to the daemon, in seconds.
          sample: false
          title: TIMEOUT
  queries:
    check_docker:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: container_state != 'running'
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: ${names}=${container_state}
        empty-state: warning
        empty-syntax: No containers found
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: ${names}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: Command the container runs
        name: command
        short_description: ''
      - generic: false
        long_description: 'Container state: created, restarting, running, removing, paused, exited, dead
          or missing (a requested container the daemon does not know about)'
        name: container_state
        short_description: ''
      - generic: false
        long_description: Human readable status, e.g. 'Up 3 hours (healthy)'
        name: container_status
        short_description: ''
      - generic: false
        long_description: When the container was created (date)
        name: created
        short_description: ''
      - generic: false
        long_description: 1 when the container defines a health check, else 0
        name: has_health_check
        short_description: ''
      - generic: false
        long_description: 'Health-check state: healthy, unhealthy, starting or empty when the container
          has no health check'
        name: health
        short_description: ''
      - generic: false
        long_description: Container id
        name: id
        short_description: ''
      - generic: false
        long_description: Image the container was created from
        name: image
        short_description: ''
      - generic: false
        long_description: Id of the image the container was created from
        name: image_id
        short_description: ''
      - generic: false
        long_description: First IP address on any network the container is attached to
        name: ip
        short_description: ''
      - generic: false
        long_description: Container labels as key=value, comma separated
        name: labels
        short_description: ''
      - generic: false
        long_description: Container name(s), comma separated
        name: names
        short_description: ''
      - generic: false
        long_description: Published/exposed ports, e.g. 0.0.0.0:8080->80/tcp
        name: ports
        short_description: ''
      info:
        description: Check the state of docker containers, optionally requiring specific containers to
          be running.
      params:
      - content_type: 2
        default_value: /var/run/docker.sock
        is_simple: false
        long_description: The local docker daemon socket (named pipe on Windows, unix socket elsewhere).
        name: host
        repeatable: false
        required: false
        short_description: The local docker daemon socket (named pipe on Windows, unix socket elsewhere).
      - content_type: 2
        default_value: '10'
        is_simple: false
        long_description: Timeout for talking to the daemon, in seconds.
        name: timeout
        repeatable: false
        required: false
        short_description: Timeout for talking to the daemon, in seconds.
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: Include stopped containers (docker ps -a); by default only running containers
          are listed.
        name: all
        repeatable: false
        required: false
        short_description: Include stopped containers (docker ps -a); by default only running containers
          are listed.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Name of a container that must exist (repeatable). Implies all; a name the daemon
          does not know gets container_state 'missing'.
        name: container
        repeatable: false
        required: false
        short_description: Name of a container that must exist (repeatable). Implies all; a name the daemon
          does not know gets container_state 'missing'.
    check_docker_df:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: ''
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: ${message}
        empty-state: unknown
        empty-syntax: '%(status): No disk usage information returned'
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: docker
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: Disk freed by pruning the idle build cache (bytes)
        name: build_cache_reclaimable
        short_description: ''
      - generic: false
        long_description: Disk used by the build cache (bytes)
        name: build_cache_size
        short_description: ''
      - generic: false
        long_description: Number of containers (running and stopped)
        name: containers
        short_description: ''
      - generic: false
        long_description: Disk freed by pruning stopped containers (bytes)
        name: containers_reclaimable
        short_description: ''
      - generic: false
        long_description: Disk used by container writable layers (bytes)
        name: containers_size
        short_description: ''
      - generic: false
        long_description: Number of images
        name: images
        short_description: ''
      - generic: false
        long_description: Disk freed by pruning unused images (bytes)
        name: images_reclaimable
        short_description: ''
      - generic: false
        long_description: Disk used by all image layers, deduplicated as in docker system df (bytes; supports
          units, e.g. images_size > 10G)
        name: images_size
        short_description: ''
      - generic: false
        long_description: Human readable disk-usage summary
        name: message
        short_description: ''
      - generic: false
        long_description: Total disk a full prune would free (bytes)
        name: total_reclaimable
        short_description: ''
      - generic: false
        long_description: Total disk used by docker (bytes)
        name: total_size
        short_description: ''
      - generic: false
        long_description: Number of images not used by any container
        name: unused_images
        short_description: ''
      - generic: false
        long_description: Number of volumes not referenced by any container
        name: unused_volumes
        short_description: ''
      - generic: false
        long_description: Number of volumes
        name: volumes
        short_description: ''
      - generic: false
        long_description: Disk freed by pruning unused volumes (bytes)
        name: volumes_reclaimable
        short_description: ''
      - generic: false
        long_description: Disk used by volumes (bytes)
        name: volumes_size
        short_description: ''
      info:
        description: 'Check docker disk usage: images, containers, volumes, build cache and reclaimable
          space.'
      params:
      - content_type: 2
        default_value: /var/run/docker.sock
        is_simple: false
        long_description: The local docker daemon socket (named pipe on Windows, unix socket elsewhere).
        name: host
        repeatable: false
        required: false
        short_description: The local docker daemon socket (named pipe on Windows, unix socket elsewhere).
      - content_type: 2
        default_value: '60'
        is_simple: false
        long_description: Timeout for talking to the daemon, in seconds (this endpoint is slow on large
          hosts).
        name: timeout
        repeatable: false
        required: false
        short_description: Timeout for talking to the daemon, in seconds (this endpoint is slow on large
          hosts).
    check_docker_info:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: ''
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: 'docker ${version} on ${name}: ${running} running, ${paused} paused, ${stopped}
          stopped containers, ${images} images'
        empty-state: unknown
        empty-syntax: '%(status): No daemon information returned'
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: ${name}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: Total number of containers
        name: containers
        short_description: ''
      - generic: false
        long_description: Number of images
        name: images
        short_description: ''
      - generic: false
        long_description: Daemon host name
        name: name
        short_description: ''
      - generic: false
        long_description: Operating system the daemon runs on
        name: os
        short_description: ''
      - generic: false
        long_description: Number of paused containers
        name: paused
        short_description: ''
      - generic: false
        long_description: Number of running containers
        name: running
        short_description: ''
      - generic: false
        long_description: Number of stopped containers
        name: stopped
        short_description: ''
      - generic: false
        long_description: Docker server version
        name: version
        short_description: ''
      info:
        description: 'Check that the docker daemon is healthy: version plus container and image counts.'
      params:
      - content_type: 2
        default_value: /var/run/docker.sock
        is_simple: false
        long_description: The local docker daemon socket (named pipe on Windows, unix socket elsewhere).
        name: host
        repeatable: false
        required: false
        short_description: The local docker daemon socket (named pipe on Windows, unix socket elsewhere).
      - content_type: 2
        default_value: '10'
        is_simple: false
        long_description: Timeout for talking to the daemon, in seconds.
        name: timeout
        repeatable: false
        required: false
        short_description: Timeout for talking to the daemon, in seconds.
    check_docker_restarts:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: oom_killed = 1
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${names}: ${restart_count} restarts, ${container_state}'
        empty-state: ok
        empty-syntax: No containers found
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: ${names}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: restart_count > 3 and started < 15m and started >= 0
      fields:
      - generic: false
        long_description: 'Container state: created, restarting, running, removing, paused, exited or
          dead'
        name: container_state
        short_description: ''
      - generic: false
        long_description: Exit code of the last exit (0 while running fine)
        name: exit_code
        short_description: ''
      - generic: false
        long_description: Image the container was created from
        name: image
        short_description: ''
      - generic: false
        long_description: Container name(s), comma separated
        name: names
        short_description: ''
      - generic: false
        long_description: 1 when the last exit was an out-of-memory kill, else 0
        name: oom_killed
        short_description: ''
      - generic: false
        long_description: How many times the container has been restarted (since creation)
        name: restart_count
        short_description: ''
      - generic: false
        long_description: Seconds since the container last started, -1 when it never started (supports
          units, e.g. started < 10m)
        name: started
        short_description: ''
      info:
        description: Detect container restart loops and out-of-memory kills.
      params:
      - content_type: 2
        default_value: /var/run/docker.sock
        is_simple: false
        long_description: The local docker daemon socket (named pipe on Windows, unix socket elsewhere).
        name: host
        repeatable: false
        required: false
        short_description: The local docker daemon socket (named pipe on Windows, unix socket elsewhere).
      - content_type: 2
        default_value: '10'
        is_simple: false
        long_description: Timeout for talking to the daemon, in seconds.
        name: timeout
        repeatable: false
        required: false
        short_description: Timeout for talking to the daemon, in seconds.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Only inspect the named container (repeatable).
        name: container
        repeatable: false
        required: false
        short_description: Only inspect the named container (repeatable).
    check_docker_stats:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: ''
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${names}: cpu ${cpu_pct}%, memory ${memory} (${memory_pct}%)'
        empty-state: ok
        empty-syntax: No running containers
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: ${names}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: CPU usage in percent of the host (like docker stats)
        name: cpu_pct
        short_description: ''
      - generic: false
        long_description: Image the container was created from
        name: image
        short_description: ''
      - generic: false
        long_description: Memory usage as human readable text, e.g. 45.2M of 512M (display only; threshold
          on memory_used or memory_pct)
        name: memory
        short_description: ''
      - generic: false
        long_description: Memory limit in bytes (the host's total memory when the container is unlimited)
        name: memory_limit
        short_description: ''
      - generic: false
        long_description: Memory usage in percent of the container's limit
        name: memory_pct
        short_description: ''
      - generic: false
        long_description: Memory used in bytes, page cache excluded (supports size units, e.g. memory_used
          > 200M)
        name: memory_used
        short_description: ''
      - generic: false
        long_description: Container name(s), comma separated
        name: names
        short_description: ''
      info:
        description: 'Check per-container resource usage: CPU percent and memory versus limit.'
      params:
      - content_type: 2
        default_value: /var/run/docker.sock
        is_simple: false
        long_description: The local docker daemon socket (named pipe on Windows, unix socket elsewhere).
        name: host
        repeatable: false
        required: false
        short_description: The local docker daemon socket (named pipe on Windows, unix socket elsewhere).
      - content_type: 2
        default_value: '10'
        is_simple: false
        long_description: Timeout for talking to the daemon, in seconds.
        name: timeout
        repeatable: false
        required: false
        short_description: Timeout for talking to the daemon, in seconds.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Only sample the named container (repeatable). Sampling takes about a second
          per container, so scope this check on busy hosts.
        name: container
        repeatable: false
        required: false
        short_description: Only sample the named container (repeatable). Sampling takes about a second
          per container, so scope this check on busy hosts.
