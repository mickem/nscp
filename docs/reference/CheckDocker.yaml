common:
  info:
    description: Check docker containers (state, health) and the docker daemon itself.
    title: CheckDocker
module: CheckDocker
namespace: misc
platforms:
- unix
- windows
unix:
  paths:
    /settings/docker:
      info:
        advanced: false
        description: ''
        subkey: false
        title: ''
      keys:
        endpoint:
          advanced: false
          default_value: /var/run/docker.sock
          description: 'The local docker daemon socket: a named pipe (\\.\pipe\docker_engine) on Windows,
            a unix socket (/var/run/docker.sock) elsewhere.'
          sample: false
          title: DOCKER ENDPOINT
        timeout:
          advanced: true
          default_value: '10'
          description: Timeout for talking to the daemon, in seconds.
          sample: false
          title: TIMEOUT
  queries:
    check_docker:
      fields:
      - generic: false
        long_description: Command the container runs
        name: command
        short_description: ''
      - generic: false
        long_description: 'Container state: created, restarting, running, removing, paused, exited, dead
          or missing (a requested container the daemon does not know about)'
        name: container_state
        short_description: ''
      - generic: true
        long_description: Number of items matching the filter. Common option for all checks.
        name: count
        short_description: ''
      - generic: false
        long_description: When the container was created
        name: created
        short_description: ''
      - generic: true
        long_description: Number of items matched the critical criteria. Common option for all checks.
        name: crit_count
        short_description: ''
      - generic: true
        long_description: A list of all items which matched the critical criteria. Common option for all
          checks.
        name: crit_list
        short_description: ''
      - generic: true
        long_description: A special list with critical, then warning and finally ok. Common option for
          all checks.
        name: detail_list
        short_description: ''
      - generic: false
        long_description: 1 when the container defines a health check, else 0
        name: has_health_check
        short_description: ''
      - generic: false
        long_description: 'Health-check state: healthy, unhealthy, starting or empty when the container
          has no health check'
        name: health
        short_description: ''
      - generic: false
        long_description: Container id
        name: id
        short_description: ''
      - generic: false
        long_description: Image the container was created from
        name: image
        short_description: ''
      - generic: false
        long_description: Id of the image the container was created from
        name: image_id
        short_description: ''
      - generic: false
        long_description: First IP address on any network the container is attached to
        name: ip
        short_description: ''
      - generic: false
        long_description: Container labels as key=value, comma separated
        name: labels
        short_description: ''
      - generic: true
        long_description: A list of all items which matched the filter. Common option for all checks.
        name: list
        short_description: ''
      - generic: false
        long_description: Container name(s), comma separated
        name: names
        short_description: ''
      - generic: true
        long_description: Number of items matched the ok criteria. Common option for all checks.
        name: ok_count
        short_description: ''
      - generic: true
        long_description: A list of all items which matched the ok criteria. Common option for all checks.
        name: ok_list
        short_description: ''
      - generic: false
        long_description: Published/exposed ports, e.g. 0.0.0.0:8080->80/tcp
        name: ports
        short_description: ''
      - generic: true
        long_description: Number of items matched either warning or critical criteria. Common option for
          all checks.
        name: problem_count
        short_description: ''
      - generic: true
        long_description: A list of all items which matched either the critical or the warning criteria.
          Common option for all checks.
        name: problem_list
        short_description: ''
      - generic: true
        long_description: 'The decoded list-separator, for use in the top-syntax: templates are never
          escape-decoded (a literal C:\temp must stay a literal C:\temp), so reference %(sep) to break
          the line before the first list item, e.g. top-syntax=%(status): %(count) items:%(sep)%(list).
          Common option for all checks.'
        name: sep
        short_description: ''
      - generic: true
        long_description: The returned status (OK/WARN/CRIT/UNKNOWN). Common option for all checks.
        name: status
        short_description: ''
      - generic: true
        long_description: Total number of items. Common option for all checks.
        name: total
        short_description: ''
      - generic: true
        long_description: Number of items matched the warning criteria. Common option for all checks.
        name: warn_count
        short_description: ''
      - generic: true
        long_description: A list of all items which matched the warning criteria. Common option for all
          checks.
        name: warn_list
        short_description: ''
      info:
        description: Check the state of docker containers, optionally requiring specific containers to
          be running.
      params:
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Filter which marks interesting items.

          Interesting items are items which will be included in the check.

          They do not denote warning or critical state instead it defines which items are relevant and
          you can remove unwanted items.'
        name: filter
        repeatable: false
        required: false
        short_description: Filter which marks interesting items.
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Filter which marks items which generates a warning state.

          If anything matches this filter the return status will be escalated to warning.

          '
        name: warning
        repeatable: false
        required: false
        short_description: Filter which marks items which generates a warning state.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Short alias for warning
        name: warn
        repeatable: false
        required: false
        short_description: Short alias for warning
      - content_type: 2
        default_value: container_state != 'running'
        is_simple: false
        long_description: 'Filter which marks items which generates a critical state.

          If anything matches this filter the return status will be escalated to critical.

          '
        name: critical
        repeatable: false
        required: false
        short_description: Filter which marks items which generates a critical state.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Short alias for critical.
        name: crit
        repeatable: false
        required: false
        short_description: Short alias for critical.
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Filter which marks items which generates an ok state.

          If anything matches this any previous state for this item will be reset to ok.'
        name: ok
        repeatable: false
        required: false
        short_description: Filter which marks items which generates an ok state.
      - content_type: 2
        default_value: 1)] (=0
        is_simple: false
        long_description: Show debugging information in the log
        name: debug
        repeatable: false
        required: false
        short_description: Show debugging information in the log
      - content_type: 2
        default_value: 1)] (=0
        is_simple: false
        long_description: Show details for all matches regardless of status (normally details are only
          showed for warnings and criticals).
        name: show-all
        repeatable: false
        required: false
        short_description: Show details for all matches regardless of status (normally details are only
          showed for warnings and criticals).
      - content_type: 2
        default_value: warning
        is_simple: false
        long_description: 'Return status to use when nothing matched filter.

          If no filter is specified this will never happen unless the file is empty.'
        name: empty-state
        repeatable: false
        required: false
        short_description: Return status to use when nothing matched filter.
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Performance data generation configuration

          TODO: obj ( key: value; key: value) obj (key:valuer;key:value)'
        name: perf-config
        repeatable: false
        required: false
        short_description: Performance data generation configuration
      - content_type: 2
        default_value: 1)] (=0
        is_simple: false
        long_description: Escape any < and > characters to prevent HTML encoding
        name: escape-html
        repeatable: false
        required: false
        short_description: Escape any < and > characters to prevent HTML encoding
      - content_type: 2
        default_value: ', '
        is_simple: false
        long_description: 'String used to separate the items of %(list), %(ok_list), %(warn_list), %(crit_list),
          %(problem_list) and %(detail_list).

          Accepts the escapes \n, \r, \t and \\ (a configuration file value is a single line, so a real
          newline cannot be written).

          Set to \n to render one item per line, which most Nagios compatible frontends show as long output
          below the summary line.

          The top-syntax decides what precedes the first item; templates are never escape-decoded, so
          reference the decoded separator as %(sep) to break before it too: --top-syntax "%(status): %(count)
          items:%(sep)%(list)".'
        name: list-separator
        repeatable: false
        required: false
        short_description: String used to separate the items of %(list), %(ok_list), %(warn_list), %(crit_list),
          %(problem_list) and %(detail_list).
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: Show help screen (this screen)
        name: help
        repeatable: false
        required: false
        short_description: Show help screen (this screen)
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: Show help screen as a protocol buffer payload
        name: help-pb
        repeatable: false
        required: false
        short_description: Show help screen as a protocol buffer payload
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: Show default values for a given command
        name: show-default
        repeatable: false
        required: false
        short_description: Show default values for a given command
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: Show help screen (short format).
        name: help-short
        repeatable: false
        required: false
        short_description: Show help screen (short format).
      - content_type: 2
        default_value: '${status}: ${list}'
        is_simple: false
        long_description: 'Top level syntax.

          Used to format the message to return can include text as well as special keywords which will
          include information from the checks.

          To add a keyword to the message you can use two syntaxes either ${keyword} or %(keyword) (there
          is no difference between them apart from ${} can be difficult to escape on linux).'
        name: top-syntax
        repeatable: false
        required: false
        short_description: Top level syntax.
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'ok syntax.

          DEPRECATED! This is the syntax for when an ok result is returned.

          This value will not be used if your syntax contains %(list) or %(count).'
        name: ok-syntax
        repeatable: false
        required: false
        short_description: ok syntax.
      - content_type: 2
        default_value: No containers found
        is_simple: false
        long_description: 'Empty syntax.

          DEPRECATED! This is the syntax for when nothing matches the filter.'
        name: empty-syntax
        repeatable: false
        required: false
        short_description: Empty syntax.
      - content_type: 2
        default_value: ${names}=${container_state}
        is_simple: false
        long_description: 'Detail level syntax.

          Used to format each resulting item in the message.

          %(list) will be replaced with all the items formatted by this syntax string in the top-syntax.

          To add a keyword to the message you can use two syntaxes either ${keyword} or %(keyword) (there
          is no difference between them apart from ${} can be difficult to escape on linux).'
        name: detail-syntax
        repeatable: false
        required: false
        short_description: Detail level syntax.
      - content_type: 2
        default_value: ${names}
        is_simple: false
        long_description: 'Performance alias syntax.

          This is the syntax for the base names of the performance data.'
        name: perf-syntax
        repeatable: false
        required: false
        short_description: Performance alias syntax.
      - content_type: 2
        default_value: /var/run/docker.sock
        is_simple: false
        long_description: The local docker daemon socket (named pipe on Windows, unix socket elsewhere).
        name: host
        repeatable: false
        required: false
        short_description: The local docker daemon socket (named pipe on Windows, unix socket elsewhere).
      - content_type: 2
        default_value: '10'
        is_simple: false
        long_description: Timeout for talking to the daemon, in seconds.
        name: timeout
        repeatable: false
        required: false
        short_description: Timeout for talking to the daemon, in seconds.
      - content_type: 2
        default_value: 1)] (=0
        is_simple: false
        long_description: Include stopped containers (docker ps -a); by default only running containers
          are listed.
        name: all
        repeatable: false
        required: false
        short_description: Include stopped containers (docker ps -a); by default only running containers
          are listed.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Name of a container that must exist (repeatable). Implies all; a name the daemon
          does not know gets container_state 'missing'.
        name: container
        repeatable: false
        required: false
        short_description: Name of a container that must exist (repeatable). Implies all; a name the daemon
          does not know gets container_state 'missing'.
