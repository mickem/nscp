common:
  info:
    description: Network related checks such as check_ping, check_tcp, check_dns, check_http, check_connections
      and check_ntp_offset.
    title: CheckNet
  queries:
    check_connections:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: total_connections > 2000
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${protocol}/${state}: ${connections}'
        empty-state: ignored
        empty-syntax: No connection data
        escape-html: 'false'
        filter: protocol = 'total'
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): %(list)'
        perf-config: ''
        perf-syntax: ${protocol}_${state}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: total_connections > 1000
      fields:
      - generic: false
        long_description: Number of TCP connections in CLOSE_WAIT state (total bucket)
        name: close_wait
        short_description: ''
      - generic: false
        long_description: Number of TCP connections in CLOSING state (total bucket)
        name: closing
        short_description: ''
      - generic: false
        long_description: Number of connections matching this bucket
        name: connections
        short_description: ''
      - generic: false
        long_description: Number of TCP connections in ESTABLISHED state (total bucket)
        name: established
        short_description: ''
      - generic: false
        long_description: Address family (ipv4, ipv6, any)
        name: family
        short_description: ''
      - generic: false
        long_description: Number of TCP connections in FIN_WAIT* state (total bucket)
        name: fin_wait
        short_description: ''
      - generic: false
        long_description: Number of TCP connections in LAST_ACK state (total bucket)
        name: last_ack
        short_description: ''
      - generic: false
        long_description: Number of TCP sockets in LISTEN state (total bucket)
        name: listen
        short_description: ''
      - generic: false
        long_description: Protocol of this bucket (tcp, tcp6, udp, udp6, total)
        name: protocol
        short_description: ''
      - generic: false
        long_description: TCP state name (ESTABLISHED, LISTEN, ...) or 'all'
        name: state
        short_description: ''
      - generic: false
        long_description: Number of TCP connections in SYN_RECV state (total bucket)
        name: syn_recv
        short_description: ''
      - generic: false
        long_description: Number of TCP connections in SYN_SENT state (total bucket)
        name: syn_sent
        short_description: ''
      - generic: false
        long_description: Number of TCP connections in TIME_WAIT state (total bucket)
        name: time_wait
        short_description: ''
      - generic: false
        long_description: Total number of connections (only on the 'total' bucket)
        name: total_connections
        short_description: ''
      - generic: false
        long_description: Number of UDP sockets (total bucket)
        name: udp
        short_description: ''
      info:
        description: Count active TCP/UDP connections and report counts per protocol and TCP state.
    check_dns:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: result != 'ok'
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: ${host} -> ${addresses} (${records}) in ${time}ms [${result}]
        empty-state: ignored
        empty-syntax: No DNS lookup performed
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): %(list)'
        perf-config: ''
        perf-syntax: ${host}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${problem_list}'
        warn: ''
        warning: time > 1000
      fields:
      - generic: false
        long_description: Comma separated list of resolved records
        name: addresses
        short_description: ''
      - generic: false
        long_description: Hostname that was looked up
        name: host
        short_description: ''
      - generic: false
        long_description: Number of records returned by the resolver
        name: records
        short_description: ''
      - generic: false
        long_description: Textual result of the lookup (ok, not_found, mismatch, error, ...)
        name: result
        short_description: ''
      - generic: false
        long_description: DNS server used (empty for the system resolver)
        name: server
        short_description: ''
      - generic: false
        long_description: Time taken by the lookup in milliseconds
        name: time
        short_description: ''
      - generic: false
        long_description: Record type that was queried (A, AAAA, MX, TXT, ...)
        name: type
        short_description: ''
      info:
        description: Resolve a host name and check the response time and resulting addresses.
      params:
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Hostname to look up.
        name: host
        repeatable: false
        required: false
        short_description: Hostname to look up.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Alias for --host.
        name: lookup
        repeatable: false
        required: false
        short_description: Alias for --host.
      - content_type: 2
        default_value: A
        is_simple: false
        long_description: 'DNS record type to query: A, AAAA, MX, TXT, CNAME, NS, SOA, PTR.'
        name: type
        repeatable: false
        required: false
        short_description: 'DNS record type to query: A, AAAA, MX, TXT, CNAME, NS, SOA, PTR.'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'DNS server to query (default: the system resolver for A/AAAA, /etc/resolv.conf
          otherwise).'
        name: server
        repeatable: false
        required: false
        short_description: 'DNS server to query (default: the system resolver for A/AAAA, /etc/resolv.conf
          otherwise).'
      - content_type: 2
        default_value: '53'
        is_simple: false
        long_description: UDP port of the DNS server.
        name: port
        repeatable: false
        required: false
        short_description: UDP port of the DNS server.
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: Do not request recursion (RD=0).
        name: norecursion
        repeatable: false
        required: false
        short_description: Do not request recursion (RD=0).
      - content_type: 2
        default_value: '5000'
        is_simple: false
        long_description: Timeout in milliseconds.
        name: timeout
        repeatable: false
        required: false
        short_description: Timeout in milliseconds.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Record that must be present in the answer (may be given multiple times).
        name: expected-address
        repeatable: false
        required: false
        short_description: Record that must be present in the answer (may be given multiple times).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Comma separated list of records that must all be present in the answer.
        name: expected
        repeatable: false
        required: false
        short_description: Comma separated list of records that must all be present in the answer.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'IP version to use: any (default), ipv4 or ipv6. Selects which address of the
          DNS server to query; with the system resolver (A/AAAA and no server=) it also restricts the
          answer to that family. Accepts 4/v4/inet and 6/v6/inet6 as aliases.'
        name: address-family
        repeatable: false
        required: false
        short_description: 'IP version to use: any (default), ipv4 or ipv6. Selects which address of the
          DNS server to query; with the system resolver (A/AAAA and no server=) it also restricts the
          answer to that family. Accepts 4/v4/inet and 6/v6/inet6 as aliases.'
    check_http:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: code < 200 or code >= 400 or result != 'ok'
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: ${url} -> ${code} ${result} (${size}B in ${time}ms)
        empty-state: ignored
        empty-syntax: No URL checked
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): %(list)'
        perf-config: ''
        perf-syntax: ${url}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${problem_list}'
        warn: ''
        warning: time > 5000
      fields:
      - generic: false
        long_description: Body of the response (use with substr/regex matching)
        name: body
        short_description: ''
      - generic: false
        long_description: HTTP status code
        name: code
        short_description: ''
      - generic: false
        long_description: Host part of the URL
        name: host
        short_description: ''
      - generic: false
        long_description: Path part of the URL
        name: path
        short_description: ''
      - generic: false
        long_description: TCP port that was used
        name: port
        short_description: ''
      - generic: false
        long_description: Protocol used (http or https)
        name: protocol
        short_description: ''
      - generic: false
        long_description: Textual result of the check (ok, error, ...)
        name: result
        short_description: ''
      - generic: false
        long_description: Size of the response body in bytes
        name: size
        short_description: ''
      - generic: false
        long_description: Days until the server's TLS certificate expires; negative if already expired.
          Renders as 'no certificate' (and compares false against every number) for plain http, so `ssl_expiry_days
          < 30` cannot fire there; `ssl_expiry_days = 'no certificate'` tests for that state.
        name: ssl_expiry_days
        short_description: ''
      - generic: false
        long_description: HTTP status message
        name: status_message
        short_description: ''
      - generic: false
        long_description: Time taken by the request in milliseconds
        name: time
        short_description: ''
      - generic: false
        long_description: Full URL that was requested
        name: url
        short_description: ''
      info:
        description: Send an HTTP/HTTPS request and check the response status, time, size and body.
      params:
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Full URL to check (http://host[:port]/path or https://...). May be given multiple
          times.
        name: url
        repeatable: false
        required: false
        short_description: Full URL to check (http://host[:port]/path or https://...). May be given multiple
          times.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Hostname (used when --url is not given).
        name: host
        repeatable: false
        required: false
        short_description: Hostname (used when --url is not given).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: TCP port (defaults to 80 or 443).
        name: port
        repeatable: false
        required: false
        short_description: TCP port (defaults to 80 or 443).
      - content_type: 2
        default_value: /
        is_simple: false
        long_description: Path component of the URL.
        name: path
        repeatable: false
        required: false
        short_description: Path component of the URL.
      - content_type: 2
        default_value: http
        is_simple: false
        long_description: 'Protocol to use: http or https.'
        name: protocol
        repeatable: false
        required: false
        short_description: 'Protocol to use: http or https.'
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: Force https, alias for --protocol https (ssl=true).
        name: ssl
        repeatable: false
        required: false
        short_description: Force https, alias for --protocol https (ssl=true).
      - content_type: 2
        default_value: '30000'
        is_simple: false
        long_description: Timeout in milliseconds.
        name: timeout
        repeatable: false
        required: false
        short_description: Timeout in milliseconds.
      - content_type: 2
        default_value: GET
        is_simple: false
        long_description: HTTP method to use (GET, HEAD, POST, PUT, DELETE, ...).
        name: method
        repeatable: false
        required: false
        short_description: HTTP method to use (GET, HEAD, POST, PUT, DELETE, ...).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Request body to send; implies POST unless --method is given.
        name: post-data
        repeatable: false
        required: false
        short_description: Request body to send; implies POST unless --method is given.
      - content_type: 2
        default_value: application/x-www-form-urlencoded
        is_simple: false
        long_description: Content-Type header for the request body.
        name: content-type
        repeatable: false
        required: false
        short_description: Content-Type header for the request body.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Username for HTTP Basic authentication.
        name: username
        repeatable: false
        required: false
        short_description: Username for HTTP Basic authentication.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Password for HTTP Basic authentication.
        name: password
        repeatable: false
        required: false
        short_description: Password for HTTP Basic authentication.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Substring that must appear in the body for the check to be ok.
        name: expected-body
        repeatable: false
        required: false
        short_description: Substring that must appear in the body for the check to be ok.
      - content_type: 2
        default_value: NSClient++
        is_simple: false
        long_description: User-Agent header value.
        name: user-agent
        repeatable: false
        required: false
        short_description: User-Agent header value.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Additional request header in ''Name: value'' form (may be given multiple times).'
        name: header
        repeatable: false
        required: false
        short_description: 'Additional request header in ''Name: value'' form (may be given multiple times).'
      - content_type: 2
        default_value: ok
        is_simple: false
        long_description: 'How to handle 3xx redirects: ''follow'' to follow the Location, ''ok'' (default)
          to report the redirect as-is.'
        name: onredirect
        repeatable: false
        required: false
        short_description: 'How to handle 3xx redirects: ''follow'' to follow the Location, ''ok'' (default)
          to report the redirect as-is.'
      - content_type: 2
        default_value: '15'
        is_simple: false
        long_description: Maximum number of redirects to follow (with --onredirect follow).
        name: max-redirs
        repeatable: false
        required: false
        short_description: Maximum number of redirects to follow (with --onredirect follow).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: TLS Server Name Indication / verification hostname override (defaults to the
          URL host).
        name: sni
        repeatable: false
        required: false
        short_description: TLS Server Name Indication / verification hostname override (defaults to the
          URL host).
      - content_type: 2
        default_value: tlsv1.2+
        is_simple: false
        long_description: TLS version for https (tlsv1.0, tlsv1.1, tlsv1.2, tlsv1.2+, tlsv1.3, sslv3).
        name: tls-version
        repeatable: false
        required: false
        short_description: TLS version for https (tlsv1.0, tlsv1.1, tlsv1.2, tlsv1.2+, tlsv1.3, sslv3).
      - content_type: 2
        default_value: peer
        is_simple: false
        long_description: 'Certificate verify mode: none, peer, peer-cert, fail-if-no-cert, fail-if-no-peer-cert,
          client-certificate.'
        name: verify
        repeatable: false
        required: false
        short_description: 'Certificate verify mode: none, peer, peer-cert, fail-if-no-cert, fail-if-no-peer-cert,
          client-certificate.'
      - content_type: 2
        default_value: ${ca-path}
        is_simple: false
        long_description: Path to a CA bundle to use when verifying the server certificate.
        name: ca
        repeatable: false
        required: false
        short_description: Path to a CA bundle to use when verifying the server certificate.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Extract a value from the JSON response body as a filter keyword: ''alias:dotted.path''
          (repeatable). Numeric segments index arrays; single-quote a segment containing a dot. Example:
          --json-path qlen:data.queue.length "crit=qlen > 100".'
        name: json-path
        repeatable: false
        required: false
        short_description: 'Extract a value from the JSON response body as a filter keyword: ''alias:dotted.path''
          (repeatable). Numeric segments index arrays; single-quote a segment containing a dot. Example:
          --json-path qlen:data.queue.length "crit=qlen > 100".'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'IP version to use: any (default, let the resolver choose), ipv4 or ipv6. Accepts
          4/v4/inet and 6/v6/inet6 as aliases.'
        name: address-family
        repeatable: false
        required: false
        short_description: 'IP version to use: any (default, let the resolver choose), ipv4 or ipv6. Accepts
          4/v4/inet and 6/v6/inet6 as aliases.'
    check_nsclient_web_online:
      info:
        description: Query the REST API of a remote NSClient++ agent (reachability or a remote check).
    check_ntp_offset:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: offset > 100 or stratum >= 16 or result != 'ok'
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: ${server} offset=${offset_signed}ms stratum=${stratum}
        empty-state: ignored
        empty-syntax: No NTP server checked
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): %(list)'
        perf-config: ''
        perf-syntax: ${server}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${problem_list}'
        warn: ''
        warning: offset > 50 or stratum >= 16
      fields:
      - generic: false
        long_description: RMS variation between the sampled offsets, in milliseconds; 'unknown' when fewer
          than 2 samples were taken (raise samples= to measure it). Renders as 'unknown', compares false
          against every number until measured, and emits no perfdata until real; `jitter = 'unknown'`
          tests for it.
        name: jitter
        short_description: ''
      - generic: false
        long_description: Absolute clock offset between local host and server, in milliseconds
        name: offset
        short_description: ''
      - generic: false
        long_description: Signed clock offset (positive = local clock is ahead of server), in milliseconds
        name: offset_signed
        short_description: ''
      - generic: false
        long_description: UDP port the query was sent to
        name: port
        short_description: ''
      - generic: false
        long_description: Textual result of the query (ok, timeout, error, ...)
        name: result
        short_description: ''
      - generic: false
        long_description: Round trip delay the server reports to its own reference clock, in milliseconds
        name: root_delay
        short_description: ''
      - generic: false
        long_description: Maximum error the server claims for the time it is serving, in milliseconds
        name: root_dispersion
        short_description: ''
      - generic: false
        long_description: Number of samples that answered
        name: samples
        short_description: ''
      - generic: false
        long_description: NTP server that was queried
        name: server
        short_description: ''
      - generic: false
        long_description: Stratum reported by the server (0..16)
        name: stratum
        short_description: ''
      - generic: false
        long_description: Round trip time of the NTP query in milliseconds
        name: time
        short_description: ''
      info:
        description: Query an NTP server and check the offset between the local clock and the server.
      params:
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: NTP server to query (may be given multiple times).
        name: server
        repeatable: false
        required: false
        short_description: NTP server to query (may be given multiple times).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Comma separated list of NTP servers to query.
        name: servers
        repeatable: false
        required: false
        short_description: Comma separated list of NTP servers to query.
      - content_type: 2
        default_value: '123'
        is_simple: false
        long_description: 'UDP port to use (default: 123).'
        name: port
        repeatable: false
        required: false
        short_description: 'UDP port to use (default: 123).'
      - content_type: 2
        default_value: '5000'
        is_simple: false
        long_description: Timeout in milliseconds.
        name: timeout
        repeatable: false
        required: false
        short_description: Timeout in milliseconds.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'IP version to use: any (default, let the resolver choose), ipv4 or ipv6. Accepts
          4/v4/inet and 6/v6/inet6 as aliases.'
        name: address-family
        repeatable: false
        required: false
        short_description: 'IP version to use: any (default, let the resolver choose), ipv4 or ipv6. Accepts
          4/v4/inet and 6/v6/inet6 as aliases.'
      - content_type: 2
        default_value: '1'
        is_simple: false
        long_description: 'Number of queries to send to each server (default: 1). At least 2 are needed
          for the jitter keyword, which is the variation between samples; sampling stops at the first
          failure so an unreachable server still costs only one timeout.'
        name: samples
        repeatable: false
        required: false
        short_description: 'Number of queries to send to each server (default: 1). At least 2 are needed
          for the jitter keyword, which is the variation between samples; sampling stops at the first
          failure so an unreachable server still costs only one timeout.'
    check_ping:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: time > 100 or loss > 10%
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: ${ip} Packet loss = ${loss}%, RTA = ${time}ms
        empty-state: unknown
        empty-syntax: No hosts found
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): All %(count) hosts are ok'
        perf-config: ''
        perf-syntax: ${host}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${ok_count}/${count} (${problem_list})'
        warn: ''
        warning: time > 60 or loss > 5%
      fields:
      - generic: false
        long_description: The host name or ip address (as given on command line)
        name: host
        short_description: ''
      - generic: false
        long_description: The ip address name
        name: ip
        short_description: ''
      - generic: false
        long_description: Mean variation between the round trip times, in ms; 'unknown' when fewer than
          2 packets came back (raise count= to measure it)
        name: jitter
        short_description: ''
      - generic: false
        long_description: Packet loss
        name: loss
        short_description: ''
      - generic: false
        long_description: Number of packets received from the host
        name: recv
        short_description: ''
      - generic: false
        long_description: Number of packets sent to the host
        name: sent
        short_description: ''
      - generic: false
        long_description: Round trip time in ms
        name: time
        short_description: ''
      - generic: false
        long_description: Number of packets which timed out from the host
        name: timeout
        short_description: ''
      - generic: false
