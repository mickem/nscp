module: CheckWMI
namespace: windows
platforms:
- windows
windows:
  aliases:
    checkwmi:
      description: 'Alternative name for: check_wmi'
  info:
    description: Check status via WMI
    title: CheckWMI
  paths:
    /settings/wmi/targets:
      info:
        advanced: false
        description: A list of available remote target systems
        subkey: true
        title: TARGET LIST SECTION
  queries:
    check_wmi:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: ''
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '%(line)'
        empty-state: ignored
        empty-syntax: ''
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: ''
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: ${list}
        warn: ''
        warning: ''
      info:
        description: Check a set of WMI values and return rows which are matching criteria.
      params:
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The target to check (for checking remote machines).
        name: target
        repeatable: false
        required: false
        short_description: The target to check (for checking remote machines).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Remote username when checking remote machines.
        name: user
        repeatable: false
        required: false
        short_description: Remote username when checking remote machines.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Remote password when checking remote machines.
        name: password
        repeatable: false
        required: false
        short_description: Remote password when checking remote machines.
      - content_type: 2
        default_value: root\cimv2
        is_simple: false
        long_description: The WMI root namespace to bind to.
        name: namespace
        repeatable: false
        required: false
        short_description: The WMI root namespace to bind to.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The WMI query to execute.
        name: query
        repeatable: false
        required: false
        short_description: The WMI query to execute.
