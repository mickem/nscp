module: CheckWindowsApps
namespace: windows
platforms:
- windows
windows:
  info:
    description: 'Checks for applications and server roles on Windows: IIS (web sites, application pools,
      worker processes, HTTP.sys request queues) and Remote Desktop Services (CAL licensing, session host
      load, Connection Broker).'
    title: CheckWindowsApps
  queries:
    check_iis_app_pools:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: state != 'running' and auto_start != 0
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${pool}: ${state}, uptime ${uptime}s, ${recycles} recycles'
        empty-state: unknown
        empty-syntax: No application pools found
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: ${pool}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: 1 when the pool is set to start automatically, 0 when not, -1 when the IIS WMI
          provider is unavailable
        name: auto_start
        short_description: ''
      - generic: false
        long_description: Name of the application pool
        name: pool
        short_description: ''
      - generic: false
        long_description: Pool recycles since WAS started
        name: recycles
        short_description: ''
      - generic: false
        long_description: 'Pool state: running, disabled, disabling, shutdown_pending, delete_pending,
          initialized, uninitialized or unknown'
        name: state
        short_description: ''
      - generic: false
        long_description: Raw APP_POOL_WAS state value (3 = running)
        name: state_id
        short_description: ''
      - generic: false
        long_description: Seconds since the pool last started
        name: uptime
        short_description: ''
      info:
        description: Check IIS application pools (state, uptime, recycles).
    check_iis_request_queues:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: queue_length > 1000
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${queue}: ${queue_length} queued, ${rejected} rejected'
        empty-state: ok
        empty-syntax: No HTTP.sys request queues found
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: ${queue}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: queue_length > 800
      fields:
      - generic: false
        long_description: Age of the oldest request in the queue
        name: max_age
        short_description: ''
      - generic: false
        long_description: Name of the HTTP.sys request queue (usually the application pool)
        name: queue
        short_description: ''
      - generic: false
        long_description: Requests currently waiting in the queue
        name: queue_length
        short_description: ''
      - generic: false
        long_description: Requests rejected from the queue since it was created
        name: rejected
        short_description: ''
      info:
        description: Check HTTP.sys request queues (length, rejections, age).
    check_iis_sites:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: state = 'stopped' and auto_start != 0
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${site}: ${state}, ${connections} connections, uptime ${uptime}s'
        empty-state: unknown
        empty-syntax: No web sites found
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: ${site}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: 1 when the site is set to start automatically, 0 when not, -1 when the IIS WMI
          provider is unavailable
        name: auto_start
        short_description: ''
      - generic: false
        long_description: Bytes sent+received per second (needs averages=true, otherwise 0)
        name: bytes_per_sec
        short_description: ''
      - generic: false
        long_description: Current connections to the site
        name: connections
        short_description: ''
      - generic: false
        long_description: Requests per second (needs averages=true, otherwise 0)
        name: requests_per_sec
        short_description: ''
      - generic: false
        long_description: Name of the web site
        name: site
        short_description: ''
      - generic: false
        long_description: running or stopped (stopped = the site has no Web Service counter instance)
        name: state
        short_description: ''
      - generic: false
        long_description: Seconds the site has been up (0 when stopped)
        name: uptime
        short_description: ''
      info:
        description: Check IIS web sites (state, connections, traffic).
      params:
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: Collect a second sample after one second so the rate keywords (requests_per_sec,
          bytes_per_sec) carry real values.
        name: averages
        repeatable: false
        required: false
        short_description: Collect a second sample after one second so the rate keywords (requests_per_sec,
          bytes_per_sec) carry real values.
    check_iis_worker_processes:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: ''
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${pool} (pid ${pid}): ${active_requests} active requests'
        empty-state: ok
        empty-syntax: No IIS worker processes running
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: ${pool}_${pid}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: Requests currently executing in the worker
        name: active_requests
        short_description: ''
      - generic: false
        long_description: Raw counter instance name (<pid>_<pool>)
        name: instance
        short_description: ''
      - generic: false
        long_description: Process id of the w3wp worker
        name: pid
        short_description: ''
      - generic: false
        long_description: Application pool the worker serves
        name: pool
        short_description: ''
      - generic: false
        long_description: HTTP requests served since the worker started
        name: total_requests
        short_description: ''
      info:
        description: Check IIS worker processes (active and served requests per w3wp).
    check_rds_broker:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: ''
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: ${label} = ${value}
        empty-state: unknown
        empty-syntax: No Connection Broker counters found
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: ${label}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: Name of the broker counter
        name: counter
        short_description: ''
      - generic: false
        long_description: Counter instance (empty for the single-instance counters)
        name: instance
        short_description: ''
      - generic: false
        long_description: Counter name suffixed with the instance name when the counterset is multi-instance
          (unique per record)
        name: label
        short_description: ''
      - generic: false
        long_description: Value of the counter
        name: value
        short_description: ''
      info:
        description: Check the Remote Desktop Connection Broker counterset (failed/pending connections).
      params:
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: Collect a second sample after one second so rate counters carry real values.
        name: averages
        repeatable: false
        required: false
        short_description: Collect a second sample after one second so rate counters carry real values.
    check_rds_licenses:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: available = 0 and total_licenses > 0
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${description}: ${issued}/${total_licenses} issued, ${available} available'
        empty-state: unknown
        empty-syntax: No license key packs found
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: ${description}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: available < 10 and total_licenses > 0
      fields:
      - generic: false
        long_description: Licenses still available
        name: available
        short_description: ''
      - generic: false
        long_description: License type and model (e.g. 'RDS Per User CAL')
        name: description
        short_description: ''
      - generic: false
        long_description: Key pack id
        name: id
        short_description: ''
      - generic: false
        long_description: Licenses issued to clients
        name: issued
        short_description: ''
      - generic: false
        long_description: Raw KeyPackType value
        name: keypack_type
        short_description: ''
      - generic: false
        long_description: Product version the key pack applies to
        name: product_version
        short_description: ''
      - generic: false
        long_description: Total licenses in the key pack
        name: total_licenses
        short_description: ''
      - generic: false
        long_description: 'Key pack type: unknown, retail, volume, concurrent, temporary, open or built-in'
        name: type
        short_description: ''
      info:
        description: 'Check Remote Desktop licensing (CAL key packs: issued versus available licenses).'
    check_rds_session_load:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: ''
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${session}: ${cpu}% cpu, ${working_set}B working set'
        empty-state: ok
        empty-syntax: No sessions found
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: ${session}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: '% processor time of the session (needs averages=true, otherwise 0)'
        name: cpu
        short_description: ''
      - generic: false
        long_description: Counter instance name (Console, Services, RDP-Tcp <n>, ...)
        name: session
        short_description: ''
      - generic: false
        long_description: Protocol bytes in+out since the session connected
        name: total_bytes
        short_description: ''
      - generic: false
        long_description: Working set of the session in bytes
        name: working_set
        short_description: ''
      info:
        description: Check per-session resource usage (CPU, working set, protocol bytes).
      params:
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: Collect a second sample after one second so the cpu keyword carries a real value.
        name: averages
        repeatable: false
        required: false
        short_description: Collect a second sample after one second so the cpu keyword carries a real
          value.
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: Skip the 'Services' aggregate instance (session 0 / system processes) and report
          only console/RDP sessions.
        name: sessions-only
        repeatable: false
        required: false
        short_description: Skip the 'Services' aggregate instance (session 0 / system processes) and report
          only console/RDP sessions.
    check_rds_sessions:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: ''
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: ${active} active, ${inactive} inactive (${total_sessions} total)
        empty-state: unknown
        empty-syntax: No session counters found
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: sessions
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: Sessions with a connected user
        name: active
        short_description: ''
      - generic: false
        long_description: Disconnected (idle) sessions still holding resources
        name: inactive
        short_description: ''
      - generic: false
        long_description: Total sessions on the host
        name: total_sessions
        short_description: ''
      info:
        description: Check session counts on a session host (active, inactive, total).
