module: NCPAServer
namespace: client
platforms:
- unix
unix:
  info:
    description: A server that serves the Nagios NCPA HTTP API, so Nagios Core and XI can poll NSClient++
      with the stock check_ncpa.py plugin and the XI NCPA wizard.
    experimental: true
    title: NCPAServer
  paths:
    /settings/NCPA/server:
      info:
        advanced: false
        description: 'Section for the NCPA (NCPAServer) protocol: the Nagios NCPA HTTP API, polled with
          check_ncpa.py and the Nagios XI NCPA wizard.'
        subkey: false
        title: NCPA server
      keys:
        allow arguments:
          advanced: false
          default_value: 'false'
          description: Whether a request to the plugins node may carry arguments - path segments after
            the query name (check_ncpa -a) or `args=` parameters. False (the default) runs only the commands
            the agent defines, exactly as the NRPE server's `allow arguments`; define an alias to give
            a check fixed arguments.
          sample: false
          title: ALLOW ARGUMENTS
        allow insecure:
          advanced: false
          default_value: 'false'
          description: When false (the default) the listener refuses to start without a TLS certificate
            rather than serve the token in clear. Set to true only behind a TLS-terminating proxy or on
            loopback. Note that check_ncpa.py always connects with https.
          sample: false
          title: ALLOW INSECURE (CLEARTEXT HTTP)
        allowed ciphers:
          advanced: false
          default_value: ''
          description: OpenSSL cipher list the listener is restricted to. Empty (the default) leaves the
            library's own selection in place.
          sample: false
          title: ALLOWED CIPHERS
        allowed hosts:
          advanced: false
          default_value: 127.0.0.1
          description: A comma separated list of allowed hosts. You can use netmasks (/ syntax) or * to
            create ranges.
          sample: false
          title: Allowed hosts
        auth rate limit block seconds:
          advanced: false
          default_value: '60'
          description: How long a blocked address stays blocked. Default 60 s, doubling for an address
            that keeps guessing at machine speed, up to an hour - the same limiter the WEB server uses.
          sample: false
          title: AUTH RATE LIMIT (BLOCK SECONDS)
        auth rate limit max failures:
          advanced: false
          default_value: '10'
          description: How many consecutive wrong tokens from one address block it. Default 10; 0 disables
            the limiter.
          sample: false
          title: AUTH RATE LIMIT (FAILURES)
        backup token:
          advanced: false
          default_value: ''
          description: A second accepted token (NCPA's `backup_community_string`), so the token can be
            rotated without a window where pollers fail. Empty (the default) accepts only `token`.
          sample: false
          title: BACKUP TOKEN
        cache allowed hosts:
          advanced: false
          default_value: 'true'
          description: If host names (DNS entries) should be cached, improves speed and security somewhat
            but won't allow you to have dynamic IPs for your Nagios server.
          sample: false
          title: Cache list of allowed hosts
        certificate:
          advanced: false
          default_value: ${certificate-path}/certificate.pem
          description: The certificate the listener serves. The default is the same file the WEB server
            uses, so one certificate serves both; a default one is generated when it is missing. check_ncpa.py
            only verifies it when run with -s.
          sample: false
          title: TLS CERTIFICATE
        certificate key:
          advanced: false
          default_value: ''
          description: The private key for the certificate if it is not in the same file.
          sample: false
          title: TLS PRIVATE KEY
        plugins:
          advanced: false
          default_value: any
          description: 'Which queries the plugins node exposes: `any` (every registered query - checks,
            aliases and external scripts), `scripts` (only the commands CheckExternalScripts registers)
            or a comma-separated list of query names. A query that is not exposed answers exactly like
            one that does not exist.'
          sample: false
          title: EXPOSED PLUGINS
        port:
          advanced: false
          default_value: '5693'
          description: Port to listen on. 5693 is the port check_ncpa.py and the XI wizard default to.
          sample: false
          title: PORT NUMBER
        threads:
          advanced: false
          default_value: '10'
          description: How many requests are answered at the same time. A check blocks the thread answering
            it until it returns, so a slow external script only delays the polls behind it once all threads
            are busy. Default 10.
          sample: false
          title: WORKER THREADS
        tls version:
          advanced: false
          default_value: 1.2+
          description: 'Which TLS versions the listener negotiates, in the same vocabulary as the WEB
            server: an exact version (1.0, 1.1, 1.2, 1.3), a trailing + for that version or later, or
            `any`. Honoured on builds using the beast web backend (all Linux packages).'
          sample: false
          title: TLS VERSION
        token:
          advanced: false
          default_value: ''
          description: 'The NCPA token (NCPA''s `community_string`), passed by check_ncpa.py as -t. There
            is no default: until one is set every request is refused. Compared in constant time, and never
            logged.'
          sample: false
          title: TOKEN
    /settings/NCPA/server/log:
      info:
        advanced: false
        description: Configure which messages from the NCPA listener are logged.
        subkey: false
        title: Log configuration
      keys:
        debug:
          advanced: false
          default_value: 'false'
          description: Log debug messages from the HTTP listener.
          sample: false
          title: LOG DEBUG
        error:
          advanced: false
          default_value: 'true'
          description: Log errors from the HTTP listener.
          sample: false
          title: LOG ERRORS
        info:
          advanced: false
          default_value: 'false'
          description: Log informational messages from the HTTP listener.
          sample: false
          title: LOG INFO
    /settings/default:
      info:
        advanced: false
        description: Default values used in other config sections.
        subkey: false
        title: Default values
      keys:
        allowed hosts:
          advanced: false
          default_value: 127.0.0.1
          description: A comma separated list of allowed hosts. You can use netmasks (/ syntax) or * to
            create ranges.
          sample: false
          title: Allowed hosts
        bind to:
          advanced: false
          default_value: ''
          description: Allows you to bind server to a specific local address. This has to be a dotted
            ip address not a host name. Leaving this blank will bind to all available IP addresses.
          sample: false
          title: BIND TO ADDRESS
        cache allowed hosts:
          advanced: false
          default_value: 'true'
          description: If host names (DNS entries) should be cached, improves speed and security somewhat
            but won't allow you to have dynamic IPs for your Nagios server.
          sample: false
          title: Cache list of allowed hosts
        encoding:
          advanced: true
          default_value: ''
          description: ''
          sample: false
          title: NRPE PAYLOAD ENCODING
        inbox:
          advanced: false
          default_value: inbox
          description: The default channel to post incoming messages on
          sample: false
          title: INBOX
        password:
          advanced: false
          default_value: ''
          description: 'Password an inbound caller has to present. Stored hashed (pbkdf2-sha256$...) when
            written by `nscp web install` or `nscp web password --set`; a clear-text value written by
            hand is still accepted, and is hashed in place when re-set. This is a password to verify against,
            not key material: NSCA encrypts with its shared secret instead of verifying it, so it keeps
            its own key under /settings/NSCA/server (or the NSCAClient default target) and never reads
            this one.'
          sample: false
          title: Password
        socket queue size:
          advanced: true
          default_value: '0'
          description: Number of sockets to queue before starting to refuse new incoming connections.
            This can be used to tweak the amount of simultaneous sockets that the server accepts.
          sample: false
          title: LISTEN QUEUE
        thread pool:
          advanced: true
          default_value: '10'
          description: ''
          sample: false
          title: THREAD POOL
        timeout:
          advanced: false
          default_value: '30'
          description: Timeout (in seconds) when reading packets on incoming sockets. If the data has
            not arrived within this time we will bail out.
          sample: false
          title: TIMEOUT
        timezone:
          advanced: true
          default_value: local
          description: Timezone used to render dates such as boot time. Accepts 'local' (default), 'utc',
            or any POSIX TZ string parseable by Boost.Date_time (e.g. 'MST-07' or 'EST-05EDT,M3.2.0,M11.1.0').
          sample: false
          title: Timezone
