common:
  aliases:
    checkalwayscritical:
      description: 'Alternative name for: check_always_critical'
    checkalwaysok:
      description: 'Alternative name for: check_always_ok'
    checkalwayswarning:
      description: 'Alternative name for: check_always_warning'
    checkcritical:
      description: 'Alternative name for: check_critical'
    checkmultiple:
      description: 'Alternative name for: check_multi'
    checkok:
      description: 'Alternative name for: check_ok'
    checkversion:
      description: 'Alternative name for: check_version'
    checkwarning:
      description: 'Alternative name for: check_warning'
    negate:
      description: 'Alternative name for: check_negate'
    timeout:
      description: 'Alternative name for: check_timeout'
  info:
    description: Various helper function to extend other checks.
    title: CheckHelpers
  paths:
    /settings/check helpers/alias:
      info:
        advanced: false
        description: 'A list of aliases for already-defined commands (with arguments).

          An alias is an internal command that has been predefined to provide a single command without
          arguments. Be careful so you don''t create loops (e.g. check_loop=check_a, check_a=check_loop).

          Aliases are also available in CheckExternalScripts under [/settings/external scripts/alias];
          use this section when you want aliases without enabling external-script execution. If the same
          alias name is registered by both modules, the last one to load wins - avoid duplicating definitions.'
        subkey: true
        title: Command aliases
  queries:
    check_always_critical:
      common_options:
        help: ''
        help-pb: ''
        help-short: ''
        show-default: ''
      info:
        description: Run another check and regardless of its return code return CRITICAL.
    check_always_ok:
      common_options:
        help: ''
        help-pb: ''
        help-short: ''
        show-default: ''
      info:
        description: Run another check and regardless of its return code return OK.
    check_always_warning:
      common_options:
        help: ''
        help-pb: ''
        help-short: ''
        show-default: ''
      info:
        description: Run another check and regardless of its return code return WARNING.
    check_and_forward:
      common_options:
        help: ''
        help-pb: ''
        help-short: ''
        show-default: ''
      info:
        description: Run a check and forward the result as a passive check.
      params:
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Commands to run (can be used multiple times)
        name: target
        repeatable: false
        required: false
        short_description: Commands to run (can be used multiple times)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Commands to run (can be used multiple times)
        name: command
        repeatable: false
        required: false
        short_description: Commands to run (can be used multiple times)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: List of arguments (for wrapped command)
        name: arguments
        repeatable: false
        required: false
        short_description: List of arguments (for wrapped command)
    check_critical:
      common_options:
        help: ''
        help-pb: ''
        help-short: ''
        show-default: ''
      info:
        description: Just return CRITICAL (anything passed along will be used as a message).
      params:
      - content_type: 2
        default_value: No message
        is_simple: false
        long_description: Message to return
        name: message
        repeatable: false
        required: false
        short_description: Message to return
    check_multi:
      common_options:
        help: ''
        help-pb: ''
        help-short: ''
        show-default: ''
      info:
        description: Run more then one check and return the worst state.
      params:
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Commands to run (can be used multiple times)
        name: command
        repeatable: false
        required: false
        short_description: Commands to run (can be used multiple times)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Deprecated alias for command
        name: arguments
        repeatable: false
        required: false
        short_description: Deprecated alias for command
      - content_type: 2
        default_value: ', '
        is_simple: false
        long_description: Separator between messages
        name: separator
        repeatable: false
        required: false
        short_description: Separator between messages
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Message prefix
        name: prefix
        repeatable: false
        required: false
        short_description: Message prefix
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Message suffix
        name: suffix
        repeatable: false
        required: false
        short_description: Message suffix
    check_negate:
      common_options:
        help: ''
        help-pb: ''
        help-short: ''
        show-default: ''
      info:
        description: Run a check and alter the return status codes according to arguments.
      params:
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The state to return instead of OK
        name: ok
        repeatable: false
        required: false
        short_description: The state to return instead of OK
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The state to return instead of WARNING
        name: warning
        repeatable: false
        required: false
        short_description: The state to return instead of WARNING
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The state to return instead of CRITICAL
        name: critical
        repeatable: false
        required: false
        short_description: The state to return instead of CRITICAL
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The state to return instead of UNKNOWN
        name: unknown
        repeatable: false
        required: false
        short_description: The state to return instead of UNKNOWN
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Wrapped command to execute
        name: command
        repeatable: false
        required: false
        short_description: Wrapped command to execute
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: List of arguments (for wrapped command)
        name: arguments
        repeatable: false
        required: false
        short_description: List of arguments (for wrapped command)
    check_ok:
      common_options:
        help: ''
        help-pb: ''
        help-short: ''
        show-default: ''
      info:
        description: Just return OK (anything passed along will be used as a message).
      params:
      - content_type: 2
        default_value: No message
        is_simple: false
        long_description: Message to return
        name: message
        repeatable: false
        required: false
        short_description: Message to return
    check_timeout:
      common_options:
        help: ''
        help-pb: ''
        help-short: ''
        show-default: ''
      info:
        description: Run a check and timeout after a given amount of time if the check has not returned.
      params:
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The timeout value
        name: timeout
        repeatable: false
        required: false
        short_description: The timeout value
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Wrapped command to execute
        name: command
        repeatable: false
        required: false
        short_description: Wrapped command to execute
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: List of arguments (for wrapped command)
        name: arguments
        repeatable: false
        required: false
        short_description: List of arguments (for wrapped command)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The return status
        name: return
        repeatable: false
        required: false
        short_description: The return status
    check_version:
      common_options:
        help: ''
        help-pb: ''
        help-short: ''
        show-default: ''
      info:
        description: Just return the NSClient++ version.
    check_warning:
      common_options:
        help: ''
        help-pb: ''
        help-short: ''
        show-default: ''
      info:
        description: Just return WARNING (anything passed along will be used as a message).
      params:
      - content_type: 2
        default_value: No message
        is_simple: false
        long_description: Message to return
        name: message
        repeatable: false
        required: false
        short_description: Message to return
    filter_perf:
      common_options:
        help: ''
        help-pb: ''
        help-short: ''
        show-default: ''
      info:
        description: Run a check and filter performance data.
      params:
      - content_type: 2
        default_value: none
        is_simple: false
        long_description: 'The sort order to use: none, normal or reversed'
        name: sort
        repeatable: false
        required: false
        short_description: 'The sort order to use: none, normal or reversed'
      - content_type: 2
        default_value: '0'
        is_simple: false
        long_description: The maximum number of items to return (0 returns all items)
        name: limit
        repeatable: false
        required: false
        short_description: The maximum number of items to return (0 returns all items)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Wrapped command to execute
        name: command
        repeatable: false
        required: false
        short_description: Wrapped command to execute
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: List of arguments (for wrapped command)
        name: arguments
        repeatable: false
        required: false
        short_description: List of arguments (for wrapped command)
    render_perf:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: ''
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: "%(key)\t%(value)\t%(unit)\t%(warn)\t%(crit)\t%(min)\t%(max)\n"
        empty-state: unknown
        empty-syntax: ''
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: '%(key)'
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '%(status): %(message) %(list)'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: The critical threshold (range when set, otherwise the numeric bound)
        name: crit
        short_description: ''
      - generic: false
        long_description: The name (alias) of the performance data entry
        name: key
        short_description: ''
      - generic: false
        long_description: The maximum bound of the performance data entry
        name: max
        short_description: ''
      - generic: false
        long_description: The name (alias) of the performance data entry
        name: message
        short_description: ''
      - generic: false
        long_description: The minimum bound of the performance data entry
        name: min
        short_description: ''
      - generic: false
        long_description: The unit of the performance data entry
        name: unit
        short_description: ''
      - generic: false
        long_description: The value of the performance data entry
        name: value
        short_description: ''
      - generic: false
        long_description: The warning threshold (range when set, otherwise the numeric bound)
        name: warn
        short_description: ''
      info:
        description: Run a check and render the performance data as output message.
      params:
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Wrapped command to execute
        name: command
        repeatable: false
        required: false
        short_description: Wrapped command to execute
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: List of arguments (for wrapped command)
        name: arguments
        repeatable: false
        required: false
        short_description: List of arguments (for wrapped command)
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: List of arguments (for wrapped command)
        name: remove-perf
        repeatable: false
        required: false
        short_description: List of arguments (for wrapped command)
    xform_perf:
      common_options:
        help: ''
        help-pb: ''
        help-short: ''
        show-default: ''
      info:
        description: Run a check and transform the performance data in various (currently one) way.
      params:
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Wrapped command to execute
        name: command
        repeatable: false
        required: false
        short_description: Wrapped command to execute
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: List of arguments (for wrapped command)
        name: arguments
        repeatable: false
        required: false
        short_description: List of arguments (for wrapped command)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Transformation mode: extract to fetch data or minmax to add missing min/max'
        name: mode
        repeatable: false
        required: false
        short_description: 'Transformation mode: extract to fetch data or minmax to add missing min/max'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Field to work with (value, warn, crit, max, min)
        name: field
        repeatable: false
        required: false
        short_description: Field to work with (value, warn, crit, max, min)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Replace expression for the alias
        name: replace
        repeatable: false
        required: false
        short_description: Replace expression for the alias
module: CheckHelpers
namespace: check
platforms:
- unix
- windows
