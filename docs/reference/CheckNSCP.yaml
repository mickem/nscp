common:
  info:
    description: Use this module to check the health and status of NSClient++ it self
    title: CheckNSCP
  paths:
    /settings/nscp/check/update:
      info:
        advanced: false
        description: Configuration for the check_nscp_update command which checks GitHub for newer NSClient++
          releases.
        subkey: false
        title: Update check
      keys:
        ca:
          advanced: false
          default_value: ${ca-path}
          description: Path to a CA bundle used to verify the update endpoint certificate. Defaults to
            the trusted system CA store; point at a private bundle when running behind a TLS-inspecting
            proxy.
          sample: false
          title: CA bundle
        cache hours:
          advanced: false
          default_value: '24'
          description: Number of hours to cache the latest version lookup. The GitHub API is queried at
            most once per cache window to avoid rate limits.
          sample: false
          title: Cache duration
        check experimental:
          advanced: false
          default_value: 'false'
          description: When true, GitHub pre-releases (experimental builds) are also considered when determining
            the latest available version. When false (default) only stable releases are considered.
          sample: false
          title: Include pre-releases
        tls version:
          advanced: false
          default_value: tlsv1.2+
          description: 'Minimum TLS protocol version accepted when fetching the GitHub releases endpoint.
            Defaults to tlsv1.2+ which permits TLS 1.2 and TLS 1.3 only. Allowed values: tlsv1.0, tlsv1.1,
            tlsv1.2, tlsv1.2+, tlsv1.3.'
          sample: false
          title: Minimum TLS version
        url:
          advanced: false
          default_value: https://api.github.com/repos/mickem/nscp/releases
          description: Base URL of the GitHub releases API used to look up the latest NSClient++ version.
            Point this at a mirror or internal proxy when running in environments without direct GitHub
            access.
          sample: false
          title: Update URL
        verify mode:
          advanced: false
          default_value: peer
          description: TLS certificate verification mode applied to the update endpoint. Defaults to 'peer'
            so the server certificate chain is validated against the configured CA bundle. Set to 'none'
            to disable verification (not recommended).
          sample: false
          title: Certificate verify mode
  queries:
    check_nscp_update:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: update_available = 1
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${version} (latest: ${latest_version})'
        empty-state: ignored
        empty-syntax: ''
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: version
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: update_available = 1
      fields:
      - generic: false
        long_description: The build component of the installed version (the 3 in 0.1.2.3)
        name: build
        short_description: ''
      - generic: false
        long_description: The build date of the currently installed NSClient++
        name: date
        short_description: ''
      - generic: false
        long_description: Error message if the latest version could not be determined (empty when ok)
        name: error
        short_description: ''
      - generic: false
        long_description: The build component of the latest available version
        name: latest_build
        short_description: ''
      - generic: false
        long_description: The major component of the latest available version
        name: latest_major
        short_description: ''
      - generic: false
        long_description: The minor component of the latest available version
        name: latest_minor
        short_description: ''
      - generic: false
        long_description: The release component of the latest available version
        name: latest_release
        short_description: ''
      - generic: false
        long_description: The latest available NSClient++ version (empty if lookup failed)
        name: latest_version
        short_description: ''
      - generic: false
        long_description: The major component of the installed version (the 1 in 0.1.2.3)
        name: major
        short_description: ''
      - generic: false
        long_description: The minor component of the installed version (the 2 in 0.1.2.3)
        name: minor
        short_description: ''
      - generic: false
        long_description: Publication date of the latest release
        name: published
        short_description: ''
      - generic: false
        long_description: The release component of the installed version (the 0 in 0.1.2.3)
        name: release
        short_description: ''
      - generic: false
        long_description: The GitHub tag of the latest release
        name: tag
        short_description: ''
      - generic: false
        long_description: 1 when the latest available version is newer than the running version, 0 otherwise
          (and 0 if the lookup failed)
        name: update_available
        short_description: ''
      - generic: false
        long_description: URL of the latest release on GitHub
        name: url
        short_description: ''
      - generic: false
        long_description: The currently installed NSClient++ version
        name: version
        short_description: ''
      - generic: false
        long_description: Difference between latest and current version components (largest meaningful
          component) when an update is available, 0 otherwise
        name: versions_behind
        short_description: ''
      info:
        description: Check if there is a newer version of NSClient++ available on GitHub. The result is
          cached (default 24 hours) to avoid hitting the GitHub API rate limit.
    check_nscp_version:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: ''
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: ${version} (${date})
        empty-state: ignored
        empty-syntax: ''
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: version
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: The build (the 3 in 0.1.2.3) not available in release versions after 0.6.0
        name: build
        short_description: ''
      - generic: false
        long_description: The NSClient++ Build date
        name: date
        short_description: ''
      - generic: false
        long_description: The major (the 1 in 0.1.2.3)
        name: major
        short_description: ''
      - generic: false
        long_description: The minor (the 2 in 0.1.2.3)
        name: minor
        short_description: ''
      - generic: false
        long_description: The release (the 0 in 0.1.2.3)
        name: release
        short_description: ''
      - generic: false
        long_description: The NSClient++ Version as a string
        name: version
        short_description: ''
      info:
        description: Check the version of NSClient++ which is used.
module: CheckNSCP
namespace: check
platforms:
- unix
- windows
unix:
  queries:
    check_nscp:
      common_options:
        help: ''
        help-pb: ''
        help-short: ''
        show-default: ''
      info:
        description: Check the internal health of NSClient++.
windows:
  queries:
    check_nscp:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: crashes > 0 or errors > 0
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: ${crashes} crash(es), ${errors} error(s), uptime ${uptime}
        empty-state: ignored
        empty-syntax: ''
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: nscp
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: 'Seconds since the most recent crash report was written, ''none'' when nothing
          has crashed (accepts units: crash_age < 7d)'
        name: crash_age
        short_description: ''
      - generic: false
        long_description: Number of crash reports found in the crash archive folder
        name: crashes
        short_description: ''
      - generic: false
        long_description: The build date of the running NSClient++
        name: date
        short_description: ''
      - generic: false
        long_description: Number of errors logged by NSClient++ since it was started
        name: errors
        short_description: ''
      - generic: false
        long_description: File name of the most recent crash report (empty when nothing has crashed)
        name: last_crash
        short_description: ''
      - generic: false
        long_description: The most recently logged error message (empty when nothing has been logged)
        name: last_error
        short_description: ''
      - generic: false
        long_description: 'Seconds since NSClient++ was started (accepts units: uptime < 5m)'
        name: uptime
        short_description: ''
      - generic: false
        long_description: The running NSClient++ version
        name: version
        short_description: ''
      info:
        description: Check the internal health of NSClient++.
      params:
      - content_type: 2
        default_value: w
        is_simple: false
        long_description: 'Largest time unit used to render ${uptime} and ${crash_age}: s|m|h|d|w (default:
          w). For a 6-week uptime, w=>''6w 0d 00:00'', d=>''42d 00:00'', h=>''1008:00''.'
        name: max-unit
        repeatable: false
        required: false
        short_description: 'Largest time unit used to render ${uptime} and ${crash_age}: s|m|h|d|w (default:
          w). For a 6-week uptime, w=>''6w 0d 00:00'', d=>''42d 00:00'', h=>''1008:00''.'
