common:
  info:
    description: Forward information as syslog messages to a syslog server
    title: SyslogClient
  paths:
    /settings/syslog/client:
      info:
        advanced: false
        description: Section for SYSLOG passive check module.
        subkey: false
        title: SYSLOG CLIENT SECTION
      keys:
        channel:
          advanced: false
          default_value: syslog
          description: The channel to listen to.
          sample: false
          title: CHANNEL
        hostname:
          advanced: false
          default_value: auto
          description: "The host name of the monitored computer.\nSet this to auto (default) to use the\
            \ windows name of the computer.\n\nauto\tHostname\n${host}\tHostname\n${host_lc}\tHostname\
            \ in lowercase\n${host_uc}\tHostname in uppercase\n${domain}\tDomainname\n${domain_lc}\tDomainname\
            \ in lowercase\n${domain_uc}\tDomainname in uppercase\n${address_ipv4}\tIPv4 address of the\
            \ computer\n${address_ipv6}\tIPv6 address of the computer (lowercase, compressed)\n${address_ipv6_lc}\t\
            IPv6 address in lowercase (compressed)\n${address_ipv6_uc}\tIPv6 address in uppercase (compressed)\n\
            ${address_ipv6_lc_comp}\tIPv6 address in lowercase, compressed (2001:db8::7)\n${address_ipv6_lc_uncomp}\t\
            IPv6 address in lowercase, uncompressed (2001:0db8:0000:0000:0000:0000:0000:0007)\n${address_ipv6_uc_comp}\t\
            IPv6 address in uppercase, compressed\n${address_ipv6_uc_uncomp}\tIPv6 address in uppercase,\
            \ uncompressed\n"
          sample: false
          title: HOSTNAME
    /settings/syslog/client/handlers:
      info:
        advanced: false
        description: ''
        subkey: true
        title: CLIENT HANDLER SECTION
    /settings/syslog/client/targets:
      info:
        advanced: false
        description: ''
        subkey: true
        title: REMOTE TARGET DEFINITIONS
      sample:
        keys:
          address:
            advanced: false
            default_value: ''
            description: Target host address
            sample: true
            title: TARGET ADDRESS
          allowed ciphers:
            advanced: true
            default_value: ALL:!ADH:!LOW:!EXP:!MD5:@STRENGTH
            description: OpenSSL cipher list.
            sample: true
            title: ALLOWED CIPHERS
          ca:
            advanced: false
            default_value: ${ca-path}
            description: Certificate authority bundle used to verify the server certificate.
            sample: true
            title: CA
          certificate:
            advanced: true
            default_value: ''
            description: Optional client certificate for mutual TLS.
            sample: true
            title: CLIENT CERTIFICATE
          certificate format:
            advanced: true
            default_value: PEM
            description: Format of the client certificate/key (PEM or DER).
            sample: true
            title: CERTIFICATE FORMAT
          certificate key:
            advanced: true
            default_value: ''
            description: Private key for the client certificate (if not bundled in the certificate file).
            sample: true
            title: CLIENT CERTIFICATE KEY
          critical severity:
            advanced: false
            default_value: critical
            description: Severity to use when the check result is CRITICAL.
            sample: true
            title: CRITICAL SEVERITY
          facility:
            advanced: false
            default_value: kernel
            description: Facility of the syslog message.
            sample: true
            title: FACILITY
          framing:
            advanced: true
            default_value: ''
            description: 'Message framing for stream transports: octet-counted (default, RFC 6587/RFC 5425
              "LEN SP MSG") or non-transparent (LF-terminated, legacy TCP receivers only - not allowed
              with TLS).'
            sample: true
            title: FRAMING
          host:
            advanced: true
            default_value: ''
            description: The target server to report results to.
            sample: true
            title: TARGET HOST
          insecure:
            advanced: true
            default_value: 'false'
            description: When true, allow TLS connections that do not verify the server certificate. Off
              by default; enabling this disables protection against man-in-the-middle attacks.
            sample: true
            title: INSECURE
          message_syntax:
            advanced: false
            default_value: '%message%'
            description: The template used for the syslog MESSAGE field (%message% expands to the check
              output).
            sample: true
            title: MESSAGE TEMPLATE
          ok severity:
            advanced: false
            default_value: informational
            description: Severity to use when the check result is OK.
            sample: true
            title: OK SEVERITY
          port:
            advanced: true
            default_value: ''
            description: The target server port
            sample: true
            title: TARGET PORT
          retries:
            advanced: false
            default_value: '3'
            description: Number of times to retry sending.
            sample: true
            title: RETRIES
          severity:
            advanced: false
            default_value: error
            description: Severity of the syslog message when no per-state severity matches.
            sample: true
            title: SEVERITY
          tag_syntax:
            advanced: false
            default_value: NSCA
            description: The template used for the syslog TAG field (%message% expands to the check output).
            sample: true
            title: TAG TEMPLATE
          timeout:
            advanced: false
            default_value: '30'
            description: Timeout (in seconds) when reading/writing packets to/from sockets.
            sample: true
            title: TIMEOUT
          tls version:
            advanced: false
            default_value: 1.2+
            description: The TLS version to use (1.0, 1.1, 1.2, 1.2+ or 1.3).
            sample: true
            title: TLS VERSION
          transport:
            advanced: false
            default_value: ''
            description: 'How to reach the syslog server: udp (default, RFC 3164), tcp (RFC 6587) or tls
              (RFC 5425, encrypted and authenticated).'
            sample: true
            title: TRANSPORT
          unknown severity:
            advanced: false
            default_value: emergency
            description: Severity to use when the check result is UNKNOWN.
            sample: true
            title: UNKNOWN SEVERITY
          use ssl:
            advanced: false
            default_value: 'false'
            description: Use TLS for this target (same as transport = tls).
            sample: true
            title: ENABLE TLS
          verify mode:
            advanced: false
            default_value: peer
            description: 'How to verify the server certificate: ''peer'' (default) / ''peer-cert'' validate
              the chain and hostname; ''none'' disables verification (insecure).'
            sample: true
            title: VERIFY MODE
          warning severity:
            advanced: false
            default_value: warning
            description: Severity to use when the check result is WARNING.
            sample: true
            title: WARNING SEVERITY
  queries:
    submit_syslog:
      common_options:
        help: ''
        help-pb: ''
        help-short: ''
        show-default: ''
      info:
        description: Submit information to the remote syslog server.
      params:
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The host of the host running the server
        name: host
        repeatable: false
        required: false
        short_description: The host of the host running the server
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The port of the host running the server
        name: port
        repeatable: false
        required: false
        short_description: The port of the host running the server
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The address (host:port) of the host running the server
        name: address
        repeatable: false
        required: false
        short_description: The address (host:port) of the host running the server
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Number of seconds before connection times out (default=10)
        name: timeout
        repeatable: false
        required: false
        short_description: Number of seconds before connection times out (default=10)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Target to use (lookup connection info from config)
        name: target
        repeatable: false
        required: false
        short_description: Target to use (lookup connection info from config)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Number of times ti retry a failed connection attempt (default=2)
        name: retry
        repeatable: false
        required: false
        short_description: Number of times ti retry a failed connection attempt (default=2)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: legacy version of retry
        name: retries
        repeatable: false
        required: false
        short_description: legacy version of retry
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Source/sender host name (default is auto which means use the name of the actual
          host)
        name: source-host
        repeatable: false
        required: false
        short_description: Source/sender host name (default is auto which means use the name of the actual
          host)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Source/sender host name (default is auto which means use the name of the actual
          host)
        name: sender-host
        repeatable: false
        required: false
        short_description: Source/sender host name (default is auto which means use the name of the actual
          host)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The name of the command that the remote daemon should run
        name: command
        repeatable: false
        required: false
        short_description: The name of the command that the remote daemon should run
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Same as command
        name: alias
        repeatable: false
        required: false
        short_description: Same as command
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Message
        name: message
        repeatable: false
        required: false
        short_description: Message
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Result code either a number or OK, WARN, CRIT, UNKNOWN
        name: result
        repeatable: false
        required: false
        short_description: Result code either a number or OK, WARN, CRIT, UNKNOWN
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Separator to use for the batch command (default is |)
        name: separator
        repeatable: false
        required: false
        short_description: Separator to use for the batch command (default is |)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Add multiple records using the separator format is: command|result|message'
        name: batch
        repeatable: false
        required: false
        short_description: 'Add multiple records using the separator format is: command|result|message'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The client certificate to use
        name: certificate
        repeatable: false
        required: false
        short_description: The client certificate to use
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The DH key to use
        name: dh
        repeatable: false
        required: false
        short_description: The DH key to use
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Client certificate to use
        name: certificate-key
        repeatable: false
        required: false
        short_description: Client certificate to use
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Client certificate format
        name: certificate-format
        repeatable: false
        required: false
        short_description: Client certificate format
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Certificate authority
        name: ca
        repeatable: false
        required: false
        short_description: Certificate authority
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Client certificate format
        name: verify
        repeatable: false
        required: false
        short_description: Client certificate format
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Client certificate format
        name: allowed-ciphers
        repeatable: false
        required: false
        short_description: Client certificate format
      - content_type: 2
        default_value: 'true'
        is_simple: false
        long_description: Initial an ssl handshake with the server.
        name: ssl
        repeatable: false
        required: false
        short_description: Initial an ssl handshake with the server.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: ''
        name: path
        repeatable: false
        required: false
        short_description: ''
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Transport to use: udp (default, RFC 3164), tcp (RFC 6587) or tls (RFC 5425)'
        name: transport
        repeatable: false
        required: false
        short_description: 'Transport to use: udp (default, RFC 3164), tcp (RFC 6587) or tls (RFC 5425)'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Stream framing: octet-counted (default) or non-transparent (legacy TCP receivers
          only)'
        name: framing
        repeatable: false
        required: false
        short_description: 'Stream framing: octet-counted (default) or non-transparent (legacy TCP receivers
          only)'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The TLS version to use (1.0, 1.1, 1.2, 1.2+ or 1.3)
        name: tls-version
        repeatable: false
        required: false
        short_description: The TLS version to use (1.0, 1.1, 1.2, 1.2+ or 1.3)
      - content_type: 2
        default_value: 'true'
        is_simple: false
        long_description: Allow TLS connections without verifying the server certificate (disables MITM
          protection)
        name: insecure
        repeatable: false
        required: false
        short_description: Allow TLS connections without verifying the server certificate (disables MITM
          protection)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Severity of error message
        name: severity
        repeatable: false
        required: false
        short_description: Severity of error message
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Severity to use when the check result is UNKNOWN
        name: unknown-severity
        repeatable: false
        required: false
        short_description: Severity to use when the check result is UNKNOWN
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Severity to use when the check result is OK
        name: ok-severity
        repeatable: false
        required: false
        short_description: Severity to use when the check result is OK
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Severity to use when the check result is WARNING
        name: warning-severity
        repeatable: false
        required: false
        short_description: Severity to use when the check result is WARNING
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Severity to use when the check result is CRITICAL
        name: critical-severity
        repeatable: false
        required: false
        short_description: Severity to use when the check result is CRITICAL
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Facility of error message
        name: facility
        repeatable: false
        required: false
        short_description: Facility of error message
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Tag template (TODO)
        name: tag template
        repeatable: false
        required: false
        short_description: Tag template (TODO)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Message template (TODO)
        name: message template
        repeatable: false
        required: false
        short_description: Message template (TODO)
module: SyslogClient
namespace: client
platforms:
- unix
- windows
