      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: usage > 95
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: 'user: ${user}% system: ${system}% iowait: ${iowait}% steal: ${steal}% idle: ${idle}%'
        empty-state: ignored
        empty-syntax: ''
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: cpu
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: usage > 90
      fields:
      - generic: false
        long_description: Guest (incl. guest_nice) CPU utilization in percent
        name: guest
        short_description: ''
      - generic: false
        long_description: Idle CPU in percent
        name: idle
