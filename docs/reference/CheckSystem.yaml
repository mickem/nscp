    check_swap_io:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: ''
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: ${swap_count} page file(s), in ${swap_in} pages/s, out ${swap_out} pages/s
        empty-state: ignored
        empty-syntax: ''
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: io
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: Always 'swap' (single aggregate row)
        name: name
        short_description: ''
      - generic: false
        long_description: Number of page files on the system
        name: swap_count
        short_description: ''
      - generic: false
        long_description: Pages paged in from disk per second (perfdata io_swap_in)
        name: swap_in
        short_description: ''
      - generic: false
        long_description: Bytes paged in per second — swap_in multiplied by the system page size (perfdata
          io_swap_in_bytes)
        name: swap_in_bytes
        short_description: ''
      - generic: false
        long_description: Pages paged out to disk per second (perfdata io_swap_out)
        name: swap_out
        short_description: ''
      - generic: false
        long_description: Bytes paged out per second (perfdata io_swap_out_bytes)
        name: swap_out_bytes
        short_description: ''
      info:
        description: 'Check system paging (swap) I/O rates: pages/bytes paged in and out per second.'
