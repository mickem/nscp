      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Measure CPU usage as a delta over a one second interval.

          The check samples process and system CPU times, sleeps for one second, then samples again. With
          delta=true the ''time'' (and ''kernel''/''user'') fields report the process CPU usage during
          that second as a whole percentage of total CPU, instead of cumulative CPU seconds.'
        name: delta
        repeatable: false
