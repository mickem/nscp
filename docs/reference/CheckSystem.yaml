        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${time}: ${load}%'
        empty-state: ignored
        empty-syntax: ''
        escape-html: 'false'
        filter: core = 'total'
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): CPU load is ok.'
        perf-config: ''
        perf-syntax: ${core} ${time}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${problem_list}'
        warn: ''
        warning: load > 80
      fields:
      - generic: false
        long_description: 'The core to check (total or core ##)'
        name: core
        short_description: ''
      - generic: false
        long_description: The core to check (total or core_##)
        name: core_id
        short_description: ''
      - generic: false
        long_description: The current idle load for a given core
        name: idle
        short_description: ''
      - generic: false
        long_description: deprecated (use system instead)
        name: kernel
        short_description: ''
      - generic: false
        long_description: The current load for a given core (deprecated, use usage)
        name: load
        short_description: ''
      - generic: false
        long_description: The current load used by the system (kernel)
        name: system
        short_description: ''
      - generic: false
        long_description: The time frame to check
        name: time
        short_description: ''
      - generic: false
        long_description: The current load used by user and system
        name: usage
        short_description: ''
      - generic: false
