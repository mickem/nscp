  queries:
    check_battery:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: charge < 10
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${name}: ${charge}% (${power_source}, ${battery_status})'
        empty-state: warning
        empty-syntax: No battery found
        escape-html: 'false'
        filter: battery_present = 'true'
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): No battery found or all batteries ok.'
        perf-config: ''
        perf-syntax: ${name}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: charge < 20
      fields:
      - generic: false
        long_description: 'Whether a battery is present: ''true'' or ''false'''
        name: battery_present
        short_description: ''
      - generic: false
        long_description: 'Battery status: ''charging'', ''discharging'', ''high'', ''low'', ''critical'',
          ''no_battery'', or ''unknown'''
        name: battery_status
        short_description: ''
      - generic: false
        long_description: Battery charge level in percent (0-100)
        name: charge
        short_description: ''
      - generic: false
        long_description: Current charge rate in mW (when charging)
        name: charge_rate
        short_description: ''
      - generic: false
        long_description: Design capacity in mWh
        name: design_capacity
        short_description: ''
      - generic: false
        long_description: Current discharge rate in mW (when discharging)
        name: discharge_rate
        short_description: ''
      - generic: false
        long_description: Current full charge capacity in mWh
        name: full_capacity
        short_description: ''
      - generic: false
        long_description: Battery health in percent (full_capacity / design_capacity * 100)
        name: health
        short_description: ''
      - generic: false
        long_description: Battery name/identifier
        name: name
        short_description: ''
      - generic: false
        long_description: 'Power source: ''ac'', ''battery'', or ''unknown'''
        name: power_source
        short_description: ''
      - generic: false
        long_description: Current remaining capacity in mWh
        name: remaining_capacity
        short_description: ''
      - generic: false
        long_description: Estimated time remaining in seconds (-1 if unknown or on AC)
        name: time_remaining
        short_description: ''
      info:
        description: Check battery status including charge level, power source, and battery health.
    check_cpu:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: load > 90
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${time}: ${load}%'
        empty-state: ignored
        empty-syntax: ''
        escape-html: 'false'
        filter: core = 'total'
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): CPU load is ok.'
        perf-config: ''
        perf-syntax: ${core} ${time}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${problem_list}'
        warn: ''
        warning: load > 80
      fields:
      - generic: false
        long_description: 'The core to check (total or core ##)'
        name: core
        short_description: ''
      - generic: false
        long_description: The core to check (total or core_##)
        name: core_id
        short_description: ''
      - generic: false
        long_description: The current idle load for a given core
        name: idle
        short_description: ''
      - generic: false
        long_description: deprecated (use system instead)
        name: kernel
        short_description: ''
      - generic: false
        long_description: deprecated (use usage instead)
        name: load
        short_description: ''
      - generic: false
        long_description: The current load used by the system (kernel)
        name: system
        short_description: ''
      - generic: false
        long_description: The time frame to check
        name: time
        short_description: ''
      - generic: false
        long_description: The current load used by user and system
        name: usage
        short_description: ''
      - generic: false
        long_description: The current load used by user applications
        name: user
        short_description: ''
      info:
        description: 'Check that the load of the CPU(s) are within bounds.


          The check_cpu command is a query based command which means it has a filter where you can use
          a filter expression with filter keywords to define which rows are relevant to the check.

          The filter is written using the filter query language and in it you can use various filter keywords
          to define the filtering logic.

          The filter keywords can also be used to create the bound expressions for the warning and critical
          which defines when a check returns warning or critical.'
      params:
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The time to check
        name: time
        repeatable: false
        required: false
        short_description: The time to check
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: This will remove the filter to  include the cores, if you use filter dont use
          this as well.
        name: cores
        repeatable: false
        required: false
        short_description: This will remove the filter to  include the cores, if you use filter dont use
          this as well.
    check_cpu_frequency:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: ''
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${name}: ${current_mhz}/${max_mhz} MHz (${frequency_pct}%)'
        empty-state: ignored
        empty-syntax: ''
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): All CPU frequencies seem ok.'
        perf-config: ''
        perf-syntax: ${name}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: Processor architecture (x86, x64, ARM64, ...)
        name: architecture
        short_description: ''
      - generic: false
        long_description: Number of physical cores
        name: cores
        short_description: ''
      - generic: false
        long_description: Current clock speed in MHz (perfdata)
        name: current_mhz
        short_description: ''
      - generic: false
        long_description: Current frequency as percentage of maximum (perfdata)
        name: frequency_pct
        short_description: ''
      - generic: false
        long_description: L2 cache size (size units work, e.g. 'l2_cache < 1M'); renders human-readable;
          0 when not reported
        name: l2_cache
        short_description: ''
      - generic: false
        long_description: L3 cache size; 0 when not reported (common on VMs)
        name: l3_cache
        short_description: ''
      - generic: false
        long_description: Per-socket CPU load as reported by Win32_Processor.LoadPercentage (perfdata);
          'no load sample' when WMI has no reading this cycle
        name: load_pct
        short_description: ''
      - generic: false
        long_description: Number of logical processors (threads)
        name: logical_processors
        short_description: ''
      - generic: false
        long_description: Maximum clock speed in MHz (perfdata)
        name: max_mhz
        short_description: ''
      - generic: false
        long_description: CPU name / model string
        name: name
        short_description: ''
      - generic: false
        long_description: Socket designation (e.g. "CPU 1"), for per-socket filtering
        name: socket
        short_description: ''
      - generic: false
        long_description: Socket device id (e.g. CPU0), for per-socket filtering
        name: socket_id
        short_description: ''
      info:
        description: Check CPU clock frequency (current vs max) per processor.
    check_hardware:
      common_fields:
