    check_w32time:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: synchronized = 0 or offset > 30000
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: ${state}
        empty-state: ignored
        empty-syntax: ''
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: w32time
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: offset > 1000
      fields:
      - generic: false
        long_description: NTP round trip delay to the time source in milliseconds
        name: delay
        short_description: ''
      - generic: false
        long_description: Correction the service applies to the clock frequency, in parts per billion
          (negative slows the clock down)
        name: frequency_adjustment
        short_description: ''
      - generic: false
        long_description: True when the W32Time service exists on this host
        name: installed
        short_description: ''
      - generic: false
        long_description: Time of the last known good synchronization, in UTC, or 'unknown'
        name: last_sync
        short_description: ''
      - generic: false
        long_description: Seconds since the last synchronization W32Time recorded as good; threshold with
          durations, e.g. last_sync_age > 24h
        name: last_sync_age
        short_description: ''
      - generic: false
        long_description: True when the source is the machine's own clock (Local CMOS Clock / free-running)
        name: local_clock
        short_description: ''
      - generic: false
        long_description: Absolute clock offset against the time source in milliseconds, as last computed
          by the service; 'unknown' until it has measured one (`offset = 'unknown'` tests for it)
        name: offset
        short_description: ''
      - generic: false
        long_description: Number of configured NTP peers
        name: peer_count
        short_description: ''
      - generic: false
        long_description: Configured NTP peers, comma separated (empty on a domain member, which discovers
          its source)
        name: peers
        short_description: ''
      - generic: false
        long_description: True when the W32Time service is running
        name: running
        short_description: ''
      - generic: false
        long_description: 'State of the W32Time service: running, stopped, starting, ... or ''not installed'''
        name: service_state
        short_description: ''
      - generic: false
        long_description: The time source in use; the configured peers when the service could not be asked
          (see source_from)
        name: source
        short_description: ''
      - generic: false
        long_description: 'Where source came from: ''service'' (live), ''configuration'' or ''unknown'''
        name: source_from
        short_description: ''
      - generic: false
        long_description: 'Start type of the W32Time service: auto, delayed, demand, disabled, ...'
        name: start_type
        short_description: ''
      - generic: false
        long_description: 'One line verdict: not installed, not running, NoSync, falling back to the local
          clock or synchronizing with a source'
        name: state
        short_description: ''
      - generic: false
        long_description: 'Configured synchronization type: NT5DS (domain hierarchy), NTP, AllSync or
          NoSync'
        name: sync_type
        short_description: ''
      - generic: false
        long_description: 'True when the machine is following a time source: the service runs, synchronization
          is not turned off, the source is not the local clock and - when the source could not be read
          - at least one time source is in use'
        name: synchronized
        short_description: ''
      - generic: false
        long_description: Number of NTP time sources the client is currently using
        name: time_sources
        short_description: ''
      info:
        description: 'Check the Windows Time service: whether the machine is following a time source at
          all, which one, the computed clock offset and the configured peers.'
