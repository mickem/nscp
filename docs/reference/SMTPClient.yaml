common:
  info:
    description: SMTP client can be used both from command line and from queries to check remote systems
      via SMTP
    title: SMTPClient
  paths:
    /settings/SMTP/client:
      info:
        advanced: false
        description: Section for SMTP passive check module.
        subkey: false
        title: SMTP CLIENT SECTION
      keys:
        channel:
          advanced: false
          default_value: SMTP
          description: The channel to listen to.
          sample: false
          title: CHANNEL
    /settings/SMTP/client/handlers:
      info:
        advanced: false
        description: ''
        subkey: true
        title: CLIENT HANDLER SECTION
    /settings/SMTP/client/targets:
      info:
        advanced: false
        description: ''
        subkey: true
        title: REMOTE TARGET DEFINITIONS
      sample:
        keys:
          address:
            advanced: false
            default_value: ''
            description: Target host address
            sample: true
            title: TARGET ADDRESS
          allow host override:
            advanced: true
            default_value: 'false'
            description: 'Let a request (a REST query, an NRPE argument or `nscp client`) send this target''s
              *configured* credentials to a destination the request names. Off by default: when a request
              moves the destination (`host=`, `port=`, `address=`) and the password or token going with
              it is the one configured here, the call is refused, since otherwise anyone able to run the
              module''s commands could direct the configured credentials to a host of their choosing.
              This setting is only consulted in that case: a target with no credentials, a request that
              supplies its own password/token, and a request that does not move the destination are all
              unaffected. To reach another server with its own credentials, prefer configuring it as a
              separate target and selecting it with `target=`.'
            sample: true
            title: ALLOW HOST OVERRIDE
          host:
            advanced: true
            default_value: ''
            description: The target server to report results to.
            sample: true
            title: TARGET HOST
          port:
            advanced: true
            default_value: ''
            description: The target server port
            sample: true
            title: TARGET PORT
          retries:
            advanced: false
            default_value: '3'
            description: Number of times to retry sending.
            sample: true
            title: RETRIES
          timeout:
            advanced: false
            default_value: '30'
            description: Timeout (in seconds) when reading/writing packets to/from sockets.
            sample: true
            title: TIMEOUT
  queries:
    submit_smtp:
      common_options:
        help: ''
        help-pb: ''
        help-short: ''
        show-default: ''
      info:
        description: Submit information to the remote SMTP server.
      params:
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The host of the host running the server
        name: host
        repeatable: false
        required: false
        short_description: The host of the host running the server
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The port of the host running the server
        name: port
        repeatable: false
        required: false
        short_description: The port of the host running the server
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The address (host:port) of the host running the server
        name: address
        repeatable: false
        required: false
        short_description: The address (host:port) of the host running the server
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Number of seconds before connection times out (default=10)
        name: timeout
        repeatable: false
        required: false
        short_description: Number of seconds before connection times out (default=10)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Target to use (lookup connection info from config)
        name: target
        repeatable: false
        required: false
        short_description: Target to use (lookup connection info from config)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Number of times ti retry a failed connection attempt (default=2)
        name: retry
        repeatable: false
        required: false
        short_description: Number of times ti retry a failed connection attempt (default=2)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: legacy version of retry
        name: retries
        repeatable: false
        required: false
        short_description: legacy version of retry
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Source/sender host name (default is auto which means use the name of the actual
          host)
        name: source-host
        repeatable: false
        required: false
        short_description: Source/sender host name (default is auto which means use the name of the actual
          host)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Source/sender host name (default is auto which means use the name of the actual
          host)
        name: sender-host
        repeatable: false
        required: false
        short_description: Source/sender host name (default is auto which means use the name of the actual
          host)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The name of the command that the remote daemon should run
        name: command
        repeatable: false
        required: false
        short_description: The name of the command that the remote daemon should run
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Same as command
        name: alias
        repeatable: false
        required: false
        short_description: Same as command
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Message
        name: message
        repeatable: false
        required: false
        short_description: Message
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Result code either a number or OK, WARN, CRIT, UNKNOWN
        name: result
        repeatable: false
        required: false
        short_description: Result code either a number or OK, WARN, CRIT, UNKNOWN
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Separator to use for the batch command (default is |)
        name: separator
        repeatable: false
        required: false
        short_description: Separator to use for the batch command (default is |)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Add multiple records using the separator format is: command|result|message'
        name: batch
        repeatable: false
        required: false
        short_description: 'Add multiple records using the separator format is: command|result|message'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Envelope sender / From: header.'
        name: sender
        repeatable: false
        required: false
        short_description: 'Envelope sender / From: header.'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Recipient address (one per submission).
        name: recipient
        repeatable: false
        required: false
        short_description: Recipient address (one per submission).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Subject template; %source% / %message% are substituted.
        name: subject
        repeatable: false
        required: false
        short_description: Subject template; %source% / %message% are substituted.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Body template; %source% / %message% are substituted.
        name: template
        repeatable: false
        required: false
        short_description: Body template; %source% / %message% are substituted.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: SMTP AUTH username.
        name: username
        repeatable: false
        required: false
        short_description: SMTP AUTH username.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: SMTP AUTH password.
        name: password
        repeatable: false
        required: false
        short_description: SMTP AUTH password.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Transport security: none | starttls (default) | tls (alias ssl).'
        name: security
        repeatable: false
        required: false
        short_description: 'Transport security: none | starttls (default) | tls (alias ssl).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'CA bundle used to verify the server certificate (default: the agent''s trusted
          bundle, ${ca-path}).'
        name: ca
        repeatable: false
        required: false
        short_description: 'CA bundle used to verify the server certificate (default: the agent''s trusted
          bundle, ${ca-path}).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Hostname to send in EHLO.
        name: ehlo-hostname
        repeatable: false
        required: false
        short_description: Hostname to send in EHLO.
      - content_type: 2
        default_value: 'true'
        is_simple: false
        long_description: Skip TLS certificate validation (test environments only).
        name: insecure-skip-verify
        repeatable: false
        required: false
        short_description: Skip TLS certificate validation (test environments only).
module: SMTPClient
namespace: client
platforms:
- unix
- windows
