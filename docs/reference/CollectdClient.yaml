common:
  info:
    description: CollectD client can be used to submit metrics to a collectd server
    title: CollectdClient
  paths:
    /settings/collectd/client:
      info:
        advanced: false
        description: Section for the collectd client; forwards NSClient++ metrics to a collectd server.
        subkey: false
        title: COLLECTD CLIENT SECTION
      keys:
        hostname:
          advanced: false
          default_value: auto
          description: "The host name reported to collectd.\nSet this to auto (default) to use the name\
            \ of this computer.\n\nauto\tHostname\n${host}\tHostname\n${host_lc}\tHostname in lowercase\n\
            ${host_uc}\tHostname in uppercase\n${domain}\tDomainname\n${domain_lc}\tDomainname in lowercase\n\
            ${domain_uc}\tDomainname in uppercase\n${address_ipv4}\tIPv4 address of the computer\n${address_ipv6}\t\
            IPv6 address of the computer (lowercase, compressed)\n${address_ipv6_lc}\tIPv6 address in\
            \ lowercase (compressed)\n${address_ipv6_uc}\tIPv6 address in uppercase (compressed)\n${address_ipv6_lc_comp}\t\
            IPv6 address in lowercase, compressed (2001:db8::7)\n${address_ipv6_lc_uncomp}\tIPv6 address\
            \ in lowercase, uncompressed (2001:0db8:0000:0000:0000:0000:0000:0007)\n${address_ipv6_uc_comp}\t\
            IPv6 address in uppercase, compressed\n${address_ipv6_uc_uncomp}\tIPv6 address in uppercase,\
            \ uncompressed\n"
          sample: false
          title: HOSTNAME
        interval:
          advanced: false
          default_value: '10'
          description: The interval (in seconds) reported to collectd. Should match the core 'metrics
            interval' so collectd computes rates correctly.
          sample: false
          title: METRICS INTERVAL
    /settings/collectd/client/metrics:
      info:
        advanced: false
        description: Mapping of collectd keys (e.g. cpu-total/cpu-user) to value expressions (e.g. derive:system.cpu.total.user).
          The expression is `gauge:`, `derive:` or `auto:` followed by one or more comma-separated metric
          keys; `auto:` takes the type from the metric itself, sending whatever the producing module declared
          as a counter as a DERIVE and everything else as a GAUGE. A value list is sent only when the
          snapshot carries every metric it names - one this platform or configuration does not produce
          means the list is skipped, not reported as zero. When empty a built-in default set is used.
        subkey: false
        title: METRIC MAPPINGS
    /settings/collectd/client/targets:
      info:
        advanced: false
        description: ''
        subkey: true
        title: REMOTE TARGET DEFINITIONS
      sample:
        keys:
          address:
            advanced: false
            default_value: ''
            description: Target host address
            sample: true
            title: TARGET ADDRESS
          allow host override:
            advanced: true
            default_value: 'false'
            description: 'Let a request (a REST query, an NRPE argument or `nscp client`) send this target''s
              *configured* credentials to a destination the request names, or under transport settings
              the request names. Off by default: when a request moves the destination (`host=`, `port=`,
              `address=`), reroutes it through a proxy of its own (`proxy=`, `no-proxy=`) or changes how
              the connection is protected (`verify=`, `insecure=`, `ca=`, `security=`, `tls-version=`,
              the certificate and cipher keys) and the password or token going with it is the one configured
              here, the call is refused, since otherwise anyone able to run the module''s commands could
              direct the configured credentials to a host of their choosing, or strip the check that the
              host answering is the configured one. This setting is only consulted in that case: a target
              with no credentials, a request that supplies its own password/token, and a request that
              changes none of those are all unaffected. To reach another server with its own credentials,
              prefer configuring it as a separate target and selecting it with `target=`.'
            sample: true
            title: ALLOW HOST OVERRIDE
          host:
            advanced: true
            default_value: ''
            description: The target server to report results to.
            sample: true
            title: TARGET HOST
          interval:
            advanced: false
            default_value: ''
            description: The interval (in seconds) reported to collectd for metrics sent to this target.
              Overrides the client-level interval; should match the core 'metrics interval'.
            sample: true
            title: METRICS INTERVAL
          multicast interface:
            advanced: false
            default_value: auto
            description: Which local interface a multicast target's metrics leave through. A target with
              no address is sent to collectd's default multicast group (239.192.74.66), so this decides
              how far those metrics travel. 'auto' (the default) sends one copy through the interface
              the routing table picks; 'all' sends a copy through every local interface of the target's
              address family, which puts the metrics on every attached segment; a comma-separated list
              of local IP addresses sends one copy through each of them and nothing else. Ignored for
              unicast targets.
            sample: true
            title: MULTICAST INTERFACE
          port:
            advanced: true
            default_value: ''
            description: The target server port
            sample: true
            title: TARGET PORT
          retries:
            advanced: false
            default_value: '3'
            description: Number of times to retry sending.
            sample: true
            title: RETRIES
          timeout:
            advanced: false
            default_value: '30'
            description: Timeout (in seconds) when reading/writing packets to/from sockets.
            sample: true
            title: TIMEOUT
    /settings/collectd/client/variables:
      info:
        advanced: false
        description: Variables used to expand ${...} placeholders in metric keys. Each value is either
          `label:<name>`, which expands to every distinct value of that metric label (`label:core`, `label:nic`,
          `label:drive` - the same dimensions the OpenMetrics exposition renders, and spelled the same
          on every platform), or a regular expression matched against metric names, whose captured groups
          become the variable's values. A label includes the aggregates, so `label:core` yields `total`
          alongside `0`, `1`, ...; a template built from it that names a metric the snapshot has no value
          for is simply not sent. When empty a built-in default set is used.
        subkey: false
        title: VARIABLE DEFINITIONS
module: CollectdClient
namespace: client
platforms:
- unix
- windows
