module: CheckMSSQL
namespace: windows
platforms:
- windows
windows:
  info:
    description: 'Check Microsoft SQL Server: connectivity, databases, backups, agent jobs and custom
      queries.'
    title: CheckMSSQL
  paths:
    /settings/mssql:
      info:
        advanced: false
        description: ''
        subkey: false
        title: ''
      keys:
        connection string:
          advanced: true
          default_value: ''
          description: Raw ODBC connection string; overrides all other connection settings.
          sample: false
          title: CONNECTION STRING
        database:
          advanced: false
          default_value: ''
          description: Default database (initial catalog) to connect to.
          sample: false
          title: DATABASE
        driver:
          advanced: false
          default_value: ''
          description: ODBC driver used to connect; leave empty to auto-detect the newest installed SQL
            Server driver.
          sample: false
          title: ODBC DRIVER
        hostname:
          advanced: false
          default_value: localhost
          description: 'Default SQL Server to connect to: host, host\INSTANCE or host,port.'
          sample: false
          title: SQL SERVER
        password:
          advanced: false
          default_value: ''
          description: Password for the SQL login.
          sample: false
          title: SQL PASSWORD
        query timeout:
          advanced: true
          default_value: '30'
          description: Query timeout in seconds.
          sample: false
          title: QUERY TIMEOUT
        timeout:
          advanced: true
          default_value: '10'
          description: Connection (login) timeout in seconds.
          sample: false
          title: LOGIN TIMEOUT
        user:
          advanced: false
          default_value: ''
          description: SQL login used to authenticate; leave user and password empty to use Windows integrated
            authentication.
          sample: false
          title: SQL USER
  queries:
    check_mssql:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: ''
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${server_name}: SQL Server ${version} ${product_level} ${edition}, uptime ${uptime}s'
        empty-state: unknown
        empty-syntax: '%(status): No server information returned'
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: ${server_name}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: Edition, e.g. Express Edition (64-bit)
        name: edition
        short_description: ''
      - generic: false
        long_description: 'Patch level: RTM, SPn or CUn'
        name: product_level
        short_description: ''
      - generic: false
        long_description: Instance name (SERVERPROPERTY('ServerName'))
        name: server_name
        short_description: ''
      - generic: false
        long_description: Seconds since the server started (supports units, e.g. uptime < 1h)
        name: uptime
        short_description: ''
      - generic: false
        long_description: Product version, e.g. 16.0.1000.6
        name: version
        short_description: ''
      info:
        description: Check SQL Server connectivity and health (version, edition, uptime).
      params:
      - content_type: 2
        default_value: localhost
        is_simple: false
        long_description: 'SQL Server to connect to: host, host\INSTANCE or host,port.'
        name: server
        repeatable: false
        required: false
        short_description: 'SQL Server to connect to: host, host\INSTANCE or host,port.'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Database (initial catalog) to connect to (default: the login''s default database).'
        name: database
        repeatable: false
        required: false
        short_description: 'Database (initial catalog) to connect to (default: the login''s default database).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: SQL login to authenticate with; leave empty (together with password) to use
          Windows integrated authentication.
        name: user
        repeatable: false
        required: false
        short_description: SQL login to authenticate with; leave empty (together with password) to use
          Windows integrated authentication.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Password for the SQL login.
        name: password
        repeatable: false
        required: false
        short_description: Password for the SQL login.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'ODBC driver to use (default: newest installed SQL Server driver).'
        name: driver
        repeatable: false
        required: false
        short_description: 'ODBC driver to use (default: newest installed SQL Server driver).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Raw ODBC connection string; overrides all other connection options.
        name: connection-string
        repeatable: false
        required: false
        short_description: Raw ODBC connection string; overrides all other connection options.
      - content_type: 2
        default_value: '10'
        is_simple: false
        long_description: Connection (login) timeout in seconds.
        name: timeout
        repeatable: false
        required: false
        short_description: Connection (login) timeout in seconds.
      - content_type: 2
        default_value: '30'
        is_simple: false
        long_description: Query timeout in seconds.
        name: query-timeout
        repeatable: false
        required: false
        short_description: Query timeout in seconds.
      - content_type: 2
        default_value: 'true'
        is_simple: false
        long_description: Trust the server certificate (TrustServerCertificate=yes, modern ODBC drivers
          only).
        name: trust-cert
        repeatable: false
        required: false
        short_description: Trust the server certificate (TrustServerCertificate=yes, modern ODBC drivers
          only).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Force connection encryption on or off: yes or no (modern ODBC drivers only).'
        name: encrypt
        repeatable: false
        required: false
        short_description: 'Force connection encryption on or off: yes or no (modern ODBC drivers only).'
    check_mssql_backup:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: full_age < 0 or full_age > 7d
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${name}: last full backup ${full_age}s ago'
        empty-state: unknown
        empty-syntax: '%(status): No databases found'
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): All %(count) databases have recent backups'
        perf-config: ''
        perf-syntax: ${name}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${problem_count}/${count} databases (${problem_list})'
        warn: ''
        warning: full_age > 3d
      fields:
      - generic: false
        long_description: Seconds since the last differential backup finished, -1 = never (supports units)
        name: diff_age
        short_description: ''
      - generic: false
        long_description: Seconds since the last full backup finished, -1 = never (supports units, e.g.
          full_age > 7d)
        name: full_age
        short_description: ''
      - generic: false
        long_description: Seconds since the last log backup finished, -1 = never (supports units, e.g.
          log_age > 1h)
        name: log_age
        short_description: ''
      - generic: false
        long_description: Database name
        name: name
        short_description: ''
      - generic: false
        long_description: 'Recovery model: SIMPLE, FULL or BULK_LOGGED'
        name: recovery_model
        short_description: ''
      info:
        description: Check the age of the last full/differential/log backup per database.
      params:
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: 'Count COPY_ONLY backups when computing the ages. Excluded by default: an ad-hoc
          copy-only backup does not belong to the scheduled restore chain, so counting it would hide a
          failing backup job.'
        name: include-copy-only
        repeatable: false
        required: false
        short_description: 'Count COPY_ONLY backups when computing the ages. Excluded by default: an ad-hoc
          copy-only backup does not belong to the scheduled restore chain, so counting it would hide a
          failing backup job.'
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: Count snapshot (VSS/third-party agent) backups when computing the ages. Excluded
          by default for the same reason.
        name: include-snapshot
        repeatable: false
        required: false
        short_description: Count snapshot (VSS/third-party agent) backups when computing the ages. Excluded
          by default for the same reason.
      - content_type: 2
        default_value: localhost
        is_simple: false
        long_description: 'SQL Server to connect to: host, host\INSTANCE or host,port.'
        name: server
        repeatable: false
        required: false
        short_description: 'SQL Server to connect to: host, host\INSTANCE or host,port.'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Database (initial catalog) to connect to (default: the login''s default database).'
        name: database
        repeatable: false
        required: false
        short_description: 'Database (initial catalog) to connect to (default: the login''s default database).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: SQL login to authenticate with; leave empty (together with password) to use
          Windows integrated authentication.
        name: user
        repeatable: false
        required: false
        short_description: SQL login to authenticate with; leave empty (together with password) to use
          Windows integrated authentication.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Password for the SQL login.
        name: password
        repeatable: false
        required: false
        short_description: Password for the SQL login.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'ODBC driver to use (default: newest installed SQL Server driver).'
        name: driver
        repeatable: false
        required: false
        short_description: 'ODBC driver to use (default: newest installed SQL Server driver).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Raw ODBC connection string; overrides all other connection options.
        name: connection-string
        repeatable: false
        required: false
        short_description: Raw ODBC connection string; overrides all other connection options.
      - content_type: 2
        default_value: '10'
        is_simple: false
        long_description: Connection (login) timeout in seconds.
        name: timeout
        repeatable: false
        required: false
        short_description: Connection (login) timeout in seconds.
      - content_type: 2
        default_value: '30'
        is_simple: false
        long_description: Query timeout in seconds.
        name: query-timeout
        repeatable: false
        required: false
        short_description: Query timeout in seconds.
      - content_type: 2
        default_value: 'true'
        is_simple: false
        long_description: Trust the server certificate (TrustServerCertificate=yes, modern ODBC drivers
          only).
        name: trust-cert
        repeatable: false
        required: false
        short_description: Trust the server certificate (TrustServerCertificate=yes, modern ODBC drivers
          only).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Force connection encryption on or off: yes or no (modern ODBC drivers only).'
        name: encrypt
        repeatable: false
        required: false
        short_description: 'Force connection encryption on or off: yes or no (modern ODBC drivers only).'
    check_mssql_databases:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: state = 'SUSPECT' or state = 'EMERGENCY' or state = 'RECOVERY_PENDING'
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${name}: ${state}'
        empty-state: unknown
        empty-syntax: '%(status): No databases found'
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): All %(count) databases are ONLINE'
        perf-config: ''
        perf-syntax: ${name}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${problem_count}/${count} databases (${problem_list})'
        warn: ''
        warning: state = 'RESTORING' or state = 'RECOVERING' or state = 'OFFLINE'
      fields:
      - generic: false
        long_description: Total size of the data files in bytes (supports units, e.g. data_size > 10G)
        name: data_size
        short_description: ''
      - generic: false
        long_description: 1 if the database is read-only
        name: is_read_only
        short_description: ''
      - generic: false
        long_description: Total size of the log files in bytes (supports units, e.g. log_size > 1G)
        name: log_size
        short_description: ''
      - generic: false
        long_description: Percentage of the log in use (-1 if unavailable)
        name: log_used_pct
        short_description: ''
      - generic: false
        long_description: Database name
        name: name
        short_description: ''
      - generic: false
        long_description: 'Recovery model: SIMPLE, FULL or BULK_LOGGED'
        name: recovery_model
        short_description: ''
      - generic: false
        long_description: 'Database state: ONLINE, RESTORING, RECOVERING, RECOVERY_PENDING, SUSPECT, EMERGENCY
          or OFFLINE'
        name: state
        short_description: ''
      info:
        description: Check database state, recovery model and data/log size.
      params:
      - content_type: 2
        default_value: localhost
        is_simple: false
        long_description: 'SQL Server to connect to: host, host\INSTANCE or host,port.'
        name: server
        repeatable: false
        required: false
        short_description: 'SQL Server to connect to: host, host\INSTANCE or host,port.'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Database (initial catalog) to connect to (default: the login''s default database).'
        name: database
        repeatable: false
        required: false
        short_description: 'Database (initial catalog) to connect to (default: the login''s default database).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: SQL login to authenticate with; leave empty (together with password) to use
          Windows integrated authentication.
        name: user
        repeatable: false
        required: false
        short_description: SQL login to authenticate with; leave empty (together with password) to use
          Windows integrated authentication.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Password for the SQL login.
        name: password
        repeatable: false
        required: false
        short_description: Password for the SQL login.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'ODBC driver to use (default: newest installed SQL Server driver).'
        name: driver
        repeatable: false
        required: false
        short_description: 'ODBC driver to use (default: newest installed SQL Server driver).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Raw ODBC connection string; overrides all other connection options.
        name: connection-string
        repeatable: false
        required: false
        short_description: Raw ODBC connection string; overrides all other connection options.
      - content_type: 2
        default_value: '10'
        is_simple: false
        long_description: Connection (login) timeout in seconds.
        name: timeout
        repeatable: false
        required: false
        short_description: Connection (login) timeout in seconds.
      - content_type: 2
        default_value: '30'
        is_simple: false
        long_description: Query timeout in seconds.
        name: query-timeout
        repeatable: false
        required: false
        short_description: Query timeout in seconds.
      - content_type: 2
        default_value: 'true'
        is_simple: false
        long_description: Trust the server certificate (TrustServerCertificate=yes, modern ODBC drivers
          only).
        name: trust-cert
        repeatable: false
        required: false
        short_description: Trust the server certificate (TrustServerCertificate=yes, modern ODBC drivers
          only).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Force connection encryption on or off: yes or no (modern ODBC drivers only).'
        name: encrypt
        repeatable: false
        required: false
        short_description: 'Force connection encryption on or off: yes or no (modern ODBC drivers only).'
    check_mssql_jobs:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: last_run_status = 'failed'
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${name}: ${last_run_status}'
        empty-state: ok
        empty-syntax: '%(status): No enabled SQL Agent jobs found'
        escape-html: 'false'
        filter: enabled = 1
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): All %(count) jobs succeeded'
        perf-config: ''
        perf-syntax: ${name}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${problem_count}/${count} jobs (${problem_list})'
        warn: ''
        warning: last_run_status = 'canceled' or last_run_status = 'retry'
      fields:
      - generic: false
        long_description: 1 if the job is enabled
        name: enabled
        short_description: ''
      - generic: false
        long_description: 1 if the job is executing right now
        name: is_running
        short_description: ''
      - generic: false
        long_description: Seconds since the last run finished, -1 = never ran (supports units, e.g. last_run_age
          > 25h)
        name: last_run_age
        short_description: ''
      - generic: false
        long_description: Raw msdb run_status code of the last completed run (-1 = never ran)
        name: last_run_outcome
        short_description: ''
      - generic: false
        long_description: 'Outcome of the last completed run: failed, succeeded, retry, canceled or never'
        name: last_run_status
        short_description: ''
      - generic: false
        long_description: Job name
        name: name
        short_description: ''
      info:
        description: Check SQL Server Agent job status.
      params:
      - content_type: 2
        default_value: localhost
        is_simple: false
        long_description: 'SQL Server to connect to: host, host\INSTANCE or host,port.'
        name: server
        repeatable: false
        required: false
        short_description: 'SQL Server to connect to: host, host\INSTANCE or host,port.'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Database (initial catalog) to connect to (default: the login''s default database).'
        name: database
        repeatable: false
        required: false
        short_description: 'Database (initial catalog) to connect to (default: the login''s default database).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: SQL login to authenticate with; leave empty (together with password) to use
          Windows integrated authentication.
        name: user
        repeatable: false
        required: false
        short_description: SQL login to authenticate with; leave empty (together with password) to use
          Windows integrated authentication.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Password for the SQL login.
        name: password
        repeatable: false
        required: false
        short_description: Password for the SQL login.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'ODBC driver to use (default: newest installed SQL Server driver).'
        name: driver
        repeatable: false
        required: false
        short_description: 'ODBC driver to use (default: newest installed SQL Server driver).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Raw ODBC connection string; overrides all other connection options.
        name: connection-string
        repeatable: false
        required: false
        short_description: Raw ODBC connection string; overrides all other connection options.
      - content_type: 2
        default_value: '10'
        is_simple: false
        long_description: Connection (login) timeout in seconds.
        name: timeout
        repeatable: false
        required: false
        short_description: Connection (login) timeout in seconds.
      - content_type: 2
        default_value: '30'
        is_simple: false
        long_description: Query timeout in seconds.
        name: query-timeout
        repeatable: false
        required: false
        short_description: Query timeout in seconds.
      - content_type: 2
        default_value: 'true'
        is_simple: false
        long_description: Trust the server certificate (TrustServerCertificate=yes, modern ODBC drivers
          only).
        name: trust-cert
        repeatable: false
        required: false
        short_description: Trust the server certificate (TrustServerCertificate=yes, modern ODBC drivers
          only).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Force connection encryption on or off: yes or no (modern ODBC drivers only).'
        name: encrypt
        repeatable: false
        required: false
        short_description: 'Force connection encryption on or off: yes or no (modern ODBC drivers only).'
    check_mssql_query:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: ''
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '%(line)'
        empty-state: ignored
        empty-syntax: ''
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: ''
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: ${list}
        warn: ''
        warning: ''
      info:
        description: Run a custom T-SQL query and apply thresholds to the returned rows.
      params:
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The T-SQL query to execute.
        name: query
        repeatable: false
        required: false
        short_description: The T-SQL query to execute.
      - content_type: 2
        default_value: localhost
        is_simple: false
        long_description: 'SQL Server to connect to: host, host\INSTANCE or host,port.'
        name: server
        repeatable: false
        required: false
        short_description: 'SQL Server to connect to: host, host\INSTANCE or host,port.'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Database (initial catalog) to connect to (default: the login''s default database).'
        name: database
        repeatable: false
        required: false
        short_description: 'Database (initial catalog) to connect to (default: the login''s default database).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: SQL login to authenticate with; leave empty (together with password) to use
          Windows integrated authentication.
        name: user
        repeatable: false
        required: false
        short_description: SQL login to authenticate with; leave empty (together with password) to use
