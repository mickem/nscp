module: CheckMSSQL
namespace: windows
platforms:
- windows
windows:
  info:
    description: 'Check Microsoft SQL Server: connectivity, databases, backups, agent jobs and custom
      queries.'
    title: CheckMSSQL
  paths:
    /settings/mssql:
      info:
        advanced: false
        description: ''
        subkey: false
        title: ''
      keys:
        connection string:
          advanced: true
          default_value: ''
          description: Raw ODBC connection string; overrides all other connection settings.
          sample: false
          title: CONNECTION STRING
        database:
          advanced: false
          default_value: ''
          description: Default database (initial catalog) to connect to.
          sample: false
          title: DATABASE
        driver:
          advanced: false
          default_value: ''
          description: ODBC driver used to connect; leave empty to auto-detect the newest installed SQL
            Server driver.
          sample: false
          title: ODBC DRIVER
        hostname:
          advanced: false
          default_value: localhost
          description: 'Default SQL Server to connect to: host, host\INSTANCE or host,port.'
          sample: false
          title: SQL SERVER
        password:
          advanced: false
          default_value: ''
          description: Password for the SQL login.
          sample: false
          title: SQL PASSWORD
        query timeout:
          advanced: true
          default_value: '30'
          description: Query timeout in seconds.
          sample: false
          title: QUERY TIMEOUT
        timeout:
          advanced: true
          default_value: '10'
          description: Connection (login) timeout in seconds.
          sample: false
          title: LOGIN TIMEOUT
        user:
          advanced: false
          default_value: ''
          description: SQL login used to authenticate; leave user and password empty to use Windows integrated
            authentication.
          sample: false
          title: SQL USER
  queries:
    check_mssql:
      fields:
      - generic: true
        long_description: Number of items matching the filter. Common option for all checks.
        name: count
        short_description: ''
      - generic: true
        long_description: Number of items matched the critical criteria. Common option for all checks.
        name: crit_count
        short_description: ''
      - generic: true
        long_description: A list of all items which matched the critical criteria. Common option for all
          checks.
        name: crit_list
        short_description: ''
      - generic: true
        long_description: A special list with critical, then warning and finally ok. Common option for
          all checks.
        name: detail_list
        short_description: ''
      - generic: false
        long_description: Edition, e.g. Express Edition (64-bit)
        name: edition
        short_description: ''
      - generic: true
        long_description: A list of all items which matched the filter. Common option for all checks.
        name: list
        short_description: ''
      - generic: true
        long_description: Number of items matched the ok criteria. Common option for all checks.
        name: ok_count
        short_description: ''
      - generic: true
        long_description: A list of all items which matched the ok criteria. Common option for all checks.
        name: ok_list
        short_description: ''
      - generic: true
        long_description: Number of items matched either warning or critical criteria. Common option for
          all checks.
        name: problem_count
        short_description: ''
      - generic: true
        long_description: A list of all items which matched either the critical or the warning criteria.
          Common option for all checks.
        name: problem_list
        short_description: ''
      - generic: false
        long_description: 'Product level: RTM, SPn or CUn'
        name: product_level
        short_description: ''
      - generic: true
        long_description: 'The decoded list-separator, for use in the top-syntax: templates are never
          escape-decoded (a literal C:\temp must stay a literal C:\temp), so reference %(sep) to break
          the line before the first list item, e.g. top-syntax=%(status): %(count) items:%(sep)%(list).
          Common option for all checks.'
        name: sep
        short_description: ''
      - generic: false
        long_description: Instance name (SERVERPROPERTY('ServerName'))
        name: server_name
        short_description: ''
      - generic: true
        long_description: The returned status (OK/WARN/CRIT/UNKNOWN). Common option for all checks.
        name: status
        short_description: ''
      - generic: true
        long_description: Total number of items. Common option for all checks.
        name: total
        short_description: ''
      - generic: false
        long_description: Seconds since the server started (supports units, e.g. uptime < 1h)
        name: uptime
        short_description: ''
      - generic: false
        long_description: Product version, e.g. 16.0.1000.6
        name: version
        short_description: ''
      - generic: true
        long_description: Number of items matched the warning criteria. Common option for all checks.
        name: warn_count
        short_description: ''
      - generic: true
        long_description: A list of all items which matched the warning criteria. Common option for all
          checks.
        name: warn_list
        short_description: ''
      info:
        description: Check SQL Server connectivity and health (version, edition, uptime).
      params:
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Filter which marks interesting items.

          Interesting items are items which will be included in the check.

          They do not denote warning or critical state instead it defines which items are relevant and
          you can remove unwanted items.'
        name: filter
        repeatable: false
        required: false
        short_description: Filter which marks interesting items.
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Filter which marks items which generates a warning state.

          If anything matches this filter the return status will be escalated to warning.

          '
        name: warning
        repeatable: false
        required: false
        short_description: Filter which marks items which generates a warning state.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Short alias for warning
        name: warn
        repeatable: false
        required: false
        short_description: Short alias for warning
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Filter which marks items which generates a critical state.

          If anything matches this filter the return status will be escalated to critical.

          '
        name: critical
        repeatable: false
        required: false
        short_description: Filter which marks items which generates a critical state.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Short alias for critical.
        name: crit
        repeatable: false
        required: false
        short_description: Short alias for critical.
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Filter which marks items which generates an ok state.

          If anything matches this any previous state for this item will be reset to ok.'
        name: ok
        repeatable: false
        required: false
        short_description: Filter which marks items which generates an ok state.
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: Show debugging information in the log
        name: debug
        repeatable: false
        required: false
        short_description: Show debugging information in the log
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: Show details for all matches regardless of status (normally details are only
          showed for warnings and criticals).
        name: show-all
        repeatable: false
        required: false
        short_description: Show details for all matches regardless of status (normally details are only
          showed for warnings and criticals).
      - content_type: 2
        default_value: unknown
        is_simple: false
        long_description: 'Return status to use when nothing matched filter.

          If no filter is specified this will never happen unless the file is empty.'
        name: empty-state
        repeatable: false
        required: false
        short_description: Return status to use when nothing matched filter.
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Performance data generation configuration

          TODO: obj ( key: value; key: value) obj (key:valuer;key:value)'
        name: perf-config
        repeatable: false
        required: false
        short_description: Performance data generation configuration
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: Escape any < and > characters to prevent HTML encoding
        name: escape-html
        repeatable: false
        required: false
        short_description: Escape any < and > characters to prevent HTML encoding
      - content_type: 2
        default_value: ', '
        is_simple: false
        long_description: 'String used to separate the items of %(list), %(ok_list), %(warn_list), %(crit_list),
          %(problem_list) and %(detail_list).

          Accepts the escapes \n, \r, \t and \\ (a configuration file value is a single line, so a real
          newline cannot be written).

          Set to \n to render one item per line, which most Nagios compatible frontends show as long output
          below the summary line.

          The top-syntax decides what precedes the first item; templates are never escape-decoded, so
          reference the decoded separator as %(sep) to break before it too: --top-syntax "%(status): %(count)
          items:%(sep)%(list)".'
        name: list-separator
        repeatable: false
        required: false
        short_description: String used to separate the items of %(list), %(ok_list), %(warn_list), %(crit_list),
          %(problem_list) and %(detail_list).
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: Show help screen (this screen)
        name: help
        repeatable: false
        required: false
        short_description: Show help screen (this screen)
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: Show help screen as a protocol buffer payload
        name: help-pb
        repeatable: false
        required: false
        short_description: Show help screen as a protocol buffer payload
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: Show default values for a given command
        name: show-default
        repeatable: false
        required: false
        short_description: Show default values for a given command
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: Show help screen (short format).
        name: help-short
        repeatable: false
        required: false
        short_description: Show help screen (short format).
      - content_type: 2
        default_value: '${status}: ${list}'
        is_simple: false
        long_description: 'Top level syntax.

          Used to format the message to return can include text as well as special keywords which will
          include information from the checks.

          To add a keyword to the message you can use two syntaxes either ${keyword} or %(keyword) (there
          is no difference between them apart from ${} can be difficult to escape on linux).'
        name: top-syntax
        repeatable: false
        required: false
        short_description: Top level syntax.
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'ok syntax.

          DEPRECATED! This is the syntax for when an ok result is returned.

          This value will not be used if your syntax contains %(list) or %(count).'
        name: ok-syntax
        repeatable: false
        required: false
        short_description: ok syntax.
      - content_type: 2
        default_value: '%(status): No server information returned'
        is_simple: false
        long_description: 'Empty syntax.

          DEPRECATED! This is the syntax for when nothing matches the filter.'
        name: empty-syntax
        repeatable: false
        required: false
        short_description: Empty syntax.
      - content_type: 2
        default_value: '${server_name}: SQL Server ${version} ${product_level} ${edition}, uptime ${uptime}s'
        is_simple: false
        long_description: 'Detail level syntax.

          Used to format each resulting item in the message.

          %(list) will be replaced with all the items formatted by this syntax string in the top-syntax.

          To add a keyword to the message you can use two syntaxes either ${keyword} or %(keyword) (there
          is no difference between them apart from ${} can be difficult to escape on linux).'
        name: detail-syntax
        repeatable: false
        required: false
        short_description: Detail level syntax.
      - content_type: 2
        default_value: ${server_name}
        is_simple: false
        long_description: 'Performance alias syntax.

          This is the syntax for the base names of the performance data.'
        name: perf-syntax
        repeatable: false
        required: false
        short_description: Performance alias syntax.
      - content_type: 2
        default_value: localhost
        is_simple: false
        long_description: 'SQL Server to connect to: host, host\INSTANCE or host,port.'
        name: server
        repeatable: false
        required: false
        short_description: 'SQL Server to connect to: host, host\INSTANCE or host,port.'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Database (initial catalog) to connect to (default: the login''s default database).'
        name: database
        repeatable: false
        required: false
        short_description: 'Database (initial catalog) to connect to (default: the login''s default database).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: SQL login to authenticate with; leave empty (together with password) to use
          Windows integrated authentication.
        name: user
        repeatable: false
        required: false
        short_description: SQL login to authenticate with; leave empty (together with password) to use
          Windows integrated authentication.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Password for the SQL login.
        name: password
        repeatable: false
        required: false
        short_description: Password for the SQL login.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'ODBC driver to use (default: newest installed SQL Server driver).'
        name: driver
        repeatable: false
        required: false
        short_description: 'ODBC driver to use (default: newest installed SQL Server driver).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Raw ODBC connection string; overrides all other connection options.
        name: connection-string
        repeatable: false
        required: false
        short_description: Raw ODBC connection string; overrides all other connection options.
      - content_type: 2
        default_value: '10'
        is_simple: false
        long_description: Connection (login) timeout in seconds.
        name: timeout
        repeatable: false
        required: false
        short_description: Connection (login) timeout in seconds.
      - content_type: 2
        default_value: '30'
        is_simple: false
        long_description: Query timeout in seconds.
        name: query-timeout
        repeatable: false
        required: false
        short_description: Query timeout in seconds.
      - content_type: 2
        default_value: 'true'
        is_simple: false
        long_description: Trust the server certificate (TrustServerCertificate=yes, modern ODBC drivers
          only).
        name: trust-cert
        repeatable: false
        required: false
        short_description: Trust the server certificate (TrustServerCertificate=yes, modern ODBC drivers
          only).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Force connection encryption on or off: yes or no (modern ODBC drivers only).'
        name: encrypt
        repeatable: false
        required: false
        short_description: 'Force connection encryption on or off: yes or no (modern ODBC drivers only).'
    check_mssql_backup:
      fields:
      - generic: true
        long_description: Number of items matching the filter. Common option for all checks.
        name: count
        short_description: ''
      - generic: true
        long_description: Number of items matched the critical criteria. Common option for all checks.
        name: crit_count
        short_description: ''
      - generic: true
        long_description: A list of all items which matched the critical criteria. Common option for all
          checks.
        name: crit_list
        short_description: ''
      - generic: true
        long_description: A special list with critical, then warning and finally ok. Common option for
          all checks.
        name: detail_list
        short_description: ''
      - generic: false
        long_description: Seconds since the last differential backup, -1 = never (supports units)
        name: diff_age
        short_description: ''
      - generic: false
        long_description: Seconds since the last full backup, -1 = never (supports units, e.g. full_age
          > 7d)
        name: full_age
        short_description: ''
      - generic: true
        long_description: A list of all items which matched the filter. Common option for all checks.
        name: list
        short_description: ''
      - generic: false
        long_description: Seconds since the last log backup, -1 = never (supports units, e.g. log_age
          > 1h)
        name: log_age
        short_description: ''
      - generic: false
        long_description: Database name
        name: name
        short_description: ''
      - generic: true
        long_description: Number of items matched the ok criteria. Common option for all checks.
        name: ok_count
        short_description: ''
      - generic: true
        long_description: A list of all items which matched the ok criteria. Common option for all checks.
        name: ok_list
        short_description: ''
      - generic: true
        long_description: Number of items matched either warning or critical criteria. Common option for
          all checks.
        name: problem_count
        short_description: ''
      - generic: true
        long_description: A list of all items which matched either the critical or the warning criteria.
          Common option for all checks.
        name: problem_list
        short_description: ''
      - generic: false
        long_description: 'Recovery model: SIMPLE, FULL or BULK_LOGGED'
        name: recovery_model
        short_description: ''
      - generic: true
        long_description: 'The decoded list-separator, for use in the top-syntax: templates are never
          escape-decoded (a literal C:\temp must stay a literal C:\temp), so reference %(sep) to break
          the line before the first list item, e.g. top-syntax=%(status): %(count) items:%(sep)%(list).
          Common option for all checks.'
        name: sep
        short_description: ''
      - generic: true
        long_description: The returned status (OK/WARN/CRIT/UNKNOWN). Common option for all checks.
        name: status
        short_description: ''
      - generic: true
        long_description: Total number of items. Common option for all checks.
        name: total
        short_description: ''
      - generic: true
        long_description: Number of items matched the warning criteria. Common option for all checks.
        name: warn_count
        short_description: ''
      - generic: true
        long_description: A list of all items which matched the warning criteria. Common option for all
          checks.
        name: warn_list
        short_description: ''
      info:
        description: Check the age of the last full/differential/log backup per database.
      params:
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Filter which marks interesting items.

          Interesting items are items which will be included in the check.

          They do not denote warning or critical state instead it defines which items are relevant and
          you can remove unwanted items.'
        name: filter
        repeatable: false
        required: false
        short_description: Filter which marks interesting items.
      - content_type: 2
        default_value: full_age > 3d
        is_simple: false
        long_description: 'Filter which marks items which generates a warning state.

          If anything matches this filter the return status will be escalated to warning.

          '
        name: warning
        repeatable: false
        required: false
        short_description: Filter which marks items which generates a warning state.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Short alias for warning
        name: warn
        repeatable: false
        required: false
        short_description: Short alias for warning
      - content_type: 2
        default_value: full_age < 0 or full_age > 7d
        is_simple: false
        long_description: 'Filter which marks items which generates a critical state.

          If anything matches this filter the return status will be escalated to critical.

          '
        name: critical
        repeatable: false
        required: false
        short_description: Filter which marks items which generates a critical state.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Short alias for critical.
        name: crit
        repeatable: false
        required: false
        short_description: Short alias for critical.
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Filter which marks items which generates an ok state.

          If anything matches this any previous state for this item will be reset to ok.'
        name: ok
        repeatable: false
        required: false
        short_description: Filter which marks items which generates an ok state.
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: Show debugging information in the log
        name: debug
        repeatable: false
        required: false
        short_description: Show debugging information in the log
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: Show details for all matches regardless of status (normally details are only
          showed for warnings and criticals).
        name: show-all
        repeatable: false
        required: false
        short_description: Show details for all matches regardless of status (normally details are only
          showed for warnings and criticals).
      - content_type: 2
        default_value: unknown
        is_simple: false
        long_description: 'Return status to use when nothing matched filter.

          If no filter is specified this will never happen unless the file is empty.'
        name: empty-state
        repeatable: false
        required: false
        short_description: Return status to use when nothing matched filter.
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Performance data generation configuration

          TODO: obj ( key: value; key: value) obj (key:valuer;key:value)'
        name: perf-config
        repeatable: false
        required: false
        short_description: Performance data generation configuration
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: Escape any < and > characters to prevent HTML encoding
        name: escape-html
        repeatable: false
        required: false
        short_description: Escape any < and > characters to prevent HTML encoding
      - content_type: 2
        default_value: ', '
        is_simple: false
        long_description: 'String used to separate the items of %(list), %(ok_list), %(warn_list), %(crit_list),
          %(problem_list) and %(detail_list).

          Accepts the escapes \n, \r, \t and \\ (a configuration file value is a single line, so a real
          newline cannot be written).

          Set to \n to render one item per line, which most Nagios compatible frontends show as long output
          below the summary line.

          The top-syntax decides what precedes the first item; templates are never escape-decoded, so
          reference the decoded separator as %(sep) to break before it too: --top-syntax "%(status): %(count)
          items:%(sep)%(list)".'
        name: list-separator
        repeatable: false
        required: false
        short_description: String used to separate the items of %(list), %(ok_list), %(warn_list), %(crit_list),
          %(problem_list) and %(detail_list).
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: Show help screen (this screen)
        name: help
        repeatable: false
        required: false
        short_description: Show help screen (this screen)
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: Show help screen as a protocol buffer payload
        name: help-pb
        repeatable: false
        required: false
        short_description: Show help screen as a protocol buffer payload
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: Show default values for a given command
        name: show-default
        repeatable: false
        required: false
        short_description: Show default values for a given command
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: Show help screen (short format).
        name: help-short
        repeatable: false
        required: false
        short_description: Show help screen (short format).
      - content_type: 2
        default_value: '${status}: ${problem_count}/${count} databases (${problem_list})'
        is_simple: false
        long_description: 'Top level syntax.

          Used to format the message to return can include text as well as special keywords which will
          include information from the checks.

          To add a keyword to the message you can use two syntaxes either ${keyword} or %(keyword) (there
          is no difference between them apart from ${} can be difficult to escape on linux).'
        name: top-syntax
        repeatable: false
        required: false
        short_description: Top level syntax.
      - content_type: 2
        default_value: '%(status): All %(count) databases have recent backups'
        is_simple: false
        long_description: 'ok syntax.

          DEPRECATED! This is the syntax for when an ok result is returned.

          This value will not be used if your syntax contains %(list) or %(count).'
        name: ok-syntax
        repeatable: false
        required: false
        short_description: ok syntax.
      - content_type: 2
        default_value: '%(status): No databases found'
        is_simple: false
        long_description: 'Empty syntax.

          DEPRECATED! This is the syntax for when nothing matches the filter.'
        name: empty-syntax
        repeatable: false
        required: false
        short_description: Empty syntax.
      - content_type: 2
        default_value: '${name}: last full backup ${full_age}s ago'
        is_simple: false
        long_description: 'Detail level syntax.

          Used to format each resulting item in the message.

          %(list) will be replaced with all the items formatted by this syntax string in the top-syntax.

          To add a keyword to the message you can use two syntaxes either ${keyword} or %(keyword) (there
          is no difference between them apart from ${} can be difficult to escape on linux).'
        name: detail-syntax
        repeatable: false
        required: false
        short_description: Detail level syntax.
      - content_type: 2
        default_value: ${name}
        is_simple: false
        long_description: 'Performance alias syntax.

          This is the syntax for the base names of the performance data.'
        name: perf-syntax
        repeatable: false
        required: false
        short_description: Performance alias syntax.
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: 'Count COPY_ONLY backups when computing the ages. Excluded by default: an ad-hoc
          copy-only backup does not belong to the scheduled restore chain, so counting it would hide a
          failing backup job.'
        name: include-copy-only
        repeatable: false
        required: false
        short_description: 'Count COPY_ONLY backups when computing the ages. Excluded by default: an ad-hoc
          copy-only backup does not belong to the scheduled restore chain, so counting it would hide a
          failing backup job.'
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: Count snapshot (VSS/third-party agent) backups when computing the ages. Excluded
          by default for the same reason.
        name: include-snapshot
        repeatable: false
