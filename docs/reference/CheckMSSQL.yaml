        short_description: Raw ODBC connection string; overrides all other connection options.
      - content_type: 2
        default_value: '10'
        is_simple: false
        long_description: Connection (login) timeout in seconds.
        name: timeout
        repeatable: false
        required: false
        short_description: Connection (login) timeout in seconds.
      - content_type: 2
        default_value: '30'
