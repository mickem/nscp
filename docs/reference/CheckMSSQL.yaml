module: CheckMSSQL
namespace: windows
platforms:
- windows
windows:
  info:
    description: 'Check Microsoft SQL Server: connectivity, databases, backups, agent jobs and custom
      queries.'
    experimental: true
    title: CheckMSSQL
  paths:
    /settings/mssql:
      info:
        advanced: false
        description: ''
        subkey: false
        title: ''
      keys:
        connection string:
          advanced: true
          default_value: ''
          description: Raw ODBC connection string; overrides all other connection settings.
          sample: false
          title: CONNECTION STRING
        database:
          advanced: false
          default_value: ''
          description: Default database (initial catalog) to connect to.
          sample: false
          title: DATABASE
        driver:
          advanced: false
          default_value: ''
          description: ODBC driver used to connect; leave empty to auto-detect the newest installed SQL
            Server driver.
          sample: false
          title: ODBC DRIVER
        hostname:
          advanced: false
          default_value: localhost
          description: 'Default SQL Server to connect to: host, host\INSTANCE or host,port.'
          sample: false
          title: SQL SERVER
        password:
          advanced: false
          default_value: ''
          description: Password for the SQL login.
          sample: false
          title: SQL PASSWORD
        query timeout:
          advanced: true
          default_value: '30'
          description: Query timeout in seconds.
          sample: false
          title: QUERY TIMEOUT
        timeout:
          advanced: true
          default_value: '10'
          description: Connection (login) timeout in seconds.
          sample: false
          title: LOGIN TIMEOUT
        user:
          advanced: false
          default_value: ''
          description: SQL login used to authenticate; leave user and password empty to use Windows integrated
            authentication.
          sample: false
          title: SQL USER
    /settings/mssql/facts:
      info:
        advanced: false
        description: ''
        subkey: false
        title: ''
      keys:
        mssql:
          advanced: false
          default_value: 'false'
          description: 'Collect the server record of the `mssql` fact set: the instance name (the same
            value check_mssql calls `server_name`), the machine and instance it is, the version, patch
            level, update level and edition, the engine edition, the server collation, the authentication
            mode and whether it is clustered or has Always On enabled. Not its uptime: that is monitoring,
            and it lives in check_mssql. One connection and one SERVERPROPERTY query per facts round,
            made with the connection configured in this section''s parent (Windows authentication, or
            the user and password): a facts round has no request to take them from. Nothing is collected
            while this is off.'
          sample: false
          title: MSSQL SERVER FACTS
        mssql.databases:
          advanced: false
          default_value: 'false'
          description: 'Collect the `mssql.databases` fact set: one record per database the login may
            see, system databases included - its name (the record id, the same value check_mssql_databases
            calls `name`), its recovery model, collation, compatibility level, creation date and whether
            it is read-only. Not its state or size: those are monitoring, and they live in check_mssql_databases.
            One query of sys.databases per facts round, over the same connection as the server record.
            Nothing is collected while this is off.'
          sample: false
          title: MSSQL DATABASES FACTS
  queries:
    check_mssql:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: ''
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${server_name}: SQL Server ${version} ${product_level} ${edition}, uptime ${uptime}s'
        empty-state: unknown
        empty-syntax: '%(status): No server information returned'
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: ''
        perf-config: ''
        perf-syntax: ${server_name}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${list}'
        warn: ''
        warning: ''
      fields:
      - generic: false
        long_description: Edition, e.g. Express Edition (64-bit)
        name: edition
        short_description: ''
      - generic: false
        long_description: 'Patch level: RTM, SPn or CUn'
        name: product_level
        short_description: ''
      - generic: false
        long_description: Instance name (SERVERPROPERTY('ServerName'))
        name: server_name
        short_description: ''
      - generic: false
        long_description: Seconds since the server started (supports units, e.g. uptime < 1h)
        name: uptime
        short_description: ''
      - generic: false
        long_description: Product version, e.g. 16.0.1000.6
        name: version
        short_description: ''
      info:
        description: Check SQL Server connectivity and health (version, edition, uptime).
        experimental: true
      params:
      - content_type: 2
        default_value: localhost
        is_simple: false
        long_description: 'SQL Server to connect to: host, host\INSTANCE or host,port.'
        name: server
        repeatable: false
        required: false
        short_description: 'SQL Server to connect to: host, host\INSTANCE or host,port.'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Database (initial catalog) to connect to (default: the login''s default database).'
        name: database
        repeatable: false
        required: false
        short_description: 'Database (initial catalog) to connect to (default: the login''s default database).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: SQL login to authenticate with; leave empty (together with password) to use
          Windows integrated authentication.
        name: user
        repeatable: false
        required: false
        short_description: SQL login to authenticate with; leave empty (together with password) to use
          Windows integrated authentication.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Password for the SQL login.
        name: password
        repeatable: false
        required: false
        short_description: Password for the SQL login.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'ODBC driver to use (default: newest installed SQL Server driver).'
        name: driver
        repeatable: false
        required: false
        short_description: 'ODBC driver to use (default: newest installed SQL Server driver).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Raw ODBC connection string; overrides all other connection options.
        name: connection-string
        repeatable: false
        required: false
        short_description: Raw ODBC connection string; overrides all other connection options.
      - content_type: 2
        default_value: '10'
        is_simple: false
        long_description: Connection (login) timeout in seconds.
        name: timeout
        repeatable: false
        required: false
        short_description: Connection (login) timeout in seconds.
      - content_type: 2
        default_value: '30'
        is_simple: false
        long_description: Query timeout in seconds.
        name: query-timeout
        repeatable: false
        required: false
        short_description: Query timeout in seconds.
      - content_type: 4
        default_value: 'true'
        is_simple: false
        long_description: Trust the server certificate (TrustServerCertificate=yes, modern ODBC drivers
          only).
        name: trust-cert
        repeatable: false
        required: false
        short_description: Trust the server certificate (TrustServerCertificate=yes, modern ODBC drivers
          only).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Force connection encryption on or off: yes or no (modern ODBC drivers only).'
        name: encrypt
        repeatable: false
        required: false
        short_description: 'Force connection encryption on or off: yes or no (modern ODBC drivers only).'
    check_mssql_availability_groups:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: health = 'NOT_HEALTHY' or connected_state = 'DISCONNECTED' or is_suspended = 1 or role
          = 'RESOLVING'
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${name}: ${health}'
        empty-state: ok
        empty-syntax: '%(status): No availability groups found'
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): All %(count) availability replicas/databases are healthy'
        perf-config: ''
        perf-syntax: ${name}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${problem_count}/${count} availability replicas/databases (${problem_list})'
        warn: ''
        warning: health = 'PARTIALLY_HEALTHY'
      fields:
      - generic: false
        long_description: CONNECTED or DISCONNECTED
        name: connected_state
        short_description: ''
      - generic: false
        long_description: Availability database name (empty for replica-level rows)
        name: database
        short_description: ''
      - generic: false
        long_description: Database synchronization health (empty for replica-level rows)
        name: db_health
        short_description: ''
      - generic: false
        long_description: Availability group name
        name: group
        short_description: ''
      - generic: false
        long_description: 'Effective health: database health for database rows, replica health otherwise'
        name: health
        short_description: ''
      - generic: false
        long_description: 1 if this replica is the instance being checked
        name: is_local
        short_description: ''
      - generic: false
        long_description: 1 if data movement for the database is suspended
        name: is_suspended
        short_description: ''
      - generic: false
        long_description: Log not yet sent to the secondary in bytes, i.e. potential data loss/RPO lag
          (supports units, e.g. log_send_queue > 100M)
        name: log_send_queue
        short_description: ''
      - generic: false
        long_description: group/replica or group/replica/database
        name: name
        short_description: ''
      - generic: false
        long_description: 'Redo queue on the secondary in bytes: log received but not yet applied, i.e.
          failover/RTO lag (supports units, e.g. redo_queue > 500M)'
        name: redo_queue
        short_description: ''
      - generic: false
        long_description: Replica server name
        name: replica
        short_description: ''
      - generic: false
        long_description: 'Replica synchronization health: HEALTHY, PARTIALLY_HEALTHY or NOT_HEALTHY'
        name: replica_health
        short_description: ''
      - generic: false
        long_description: 'Replica role: PRIMARY, SECONDARY or RESOLVING (no primary, e.g. during failover)'
        name: role
        short_description: ''
      - generic: false
        long_description: Database synchronization state, e.g. SYNCHRONIZED or SYNCHRONIZING
        name: sync_state
        short_description: ''
      info:
        description: Check Always On availability group replica and database health.
        experimental: true
      params:
      - content_type: 2
        default_value: localhost
        is_simple: false
        long_description: 'SQL Server to connect to: host, host\INSTANCE or host,port.'
        name: server
        repeatable: false
        required: false
        short_description: 'SQL Server to connect to: host, host\INSTANCE or host,port.'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Database (initial catalog) to connect to (default: the login''s default database).'
        name: database
        repeatable: false
        required: false
        short_description: 'Database (initial catalog) to connect to (default: the login''s default database).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: SQL login to authenticate with; leave empty (together with password) to use
          Windows integrated authentication.
        name: user
        repeatable: false
        required: false
        short_description: SQL login to authenticate with; leave empty (together with password) to use
          Windows integrated authentication.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Password for the SQL login.
        name: password
        repeatable: false
        required: false
        short_description: Password for the SQL login.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'ODBC driver to use (default: newest installed SQL Server driver).'
        name: driver
        repeatable: false
        required: false
        short_description: 'ODBC driver to use (default: newest installed SQL Server driver).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Raw ODBC connection string; overrides all other connection options.
        name: connection-string
        repeatable: false
        required: false
        short_description: Raw ODBC connection string; overrides all other connection options.
      - content_type: 2
        default_value: '10'
        is_simple: false
        long_description: Connection (login) timeout in seconds.
        name: timeout
        repeatable: false
        required: false
        short_description: Connection (login) timeout in seconds.
      - content_type: 2
        default_value: '30'
        is_simple: false
        long_description: Query timeout in seconds.
        name: query-timeout
        repeatable: false
        required: false
        short_description: Query timeout in seconds.
      - content_type: 4
        default_value: 'true'
        is_simple: false
        long_description: Trust the server certificate (TrustServerCertificate=yes, modern ODBC drivers
          only).
        name: trust-cert
        repeatable: false
        required: false
        short_description: Trust the server certificate (TrustServerCertificate=yes, modern ODBC drivers
          only).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Force connection encryption on or off: yes or no (modern ODBC drivers only).'
        name: encrypt
        repeatable: false
        required: false
        short_description: 'Force connection encryption on or off: yes or no (modern ODBC drivers only).'
    check_mssql_backup:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: full_age < 0 or full_age > 7d
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${name}: last full backup ${full_age}s ago'
        empty-state: unknown
        empty-syntax: '%(status): No databases found'
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): All %(count) databases have recent backups'
        perf-config: ''
        perf-syntax: ${name}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${problem_count}/${count} databases (${problem_list})'
        warn: ''
        warning: full_age > 3d
      fields:
      - generic: false
        long_description: Seconds since the last differential backup finished, -1 = never (supports units)
        name: diff_age
        short_description: ''
      - generic: false
        long_description: Seconds since the last full backup finished, -1 = never (supports units, e.g.
          full_age > 7d)
        name: full_age
        short_description: ''
      - generic: false
        long_description: Seconds since the last log backup finished, -1 = never (supports units, e.g.
          log_age > 1h)
        name: log_age
        short_description: ''
      - generic: false
        long_description: Database name
        name: name
        short_description: ''
      - generic: false
        long_description: 'Recovery model: SIMPLE, FULL or BULK_LOGGED'
        name: recovery_model
        short_description: ''
      info:
        description: Check the age of the last full/differential/log backup per database.
        experimental: true
      params:
      - content_type: 4
        default_value: 'false'
        is_simple: false
        long_description: 'Count COPY_ONLY backups when computing the ages. Excluded by default: an ad-hoc
          copy-only backup does not belong to the scheduled restore chain, so counting it would hide a
          failing backup job.'
        name: include-copy-only
        repeatable: false
        required: false
        short_description: 'Count COPY_ONLY backups when computing the ages. Excluded by default: an ad-hoc
          copy-only backup does not belong to the scheduled restore chain, so counting it would hide a
          failing backup job.'
      - content_type: 4
        default_value: 'false'
        is_simple: false
        long_description: Count snapshot (VSS/third-party agent) backups when computing the ages. Excluded
          by default for the same reason.
        name: include-snapshot
        repeatable: false
        required: false
        short_description: Count snapshot (VSS/third-party agent) backups when computing the ages. Excluded
          by default for the same reason.
      - content_type: 2
        default_value: localhost
        is_simple: false
        long_description: 'SQL Server to connect to: host, host\INSTANCE or host,port.'
        name: server
        repeatable: false
        required: false
        short_description: 'SQL Server to connect to: host, host\INSTANCE or host,port.'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Database (initial catalog) to connect to (default: the login''s default database).'
        name: database
        repeatable: false
        required: false
        short_description: 'Database (initial catalog) to connect to (default: the login''s default database).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: SQL login to authenticate with; leave empty (together with password) to use
          Windows integrated authentication.
        name: user
        repeatable: false
        required: false
        short_description: SQL login to authenticate with; leave empty (together with password) to use
          Windows integrated authentication.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Password for the SQL login.
        name: password
        repeatable: false
        required: false
        short_description: Password for the SQL login.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'ODBC driver to use (default: newest installed SQL Server driver).'
        name: driver
        repeatable: false
        required: false
        short_description: 'ODBC driver to use (default: newest installed SQL Server driver).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Raw ODBC connection string; overrides all other connection options.
        name: connection-string
        repeatable: false
        required: false
        short_description: Raw ODBC connection string; overrides all other connection options.
      - content_type: 2
        default_value: '10'
        is_simple: false
        long_description: Connection (login) timeout in seconds.
        name: timeout
        repeatable: false
        required: false
        short_description: Connection (login) timeout in seconds.
      - content_type: 2
        default_value: '30'
        is_simple: false
        long_description: Query timeout in seconds.
        name: query-timeout
        repeatable: false
        required: false
        short_description: Query timeout in seconds.
      - content_type: 4
        default_value: 'true'
        is_simple: false
        long_description: Trust the server certificate (TrustServerCertificate=yes, modern ODBC drivers
          only).
        name: trust-cert
        repeatable: false
        required: false
        short_description: Trust the server certificate (TrustServerCertificate=yes, modern ODBC drivers
          only).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Force connection encryption on or off: yes or no (modern ODBC drivers only).'
        name: encrypt
        repeatable: false
        required: false
        short_description: 'Force connection encryption on or off: yes or no (modern ODBC drivers only).'
    check_mssql_blocking:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: wait_time > 300
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: ${database}/${login} blocked by session ${blocking_session_id} (${blocking_login})
          for ${wait_time}s on ${wait_type}
        empty-state: ok
        empty-syntax: '%(status): No blocked sessions'
        escape-html: 'false'
        filter: ''
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): %(count) blocked sessions, none over the thresholds'
        perf-config: ''
        perf-syntax: ${session_id}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${problem_count}/${count} blocked sessions (${problem_list})'
        warn: ''
        warning: wait_time > 30
      fields:
      - generic: false
        long_description: 1 if the direct blocker is idle (holding locks with no active request)
        name: blocker_idle
        short_description: ''
      - generic: false
        long_description: Login of the direct blocker
        name: blocking_login
        short_description: ''
      - generic: false
        long_description: Session id of the direct blocker
        name: blocking_session_id
        short_description: ''
      - generic: false
        long_description: Command the blocked request is executing, e.g. UPDATE
        name: command
        short_description: ''
      - generic: false
        long_description: Database the blocked request runs in (empty if unavailable)
        name: database
        short_description: ''
      - generic: false
        long_description: Login of the blocked session
        name: login
        short_description: ''
      - generic: false
        long_description: Session id at the head of this blocking chain
        name: root_blocker
        short_description: ''
      - generic: false
        long_description: Session id of the blocked request
        name: session_id
        short_description: ''
      - generic: false
        long_description: Seconds the request has been blocked (supports units, e.g. wait_time > 5m)
        name: wait_time
        short_description: ''
      - generic: false
        long_description: Wait type of the blocked request, e.g. LCK_M_X
        name: wait_type
        short_description: ''
      info:
        description: Check for blocked sessions and blocking chains.
        experimental: true
      params:
      - content_type: 2
        default_value: localhost
        is_simple: false
        long_description: 'SQL Server to connect to: host, host\INSTANCE or host,port.'
        name: server
        repeatable: false
        required: false
        short_description: 'SQL Server to connect to: host, host\INSTANCE or host,port.'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Database (initial catalog) to connect to (default: the login''s default database).'
        name: database
        repeatable: false
        required: false
        short_description: 'Database (initial catalog) to connect to (default: the login''s default database).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: SQL login to authenticate with; leave empty (together with password) to use
          Windows integrated authentication.
        name: user
        repeatable: false
        required: false
        short_description: SQL login to authenticate with; leave empty (together with password) to use
          Windows integrated authentication.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Password for the SQL login.
        name: password
        repeatable: false
        required: false
        short_description: Password for the SQL login.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'ODBC driver to use (default: newest installed SQL Server driver).'
        name: driver
        repeatable: false
        required: false
        short_description: 'ODBC driver to use (default: newest installed SQL Server driver).'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Raw ODBC connection string; overrides all other connection options.
        name: connection-string
        repeatable: false
        required: false
        short_description: Raw ODBC connection string; overrides all other connection options.
      - content_type: 2
        default_value: '10'
        is_simple: false
        long_description: Connection (login) timeout in seconds.
        name: timeout
        repeatable: false
        required: false
        short_description: Connection (login) timeout in seconds.
      - content_type: 2
        default_value: '30'
        is_simple: false
        long_description: Query timeout in seconds.
        name: query-timeout
        repeatable: false
        required: false
        short_description: Query timeout in seconds.
      - content_type: 4
        default_value: 'true'
        is_simple: false
        long_description: Trust the server certificate (TrustServerCertificate=yes, modern ODBC drivers
          only).
        name: trust-cert
        repeatable: false
        required: false
        short_description: Trust the server certificate (TrustServerCertificate=yes, modern ODBC drivers
          only).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Force connection encryption on or off: yes or no (modern ODBC drivers only).'
        name: encrypt
        repeatable: false
        required: false
        short_description: 'Force connection encryption on or off: yes or no (modern ODBC drivers only).'
    check_mssql_counters:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
