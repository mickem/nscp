        long_description: 'The decoded list-separator, for use in the top-syntax: templates are never
          escape-decoded (a literal C:\temp must stay a literal C:\temp), so reference %(sep) to break
          the line before the first list item, e.g. top-syntax=%(status): %(count) items:%(sep)%(list).
          Common option for all checks.'
        name: sep
        short_description: ''
