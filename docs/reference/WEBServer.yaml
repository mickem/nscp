common:
  info:
    description: A server that listens for incoming HTTP connection and processes incoming requests. It
      provides both a WEB UI as well as a REST API in addition to simplifying configuration of WEB Server
      module.
    title: WEBServer
  paths:
    /settings/WEB/server:
      info:
        advanced: false
        description: Section for WEB (WEBServer.dll) (check_WEB) protocol options.
        subkey: false
        title: Web server
      keys:
        allow anonymous access:
          advanced: false
          default_value: 'false'
          description: When false (the default) any role named `anonymous` registered via /settings/WEB/server/roles
            is ignored and the WEB server never answers an unauthenticated request. Set to true only if
            you intentionally want to expose endpoints (via the `anonymous` role grants) without authentication.
          sample: false
          title: ALLOW ANONYMOUS ACCESS
        allow insecure:
          advanced: false
          default_value: 'false'
          description: When false (the default) the WEB server refuses to start if the TLS certificate
            is missing, rather than silently serving HTTP in clear. Set to true to explicitly accept unencrypted
            HTTP when no certificate is present - session tokens and Basic-auth credentials will then
            be transmitted unencrypted, so only do this behind a TLS-terminating proxy or on a trusted
            loopback interface.
          sample: false
          title: ALLOW INSECURE (CLEARTEXT HTTP)
        allowed ciphers:
          advanced: false
          default_value: ''
          description: OpenSSL cipher list the listener is restricted to. Empty (the default) leaves the
            library's own selection in place. Same backend caveat as `tls version`.
          sample: false
          title: ALLOWED CIPHERS
        allowed hosts:
          advanced: false
          default_value: 127.0.0.1
          description: A comma separated list of allowed hosts. You can use netmasks (/ syntax) or * to
            create ranges.
          sample: false
          title: Allowed hosts
        auth rate limit block seconds:
          advanced: false
          default_value: '60'
          description: How long an IP stays blocked when it hits `auth rate limit max failures` consecutive
            failures. Default 60 s. A further block doubles the wait - up to an hour - only when that
            IP burned its whole failure budget at machine speed (faster than one attempt every two seconds
            on average); a slower run, such as a monitoring client retrying a stale password, keeps the
            base delay however long it goes on, so one broken client cannot lock everyone sharing its
            address (behind NAT or a proxy) out for hours. The escalation resets on a successful authentication,
            or after an hour of quiet. A value of an hour or more is already longer than any escalated
            block and is used as configured, without doubling.
          sample: false
          title: AUTH RATE LIMIT (BLOCK SECONDS)
        auth rate limit max failures:
          advanced: false
          default_value: '10'
          description: How many consecutive failed authentication attempts from one client IP trigger
            the block. Default 10. Set to 0 to disable the limiter entirely (useful for integration test
            harnesses that intentionally probe failed auth).
          sample: false
          title: AUTH RATE LIMIT (FAILURES)
        cache allowed hosts:
          advanced: false
          default_value: 'true'
          description: If host names (DNS entries) should be cached, improves speed and security somewhat
            but won't allow you to have dynamic IPs for your Nagios server.
          sample: false
          title: Cache list of allowed hosts
        certificate:
          advanced: false
          default_value: ${certificate-path}/certificate.pem
          description: Ssl certificate to use for the ssl server
          sample: false
          title: TLS Certificate
        certificate key:
          advanced: false
          default_value: ''
          description: The private key for the certificate if not in the same file
          sample: false
          title: TLS private key
        disable admin user:
          advanced: false
          default_value: 'false'
          description: When true, suppress the built-in `admin` user entirely. The default admin is not
            seeded on first boot, any pre-existing `admin` entry in /settings/WEB/server/users is ignored
            at load time, and the fallback that auto-creates admin when no users are configured is skipped.
            Use this when you want the WEB server up for monitoring (queries, metrics, anonymous endpoints)
            but do NOT want any account that can remotely reconfigure the host - even if credentials are
            compromised. Define your own read-only users under /settings/WEB/server/users (or rely on
            `allow anonymous access` with a tightly-scoped `anonymous` role) so something remains callable.
          sample: false
          title: DISABLE ADMIN USER
        legacy query auth user agents:
          advanced: false
          default_value: Icinga/check_nscp_api
          description: Comma-separated list of User-Agent substrings (case-insensitive) for clients allowed
            to authenticate via the legacy `?password=...` / `?TOKEN=...` query-string mechanism. The
            fallback was removed for security in 340b8db1 because URL parameters leak into browser history,
            proxy logs and Referer headers. Defaults to 'Icinga/check_nscp_api' so Icinga's bundled check_nscp_api
            plugin keeps working without admitting any other client that happens to mention Icinga in
            its User-Agent. Set to empty string to disable the fallback entirely.
          sample: false
          title: LEGACY QUERY-STRING AUTH ALLOWLIST
        openmetrics format:
          advanced: false
          default_value: openmetrics
          description: 'Which exposition /api/v2/openmetrics serves. `openmetrics` (the default) emits
            a conformant OpenMetrics document: metric names are rewritten to the `[a-zA-Z_][a-zA-Z0-9_]*`
            grammar (`system.mem.physical.%` becomes `system_mem_physical_percent`), every family carries
            a `# TYPE` line, the body ends with `# EOF` and values keep their full precision. `legacy`
            reproduces the previous body byte for byte - `<name> <value>` lines with dots, spaces and
            colons left in the names, and values truncated to six significant digits - for a dashboard
            or recording rule that has not been migrated yet. The legacy format is deprecated and will
            be removed in a future release.'
          sample: false
          title: OPENMETRICS EXPOSITION FORMAT
        password:
          advanced: false
          default_value: ''
          description: Password used to authenticate against server
          sample: false
          title: Password
        persist sessions:
          advanced: false
          default_value: 'true'
          description: 'When true (the default) the sessions handed out by /api/v2/login are kept in ${data-path}/nsclient.db
            and restored at the next start, so a restart does not log every web user out. Only the SHA-256
            of each session key is stored, a session is only restored while the user''s password and role
            are unchanged, and logging one out removes it from the file straight away. Set to false to
            keep sessions in memory only: every restart then ends every session, which is also the way
            to invalidate all of them at once without rotating passwords.'
          sample: false
          title: PERSIST SESSIONS
        port:
          advanced: false
          default_value: '8443'
          description: Port to use for WEB server.
          sample: false
          title: Server port
        threads:
          advanced: false
          default_value: '10'
          description: The number of threads in the sever response pool.
          sample: false
          title: Server threads
        tls version:
          advanced: false
          default_value: 1.2+
          description: 'Which TLS versions the listener will negotiate, in the same vocabulary as the
            NRPE and NSCA listeners: an exact version (1.0, 1.1, 1.2, 1.3), a trailing + for that version
            or later, or `any`. The default 1.2+ allows TLS 1.2 and TLS 1.3. `sslv3` is the one spelling
            those listeners take that this one does not: the web listener never serves SSL 3.0, so pinning
            the range to it would accept no handshake at all and is refused at startup (`sslv3+`, a floor
            rather than a pin, is accepted). A version this listener cannot honour stops it starting rather
            than falling back to a default. Honoured on builds using the beast web backend (all Linux
            packages); the mongoose backend drives TLS through its own stack and logs that it is ignoring
            a value you set.'
          sample: false
          title: TLS version to use
    /settings/WEB/server/log:
      info:
        advanced: false
        description: Configure which messages from the web server are logged.
        subkey: false
        title: Log configuration
      keys:
        debug:
          advanced: false
          default_value: 'false'
          description: Enable logging of debug messages from the web server.
          sample: false
          title: Log debug
        error:
          advanced: false
          default_value: 'true'
          description: Enable logging of errors from the web server.
          sample: false
          title: Log errors
        info:
          advanced: false
          default_value: 'false'
          description: Enable logging of info messages from the web server.
          sample: false
          title: Log info
    /settings/WEB/server/results:
      info:
        advanced: false
        description: Configure the channel the web server listens on for passive check results and how
          long they are kept.
        subkey: false
        title: Passive result cache
      keys:
        channel:
          advanced: false
          default_value: WEB
          description: 'The submission channel the web server registers and caches results from. Anything
            submitted here (by the Scheduler, by check_and_forward, by a relaying client, ...) is kept
            in memory and served by the /api/v2/results REST endpoints, so a monitoring system that cannot
            be reached from this host can poll the results out instead. Set to an empty string to register
            no channel and disable the cache entirely. Read when the web server starts: a channel cannot
            be registered or moved by a settings reload, so changing this needs a service restart.'
          sample: false
          title: PASSIVE RESULT CHANNEL
        clear on poll:
          advanced: false
          default_value: 'true'
          description: When true (the default) GET /api/v2/results removes the results it returns, so
            the next poll reports what has happened since this one rather than repeating it - this is
            what makes `mode = worst` mean "worst since the last poll". Only what a poll actually returns
            is dropped, so a filtered poll cannot discard results its caller never saw. Set to false when
            several consumers poll the same agent, or for a dashboard that must not consume what it displays;
            results then stay until they are replaced, expire or are deleted. Fetching a single result
            by key is a lookup rather than a poll and never drains.
          sample: false
          title: DRAIN THE CACHE ON A POLL
        enabled:
          advanced: false
          default_value: 'false'
          description: 'When false (the default) the web server registers no submission channel, caches
            nothing and answers the /api/v2/results endpoints with 503. Set to true to have the agent
            accept passive results and hold them for a monitoring system to poll. Read when the web server
            starts: turning the cache on needs a service restart, since a submission channel cannot be
            registered by a settings reload. Turning it off does take effect on a reload (and empties
            the cache).'
          sample: false
          title: ENABLE THE PASSIVE RESULT CACHE
        max age:
          advanced: false
          default_value: '0'
          description: Drop cached results that have not been updated for this many seconds. 0 (the default)
            keeps them until they are replaced or the service restarts. Note that results are never hidden
            merely for being stale - every result carries an `age` field - so this is about bounding memory,
            not about deciding what counts as current.
          sample: false
          title: PASSIVE RESULT CACHE MAX AGE
        max entries:
          advanced: false
          default_value: '1000'
          description: How many distinct keys to keep. Since a repeat result for a key replaces the previous
            one, this only bites when results arrive under ever-changing keys; the least recently updated
            entry is then dropped. 0 is treated as 1.
          sample: false
          title: PASSIVE RESULT CACHE SIZE
        mode:
          advanced: false
          default_value: last
          description: 'Only one result is kept per key, and this decides which one when a second arrives.
            `last` (the default) keeps the newest, so a recovery replaces the problem before it. `worst`
            keeps the most severe, so a CRITICAL that recovers before the next poll is still reported
            (an equally severe result still replaces it, keeping the message current). Severity is ordered
            as elsewhere in NSClient++: OK < WARNING < CRITICAL < UNKNOWN.'
          sample: false
          title: WHICH RESULT TO KEEP PER KEY
        primary index:
          advanced: false
          default_value: ${host}/${alias-or-command}
          description: 'The key each cached result is stored under: a new result replaces the previous
            result carrying the same key. Can be any string, optionally including ${host} (the submitting
            host), ${source} (the raw sender id), ${channel}, ${command}, ${alias} and ${alias-or-command}
            (alias if set, otherwise command).'
          sample: false
          title: PASSIVE RESULT CACHE KEY
    /settings/WEB/server/roles:
      info:
        advanced: false
        description: A list of roles and with coma separated list of access rights.
        subkey: false
        title: Web server roles
      keys:
        client:
          advanced: false
          default_value: public,info.get,info.get.version,queries.list,queries.get,queries.execute,aliases.list,login.get,modules.list
          description: Default role for read + run checks (queries.execute can run side-effecting commands)
          sample: false
          title: Role for read + run checks (queries.execute can run side-effecting commands)
        full:
          advanced: false
          default_value: '*'
          description: Default role for Full access
          sample: false
          title: Role for Full access
        legacy:
          advanced: false
          default_value: legacy,login.get
          description: Default role for legacy API
          sample: false
          title: Role for legacy API
        metrics:
          advanced: false
          default_value: public,metrics.list,openmetrics.list,login.get
          description: Default role for reading metrics only
          sample: false
          title: Role for reading metrics only
        monitoring:
          advanced: false
          default_value: public,queries.execute,aliases.list,login.get,metrics.list,openmetrics.list
          description: Default role for checks, queries and metrics
          sample: false
          title: Role for checks, queries and metrics
        restricted:
          advanced: false
          default_value: public,queries.execute.noargs,aliases.list,login.get
          description: Default role for checks and queries only, without arguments
          sample: false
          title: Role for checks and queries only, without arguments
    /settings/WEB/server/users:
      info:
        advanced: false
        description: Users which can access the REST API
        subkey: true
        title: Web server users
      sample:
        keys:
          alias:
            advanced: true
            default_value: ''
            description: The alias (service name) to report to server
            sample: false
            title: ALIAS
          is template:
            advanced: true
            default_value: 'false'
            description: Declare this object as a template (this means it will not be available as a separate
              object)
            sample: false
            title: IS TEMPLATE
          parent:
            advanced: true
            default_value: default
            description: The parent the target inherits from
            sample: false
            title: PARENT
          password:
            advanced: false
            default_value: ''
            description: The password to use.
            sample: true
            title: PASSWORD
          role:
            advanced: false
            default_value: ''
            description: The role which will grant access to this user
            sample: true
            title: ROLE
    /settings/default:
      info:
        advanced: false
        description: Default values used in other config sections.
        subkey: false
        title: Default values
      keys:
        allowed hosts:
          advanced: false
          default_value: 127.0.0.1
          description: A comma separated list of allowed hosts. You can use netmasks (/ syntax) or * to
            create ranges.
          sample: false
          title: Allowed hosts
        bind to:
          advanced: false
          default_value: ''
          description: Allows you to bind server to a specific local address. This has to be a dotted
            ip address not a host name. Leaving this blank will bind to all available IP addresses.
          sample: false
          title: BIND TO ADDRESS
        cache allowed hosts:
          advanced: false
          default_value: 'true'
          description: If host names (DNS entries) should be cached, improves speed and security somewhat
            but won't allow you to have dynamic IPs for your Nagios server.
          sample: false
          title: Cache list of allowed hosts
        encoding:
          advanced: true
          default_value: ''
          description: ''
          sample: false
          title: NRPE PAYLOAD ENCODING
        inbox:
          advanced: false
          default_value: inbox
          description: The default channel to post incoming messages on
          sample: false
          title: INBOX
        password:
          advanced: false
          default_value: ''
          description: Password used to authenticate against server
          sample: false
          title: Password
        socket queue size:
          advanced: true
          default_value: '0'
          description: Number of sockets to queue before starting to refuse new incoming connections.
            This can be used to tweak the amount of simultaneous sockets that the server accepts.
          sample: false
          title: LISTEN QUEUE
        thread pool:
          advanced: true
          default_value: '10'
          description: ''
          sample: false
          title: THREAD POOL
        timeout:
          advanced: false
          default_value: '30'
          description: Timeout (in seconds) when reading packets on incoming sockets. If the data has
            not arrived within this time we will bail out.
          sample: false
          title: TIMEOUT
        timezone:
          advanced: true
          default_value: local
          description: Timezone used to render dates such as boot time. Accepts 'local' (default), 'utc',
            or any POSIX TZ string parseable by Boost.Date_time (e.g. 'MST-07' or 'EST-05EDT,M3.2.0,M11.1.0').
          sample: false
          title: Timezone
module: WEBServer
namespace: generic
platforms:
- unix
- windows
