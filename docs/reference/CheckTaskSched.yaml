module: CheckTaskSched
namespace: windows
platforms:
- windows
windows:
  info:
    description: Check status of your scheduled jobs.
    title: CheckTaskSched
  queries:
    check_tasksched:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      common_options:
        byte-unit: ''
        crit: ''
        critical: exit_code < 0
        debug: 'false'
        decimal-separator: ''
        decimals: '-1'
        detail-syntax: '${folder}/${title}: ${exit_code} != 0'
        empty-state: warning
        empty-syntax: '%(status): No tasks found'
        escape-html: 'false'
        filter: enabled = 1
        help: ''
        help-pb: ''
        help-short: ''
        list-separator: ', '
        ok: ''
        ok-syntax: '%(status): All tasks are ok'
        perf-config: ''
        perf-syntax: ${title}
        show-all: 'false'
        show-default: ''
        thousands-separator: ''
        top-syntax: '${status}: ${problem_list}'
        warn: ''
        warning: exit_code != 0
      fields:
      - generic: false
        long_description: Retrieves the name of the application that the task is associated with.
        name: application
        short_description: ''
      - generic: false
        long_description: Retrieves the comment or description for the work item.
        name: comment
        short_description: ''
      - generic: false
        long_description: Retrieves the creator of the work item.
        name: creator
        short_description: ''
      - generic: false
        long_description: TODO.
        name: enabled
        short_description: ''
      - generic: false
        long_description: The task's last run result (last exit code).
        name: exit_code
        short_description: ''
      - generic: false
        long_description: The task folder
        name: folder
        short_description: ''
      - generic: false
        long_description: True if the task has ever executed.
        name: has_run
        short_description: ''
      - generic: false
        long_description: True if the task is marked hidden (ITaskSettings Hidden flag). Always false
          on the legacy ITask API.
        name: hidden
        short_description: ''
      - generic: false
        long_description: Seconds since the task last ran (-1 if it has never run). Use e.g. last_run_age
          > 86400 to alert on stale tasks.
        name: last_run_age
        short_description: ''
      - generic: false
        long_description: Retrieves the maximum length of time the task can run.
        name: max_run_time
        short_description: ''
      - generic: false
        long_description: The most recent time the task began running. Comparable to relative times, e.g.
          most_recent_run_time < -1d.
        name: most_recent_run_time
        short_description: ''
      - generic: false
        long_description: The next time the task is scheduled to run. Rendered as 'none' (value 0) when
          the task has no upcoming run (disabled, on-demand, or no more triggers).
        name: next_run_time
        short_description: ''
      - generic: false
        long_description: Number of times the task was scheduled to run but did not (0 on the legacy ITask
          API).
        name: number_of_missed_runs
        short_description: ''
      - generic: false
        long_description: Retrieves the command-line parameters of a task.
        name: parameters
        short_description: ''
      - generic: false
        long_description: Retrieves the priority for the task.
        name: priority
        short_description: ''
      - generic: false
        long_description: 'The task state: ready, running, disabled, queued or unknown (the legacy ITask
          API instead uses ready, running, disabled, not_scheduled, has_not_run, no_more_runs or no_valid_triggers).'
        name: task_status
        short_description: ''
      - generic: false
        long_description: The task title
        name: title
        short_description: ''
      - generic: false
        long_description: The task's full path / URI (e.g. \Microsoft\Windows\Defrag\ScheduledDefrag).
          Empty on the legacy ITask API.
        name: uri
        short_description: ''
      - generic: false
        long_description: Retrieves the working directory of the task.
        name: working_directory
        short_description: ''
      info:
        description: Check status of scheduled jobs.
      params:
      - content_type: 2
        default_value: 'false'
        is_simple: false
        long_description: The name of the computer that you want to connect to.
        name: force-old
        repeatable: false
        required: false
        short_description: The name of the computer that you want to connect to.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The name of the computer that you want to connect to.
        name: computer
        repeatable: false
        required: false
        short_description: The name of the computer that you want to connect to.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The user name that is used during the connection to the computer.
        name: user
        repeatable: false
        required: false
        short_description: The user name that is used during the connection to the computer.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The domain of the user specified in the user parameter.
        name: domain
        repeatable: false
        required: false
        short_description: The domain of the user specified in the user parameter.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The password that is used to connect to the computer. If the user name and password
          are not specified, then the current token is used.
        name: password
        repeatable: false
        required: false
        short_description: The password that is used to connect to the computer. If the user name and
          password are not specified, then the current token is used.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The folder in which the tasks to check reside.
        name: folder
        repeatable: false
        required: false
        short_description: The folder in which the tasks to check reside.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Recurse sub folder (defaults to true).
        name: recursive
        repeatable: false
        required: false
        short_description: Recurse sub folder (defaults to true).
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Look for hidden tasks.
        name: hidden
        repeatable: false
        required: false
        short_description: Look for hidden tasks.
