common:
  info:
    description: check_mk client can be used both from command line and from queries to check remote systems
      via check_mk
    title: CheckMKClient
  paths:
    /settings/check_mk/client:
      info:
        advanced: false
        description: Section for check_mk active/passive check module.
        subkey: false
        title: CHECK MK CLIENT SECTION
      keys:
        channel:
          advanced: false
          default_value: CheckMK
          description: The channel to listen to.
          sample: false
          title: CHANNEL
        script root:
          advanced: false
          default_value: ''
          description: 'The folder this module''s scripts live in: ${scripts} by default (empty, or `default`).
            `fleet` is ${fleet-folder}/scripts, where the fleet sync stages a bundle''s `scripts/` entries
            - a bundle that ships scripts sets this to `fleet` and refers to them as `scripts\<name>`.
            `shared` is ${shared-path}/scripts; any other value is a folder (${...} tokens expanded).
            Python and Lua scripts live in its `python` and `lua` sub-folders. An external script is started
            in the folder *above* it, with a relative command such as `scripts\check.bat` resolved against
            that folder - the rule the default layout has always followed, so a scripts folder moved elsewhere
            runs unchanged, scripts that call each other by relative path included. Set it under [/settings/default]
            to apply to every script module at once. SECURITY: whoever can write to this folder can change
            what the service runs.'
          sample: false
          title: Script root
    /settings/check_mk/client/handlers:
      info:
        advanced: false
        description: ''
        subkey: true
        title: CLIENT HANDLER SECTION
    /settings/check_mk/client/scripts:
      info:
        advanced: false
        description: ''
        subkey: true
        title: REMOTE TARGET DEFINITIONS
    /settings/check_mk/client/targets:
      info:
        advanced: false
        description: ''
        subkey: true
        title: REMOTE TARGET DEFINITIONS
      sample:
        keys:
          address:
            advanced: false
            default_value: ''
            description: Target host address
            sample: true
            title: TARGET ADDRESS
          allow host override:
            advanced: true
            default_value: 'false'
            description: 'Let a request (a REST query, an NRPE argument or `nscp client`) send this target''s
              *configured* credentials to a destination the request names, or under transport settings
              the request names. Off by default: when a request moves the destination (`host=`, `port=`,
              `address=`), reroutes it through a proxy of its own (`proxy=`, `no-proxy=`) or changes how
              the connection is protected (`verify=`, `insecure=`, `ca=`, `security=`, `tls-version=`,
              the certificate and cipher keys) and the password or token going with it is the one configured
              here, the call is refused, since otherwise anyone able to run the module''s commands could
              direct the configured credentials to a host of their choosing, or strip the check that the
              host answering is the configured one. This setting is only consulted in that case: a target
              with no credentials, a request that supplies its own password/token, and a request that
              changes none of those are all unaffected. To reach another server with its own credentials,
              prefer configuring it as a separate target and selecting it with `target=`.'
            sample: true
            title: ALLOW HOST OVERRIDE
          allowed ciphers:
            advanced: false
            default_value: ''
            description: 'A better value is: ALL:!ADH:!LOW:!EXP:!MD5:@STRENGTH'
            sample: true
            title: ALLOWED CIPHERS
          ca:
            advanced: true
            default_value: ${ca-path}
            description: Certificate authority the server certificate is verified against. Defaults to
              ${ca-path} (the auto-generated system ROOT bundle on Windows, the distribution bundle elsewhere).
            sample: true
            title: CA
          certificate:
            advanced: false
            default_value: ''
            description: ''
            sample: true
            title: SSL CERTIFICATE
          certificate format:
            advanced: true
            default_value: ''
            description: ''
            sample: true
            title: CERTIFICATE FORMAT
          certificate key:
            advanced: true
            default_value: ''
            description: ''
            sample: true
            title: SSL CERTIFICATE
          dh:
            advanced: true
            default_value: ''
            description: ''
            sample: true
            title: DH KEY
          host:
            advanced: true
            default_value: ''
            description: The target server to report results to.
            sample: true
            title: TARGET HOST
          port:
            advanced: true
            default_value: ''
            description: The target server port
            sample: true
            title: TARGET PORT
          retries:
            advanced: false
            default_value: '3'
            description: Number of times to retry sending.
            sample: true
            title: RETRIES
          timeout:
            advanced: false
            default_value: '30'
            description: Timeout (in seconds) when reading/writing packets to/from sockets.
            sample: true
            title: TIMEOUT
          use ssl:
            advanced: false
            default_value: ''
            description: This option controls if SSL should be enabled.
            sample: true
            title: ENABLE SSL ENCRYPTION
          verify mode:
            advanced: false
            default_value: peer
            description: 'How to verify the server certificate. Comma separated list of options: none,
              peer (or certificate), peer-cert, fail-if-no-cert (or fail-if-no-peer-cert, client-certificate).
              For a self signed certificate use peer-cert and point `ca` at that certificate; none leaves
              the connection encrypted but the server unauthenticated, so an on-path attacker can impersonate
              it undetected. Defaults to peer.'
            sample: true
            title: VERIFY MODE
  queries:
    check_mk_query:
      common_options:
        help: ''
        help-pb: ''
        help-short: ''
        show-default: ''
      info:
        description: Request remote information via check_mk.
      params:
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The host of the host running the server
        name: host
        repeatable: false
        required: false
        short_description: The host of the host running the server
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The port of the host running the server
        name: port
        repeatable: false
        required: false
        short_description: The port of the host running the server
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The address (host:port) of the host running the server
        name: address
        repeatable: false
        required: false
        short_description: The address (host:port) of the host running the server
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Number of seconds before connection times out (default=10)
        name: timeout
        repeatable: false
        required: false
        short_description: Number of seconds before connection times out (default=10)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Target to use (lookup connection info from config)
        name: target
        repeatable: false
        required: false
        short_description: Target to use (lookup connection info from config)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Number of times ti retry a failed connection attempt (default=2)
        name: retry
        repeatable: false
        required: false
        short_description: Number of times ti retry a failed connection attempt (default=2)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: legacy version of retry
        name: retries
        repeatable: false
        required: false
        short_description: legacy version of retry
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Source/sender host name (default is auto which means use the name of the actual
          host)
        name: source-host
        repeatable: false
        required: false
        short_description: Source/sender host name (default is auto which means use the name of the actual
          host)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Source/sender host name (default is auto which means use the name of the actual
          host)
        name: sender-host
        repeatable: false
        required: false
        short_description: Source/sender host name (default is auto which means use the name of the actual
          host)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The name of the command that the remote daemon should run
        name: command
        repeatable: false
        required: false
        short_description: The name of the command that the remote daemon should run
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Set command line arguments
        name: argument
        repeatable: false
        required: false
        short_description: Set command line arguments
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Separator to use for the batch command (default is |)
        name: separator
        repeatable: false
        required: false
        short_description: Separator to use for the batch command (default is |)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'Add multiple records using the separator format is: command|argument|argument'
        name: batch
        repeatable: false
        required: false
        short_description: 'Add multiple records using the separator format is: command|argument|argument'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The client certificate to use
        name: certificate
        repeatable: false
        required: false
        short_description: The client certificate to use
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The DH key to use
        name: dh
        repeatable: false
        required: false
        short_description: The DH key to use
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The private key belonging to the client certificate (when it is not in the certificate
          file itself)
        name: certificate-key
        repeatable: false
        required: false
        short_description: The private key belonging to the client certificate (when it is not in the
          certificate file itself)
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Client certificate format
        name: certificate-format
        repeatable: false
        required: false
        short_description: Client certificate format
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The certificate authority the server certificate is verified against
        name: ca
        repeatable: false
        required: false
        short_description: The certificate authority the server certificate is verified against
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'How to verify the server certificate. Comma separated list of options: none,
          peer (or certificate), peer-cert, fail-if-no-cert (or fail-if-no-peer-cert, client-certificate).
          For a self signed certificate use peer-cert and point --ca at that certificate; none leaves
          the connection encrypted but the server unauthenticated, so an on-path attacker can impersonate
          it undetected.'
        name: verify
        repeatable: false
        required: false
        short_description: 'How to verify the server certificate. Comma separated list of options: none,
          peer (or certificate), peer-cert, fail-if-no-cert (or fail-if-no-peer-cert, client-certificate).
          For a self signed certificate use peer-cert and point --ca at that certificate; none leaves
          the connection encrypted but the server unauthenticated, so an on-path attacker can impersonate
          it undetected.'
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: The OpenSSL cipher list the connection is restricted to
        name: allowed-ciphers
        repeatable: false
        required: false
        short_description: The OpenSSL cipher list the connection is restricted to
      - content_type: 4
        default_value: 'true'
        is_simple: false
        long_description: Initial an ssl handshake with the server.
        name: ssl
        repeatable: false
        required: false
        short_description: Initial an ssl handshake with the server.
module: CheckMKClient
namespace: client
platforms:
- unix
- windows
unix:
  paths:
    /settings/default:
      info:
        advanced: false
        description: Default values used in other config sections.
        subkey: false
        title: Default values
      keys:
        allowed hosts:
          advanced: false
          default_value: 127.0.0.1
          description: A comma separated list of allowed hosts. You can use netmasks (/ syntax) or * to
            create ranges.
          sample: false
          title: Allowed hosts
        bind to:
          advanced: false
          default_value: ''
          description: Allows you to bind server to a specific local address. This has to be a dotted
            ip address not a host name. Leaving this blank will bind to all available IP addresses.
          sample: false
          title: BIND TO ADDRESS
        cache allowed hosts:
          advanced: false
          default_value: 'true'
          description: If host names (DNS entries) should be cached, improves speed and security somewhat
            but won't allow you to have dynamic IPs for your Nagios server.
          sample: false
          title: Cache list of allowed hosts
        encoding:
          advanced: true
          default_value: ''
          description: ''
          sample: false
          title: NRPE PAYLOAD ENCODING
        inbox:
          advanced: false
          default_value: inbox
          description: The default channel to post incoming messages on
          sample: false
          title: INBOX
        password:
          advanced: false
          default_value: ''
          description: 'Password an inbound caller has to present. Stored hashed (pbkdf2-sha256$...) when
            written by `nscp web install` or `nscp web password --set`; a clear-text value written by
            hand is still accepted, and is hashed in place when re-set. This is a password to verify against,
            not key material: NSCA encrypts with its shared secret instead of verifying it, so it keeps
            its own key under /settings/NSCA/server (or the NSCAClient default target) and never reads
            this one.'
          sample: false
          title: Password
        script root:
          advanced: false
          default_value: ''
          description: 'The folder this module''s scripts live in: ${scripts} by default (empty, or `default`).
            `fleet` is ${fleet-folder}/scripts, where the fleet sync stages a bundle''s `scripts/` entries
            - a bundle that ships scripts sets this to `fleet` and refers to them as `scripts\<name>`.
            `shared` is ${shared-path}/scripts; any other value is a folder (${...} tokens expanded).
            Python and Lua scripts live in its `python` and `lua` sub-folders. An external script is started
            in the folder *above* it, with a relative command such as `scripts\check.bat` resolved against
            that folder - the rule the default layout has always followed, so a scripts folder moved elsewhere
            runs unchanged, scripts that call each other by relative path included. Set it under [/settings/default]
            to apply to every script module at once. SECURITY: whoever can write to this folder can change
            what the service runs.'
          sample: false
          title: Script root
        socket queue size:
          advanced: true
          default_value: '0'
          description: Number of sockets to queue before starting to refuse new incoming connections.
            This can be used to tweak the amount of simultaneous sockets that the server accepts.
          sample: false
          title: LISTEN QUEUE
        thread pool:
          advanced: true
          default_value: '10'
          description: ''
          sample: false
          title: THREAD POOL
        timeout:
          advanced: false
          default_value: '30'
          description: Timeout (in seconds) when reading packets on incoming sockets. If the data has
            not arrived within this time we will bail out.
          sample: false
          title: TIMEOUT
        timezone:
          advanced: true
          default_value: local
          description: Timezone used to render dates such as boot time. Accepts 'local' (default), 'utc',
            or any POSIX TZ string parseable by Boost.Date_time (e.g. 'MST-07' or 'EST-05EDT,M3.2.0,M11.1.0').
          sample: false
          title: Timezone
