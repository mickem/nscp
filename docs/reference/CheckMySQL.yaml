common:
  info:
    description: 'Check MySQL, MariaDB, Percona and other MySQL-compatible servers: connectivity, health
      and custom queries.'
    title: CheckMySQL
  paths:
    /settings/mysql:
      info:
        advanced: false
        description: ''
        subkey: false
        title: ''
      keys:
        database:
          advanced: false
          default_value: ''
          description: Default database (schema) to connect to.
          sample: false
          title: DATABASE
        defaults file:
          advanced: true
          default_value: ''
          description: my.cnf-style file whose [client] section supplies credentials, so passwords can
            be kept out of nsclient.ini.
          sample: false
          title: DEFAULTS FILE
        hostname:
          advanced: false
          default_value: localhost
          description: Default MySQL/MariaDB server to connect to.
          sample: false
          title: MYSQL SERVER
        password:
          advanced: false
          default_value: ''
          description: Password used to authenticate.
          sample: false
          title: MYSQL PASSWORD
        plugin dir:
          advanced: true
          default_value: ''
          description: Directory the connector loads client auth plugins from (needed for MySQL 8's caching_sha2_password
            when the connector's default is wrong).
          sample: false
          title: PLUGIN DIRECTORY
        port:
          advanced: false
          default_value: '3306'
          description: Default TCP port of the server.
          sample: false
          title: MYSQL PORT
        query timeout:
          advanced: true
          default_value: '30'
          description: Query (read/write) timeout in seconds.
          sample: false
          title: QUERY TIMEOUT
        socket:
          advanced: false
          default_value: ''
          description: Unix socket path (or Windows named pipe) to connect through instead of TCP.
          sample: false
          title: MYSQL SOCKET
        timeout:
          advanced: true
          default_value: '10'
          description: Connection timeout in seconds.
          sample: false
          title: CONNECTION TIMEOUT
        tls:
          advanced: true
          default_value: 'false'
          description: Require TLS on the connection.
          sample: false
          title: TLS
        user:
          advanced: false
          default_value: ''
          description: User used to authenticate.
          sample: false
          title: MYSQL USER
  queries:
    check_mysql:
      fields:
      - generic: false
        long_description: Open connections as a percentage of max_connections
        name: connections_pct
        short_description: ''
      - generic: true
        long_description: Number of items matching the filter. Common option for all checks.
        name: count
        short_description: ''
      - generic: true
        long_description: Number of items matched the critical criteria. Common option for all checks.
        name: crit_count
        short_description: ''
      - generic: true
        long_description: A list of all items which matched the critical criteria. Common option for all
          checks.
        name: crit_list
        short_description: ''
      - generic: true
        long_description: A special list with critical, then warning and finally ok. Common option for
          all checks.
        name: detail_list
        short_description: ''
      - generic: false
        long_description: 'Server flavor derived from the version: mysql, mariadb or percona'
        name: flavor
        short_description: ''
      - generic: true
        long_description: A list of all items which matched the filter. Common option for all checks.
        name: list
        short_description: ''
      - generic: false
        long_description: Configured connection limit (max_connections)
        name: max_connections
        short_description: ''
      - generic: true
        long_description: Number of items matched the ok criteria. Common option for all checks.
        name: ok_count
        short_description: ''
      - generic: true
        long_description: A list of all items which matched the ok criteria. Common option for all checks.
        name: ok_list
        short_description: ''
      - generic: true
        long_description: Number of items matched either warning or critical criteria. Common option for
          all checks.
        name: problem_count
        short_description: ''
      - generic: true
        long_description: A list of all items which matched either the critical or the warning criteria.
          Common option for all checks.
        name: problem_list
        short_description: ''
      - generic: true
        long_description: 'The decoded list-separator, for use in the top-syntax: templates are never
          escape-decoded (a literal C:\temp must stay a literal C:\temp), so reference %(sep) to break
          the line before the first list item, e.g. top-syntax=%(status): %(count) items:%(sep)%(list).
          Common option for all checks.'
        name: sep
        short_description: ''
      - generic: true
        long_description: The returned status (OK/WARN/CRIT/UNKNOWN). Common option for all checks.
        name: status
        short_description: ''
      - generic: false
        long_description: Currently open connections (Threads_connected)
        name: threads_connected
        short_description: ''
      - generic: true
        long_description: Total number of items. Common option for all checks.
        name: total
        short_description: ''
      - generic: false
        long_description: Seconds since the server started (supports units, e.g. uptime < 1h)
        name: uptime
        short_description: ''
      - generic: false
        long_description: Server version, e.g. 10.11.14-MariaDB-ubu2404 or 8.4.3
        name: version
        short_description: ''
      - generic: false
        long_description: Server version comment (distribution/build description)
        name: version_comment
        short_description: ''
      - generic: true
        long_description: Number of items matched the warning criteria. Common option for all checks.
        name: warn_count
        short_description: ''
      - generic: true
        long_description: A list of all items which matched the warning criteria. Common option for all
          checks.
        name: warn_list
        short_description: ''
      info:
        description: Check MySQL/MariaDB server connectivity and health (version, flavor, uptime, connections).
      params:
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Filter which marks interesting items.

          Interesting items are items which will be included in the check.

          They do not denote warning or critical state instead it defines which items are relevant and
          you can remove unwanted items.'
        name: filter
        repeatable: false
        required: false
        short_description: Filter which marks interesting items.
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Filter which marks items which generates a warning state.

          If anything matches this filter the return status will be escalated to warning.

          '
        name: warning
        repeatable: false
        required: false
        short_description: Filter which marks items which generates a warning state.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Short alias for warning
        name: warn
        repeatable: false
        required: false
        short_description: Short alias for warning
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Filter which marks items which generates a critical state.

          If anything matches this filter the return status will be escalated to critical.

          '
        name: critical
        repeatable: false
        required: false
        short_description: Filter which marks items which generates a critical state.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Short alias for critical.
        name: crit
        repeatable: false
        required: false
        short_description: Short alias for critical.
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Filter which marks items which generates an ok state.

          If anything matches this any previous state for this item will be reset to ok.'
        name: ok
        repeatable: false
        required: false
        short_description: Filter which marks items which generates an ok state.
      - content_type: 2
        default_value: 1)] (=0
        is_simple: false
        long_description: Show debugging information in the log
        name: debug
        repeatable: false
        required: false
        short_description: Show debugging information in the log
      - content_type: 2
        default_value: 1)] (=0
        is_simple: false
        long_description: Show details for all matches regardless of status (normally details are only
          showed for warnings and criticals).
        name: show-all
        repeatable: false
        required: false
        short_description: Show details for all matches regardless of status (normally details are only
          showed for warnings and criticals).
      - content_type: 2
        default_value: unknown
        is_simple: false
        long_description: 'Return status to use when nothing matched filter.

          If no filter is specified this will never happen unless the file is empty.'
        name: empty-state
        repeatable: false
        required: false
        short_description: Return status to use when nothing matched filter.
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Performance data generation configuration

          TODO: obj ( key: value; key: value) obj (key:valuer;key:value)'
        name: perf-config
        repeatable: false
        required: false
        short_description: Performance data generation configuration
      - content_type: 2
        default_value: 1)] (=0
        is_simple: false
        long_description: Escape any < and > characters to prevent HTML encoding
        name: escape-html
        repeatable: false
        required: false
        short_description: Escape any < and > characters to prevent HTML encoding
      - content_type: 2
        default_value: ', '
        is_simple: false
        long_description: 'String used to separate the items of %(list), %(ok_list), %(warn_list), %(crit_list),
          %(problem_list) and %(detail_list).

          Accepts the escapes \n, \r, \t and \\ (a configuration file value is a single line, so a real
          newline cannot be written).

          Set to \n to render one item per line, which most Nagios compatible frontends show as long output
          below the summary line.

          The top-syntax decides what precedes the first item; templates are never escape-decoded, so
          reference the decoded separator as %(sep) to break before it too: --top-syntax "%(status): %(count)
          items:%(sep)%(list)".'
        name: list-separator
        repeatable: false
        required: false
        short_description: String used to separate the items of %(list), %(ok_list), %(warn_list), %(crit_list),
          %(problem_list) and %(detail_list).
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: Show help screen (this screen)
        name: help
        repeatable: false
        required: false
        short_description: Show help screen (this screen)
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: Show help screen as a protocol buffer payload
        name: help-pb
        repeatable: false
        required: false
        short_description: Show help screen as a protocol buffer payload
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: Show default values for a given command
        name: show-default
        repeatable: false
        required: false
        short_description: Show default values for a given command
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: Show help screen (short format).
        name: help-short
        repeatable: false
        required: false
        short_description: Show help screen (short format).
      - content_type: 2
        default_value: '${status}: ${list}'
        is_simple: false
        long_description: 'Top level syntax.

          Used to format the message to return can include text as well as special keywords which will
          include information from the checks.

          To add a keyword to the message you can use two syntaxes either ${keyword} or %(keyword) (there
          is no difference between them apart from ${} can be difficult to escape on linux).'
        name: top-syntax
        repeatable: false
        required: false
        short_description: Top level syntax.
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'ok syntax.

          DEPRECATED! This is the syntax for when an ok result is returned.

          This value will not be used if your syntax contains %(list) or %(count).'
        name: ok-syntax
        repeatable: false
        required: false
        short_description: ok syntax.
      - content_type: 2
        default_value: '%(status): No server information returned'
        is_simple: false
        long_description: 'Empty syntax.

          DEPRECATED! This is the syntax for when nothing matches the filter.'
        name: empty-syntax
        repeatable: false
        required: false
        short_description: Empty syntax.
      - content_type: 2
        default_value: ${flavor} ${version}, uptime ${uptime}s, connections ${threads_connected}/${max_connections}
          (${connections_pct}%)
        is_simple: false
        long_description: 'Detail level syntax.

          Used to format each resulting item in the message.

          %(list) will be replaced with all the items formatted by this syntax string in the top-syntax.

          To add a keyword to the message you can use two syntaxes either ${keyword} or %(keyword) (there
          is no difference between them apart from ${} can be difficult to escape on linux).'
        name: detail-syntax
        repeatable: false
        required: false
        short_description: Detail level syntax.
      - content_type: 2
        default_value: ${flavor}
        is_simple: false
        long_description: 'Performance alias syntax.

          This is the syntax for the base names of the performance data.'
        name: perf-syntax
        repeatable: false
        required: false
        short_description: Performance alias syntax.
      - content_type: 2
        default_value: localhost
        is_simple: false
        long_description: MySQL/MariaDB server to connect to.
        name: host
        repeatable: false
        required: false
        short_description: MySQL/MariaDB server to connect to.
      - content_type: 2
        default_value: '3306'
        is_simple: false
        long_description: TCP port of the server.
        name: port
        repeatable: false
        required: false
        short_description: TCP port of the server.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Unix socket path (or Windows named pipe) to connect through instead of TCP.
        name: socket
        repeatable: false
        required: false
        short_description: Unix socket path (or Windows named pipe) to connect through instead of TCP.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Default database (schema) to connect to.
        name: database
        repeatable: false
        required: false
        short_description: Default database (schema) to connect to.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: User to authenticate with.
        name: user
        repeatable: false
        required: false
        short_description: User to authenticate with.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Password to authenticate with.
        name: password
        repeatable: false
        required: false
        short_description: Password to authenticate with.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: my.cnf-style file whose [client] section supplies credentials, so passwords
