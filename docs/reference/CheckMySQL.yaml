      - content_type: 2
        default_value: 1)] (=0
        is_simple: false
        long_description: Require TLS on the connection.
        name: tls
        repeatable: false
        required: false
        short_description: Require TLS on the connection.
      - content_type: 2
        default_value: '10'
        is_simple: false
        long_description: Connection timeout in seconds.
        name: timeout
        repeatable: false
        required: false
        short_description: Connection timeout in seconds.
      - content_type: 2
        default_value: '30'
        is_simple: false
        long_description: Query (read/write) timeout in seconds.
        name: query-timeout
        repeatable: false
        required: false
        short_description: Query (read/write) timeout in seconds.
