      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Directory the connector loads client auth plugins from (needed for MySQL 8's
          caching_sha2_password when the connector's default is wrong).
        name: plugin-dir
        repeatable: false
        required: false
        short_description: Directory the connector loads client auth plugins from (needed for MySQL 8's
