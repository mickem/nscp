module: CheckActiveDirectory
namespace: misc
platforms:
- windows
windows:
  info:
    description: 'CheckActiveDirectory checks Active Directory health: replication on domain controllers,
      the machine-account secure channel and Kerberos KDC availability.'
    title: CheckActiveDirectory
  queries:
    check_ad_replication:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      fields:
      - generic: false
        long_description: Number of consecutive failed sync attempts on this link
        name: consecutive_failures
        short_description: ''
      - generic: false
        long_description: True when the last sync attempt failed
        name: failed
        short_description: ''
      - generic: false
        long_description: When the last sync was attempted
        name: last_attempt
        short_description: ''
      - generic: false
        long_description: Win32 result code of the last sync attempt (0 = success)
        name: last_error
        short_description: ''
      - generic: false
        long_description: Human readable message for the last sync result (empty when ok)
        name: last_error_message
        short_description: ''
      - generic: false
        long_description: When the last sync succeeded (epoch 0 = never)
        name: last_success
        short_description: ''
      - generic: false
        long_description: The replicated directory partition (naming context) DN
        name: naming_context
        short_description: ''
      - generic: false
        long_description: The source domain controller this link replicates from
        name: source
        short_description: ''
      - generic: false
        long_description: Transport address of the source (GUID-based DNS name)
        name: source_address
        short_description: ''
      - generic: false
        long_description: Full DN of the source directory service agent
        name: source_dsa
        short_description: ''
      info:
        description: Check inbound Active Directory replication links on a domain controller (last success,
          consecutive failures). Windows only.
      params:
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Filter which marks interesting items.

          Interesting items are items which will be included in the check.

          They do not denote warning or critical state instead it defines which items are relevant and
          you can remove unwanted items.'
        name: filter
        repeatable: false
        required: false
        short_description: Filter which marks interesting items.
      - content_type: 2
        default_value: consecutive_failures > 0
        is_simple: false
        long_description: 'Filter which marks items which generates a warning state.

          If anything matches this filter the return status will be escalated to warning.

          '
        name: warning
        repeatable: false
        required: false
        short_description: Filter which marks items which generates a warning state.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Short alias for warning
        name: warn
        repeatable: false
        required: false
        short_description: Short alias for warning
      - content_type: 2
        default_value: consecutive_failures > 4 or last_success < -24h
        is_simple: false
        long_description: 'Filter which marks items which generates a critical state.

          If anything matches this filter the return status will be escalated to critical.

          '
        name: critical
        repeatable: false
        required: false
        short_description: Filter which marks items which generates a critical state.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: Short alias for critical.
        name: crit
        repeatable: false
        required: false
        short_description: Short alias for critical.
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Filter which marks items which generates an ok state.

          If anything matches this any previous state for this item will be reset to ok.'
        name: ok
        repeatable: false
        required: false
        short_description: Filter which marks items which generates an ok state.
      - content_type: 2
        default_value: 1)] (=0
        is_simple: false
        long_description: Show debugging information in the log
        name: debug
        repeatable: false
        required: false
        short_description: Show debugging information in the log
      - content_type: 2
        default_value: 1)] (=0
        is_simple: false
        long_description: Show details for all matches regardless of status (normally details are only
          showed for warnings and criticals).
        name: show-all
        repeatable: false
        required: false
        short_description: Show details for all matches regardless of status (normally details are only
          showed for warnings and criticals).
      - content_type: 2
        default_value: ok
        is_simple: false
        long_description: 'Return status to use when nothing matched filter.

          If no filter is specified this will never happen unless the file is empty.'
        name: empty-state
        repeatable: false
        required: false
        short_description: Return status to use when nothing matched filter.
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Performance data generation configuration

          TODO: obj ( key: value; key: value) obj (key:valuer;key:value)'
        name: perf-config
        repeatable: false
        required: false
        short_description: Performance data generation configuration
      - content_type: 2
        default_value: 1)] (=0
        is_simple: false
        long_description: Escape any < and > characters to prevent HTML encoding
        name: escape-html
        repeatable: false
        required: false
        short_description: Escape any < and > characters to prevent HTML encoding
      - content_type: 2
        default_value: ', '
        is_simple: false
        long_description: 'String used to separate the items of %(list), %(ok_list), %(warn_list), %(crit_list),
          %(problem_list) and %(detail_list).

          Accepts the escapes \n, \r, \t and \\ (a configuration file value is a single line, so a real
          newline cannot be written).

          Set to \n to render one item per line, which most Nagios compatible frontends show as long output
          below the summary line.

          The top-syntax decides what precedes the first item; templates are never escape-decoded, so
          reference the decoded separator as %(sep) to break before it too: --top-syntax "%(status): %(count)
          items:%(sep)%(list)".'
        name: list-separator
        repeatable: false
        required: false
        short_description: String used to separate the items of %(list), %(ok_list), %(warn_list), %(crit_list),
          %(problem_list) and %(detail_list).
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: Show help screen (this screen)
        name: help
        repeatable: false
        required: false
        short_description: Show help screen (this screen)
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: Show help screen as a protocol buffer payload
        name: help-pb
        repeatable: false
        required: false
        short_description: Show help screen as a protocol buffer payload
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: Show default values for a given command
        name: show-default
        repeatable: false
        required: false
        short_description: Show default values for a given command
      - content_type: 4
        default_value: ''
        is_simple: true
        long_description: Show help screen (short format).
        name: help-short
        repeatable: false
        required: false
        short_description: Show help screen (short format).
      - content_type: 2
        default_value: '${status}: ${problem_list}'
        is_simple: false
        long_description: 'Top level syntax.

          Used to format the message to return can include text as well as special keywords which will
          include information from the checks.

          To add a keyword to the message you can use two syntaxes either ${keyword} or %(keyword) (there
          is no difference between them apart from ${} can be difficult to escape on linux).'
        name: top-syntax
        repeatable: false
        required: false
        short_description: Top level syntax.
      - content_type: 2
        default_value: '%(status): all %(count) replication links are healthy'
        is_simple: false
        long_description: 'ok syntax.

          DEPRECATED! This is the syntax for when an ok result is returned.

          This value will not be used if your syntax contains %(list) or %(count).'
        name: ok-syntax
        repeatable: false
        required: false
        short_description: ok syntax.
      - content_type: 2
        default_value: No replication partners found (single domain controller?)
        is_simple: false
        long_description: 'Empty syntax.

          DEPRECATED! This is the syntax for when nothing matches the filter.'
        name: empty-syntax
        repeatable: false
        required: false
        short_description: Empty syntax.
      - content_type: 2
        default_value: '${source} ${naming_context}: ${consecutive_failures} failures, last success ${last_success}'
        is_simple: false
        long_description: 'Detail level syntax.

          Used to format each resulting item in the message.

          %(list) will be replaced with all the items formatted by this syntax string in the top-syntax.

          To add a keyword to the message you can use two syntaxes either ${keyword} or %(keyword) (there
          is no difference between them apart from ${} can be difficult to escape on linux).'
        name: detail-syntax
        repeatable: false
        required: false
        short_description: Detail level syntax.
      - content_type: 2
        default_value: ${source} ${naming_context}
        is_simple: false
        long_description: 'Performance alias syntax.

          This is the syntax for the base names of the performance data.'
        name: perf-syntax
        repeatable: false
        required: false
        short_description: Performance alias syntax.
      - content_type: 2
        default_value: ''
        is_simple: true
        long_description: 'The domain controller to check (default: the local machine).'
        name: server
        repeatable: false
        required: false
        short_description: 'The domain controller to check (default: the local machine).'
    check_kdc:
      common_fields:
      - count
      - crit_count
      - crit_list
      - detail_list
      - list
      - ok_count
      - ok_list
      - problem_count
      - problem_list
      - sep
      - status
      - total
      - warn_count
      - warn_list
      fields:
      - generic: false
        long_description: KRB-ERROR code from the response (-1 when none)
        name: error_code
        short_description: ''
      - generic: false
        long_description: The KDC host that was probed
        name: kdc
        short_description: ''
      - generic: false
        long_description: TCP port probed
        name: port
        short_description: ''
      - generic: false
        long_description: The Kerberos realm the probe requested a ticket for
        name: realm
        short_description: ''
      - generic: false
        long_description: True when the KDC answered the AS-REQ with a well-formed Kerberos message
        name: responding
        short_description: ''
      - generic: false
        long_description: What the KDC answered (or the transport error)
        name: response
        short_description: ''
      - generic: false
        long_description: Probe round-trip time in milliseconds
        name: time
        short_description: ''
      info:
        description: Check that Kerberos KDCs answer an AS-REQ probe on port 88 (a real Kerberos exchange,
          not just a port check). Windows only.
      params:
      - content_type: 2
        default_value: ''
        is_simple: false
        long_description: 'Filter which marks interesting items.

          Interesting items are items which will be included in the check.

          They do not denote warning or critical state instead it defines which items are relevant and
          you can remove unwanted items.'
        name: filter
        repeatable: false
        required: false
