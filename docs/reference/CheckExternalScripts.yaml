common:
  aliases:
    alias_cpu:
      description: 'Alias for: check_cpu'
    alias_cpu_ex:
      description: 'Alias for: check_cpu warn=load > $ARG1$ crit=load > $ARG2$ time=5m time=1m time=30s'
    alias_disk:
      description: 'Alias for: check_drivesize'
    alias_disk_loose:
      description: 'Alias for: check_drivesize'
    alias_event_log:
      description: 'Alias for: check_eventlog'
    alias_file_age:
      description: 'Alias for: check_files path=$ARG1$ crit=written > $ARG2$ top-syntax=${list} detail-syntax=${filename]
        ${written} max-dir-depth=10'
    alias_file_size:
      description: 'Alias for: check_files path=$ARG1$ crit=size > $ARG2$ top-syntax=${list} detail-syntax=${filename]
        ${size} max-dir-depth=10'
    alias_mem:
      description: 'Alias for: check_memory'
    alias_process:
      description: 'Alias for: check_process process=$ARG1$ crit=state != ''started'''
    alias_process_count:
      description: 'Alias for: check_process process=$ARG1$ warn=count > $ARG2$ crit=count > $ARG3$'
    alias_process_hung:
      description: 'Alias for: check_process filter=is_hung crit=count>0'
    alias_process_stopped:
      description: 'Alias for: check_process process=$ARG1$ crit=state != ''stopped'''
    alias_sched_all:
      description: 'Alias for: check_tasksched show-all syntax=${title}: ${exit_code} crit=exit_code ne
        0'
    alias_sched_long:
      description: 'Alias for: check_tasksched filter=status = ''running'' detail-syntax=${title} (${most_recent_run_time})
        crit=most_recent_run_time < -$ARG1$'
    alias_sched_task:
      description: 'Alias for: check_tasksched show-all filter=title eq ''$ARG1$'' detail-syntax=${title}
        (${exit_code}) crit=exit_code ne 0'
    alias_service:
      description: 'Alias for: check_service'
    alias_service_ex:
      description: 'Alias for: check_service exclude=Net Driver HPZ12 exclude=Pml Driver HPZ12 exclude=stisvc'
    alias_top_memory_users:
      description: 'Alias for: filter_perf sort=normal limit=5 command=check_process arguments warn=working_set
        > 3G crit=working_set > 4G detail-syntax=%(exe) ws=%(working_set)'
    alias_top_memory_users_ex:
      description: 'Alias for: filter_perf sort=normal limit=5 command=check_process arguments warn=working_set
        > $ARG1$ crit=working_set > $ARG2$ detail-syntax=%(exe) ws=%(working_set)'
    alias_up:
      description: 'Alias for: check_uptime'
    alias_volumes:
      description: 'Alias for: check_drivesize'
    alias_volumes_loose:
      description: 'Alias for: check_drivesize'
  info:
    description: Module used to execute external scripts
    title: CheckExternalScripts
  paths:
    /settings/external scripts:
      info:
        advanced: false
        description: General settings for the external scripts module (CheckExternalScripts).
        subkey: false
        title: External script settings
      keys:
        allow arguments:
          advanced: false
          default_value: 'false'
          description: This option determines whether or not we will allow clients to specify arguments
            to commands that are executed. NOTICE this governs external script commands only. Command
            aliases (the alias section) always substitute their client arguments into the internal command
            they wrap regardless of this setting, because they dispatch to another internal check rather
            than spawning a process - the wrapped check's own argument handling applies. Restrict which
            commands an alias may reach through the query permissions, not this flag.
          sample: false
          title: Allow arguments when executing external scripts
        allow nasty characters:
          advanced: false
          default_value: 'false'
          description: This option determines whether or not the we will allow clients to specify nasty
            (as in |`&><'"\[]{}) characters in arguments.
          sample: false
          title: Allow certain potentially dangerous characters in arguments
        kill tree:
          advanced: false
          default_value: 'false'
          description: Kill all child processes (notice this might accidentally kill other processes if
            PIDs are reused when killing the process). On Linux the script then runs in a session of its
            own, and the whole process group is signalled when it times out or the module unloads, so
            helpers it backgrounds die with it; a script that calls setsid() itself gets EPERM, as it
            already leads its session.
          sample: false
          title: Kill process tree
        script path:
          advanced: false
          default_value: ''
          description: 'Load all scripts in a given directory and use them as commands. SECURITY: every
            file in this directory becomes a runnable command (with %ARGS% appended when arguments are
            allowed), so write/create access to the directory is equivalent to command execution as the
            service account - restrict it with filesystem ACLs. Prefer listing individual scripts explicitly
            under the scripts section over pointing this at a shared or writable folder.'
          sample: false
          title: Load all scripts in a given folder
        script root:
          advanced: false
          default_value: ''
          description: 'The folder this module''s scripts live in: ${scripts} by default (empty, or `default`).
            `fleet` is ${fleet-folder}/scripts, where the fleet sync stages a bundle''s `scripts/` entries
            - a bundle that ships scripts sets this to `fleet` and refers to them as `scripts\<name>`.
            `shared` is ${shared-path}/scripts; any other value is a folder (${...} tokens expanded).
            Python and Lua scripts live in its `python` and `lua` sub-folders. An external script is started
            in the folder *above* it, with a relative command such as `scripts\check.bat` resolved against
            that folder - the rule the default layout has always followed, so a scripts folder moved elsewhere
            runs unchanged, scripts that call each other by relative path included. Set it under [/settings/default]
            to apply to every script module at once. SECURITY: whoever can write to this folder can change
            what the service runs. It is also what ext-scr show/delete are confined to and where ext-scr
            add --import copies to; ext-scr add --script <path> is not bounded by it (an administrator-only
            action, equivalent to editing the configuration directly).'
          sample: false
          title: Script root
        timeout:
          advanced: false
          default_value: '60'
          description: The maximum time in seconds that a command can execute. (if more then this execution
            will be aborted). NOTICE this only affects external commands not internal ones.
          sample: false
          title: Command timeout
    /settings/external scripts/alias:
      info:
        advanced: false
        description: 'A list of aliases for already defined commands (with arguments).

          An alias is an internal command that has been predefined to provide a single command without
          arguments. Be careful so you don''t create loops (ie check_loop=check_a, check_a=check_loop)'
        subkey: true
        title: Command aliases
      objects:
      - alias_cpu
      - alias_cpu_ex
      - alias_disk
      - alias_disk_loose
      - alias_event_log
      - alias_file_age
      - alias_file_size
      - alias_mem
      - alias_process
      - alias_process_count
      - alias_process_hung
      - alias_process_stopped
      - alias_sched_all
      - alias_sched_long
      - alias_sched_task
      - alias_service
      - alias_service_ex
      - alias_top_memory_users
      - alias_top_memory_users_ex
      - alias_up
      - alias_volumes
      - alias_volumes_loose
      sample:
        keys:
          alias:
            advanced: true
            default_value: ''
            description: The alias (service name) to report to server
            sample: false
            title: ALIAS
          command:
            advanced: false
            default_value: ''
            description: Command to execute
            sample: true
            title: COMMAND
          is template:
            advanced: true
            default_value: 'false'
            description: Declare this object as a template (this means it will not be available as a separate
              object)
            sample: false
            title: IS TEMPLATE
          parent:
            advanced: true
            default_value: default
            description: The parent the target inherits from
            sample: false
            title: PARENT
    /settings/external scripts/scripts:
      info:
        advanced: false
        description: 'A list of scripts available to run from the CheckExternalScripts module. Syntax
          is: `command=script arguments`.

          The value is a command line handed to the operating system, not a path the agent resolves, so
          it is NOT searched for and `${...}` path tokens are NOT expanded here: `${scripts}/check_foo.sh`
          reaches the shell literally and fails. A name with no directory separator (`check_foo.sh`) is
          looked up on PATH rather than in the script folder. A relative name that does contain one (`scripts/check_foo.sh`)
          is resolved against the service''s working directory, which is the installation directory on
          Windows and whatever the unit or init script set on Linux - so prefer an absolute path unless
          you are keeping the conventional `scripts\check_foo.bat` form.'
        subkey: true
        title: External scripts
      sample:
        keys:
          alias:
            advanced: true
            default_value: ''
            description: The alias (service name) to report to server
            sample: false
            title: ALIAS
          capture output:
            advanced: true
            default_value: ''
            description: This should be set to false if you want to run commands which never terminates
              (i.e. relinquish control from NSClient++). The effect of this is that the command output
              will not be captured. The main use is to protect from socket reuse issues
            sample: true
            title: CAPTURE OUTPUT
          command:
            advanced: false
            default_value: ''
            description: Command to execute
            sample: true
            title: COMMAND
          display:
            advanced: true
            default_value: ''
            description: Set to true if you want to display the resulting window or not
            sample: true
            title: DISPLAY
          domain:
            advanced: true
            default_value: ''
            description: The domain of the user to run the command as (Windows only; on Linux the command
              is refused when this is set).
            sample: true
            title: DOMAIN
          encoding:
            advanced: true
            default_value: ''
            description: The encoding to parse the command as
            sample: true
            title: ENCODING
          ignore perfdata:
            advanced: false
            default_value: ''
            description: Do not parse performance data from the output
            sample: true
            title: IGNORE PERF DATA
          is template:
            advanced: true
            default_value: 'false'
            description: Declare this object as a template (this means it will not be available as a separate
              object)
            sample: false
            title: IS TEMPLATE
          parent:
            advanced: true
            default_value: default
            description: The parent the target inherits from
            sample: false
            title: PARENT
          password:
            advanced: true
            default_value: ''
            description: The password of the user to run the command as (Windows only; on Linux the command
              is refused when this is set).
            sample: true
            title: PASSWORD
          session:
            advanced: true
            default_value: ''
            description: Session you want to invoke the client in either the number of current for the
              one with a UI
            sample: true
            title: SESSION
          user:
            advanced: true
            default_value: ''
            description: 'The user to run the command as (Windows only). On Linux the command is refused
              when this is set: prefix the command with sudo (`sudo -n -u <user> ...`) and grant it in
              sudoers instead.'
            sample: true
            title: USER
    /settings/external scripts/wrapped scripts:
      info:
        advanced: false
        description: 'A list of wrapped scripts (ie. script using a template mechanism).

          The template used will be defined by the extension of the script. Thus a foo.ps1 will use the
          ps1 wrapping from the wrappings section.'
        subkey: true
        title: Wrapped scripts
    /settings/external scripts/wrappings:
      info:
        advanced: false
        description: 'A list of templates for defining script commands.

          Enter any command line here and they will be expanded by scripts placed under the wrapped scripts
          section. %SCRIPT% will be replaced by the actual script an %ARGS% will be replaced by any given
          arguments.'
        subkey: true
        title: Script wrappings
      objects:
      - bat
      - ps1
      - vbs
module: CheckExternalScripts
namespace: check
platforms:
- unix
- windows
unix:
  paths:
    /settings/default:
      info:
        advanced: false
        description: Default values used in other config sections.
        subkey: false
        title: Default values
      keys:
        allowed hosts:
          advanced: false
          default_value: 127.0.0.1
          description: A comma separated list of allowed hosts. You can use netmasks (/ syntax) or * to
            create ranges.
          sample: false
          title: Allowed hosts
        bind to:
          advanced: false
          default_value: ''
          description: Allows you to bind server to a specific local address. This has to be a dotted
            ip address not a host name. Leaving this blank will bind to all available IP addresses.
          sample: false
          title: BIND TO ADDRESS
        cache allowed hosts:
          advanced: false
          default_value: 'true'
          description: If host names (DNS entries) should be cached, improves speed and security somewhat
            but won't allow you to have dynamic IPs for your Nagios server.
          sample: false
          title: Cache list of allowed hosts
        encoding:
          advanced: true
          default_value: ''
          description: ''
          sample: false
          title: NRPE PAYLOAD ENCODING
        inbox:
          advanced: false
          default_value: inbox
          description: The default channel to post incoming messages on
          sample: false
          title: INBOX
        password:
          advanced: false
          default_value: ''
          description: 'Password an inbound caller has to present. Stored hashed (pbkdf2-sha256$...) when
            written by `nscp web install` or `nscp web password --set`; a clear-text value written by
            hand is still accepted, and is hashed in place when re-set. This is a password to verify against,
            not key material: NSCA encrypts with its shared secret instead of verifying it, so it keeps
            its own key under /settings/NSCA/server (or the NSCAClient default target) and never reads
            this one.'
          sample: false
          title: Password
        script root:
          advanced: false
          default_value: ''
          description: 'The folder this module''s scripts live in: ${scripts} by default (empty, or `default`).
            `fleet` is ${fleet-folder}/scripts, where the fleet sync stages a bundle''s `scripts/` entries
            - a bundle that ships scripts sets this to `fleet` and refers to them as `scripts\<name>`.
            `shared` is ${shared-path}/scripts; any other value is a folder (${...} tokens expanded).
            Python and Lua scripts live in its `python` and `lua` sub-folders. An external script is started
            in the folder *above* it, with a relative command such as `scripts\check.bat` resolved against
            that folder - the rule the default layout has always followed, so a scripts folder moved elsewhere
            runs unchanged, scripts that call each other by relative path included. Set it under [/settings/default]
            to apply to every script module at once. SECURITY: whoever can write to this folder can change
            what the service runs.'
          sample: false
          title: Script root
        socket queue size:
          advanced: true
          default_value: '0'
          description: Number of sockets to queue before starting to refuse new incoming connections.
            This can be used to tweak the amount of simultaneous sockets that the server accepts.
          sample: false
          title: LISTEN QUEUE
        thread pool:
          advanced: true
          default_value: '10'
          description: ''
          sample: false
          title: THREAD POOL
        timeout:
          advanced: false
          default_value: '30'
          description: Timeout (in seconds) when reading packets on incoming sockets. If the data has
            not arrived within this time we will bail out.
          sample: false
          title: TIMEOUT
        timezone:
          advanced: true
          default_value: local
          description: Timezone used to render dates such as boot time. Accepts 'local' (default), 'utc',
            or any POSIX TZ string parseable by Boost.Date_time (e.g. 'MST-07' or 'EST-05EDT,M3.2.0,M11.1.0').
          sample: false
          title: Timezone
