# Service account for nsclient.service, provisioned by systemd-sysusers(8).
#
# Declaring the account here instead of calling adduser/useradd from the
# package's maintainer scripts means the distribution decides how the account is
# created (uid range, shell, home, /etc/subuid handling) and the package only
# states that it needs one. sysusers never removes accounts, which matches
# Debian policy: a leftover locked system account is harmless, and files it owns
# would otherwise become orphaned.
#
# The account is not needed at all when the DynamicUser drop-in is enabled, in
# which case systemd allocates a transient UID/GID for the lifetime of the
# service instead. Note that a *statically* allocated user of the configured
# name takes precedence over a dynamic one (systemd.exec(5)), so removing this
# account is what completes the switch - see systemd/dynamic-user.conf.
#
# No home directory or shell is given: sysusers defaults those to / and
# /usr/sbin/nologin, and the daemon reads neither.
u nsclient - "NSClient++ monitoring agent"
