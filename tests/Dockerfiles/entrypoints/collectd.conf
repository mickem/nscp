# Minimal collectd config for the integration test: receive value-lists over
# the binary network protocol and write each one to a CSV file the test can
# read back. See collectd.Dockerfile for the surrounding context.

Hostname "receiver"
FQDNLookup false
Interval 1

LoadPlugin network
LoadPlugin csv

# Three listeners, one per security level, so the test can prove both that the
# client's signed/encrypted framing is accepted and that the stricter
# listeners actually reject lesser traffic:
#   25826  SecurityLevel None    — accepts anything (plaintext sender)
#   25827  SecurityLevel Sign    — requires a valid HMAC-SHA-256 signature
#   25828  SecurityLevel Encrypt — requires AES-256/OFB encryption
# The credentials live in collectd.auth (username "nscp"); the client tests
# use the same values.
<Plugin network>
  Listen "0.0.0.0" "25826"
  <Listen "0.0.0.0" "25827">
    SecurityLevel "Sign"
    AuthFile "/etc/collectd/collectd.auth"
  </Listen>
  <Listen "0.0.0.0" "25828">
    SecurityLevel "Encrypt"
    AuthFile "/etc/collectd/collectd.auth"
  </Listen>
</Plugin>

# One file per value-list under /data/<host>/<plugin-instance>/<type-instance>.
# StoreRates false keeps raw DERIVE/GAUGE values so a single sample produces a
# data line (no rate computation that would need two samples).
<Plugin csv>
  DataDir "/data"
  StoreRates false
</Plugin>
