# Requests reach the container from the docker bridge gateway (or the Docker
# Desktop / Rancher VM), whose address is not known up front, so every source
# address is a client. The container is only published on host loopback.
client any-ipv4 {
	ipaddr = 0.0.0.0/0
	secret = radius-test-secret
	shortname = nscp-test
	require_message_authenticator = yes
	limit_proxy_state = yes
}
