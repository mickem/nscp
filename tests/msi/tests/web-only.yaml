command_line: ["msiexec.exe", "/i", "$MSI-FILE", "/qn", "/l*", "log.txt", "ADDLOCAL=ALL", "MONITORING_TOOL=NONE", "CONF_WEB=enabled", "NSCLIENT_PWD=1234567890", "ALLOWED_HOSTS=1.2.3.4" ]
# As in upgrade-and-enabled-web-server: NSCLIENT_PWD given on the command line
# is hashed before it is written, so the form is what gets asserted.
replace_password: true
boot.ini: |
  [settings]
  1 = ini://${shared-path}/nsclient.ini

nsclient.ini: |
  [/modules]
  webserver = enabled

  [/settings/default]
  allowed hosts = 1.2.3.4
  password = $$PASSWORD$$

masked_values:
  "/settings/default": hashed
