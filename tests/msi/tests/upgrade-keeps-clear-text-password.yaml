# An upgrade does not migrate a password it only found on disk.
#
# The installer hashes a password it is *given* (see
# password-enabled-web-server.yaml), and NSCLIENT_PWD's default is seeded from
# whatever is already in the file - which is what pre-fills the configuration
# dialog on an upgrade. Left alone, that value is unchanged, so it has to come
# out of the upgrade exactly as it went in: an agent whose NSCA server or any
# other reader of the clear text still works after upgrading.
command_line: ["msiexec.exe", "/i", "$MSI-FILE", "/qn", "/l*", "log.txt", "ADDLOCAL=ALL" ]
replace_password: true

upgrade:
  boot.ini: |
    [settings]
    1 = ini://${shared-path}/nsclient.ini

  nsclient.ini: |
    [/modules]
    checkdisk = enabled
    checkeventlog = enabled
    checkexternalscripts = enabled
    checkhelpers = enabled
    checknscp = enabled
    checksystem = enabled
    nrpeserver = enabled
    webserver = enabled

    [/settings/NRPE/server]
    insecure = false
    verify mode = peer-cert

    [/settings/default]
    allowed hosts = 127.0.0.1
    password = keep-me-in-clear-text

boot.ini: |
  [settings]
  1 = ini://${shared-path}/nsclient.ini

nsclient.ini: |
  [/modules]
  checkdisk = enabled
  checkeventlog = enabled
  checkexternalscripts = enabled
  checkhelpers = enabled
  checknscp = enabled
  checksystem = enabled
  nrpeserver = enabled
  webserver = enabled

  [/settings/NRPE/server]
  insecure = false
  verify mode = peer-cert

  [/settings/default]
  allowed hosts = 127.0.0.1
  password = $$PASSWORD$$

passwords:
  "/settings/default": keep-me-in-clear-text
