command_line: ["msiexec.exe", "/i", "$MSI-FILE", "/qn", "/l*", "log.txt", "ADDLOCAL=ALL", "CONF_WEB=enabled", "NSCLIENT_PWD=1234567890" ]
# The password is given on the command line, so the installer hashes it before
# writing: the exact value cannot be compared any more, and asserting the *form*
# is the point (a clear-text 1234567890 here would be the regression).
replace_password: true
boot.ini: |
  [settings]
  1 = ini://${shared-path}/nsclient.ini

nsclient.ini: |
  [/modules]
  checkdisk = enabled
  checkeventlog = enabled
  checkexternalscripts = enabled
  checkhelpers = enabled
  checknscp = enabled
  checksystem = enabled
  webserver = enabled
  nrpeserver = enabled

  [/settings/NRPE/server]
  insecure = false
  verify mode = peer-cert
  
  [/settings/default]
  allowed hosts = 127.0.0.1
  password = $$PASSWORD$$

masked_values:
  "/settings/default": hashed
